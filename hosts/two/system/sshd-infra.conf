# infra-os:   alpine
# infra-init: openrc
# infra-path: /etc/ssh/sshd_config.d
# infra-name: 10-infra.conf
# infra-mode: 0644
#
# A DROP-IN, NOT A REPLACEMENT. /etc/ssh/sshd_config carries
# `Include /etc/ssh/sshd_config.d/*.conf` at line 15 — before its own settings — and
# sshd takes the FIRST value it obtains for each keyword, so everything here wins
# without the stock file being edited. An OpenSSH upgrade's changes to that file then
# stay visible instead of being merged into a tracked copy nobody re-reads.
#
# BYTE-IDENTICAL ON ALL THREE HOSTS, deliberately. Phase 1's audit found divergences
# that had been read as facts — a netstat branch that existed because `ss` was on one
# host out of three. Three files that must match are easier to keep honest than three
# that happen to. If one ever needs to differ, the reason goes here.
#
# Every line below was compared against `sshd -T` on all three on 2026-08-23. Nothing is
# set because it looked sensible: each one either changes something or pins something an
# upgrade could move.

# ── the mesh ──────────────────────────────────────────────────────────────────
# zero and one had `allowtcpforwarding no`; two had `yes`, which is the whole reason it
# was the only bastion. All three now forward — but only to each other, on port 22.
#
# or3's dev/README.md § "`ProxyJump zero` does not work, and must not be made to" argues
# against enabling this, and the objection is answered rather than ignored: it is about
# ARBITRARY forwarding from the internet-facing box. PermitOpen makes the reachable set
# exactly three addresses, all of them boxes the client can already reach directly. The
# same document also concedes the setting "was never a boundary against an authenticated
# user", since anyone with a shell can run `nc`.
#
# THIS DOES NOT LET ZERO REACH ONE. With ProxyJump the client's key authenticates
# end-to-end to the target and the middle box only forwards TCP, so decisions.md's "no
# key on zero authorising it to reach one or two" is untouched by it.
#
# Note what is NOT here: 127.0.0.1:2224 and friends. The dev containers are still
# reached with `ProxyCommand ssh zero nc %h %p`, a session channel PermitOpen does not
# govern. If those ever move to ProxyJump, this line needs their loopback ports.
AllowTcpForwarding yes
PermitOpen 192.168.86.100:22 192.168.86.101:22 192.168.86.102:22

# ── reap dead sessions ────────────────────────────────────────────────────────
# `clientaliveinterval` was 0 on all three: the server never probes, so a mobile client
# that vanishes at a lock screen leaves its session and its processes behind
# indefinitely. A live-but-idle client answers the probe and stays.
ClientAliveInterval 60
ClientAliveCountMax 3

# ── pinned, not changed ───────────────────────────────────────────────────────
# All six already read this way in `sshd -T`. Stated so an upgrade cannot move one
# quietly — the argument dev/sshd_config already makes for `Compression yes`: in there
# so the behaviour is visible rather than inherited.
#
# AllowAgentForwarding is deliberately absent. It is `yes` on all three and nothing here
# is known to need it, but the owner could not recall what does — so it is left alone
# rather than tightened on a guess. Compression is absent for the opposite reason: it is
# already `yes`, the client is the half that has to offer it, and that is in ssh_config.
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
X11Forwarding no
PermitTunnel no
GatewayPorts no
