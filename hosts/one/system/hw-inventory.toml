# Per-host SMART policy and manual corrections for bin/hw-inventory.
#
# The PRESENCE of this file is what enables SMART polling on this host. `smart_skip`
# then names the devices that must never be polled. A host with no file here gets a
# sysfs-only inventory — so forgetting to think about it produces the safe outcome.
#
# Anything under [overrides.<dev>] wins over what the script detects.

# No smart_skip any more. The SP900 that must never be polled was pulled on
# 2026-08-24; its entry — the hand-pinned model/serial that could no longer be read
# safely, the FAILING note, the skip itself — is in git history. The one disk left is
# the MX500, healthy and safe to poll. If a disk ever goes back into bay 0, think
# about this file BEFORE the first poll, not after: the empty list below is a
# statement that every present disk is pollable, and a new disk makes it a claim
# nobody has checked.
smart_skip = []


# The MX500 enumerates as sda now that it is the only disk (it was sdb while the
# SP900 held bay 0). Everything mounts by UUID, so the rename cost nothing.
[overrides.sda]
bay = "1"
role = "btrfs array (sda1) + swap (sda2, currently off)"
# Model, serial, form factor and manufacture date are read from SMART — this disk is
# healthy and safe to poll. Its Micron serial encodes YYWW, which the script decodes.


[overrides.mmcblk0]
bay = "onboard"
role = "boot + root"
