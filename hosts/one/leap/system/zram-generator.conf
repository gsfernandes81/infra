# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/systemd
# infra-name: zram-generator.conf
# infra-mode: 0644
#
# Compressed swap in RAM, ahead of the SSD's swap partition, as zero's zram-swap gives it
# on Alpine: 2 GiB, zstd, priority 100, so the kernel fills it before the SSD's at -2. On
# Alpine, one ran 768 MB through zram-init on a 1 GB board; the 8 GB board takes the dev
# hub later, which zero's size was set for.
[zram0]
zram-size = 2048
compression-algorithm = zstd
swap-priority = 100
