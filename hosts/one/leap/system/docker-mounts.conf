# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/systemd/system/docker.service.d
# infra-name: infra-mounts.conf
# infra-mode: 0644
#
# Docker starts only once its store on the SSD is mounted. Without this, a missing SSD
# leaves dockerd to start on an empty /var/lib/docker on the SD card and pull everything
# there; Alpine stopped that with an immutable bare mountpoint, and /var on Leap is
# writable, so the guard is this line instead. The fstab entry carries nofail and a 180 s
# device timeout, so a missing SSD costs the containers, never the boot.
[Unit]
RequiresMountsFor=/var/lib/docker
