# infra-os:   alpine
# infra-init: openrc
# infra-path: /etc/modules-load.d
# infra-name: dm-crypt.conf
# infra-mode: 0644
#
# Loaded by OpenRC's modules service at boot, before dmcrypt (/etc/conf.d/dmcrypt orders
# it). dm-crypt pulls in dm-mod. Neither is built into linux-rpi: on 2026-11-19 zero's
# /proc/misc had no device-mapper entry, and both ship as modules in
# /lib/modules/<release>/kernel/drivers/md/. The cipher's modules (adiantum, chacha,
# nhpoly1305) are not listed: the kernel's crypto API loads them by algorithm name, as it
# does when cryptsetup first formats the disk by hand.
dm-crypt
