# infra-os:   alpine
# infra-init: openrc
# infra-path: /etc/cloudflared
# infra-name: config.yml
# infra-mode: 0644
#
# Credentials and metrics for `zero`'s host tunnel. NOT its ingress.
#
# WHY THIS FILE EXISTS. `command_args` carried `--token <secret>`, and supervise-daemon
# logs its child's full command line to syslog — the token-in-argv leak
# docs/host-setup.md flags. The secret now lives in a 0600 credentials file instead.
# That is the whole of what this file achieves, and it does achieve it.
#
# WHAT IT DOES NOT DO, ESTABLISHED THE HARD WAY 2026-08-23. An earlier version of this
# file carried the eight ingress rules and claimed to be authoritative. It was not.
# **cloudflared prefers the tunnel's REMOTE configuration whenever one exists, and
# ignores local ingress silently** — no error, no warning that reached any log we had.
# The two were byte-identical in effect, so nothing distinguished them: /config reported
# the same eight rules either way.
#
# It was only proven by clearing the remote copy, at which point the connector dropped
# from nine rules to one within fifteen seconds. So the ingress lives in Cloudflare, the
# dashboard's Public Hostnames page is the real record, and changing a route here would
# do nothing at all while looking like it had.
#
# The ingress rules are therefore NOT reproduced here. A second copy that cannot take
# effect is the drift this repo exists to end, and it is worse than no copy because it
# reads as authoritative. docs/cloudflare.md holds a dated snapshot for humans, with the
# command to regenerate it.
#
# `--autoupdate-freq 24h0m0s` stays in command_args and no-autoupdate is deliberately
# NOT set here: infra-dev disables autoupdate, this host does not.

tunnel: 9456fbcd-95f6-48a8-9bcd-d6e85bfbfc01
credentials-file: /etc/cloudflared/zero.json

# Pinned rather than left to the default: cloudflared happens to choose 20241 first, but
# the probe in docs/recovery.md depends on it and a probe that silently moves is worse
# than no probe.
#
# THE PIN MAKES THE RESTART METHOD LOAD-BEARING. `rc-service restart` does not wait, and
# cloudflared's default grace period is 30s, so the outgoing process still holds this
# port when the incoming one tries to bind it — the bind fails and cloudflared exits 1.
# On 2026-08-23 that killed six respawns in 20 seconds and supervise-daemon gave up,
# taking the tunnel down until the change was rolled back. Nothing was wrong with the
# credentials or the ingress; both were later proven good by running them in the
# foreground on a different metrics port.
#
# So this file may only be cycled with stop -> poll until 20241 is free -> start.
metrics: 127.0.0.1:20241

