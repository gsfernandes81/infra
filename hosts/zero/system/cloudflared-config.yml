# infra-os:   alpine
# infra-init: openrc
# infra-path: /etc/cloudflared
# infra-name: config.yml
# infra-mode: 0644
#
# GENERATED INTO THE REPO by ansible/playbooks/cloudflare-tunnel-new.yml, from the
# ingress the connector was actually serving — not from the dashboard and not from
# anyone's transcription. Read the diff before committing it: from here on this file IS
# the routing, and a hostname missing from it is a hostname serving 404.
#
# Generating into the repo is not the thing CLAUDE.md rejects. What is rejected is
# generating boot-path content into /etc; these bytes go through a diff, a commit and
# bin/install-system-file like every other tracked file.
#
# THIS TUNNEL IS LOCALLY-MANAGED, so unlike the old one the rules below are in force.
# cloudflared prefers a REMOTE configuration whenever one exists and ignores local
# ingress silently — which is why the previous config.yml on zero carried rules that had
# never taken effect and looked exactly like rules that had. This tunnel was created with
# `config_src: local` and has no remote configuration, so there is nothing to lose to.
#
# ORDER IS BEHAVIOUR: cloudflared matches first-rule-wins. This preserves the order the
# edge served. Do not sort it.
#
# `localhost` IS REWRITTEN TO 127.0.0.1 on the way through, deliberately, and it is the
# one thing here that is not a faithful copy of the edge. ssh resolves localhost to ::1
# first and much of this fleet binds IPv4 only — zero's cloudflared logged
# `dial tcp [::1]:8384: connect: connection refused` for months against a Syncthing that
# was running. CLAUDE.md § Landmines carries the rule. A literal costs nothing.

tunnel: ce28c17c-a722-4ba1-8e46-21985337f13f
credentials-file: /etc/cloudflared/zero.json

# Pinned so the probe in docs/recovery.md has a fixed target. THE PIN MAKES THE RESTART
# METHOD LOAD-BEARING: `rc-service restart` does not wait, cloudflared's grace period is
# 30s, and the outgoing process still holds this port when the incoming one binds it —
# six respawns died that way on zero. Cycle with stop, poll until 20241 clears, start.
metrics: 127.0.0.1:20241

ingress:
  - hostname: ssh-zero.gsrpi.uk
    service: ssh://127.0.0.1:22
  - hostname: syncthing.gsrpi.uk
    service: http://127.0.0.1:8384
  - hostname: syncthing-server.gsrpi.uk
    service: tcp://127.0.0.1:22000
  - hostname: immich.gsrpi.uk
    service: http://127.0.0.1:2283
  # 2i, 2026-08-29: `ssh-zero-dev-dd` and `ssh-zero-dev-ds` removed from here.
  #
  # They were doors ZERO opened on a container's behalf — a rule on the host tunnel
  # pointing at a container's loopback port — and each was a SECOND way in beside the
  # container's own connector. `ssh-zero-dev-or3` went the same way in 7bb2075 once
  # or3-dev had its own hostname behind its own Access application.
  #
  # dd-dev and ds-dev do NOT have their own tunnels yet; that is Phase 5. They are also
  # not running, and will not be until they are deployed with an in-container connector,
  # so removing these costs no access today. Until then they are reached through zero:
  # `ssh zero`, then the published loopback port (2222 and 2223).
  #
  # Deleting the rule does not delete the CNAME. Both records were removed at Cloudflare
  # in the same sitting; a record left pointing at this tunnel gets the catch-all 404
  # below and looks like a service that is merely down.
  - service: http_status:404
