# infra-os:   alpine
# infra-init: openrc
# infra-path: /etc
# infra-name: rsyncd-backup.conf
# infra-mode: 0644
#
# What three's pull can reach on zero: one rsync daemon, started over ssh by the forced
# command in backup-authorized-keys, serving zero's snapper snapshots read-only
# (plans/three-backup-pull.md). The daemon runs as zero's backup user, never as root, with one
# capability, CAP_DAC_READ_SEARCH, which lets it read every file in a snapshot (Postgres's
# are mode 700, its own user's) and change nothing (sudoers-backup says how it gets it).
#
#   use chroot      no: a daemon that is not root cannot chroot. The module's path still
#                   confines every name the client sends, .. included
#   read only       nothing can be written, renamed or deleted
#   list            no: the module is not named to a client that asks for the list.
#                   Listing inside it, as mirror-pull does to find the newest snapshot,
#                   needs no more
#   numeric ids     owners go as numbers; zero's names mean nothing on three
#   refuse options  the daemon never follows a symlink for the client. A snapshot holds
#                   none from Immich or Postgres, but a followed link would read whatever
#                   it points at, with the capability that reads anything
#
# A snapshot's directory is /media/immich/.snapshots/<N>/: snapper's info.xml, written once
# the snapshot is finished, and the read-only snapshot itself in snapshot/.
use chroot = no
read only = yes
list = no
numeric ids = yes
timeout = 900
refuse options = copy-links copy-unsafe-links copy-dirlinks

[snapshots]
path = /media/immich/.snapshots
