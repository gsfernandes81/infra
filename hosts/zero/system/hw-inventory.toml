# Per-host SMART policy and manual corrections for bin/hw-inventory.
#
# The PRESENCE of this file is what enables SMART polling on this host. `smart_skip`
# then names the devices that must never be polled. A host with no file here gets a
# sysfs-only inventory — so forgetting to think about it produces the safe outcome.
#
# Anything under [overrides.<dev>] wins over what the script detects.

# Nothing is skipped here, and that is a decision rather than an omission — an empty
# list says someone looked, which a deleted line does not.
#
# The caution was inherited from `one`, where a bare smartctl read of a Sabrent-bridged
# disk stalled ~60s and provoked a bridge-wide USB reset that cost a ten-minute array
# outage. Two of zero's three disks sit behind the same class of bridge, so all three
# started out skipped.
#
# Tested 2026-08-04, deliberately in blast-radius order — sdc first (alone on its own
# bridge), then sdb, then sda (which share one). All three `smartctl -i -d sat` reads
# returned within a second, with no USB reset, no I/O error, and all three mounts
# intact afterwards. Note what that does and does not establish: `one`'s hang was
# provoked by a FAILING drive, not by the bridge alone, and zero's array had just
# scrubbed clean across 130.86 GiB with zero errors. So this is safe while the disks
# are healthy. If SMART ever reports a failing drive here, re-add it to this list
# before polling it again.
smart_skip = []


[overrides.mmcblk0]
bay = "onboard"
role = "boot + root"
kind = "SD"


[overrides.sda]
# LUN 0 of the Sabrent dual bridge. Read 2026-08-21 from the sysfs path:
# sda and sdb are both under usb2/2-1/2-1:1.0 and differ only in the final LUN
# (1:0:0:0 vs 1:0:0:1), which is the bay. sdc sits alone on usb4, i.e. its own
# enclosure. That matches the SMART blast-radius note below, which already said
# sdc is alone on its bridge and sda/sdb share one.
bay = "0"
role = "bcache cache (sda1) + swap (sda3); sda2 unused"
kind = "SSD"
form_factor = "2.5in"
# sysfs reports rotational=1 for this device. That is the USB bridge answering, not the
# drive: it is the bcache CACHE, which is an SSD by design and is documented as such in
# docs/roadmap.md. Do not "correct" this back to HDD from the sysfs flag.
note = """
The bcache cache device, shared by both backing disks. Its by-id name is \
ata-Sabrent_Disk_Dev_00000000000000000000 — an ALL-ZEROS serial invented by the \
enclosure, which is the by-id collision recorded in this repo's history. Do not \
identify this drive by by-id path; two disks behind these bridges can present the same \
one. Cache mode was writethrough with 0.0k dirty as of 2026-08-03, so it holds nothing \
the backing disks do not — re-check before relying on that, because writeback would \
make it live data."""


[overrides.sdb]
# LUN 1 of the same Sabrent bridge as sda — see the note under [overrides.sda].
bay = "1"
role = "btrfs RAID1 member, backing disk for bcache1"
kind = "HDD"
note = """
Reports model 'Sabrent Disk Dev', the same string as sda, so model does not \
distinguish them. sdc is a WD Elements and is the one that IS distinguishable by \
sight."""


[overrides.sdc]
bay = "external"
role = "btrfs RAID1 member, backing disk for bcache0"
kind = "HDD"
note = """
Reports model 'Elements 25A2' — a WD Elements in its own enclosure, and therefore the \
one drive here you can identify by eye without opening anything."""
