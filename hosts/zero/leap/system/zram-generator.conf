# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/systemd
# infra-name: zram-generator.conf
# infra-mode: 0644
#
# Compressed swap in RAM, ahead of the SSD's swap partition, as zram-swap gives it on
# Alpine (hosts/zero/system/zram-swap): 2 GiB, zstd, priority 100, so the kernel fills it
# before the SSD's at -2. The same file as one's.
[zram0]
zram-size = 2048
compression-algorithm = zstd
swap-priority = 100
