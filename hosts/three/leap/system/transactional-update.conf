# infra-os:   leap
# infra-init: systemd
# infra-path: /etc
# infra-name: transactional-update.conf
# infra-mode: 0644
#
# An update builds its snapshot and never reboots into it: the owner reboots, by hand,
# after the monthly update (docs/decisions.md § Updates are by hand on every host). The
# update timer is disabled as well, by the first-boot script.
REBOOT_METHOD=none
