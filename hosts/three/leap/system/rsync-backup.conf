# infra-os:   leap
# infra-init: systemd
# infra-path: /etc
# infra-name: rsync-backup.conf
# infra-mode: 0644
#
# The one thing zero's backup key can reach: an rsync daemon, started over ssh by the key's
# forced command (backup-authorized-keys), running as the backup user, never as root, and
# serving one module that can only be written to (plans/three.md § Backups). rsync's own
# daemon over ssh, not rrsync, which openSUSE's rsync package does not install
# (docs/decisions.md).
#
#   write only    no file can be read back out of it, so the key cannot exfiltrate
#   use chroot    no: a daemon that is not root cannot chroot; the module's path still
#                 confines every name the client sends, and symlinks are munged, so a link
#                 the client makes cannot point out of incoming
#   fake super    each file's owner, group, mode and ACLs are kept in an xattr
#                 (user.rsync.%stat), since the backup user cannot chown; a restore with
#                 --fake-super on this side puts them back (hosts/three/leap/README.md)
#   list          no: the module is not even named to a client that asks
#
# While the array is locked, /media/mirror/incoming does not exist, the daemon cannot change
# into it, and the run fails cleanly; zero's next run retries.
use chroot = no
munge symlinks = yes
fake super = yes
numeric ids = yes
list = no
timeout = 900

[incoming]
path = /media/mirror/incoming
read only = no
write only = yes
