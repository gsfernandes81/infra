# infra-os:   leap
# infra-init: systemd
# infra-path: /etc
# infra-name: rsyncd-restore.conf
# infra-mode: 0644
#
# What zero's restore key can reach on three: one rsync daemon, started over ssh by the
# forced command in restore-authorized-keys, serving zero's own backups read-only
# (plans/three-backup-pull.md). The daemon runs as the restore user, never as root, with one
# capability, CAP_DAC_READ_SEARCH, which reads the backup user's files and changes nothing.
#
#   use chroot      no: a daemon that is not root cannot chroot. The module's path still
#                   confines every name the client sends, .. included
#   read only       nothing can be written, renamed or deleted
#   list            no: the module is not named to a client that asks for the list
#   fake super      the pull kept each file's owner, mode and ACLs in an xattr, since the
#                   backup user cannot chown; this sends them as the real ones, so a restore
#                   as root on zero puts them back
#   munge symlinks  the pull stored every symlink with a /rsyncd-munged/ prefix, so none
#                   leads anywhere on three, and this strips it on the way out. A link zero
#                   sent cannot then steer the daemon to a file outside the module, which,
#                   with the capability that reads anything, it would read. /rsyncd-munged
#                   must never exist on three
#   refuse options  the daemon never follows a symlink for the client
#
# The newest snapshot of zero's Immich is under
# backups/immich/current/.snapshots/<N>/snapshot/, and `sudo snapper --no-dbus -c
# received-immich list` on three gives each N with its date (hosts/three/leap/README.md
# § Restore).
use chroot = no
read only = yes
list = no
numeric ids = yes
fake super = yes
munge symlinks = yes
timeout = 900
refuse options = copy-links copy-unsafe-links copy-dirlinks

[backups]
path = /media/mirror/received-backups
