# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/systemd
# infra-name: zram-generator.conf
# infra-mode: 0644
#
# Compressed swap in RAM, and the only swap three has: its SD card is not worn by swap, and
# its one hard disk is behind a passphrase. 768 MB, zstd, as this same 1 GB board ran it
# under Alpine through zram-init while it was one, with Syncthing 2.0.14 among its loads.
[zram0]
zram-size = 768
compression-algorithm = zstd
swap-priority = 100
