# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/systemd/system/media-mirror.mount.d
# infra-name: infra-wants.conf
# infra-mode: 0644
#
# What starts the moment the owner unlocks and mounts the array: Docker, and with it
# Syncthing under its own restart policy, and the snapshot and scrub timers. The fstab
# entry is noauto, so nothing else ever starts this mount; the unlock command does
# (hosts/three/leap/README.md § Unlocking).
#
# The timers start here rather than at boot because both are Persistent: a turn missed
# while the box was off or locked runs as soon as its timer starts. Started at boot, that
# catch-up would fire against a locked array and be spent on a skipped run; started here,
# it runs on the unlocked one.
[Unit]
Wants=docker.service mirror-snapshot.timer mirror-scrub.timer
