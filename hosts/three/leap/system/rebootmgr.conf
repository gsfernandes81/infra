# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/rebootmgr
# infra-name: rebootmgr.conf
# infra-mode: 0644
#
# Nothing on this fleet reboots without the owner. /etc/rebootmgr.conf is ignored on this
# OS; this path is the one the simulation showed holding across a reboot.
[rebootmgr]
strategy=off
