# infra-os:   leap
# infra-init: systemd
# infra-path: /etc/systemd/system/docker.service.d
# infra-name: infra-mirror.conf
# infra-mode: 0644
#
# Docker on three runs only Syncthing, whose data and identity live on the encrypted
# array, so Docker starts only once the array is unlocked and mounted: the mount wants it
# (mirror-mount.conf), and until then this condition skips it, cleanly, at boot.
#
# A CONDITION, NOT RequiresMountsFor=. That option pulls the mount in, noauto or not
# (systemd.unit(5)), and the mount pulls in the LUKS unlock, so every boot would start
# Docker, start the unlock, and wait at a passphrase prompt on a console nobody watches.
# A condition never starts anything.
#
# Docker's store stays on the SD card, where Leap puts it; only the containers' data is on
# the array. While the array is locked, `docker` itself answers that it cannot connect.
#
# PartOf= so stopping the mount stops Docker first, rather than failing on a busy array;
# unlike Requires= or BindsTo=, it never starts the mount.
[Unit]
After=media-mirror.mount
PartOf=media-mirror.mount
ConditionPathIsMountPoint=/media/mirror
