# Proposes bumps to the images the compose files pin by digest. It opens a pull request
# and nothing else: the owner merges, then deploys as with any bump, so git still names
# what runs. Nothing here touches a box. Why a PR bot and not an updater on the host:
# docs/decisions.md, "Pinned images are bumped by a pull request".
#
# Only deployments whose images carry `tag@sha256:` are listed. A floating tag (`latest`,
# `release`, `dev`) has no version for Dependabot to move, so pinning those is its own
# change. `destiny-director` (stopped), `ionic-traces` (stopped), `syncthing` and `torrents`
# (all floating) are left out for that reason, not by oversight.
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /deployments/calibre-web
      - /deployments/garmin-mcp
      - /deployments/send2ereader
      - /deployments/immich
    schedule:
      interval: weekly
    groups:
      # One PR for the sidecar that three deployments carry, so the three move together.
      cloudflared:
        patterns:
          - cloudflare/cloudflared
    ignore:
      # Built by the fork's CI and tagged with a commit, so there is no version order for a
      # bot to follow. Deployed by editing compose.yaml by hand (its README, "A new version").
      - dependency-name: gsfernandes81/send2ereader
      # Built on `one` from the garmin-mcp checkout, not pulled from a registry.
      - dependency-name: garmin-mcp-remote
      # Immich's images move together and an upgrade there is a deliberate act; its
      # postgres is tied to the vector extension versions in its tag.
      #
      # Dependabot names a dependency without its registry (`immich-app/postgres`, not
      # `ghcr.io/immich-app/postgres`), so these names carry none. The first run opened a
      # Postgres 14 to 16 bump (PR 13) because the ignore was written with the prefix.
      - dependency-name: immich-app/*
