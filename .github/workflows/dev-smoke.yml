name: dev-smoke

# Bring the dev project (dev/compose.yaml) up on a runner, with stand-in keys, and check the
# things no unit test can: that the hub reaches a container with its own key, that a client
# key reaches the hub's door, that the hooks drop-in, the claude-sessions binary and the
# container's GitHub token all arrive through their volume mounts, that the workspace is
# cloned with that token, that the base carries its tools and its language servers run, that
# the sshd every container shares forwards only -R and only for a key that is not the hub's,
# that the menu draws under a terminal and then sends nothing while idle, that a recreate
# keeps the workspace, the host keys and the tokens, that the deploy play's dev hooks pass,
# that destiny-director comes up with its database and its env link as the cutover's step 6 does it,
# and that a child builds straight from its GitHub URL. Every check is named in the log, PASS
# or FAIL. The job summary carries each container's idle memory.
#
# WHAT IT CANNOT CHECK, so nobody reads a green run as more: the Pi itself (arm64 under
# Alpine/OpenRC, cgroupfs; this is amd64 Ubuntu), the memory pool (hosts/zero/system/devpool
# has its own proof, on zero), Cloudflare and the tunnel (no profile `tunnel` here), the
# GitHub App (the token handed to infra is this run's own GITHUB_TOKEN, written where the
# broker would write it; hub/test_github_tokens.py covers the broker against a stand-in),
# or3 (private: its image needs or3's deploy key), and Claude Code acting on the hooks
# (it needs a login).
#
# claude-sessions: the hub builds exactly as on zero, from the release hub/Dockerfile pins and
# checksums. To test an UNRELEASED claude-sessions against this image before a bump, dispatch
# with its ref: the binary is compiled here and swapped in for the image's `fetch` stage
# through dev/ci/compose.smoke.yaml.
#
# Runs as the runner's own user, not under sudo (`make SUDO=`): the runner user is in the
# docker group, and sudo would drop the environment the override file reads.

on:
  push:
    paths: ['dev/**', '.github/workflows/dev-smoke.yml']
  pull_request:
    paths: ['dev/**', '.github/workflows/dev-smoke.yml']
  workflow_dispatch:
    inputs:
      claude_sessions_ref:
        description: claude-sessions ref to build the hub's binary from (empty = the pinned release)
        default: ''

permissions:
  contents: read

concurrency:
  group: dev-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decide where the hub's claude-sessions comes from
        id: cs
        env:
          ASKED: ${{ inputs.claude_sessions_ref }}
        run: |
          ref="$ASKED"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "claude-sessions: ${ref:-the release hub/Dockerfile pins}"

      - name: "If unreleased: build claude-sessions from source"
        if: steps.cs.outputs.ref != ''
        env:
          REF: ${{ steps.cs.outputs.ref }}
        run: |
          git clone -q --depth 1 --branch "$REF" https://github.com/gsfernandes81/claude-sessions "$RUNNER_TEMP/cs"
          rustup update stable --no-self-update && rustup default stable
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --manifest-path "$RUNNER_TEMP/cs/Cargo.toml" --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/fetch/out"
          cp "$RUNNER_TEMP/cs/target/x86_64-unknown-linux-musl/release/claude-sessions" "$RUNNER_TEMP/fetch/out/"
          "$RUNNER_TEMP/fetch/out/claude-sessions" --version
          echo "SMOKE_CLAUDE_SESSIONS_DIR=$RUNNER_TEMP/fetch" >> "$GITHUB_ENV"
          echo "SMOKE_OVERRIDE=COMPOSE_OVERRIDE=$GITHUB_WORKSPACE/dev/ci/compose.smoke.yaml" >> "$GITHUB_ENV"

      - name: Write stand-in keys and dev/.env
        run: |
          s="$RUNNER_TEMP/secrets"
          mkdir -p "$s/hub" "$s/infra" "$s/or3" "$s/dd" "$s/ds"
          chmod 700 "$s/hub" "$s/infra" "$s/or3" "$s/dd" "$s/ds"
          ssh-keygen -q -t ed25519 -N '' -C smoke-client -f "$s/client"
          # The App is required, so a throwaway key stands in for it: the broker signs with it
          # and GitHub refuses, which the log says. infra's token is written by hand below.
          openssl genrsa -out "$s/hub/github-app.pem" 2048 2>/dev/null
          chmod 600 "$s/hub/github-app.pem"
          # The client key goes into infra's authorized_keys as well, so the forwarding
          # rules every container's sshd shares can be tried with a key that is not the hub's.
          for d in hub infra; do cp "$s/client.pub" "$s/$d/authorized_keys"; chmod 600 "$s/$d/authorized_keys"; done
          sed -e "s#^HUB_SECRETS=.*#HUB_SECRETS=$s/hub#" \
              -e "s#^INFRA_SECRETS=.*#INFRA_SECRETS=$s/infra#" \
              -e "s#^OR3_SECRETS=.*#OR3_SECRETS=$s/or3#" \
              -e "s#^DD_SECRETS=.*#DD_SECRETS=$s/dd#" \
              -e "s#^DS_SECRETS=.*#DS_SECRETS=$s/ds#" \
              -e 's#^COMPOSE_PROFILES=.*#COMPOSE_PROFILES=#' \
              -e 's#^HUB_TUNNEL_ID=.*#HUB_TUNNEL_ID=none#' \
              -e 's#^HUB_GITHUB_APP_ID=.*#HUB_GITHUB_APP_ID=1#' \
              -e "s#^HOST_UID=.*#HOST_UID=$(id -u)#" \
              -e "s#^HOST_GID=.*#HOST_GID=$(id -g)#" \
              dev/.env.example > dev/.env
          echo "SMOKE_SECRETS=$s" >> "$GITHUB_ENV"

      # Every container starts by default and only the tunnel has a profile (owner, 2026-10-27),
      # so with COMPOSE_PROFILES empty the project is everything but the tunnel. From here on,
      # each step that brings something up names it: or3's image needs its deploy key.
      - name: Check compose parses, and that only the tunnel is behind a profile
        working-directory: dev
        run: |
          COMPOSE_PROFILES=tunnel HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose config -q
          got=$(HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose config --services | sort | tr '\n' ' ')
          want="claude-sessions dd-postgres destiny-director dossier hub infra invective ionic-traces nibbles or3 "
          [ "$got" = "$want" ] || { echo "FAIL  started by default: [$got], want [$want]"; exit 1; }
          echo "PASS  every container starts by default, and the tunnel does not"
          docker version --format 'docker {{.Server.Version}}'; docker compose version

      - name: Build the base (make base)
        run: make -C dev base SUDO=

      # A runner never had the old projects, so the external volumes zero keeps are made here,
      # empty — after checking that `make up` refuses without them, which is the cutover's net.
      - name: Check make up refuses missing volumes, then create them (make volumes)
        run: |
          if make -C dev up SUDO= $SMOKE_OVERRIDE 2>err.txt; then echo "make up did NOT refuse"; exit 1; fi
          grep -q 'missing external volumes' err.txt && echo "PASS  refused, naming the volumes"
          make -C dev volumes SUDO=

      # The deploy play brings the whole project up at once, and Compose creates every container
      # before it starts any; the steps below start the hub alone first, which hid this. A dev
      # container's create used to copy its root-owned mountpoint over the hub's still-empty
      # volume, so the hub could not install into it (zero, 2026-10-27; compose.yaml at x-opt).
      # Here it is the hub and infra, since every dev container mounts the same volumes and the
      # others' images are not built yet.
      - name: Check creating a dev container leaves the hub's volumes dev's
        working-directory: dev
        run: |
          files="-f compose.yaml"; [ -n "${SMOKE_CLAUDE_SESSIONS_DIR:-}" ] && files="$files -f ci/compose.smoke.yaml"
          docker compose $files create hub infra
          for v in claude-sessions github-tokens hub-state claude-login; do
            owner=$(docker run --rm -v "dev_$v:/v" busybox stat -c %u /v)
            [ "$owner" = "$(id -u)" ] || { echo "FAIL  dev_$v is owned by uid $owner, not the hub's $(id -u)"; exit 1; }
            echo "PASS  dev_$v is the hub's after creating every container"
          done
          docker compose $files down

      - name: Start the hub (make up S=hub)
        run: |
          make -C dev up S=hub SUDO= $SMOKE_OVERRIDE
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" dev-hub)" = healthy ]; do sleep 2; done'

      - name: Hand infra a token where the broker would write it
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf %s "$TOKEN" | docker exec -i dev-hub sh -c \
            'umask 077; d=/home/dev/tokens/infra; cat > "$d/token.tmp" && mv -f "$d/token.tmp" "$d/token"'

      - name: Start infra (make up S=infra)
        run: |
          make -C dev up S=infra SUDO= $SMOKE_OVERRIDE
          timeout 300 sh -c 'until docker exec dev-hub ssh -o BatchMode=yes -o ConnectTimeout=5 infra true 2>/dev/null; do sleep 5; done'

      - name: Check the project end to end
        env:
          REPO: ${{ github.repository }}
        run: |
          fails=0
          check() { n="$1"; shift; if "$@"; then echo "PASS  $n"; else echo "FAIL  $n"; fails=$((fails + 1)); fi; }

          check "the hub's key sits in authorized_keys.hub, restrict,pty" \
            docker exec infra grep -q '^restrict,pty ssh-ed25519 ' /home/dev/.ssh/authorized_keys.hub
          check "the hub runs a command in infra with it" \
            docker exec dev-hub ssh -o BatchMode=yes infra true
          check "the same claude-sessions runs at both ends" sh -c \
            '[ "$(docker exec dev-hub claude-sessions --version)" = "$(docker exec dev-hub ssh infra /opt/claude-sessions/bin/claude-sessions --version)" ]'
          check "the agent answers with a snapshot of /workspace" sh -c \
            'docker exec dev-hub timeout 20 ssh -T infra /opt/claude-sessions/bin/claude-sessions agent </dev/null | head -1 | grep -q "\"workspace\":\"/workspace\""'
          docker exec -i dev-hub sh -c 'umask 077; cat > /tmp/client' < "$SMOKE_SECRETS/client"
          check "a client key reaches the hub's door" sh -c \
            '[ "$(docker exec dev-hub ssh -F /dev/null -i /tmp/client -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null dev@127.0.0.1 echo door-ok)" = door-ok ]'
          check "the hooks drop-in is mounted" \
            docker exec infra test -s /etc/claude-code/managed-settings.d/claude-sessions.json
          check "Claude Code is installed" docker exec infra claude --version
          check "/run/github holds this container's token and nothing else" sh -c \
            '[ "$(docker exec infra ls -A /run/github)" = token ]'
          check "git asks the hub's helper for github.com" sh -c \
            '[ "$(docker exec infra git config --global credential.https://github.com.helper)" = hub ]'
          check "gh uses the hub's token" sh -c \
            '[ "$(docker exec infra gh api "repos/$REPO" --jq .full_name)" = "$REPO" ]'
          check "the workspace is a clone over https" sh -c \
            '[ "$(docker exec infra git -C /workspace remote get-url origin)" = "https://github.com/gsfernandes81/infra.git" ]'
          check "the base carries its tools" docker exec infra sh -c '
            for t in hx rg fd jq yq tree file unzip rsync sqlite3 shellcheck shfmt bat fzf delta \
                     uv ruff ty typescript-language-server bash-language-server \
                     yaml-language-server docker-langserver vscode-json-language-server \
                     taplo fish-lsp gh zmx; do
              command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
            done'
          check "helix has its grammars" docker exec infra test -s /opt/helix/runtime/grammars/python.so
          check "the token broker's own tests" python3 dev/hub/test_github_tokens.py

          # ── the hub's own parts ──
          check "hub-health says healthy" sh -c '[ "$(docker exec dev-hub hub-health)" = healthy ]'
          check "the offload loop has beaten" docker exec dev-hub test -f /home/dev/.hub/offload.beat
          check "the token loop has beaten" docker exec dev-hub test -f /home/dev/.hub/tokens.beat
          check "the container list is derived from HUB_REPO_*" sh -c \
            '[ "$(docker exec dev-hub sh -c "grep ^CLAUDE_SESSIONS_HOSTS= ~/.ssh/environment")" = "CLAUDE_SESSIONS_HOSTS=claude-sessions destiny-director dossier infra invective ionic-traces nibbles or3" ]'
          # Calibrated by its other half: the stopped containers must FAIL, or the pass did
          # not try them and "infra did not fail" means nothing.
          docker exec dev-hub claude-sessions offload-all --dry-run > offload.txt 2>&1 || true
          sed 's/^/    | /' offload.txt
          check "docker exec sees the derived list too (not 'local')" grep -q "^infra: " offload.txt
          check "an offload pass reaches infra" sh -c '! grep -q "^infra: pass failed" offload.txt'
          check "and reports the stopped ones as failed" grep -q "^dossier: pass failed" offload.txt
          check "the hub's sshd: no forwarding, the menu door" sh -c '
            t=$(docker exec dev-hub /usr/sbin/sshd -T -f /home/dev/sshd_config) &&
            echo "$t" | grep -qx "allowtcpforwarding no" &&
            echo "$t" | grep -qx "forcecommand /usr/local/bin/hub-door"'

          # ── every container's sshd, the one file ──
          check "infra's sshd: remote forwarding only, the door, two key files" sh -c '
            t=$(docker exec infra /usr/sbin/sshd -T -f /home/dev/sshd_config) &&
            echo "$t" | grep -qx "allowtcpforwarding remote" &&
            echo "$t" | grep -qx "gatewayports no" &&
            echo "$t" | grep -qx "forcecommand /usr/local/bin/dev-door" &&
            echo "$t" | grep -qx "authorizedkeysfile /home/dev/.ssh/authorized_keys /home/dev/.ssh/authorized_keys.hub"'
          check "a client key may -R into a container (or3-tunnel's shape)" sh -c \
            "[ \"\$(docker exec dev-hub ssh -F /dev/null -i /tmp/client -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ExitOnForwardFailure=yes -R 127.0.0.1:2299:127.0.0.1:2222 dev@infra 'nc -z 127.0.0.1 2299 && echo r-ok')\" = r-ok ]"
          check "but not -W/-L (local forwarding refused)" sh -c \
            "! docker exec dev-hub ssh -F /dev/null -i /tmp/client -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W 127.0.0.1:2222 dev@infra </dev/null >/dev/null 2>&1"
          check "and the hub's key may not forward at all (restrict)" sh -c \
            "! docker exec dev-hub ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -R 127.0.0.1:2298:127.0.0.1:2222 infra true 2>/dev/null"

          # ── GitHub is the token and nothing else ──
          check "no url rewrite to ssh in git's config" sh -c \
            '! docker exec infra git config --global --get-regexp "^url\." >/dev/null'
          check "no private key in ~/.ssh" sh -c '[ -z "$(docker exec infra sh -c "ls ~/.ssh/id_* 2>/dev/null")" ]'
          check "git's credential for github.com is the token" sh -c \
            'printf "protocol=https\nhost=github.com\n\n" | docker exec -i infra git credential fill | grep -qx username=x-access-token'

          # ── the editor and its language servers actually run ──
          check "the language servers start (each --version)" docker exec infra sh -c '
            for t in hx typescript-language-server bash-language-server fish-lsp \
                     taplo ruff ty uv yq; do
              out=$("$t" --version 2>&1) || { echo "does not run: $t"; echo "$out" | head -20; exit 1; }
            done'
          docker exec infra sh -c 'for l in python bash yaml toml typescript json dockerfile docker-compose fish; do echo "--- $l"; hx --health $l 2>&1 | sed -n "/language servers/,/^[^ ]/p"; done' | sed 's/^/    | /'
          check "helix finds a language server for each language it is meant to" docker exec infra sh -c '
            for l in python bash yaml toml typescript json dockerfile docker-compose fish; do
              hx --health $l 2>&1 | awk "/language servers/{f=1;next} /^[^ ]/{f=0} f && /✓/{ok=1} END{exit !ok}" \
                || { echo "no server for $l"; exit 1; }
            done'

          # ── Claude Code's code intelligence: the plugin is there and enabled, and ty speaks LSP ──
          check "the local plugin marketplace validates" docker exec infra claude plugin validate /opt/claude-plugins
          # A session's init event is where Claude Code says what it loaded (`claude plugin list`
          # shows only what a user installed, so it lists nothing here, correctly). A dummy key:
          # the init event comes before the first request, which then fails. A throwaway config
          # dir, so the probe leaves nothing in the container's ~/.claude.
          docker exec -w /workspace infra sh -c 'CLAUDE_CONFIG_DIR=/tmp/cc-probe ANTHROPIC_API_KEY=sk-ant-smoke-dummy \
            timeout 60 claude -p hi --output-format stream-json --verbose 2>/dev/null; rm -rf /tmp/cc-probe' \
            | grep '"subtype":"init"' > init.json || true
          check "a Claude session loads ty-lsp from /opt/claude-plugins" grep -q '"path":"/opt/claude-plugins/ty-lsp","source":"ty-lsp@gsrpi-dev"' init.json
          check "and gives Claude its LSP tool" grep -q '"LSP"' init.json
          check "ty-lsp prefers the project's venv ty" docker exec infra sh -c '
            mkdir -p /tmp/p/.venv/bin && printf "#!/bin/sh\nexit 0\n" > /tmp/p/.venv/bin/ty && chmod +x /tmp/p/.venv/bin/ty
            CLAUDE_PROJECT_DIR=/tmp/p ty-lsp 2>&1 | grep -qx "ty-lsp: using /tmp/p/.venv/bin/ty"; r=$?; rm -rf /tmp/p; exit $r'
          check "ty-lsp answers an LSP initialize (the base ty, no venv here)" docker exec infra sh -c '
            b="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"processId\":null,\"rootUri\":\"file:///workspace\",\"capabilities\":{}}}"
            printf "Content-Length: %d\r\n\r\n%s" "${#b}" "$b" | (cat; sleep 5) | CLAUDE_PROJECT_DIR=/workspace timeout 10 ty-lsp 2>/dev/null | head -c 4000 | grep -q "\"capabilities\""'

          # ── the limits compose sets are the ones the kernel got ──
          check "infra's limits: 2560m RAM, 8704m RAM+swap" sh -c \
            '[ "$(docker inspect -f "{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}" infra)" = "2684354560 9126805504" ]'

          echo "$fails failed"
          [ "$fails" = 0 ]

      # The door, as the phone meets it: a terminal on the far end of `ssh dev`. And the rule the
      # metered link depends on, that a menu nobody touches sends nothing. Calibrated by the
      # first half: the menu must have drawn the containers, or "nothing was sent" is empty.
      # compose.yaml's shared-logins switch reads true: infra reads its
      # login from the shared volume, and the check `make verify` uses to prove Claude Code still
      # honours the undocumented variable tells honoured from ignored. A fake, unexpired login, so
      # nothing reaches a login server; removed after.
      - name: Check the shared Claude login is the one infra reads
        run: |
          dir=$(docker exec infra printenv CLAUDE_SECURESTORAGE_CONFIG_DIR)
          [ "$dir" = /home/dev/.claude-logins/true ] || { echo "FAIL  CLAUDE_SECURESTORAGE_CONFIG_DIR is '$dir'"; exit 1; }
          exp=$(( $(date +%s) * 1000 + 3600000 ))
          printf '{"claudeAiOauth":{"accessToken":"at-smoke","refreshToken":"rt-smoke","expiresAt":%s,"scopes":["user:inference"],"subscriptionType":"max"}}' "$exp" \
            | docker exec -i infra sh -c 'umask 077; cat > "$CLAUDE_SECURESTORAGE_CONFIG_DIR/.credentials.json"'
          make -s -C dev verify SUDO= | grep -E '^(auth|login dir)' | tee login.txt
          grep -q '^auth      : claude logged in — the shared login' login.txt || { echo "FAIL  not logged in on the shared login"; exit 1; }
          echo "PASS  logged in on the shared login"
          grep -q '^login dir : honoured' login.txt || { echo "FAIL  the variable is not honoured"; exit 1; }
          echo "PASS  the variable is honoured"
          docker exec infra rm -f /home/dev/.claude-logins/true/.credentials.json

      - name: Check the menu under a terminal, and that an idle one sends nothing
        run: |
          cmd="stty cols 80 rows 24; exec docker exec -it dev-hub ssh -tt -F /dev/null -i /tmp/client -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null dev@127.0.0.1"
          in="$RUNNER_TEMP/menu.in"; out="$RUNNER_TEMP/menu.out"
          mkfifo "$in"
          TERM=xterm-256color script -qfc "$cmd" "$out" < "$in" > /dev/null 2>&1 &
          pid=$!
          exec 3> "$in"
          sleep 15; a=$(wc -c < "$out")
          sleep 25; b=$(wc -c < "$out")
          printf q >&3; sleep 3; exec 3>&-
          kill "$pid" 2>/dev/null || true
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$out" | tr -d '\r' | grep -v '^ *$' | head -30 | sed 's/^/    | /'
          echo "bytes at 15s: $a, at 40s: $b"
          fails=0
          sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$out" | grep -q infra && echo "PASS  the menu lists the containers" || { echo "FAIL  the menu lists the containers"; fails=1; }
          [ "$a" -gt 0 ] && [ "$a" = "$b" ] && echo "PASS  an idle menu sent nothing for 25s" || { echo "FAIL  an idle menu sent $((b - a)) bytes in 25s"; fails=1; }
          [ "$fails" = 0 ]

      # What a rebuild or an `up` that recreates must keep: the workspace, the host key the
      # clients pinned, and — for the hub — its own key and every container's token.
      - name: Check a recreate keeps the workspace, the host keys and the tokens
        working-directory: dev
        run: |
          files="-f compose.yaml"; [ -n "${SMOKE_CLAUDE_SESSIONS_DIR:-}" ] && files="$files -f ci/compose.smoke.yaml"
          fails=0
          check() { n="$1"; shift; if "$@"; then echo "PASS  $n"; else echo "FAIL  $n"; fails=$((fails + 1)); fi; }
          reach() { timeout 300 sh -c 'until docker exec dev-hub ssh -o BatchMode=yes -o ConnectTimeout=5 infra true 2>/dev/null; do sleep 3; done'; }
          fp() { docker exec "$1" ssh-keygen -lf "$2" | awk '{print $2}'; }

          docker exec infra sh -c 'echo kept > /workspace/.smoke-marker'
          id1=$(docker inspect -f '{{.Id}}' infra); k1=$(fp infra /home/dev/.ssh-host/ssh_host_ed25519_key.pub)
          docker compose $files up -d --no-deps --force-recreate infra
          reach
          check "infra was recreated (a new container id)" [ "$id1" != "$(docker inspect -f '{{.Id}}' infra)" ]
          check "its workspace survived, not re-cloned" docker exec infra test -s /workspace/.smoke-marker
          check "its sshd host key survived" [ "$k1" = "$(fp infra /home/dev/.ssh-host/ssh_host_ed25519_key.pub)" ]

          id2=$(docker inspect -f '{{.Id}}' dev-hub); h1=$(docker exec dev-hub sh -c 'ssh-keygen -lf ~/.hub/id_ed25519.pub' | awk '{print $2}')
          docker compose $files up -d --no-deps --force-recreate hub
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" dev-hub)" = healthy ]; do sleep 2; done'
          check "the hub was recreated" [ "$id2" != "$(docker inspect -f '{{.Id}}' dev-hub)" ]
          check "its own key survived" [ "$h1" = "$(docker exec dev-hub sh -c 'ssh-keygen -lf ~/.hub/id_ed25519.pub' | awk '{print $2}')" ]
          check "it still reaches infra, host key unchanged" docker exec dev-hub ssh -o BatchMode=yes infra true
          check "infra still sees its token" docker exec infra test -s /run/github/token
          docker exec infra rm -f /workspace/.smoke-marker
          echo "$fails failed"; [ "$fails" = 0 ]

      # The deploy play runs these hook files against zero; here they run against the runner,
      # as root the way `become` runs them. Preflight under --check (its build is skipped
      # there: it would rebuild without the smoke override), the probe for real. And
      # check-names is calibrated by a stand-in from another project holding a dev name.
      - name: Check the deploy play's dev hooks, and every playbook parses
        run: |
          pipx install --quiet ansible-core
          ansible-galaxy collection install --upgrade -r ansible/requirements.yml >/dev/null
          # Playbooks only: an underscore file is either an imported play or a task list that
          # plays include, and --syntax-check refuses the second kind as "not a valid Play".
          # The -e values are placeholders for the three plays that name a host or a play from
          # one; syntax-check renders those names and dies on an undefined variable.
          plays=$(cd ansible && python3 -c 'import sys, yaml
          for f in sys.argv[1:]:
              d = yaml.safe_load(open(f)) or []
              if all(isinstance(e, dict) and ("hosts" in e or any(k.endswith("import_playbook") for k in e)) for e in d):
                  print(f)' playbooks/*.yml)
          echo "$plays" | wc -l | xargs echo "playbooks:"
          (cd ansible && for p in $plays; do ansible-playbook --syntax-check -e deployment=dev -e target=zero "$p" >/dev/null || { echo "FAIL  syntax: $p"; exit 1; }; done)
          echo "PASS  every playbook parses"
          h="$RUNNER_TEMP/hooks.yml"
          cat > "$h" <<'YAML'
          - hosts: localhost
            connection: local
            gather_facts: false
            vars:
              dep: { name: dev, host: localhost }
              dep_dir: "{{ lookup('env', 'GITHUB_WORKSPACE') }}/dev"
            tasks:
              - ansible.builtin.include_tasks: "{{ lookup('env', 'GITHUB_WORKSPACE') }}/ansible/deploy-hooks/dev/{{ hook }}.yml"
          YAML
          ansible-playbook -i localhost, "$h" -e hook=preflight --check
          echo "PASS  preflight: make check and check-names pass on a good project"
          ansible-playbook -i localhost, "$h" -e hook=probe
          echo "PASS  probe: the hub is healthy and reaches what runs"
          docker run -d --name dossier --label com.docker.compose.project=dossier busybox sleep 600 >/dev/null
          if make -C dev check-names SUDO= 2>err.txt; then echo "FAIL  check-names let an old project's dossier through"; docker rm -f dossier; exit 1; fi
          docker rm -f dossier >/dev/null
          grep -q "project 'dossier'" err.txt && echo "PASS  check-names refuses an old project's container, naming it"
          # A container under a name retired by the 2026-10-27 rename, in this very project, as
          # zero has until its first deploy after it: refused, because it would share volumes.
          docker run -d --name ds-dev --label com.docker.compose.project=dev busybox sleep 600 >/dev/null
          if make -C dev check-names SUDO= 2>err.txt; then echo "FAIL  check-names let the retired ds-dev through"; docker rm -f ds-dev; exit 1; fi
          docker rm -f ds-dev >/dev/null
          if grep -q "retired on 2026-10-27: ds-dev" err.txt; then echo "PASS  check-names refuses a container under a retired name"
          else echo "FAIL  check-names refused, but not for the retired name:"; cat err.txt; exit 1; fi

      # destiny-director is the one child with an env file and a database, and it builds from a public
      # repo, so it can be brought up here exactly as the cutover's step 6 says.
      - name: Check destiny-director, its database and its env link (cutover step 6)
        run: |
          make -C dev up S=destiny-director SUDO= $SMOKE_OVERRIDE
          timeout 600 sh -c 'until docker exec dev-hub ssh -o BatchMode=yes -o ConnectTimeout=5 destiny-director true 2>/dev/null; do sleep 5; done'
          printf 'SMOKE=1\n' > "$RUNNER_TEMP/dd.env"
          docker cp "$RUNNER_TEMP/dd.env" destiny-director:/home/dev/.env.d/.env
          make -C dev restart C=destiny-director SUDO=
          timeout 300 sh -c 'until docker exec dev-hub ssh -o BatchMode=yes -o ConnectTimeout=5 destiny-director true 2>/dev/null; do sleep 3; done'
          fails=0
          check() { n="$1"; shift; if "$@"; then echo "PASS  $n"; else echo "FAIL  $n"; fails=$((fails + 1)); fi; }
          check "destiny-director cloned destiny-director" sh -c \
            '[ "$(docker exec destiny-director git -C /workspace remote get-url origin)" = "https://github.com/gsfernandes81/destiny-director.git" ]'
          check "/workspace/.env is the link into the env volume" sh -c \
            '[ "$(docker exec destiny-director readlink /workspace/.env)" = /home/dev/.env.d/.env ]'
          check "and reads what docker cp put there" sh -c '[ "$(docker exec destiny-director cat /workspace/.env)" = SMOKE=1 ]'
          check "the link is excluded from git" sh -c '[ -z "$(docker exec destiny-director git -C /workspace status --porcelain -- .env)" ]'
          check "postgres answers by its old name" docker exec destiny-director nc -z -w 5 postgres 5432
          check "destiny-director's limits: 2560m RAM, 8704m RAM+swap" sh -c \
            '[ "$(docker inspect -f "{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}" destiny-director)" = "2684354560 9126805504" ]'
          echo "$fails failed"; [ "$fails" = 0 ]

      # Not a check: what the owner asked, measured. Each container's own cgroup, after a minute
      # with nothing open in it. amd64 here, not the Pi, so read it as close, not exact.
      - name: Report idle memory, nothing open in any container
        run: |
          sleep 60
          {
            echo "### Idle memory, no claude in any container"
            echo
            echo "| container | memory.current | anon | file (cache) | docker stats |"
            echo "|---|---|---|---|---|"
            for c in dev-hub dev-cloudflared infra destiny-director dd-postgres; do
              docker inspect --type container "$c" >/dev/null 2>&1 || continue
              # cgroup v2 names first (the runner, and zero); v1's for a host that still has it.
              read -r cur anon file <<EOF2
          $(docker exec "$c" sh -c 'd=/sys/fs/cgroup; if [ -f $d/memory.current ]; then
              echo "$(cat $d/memory.current) $(awk "\$1==\"anon\"{print \$2}" $d/memory.stat) $(awk "\$1==\"file\"{print \$2}" $d/memory.stat)"
            else d=$d/memory
              echo "$(cat $d/memory.usage_in_bytes) $(awk "\$1==\"total_rss\"{print \$2}" $d/memory.stat) $(awk "\$1==\"total_cache\"{print \$2}" $d/memory.stat)"
            fi' 2>/dev/null || echo 0 0 0)
          EOF2
              st=$(docker stats --no-stream --format '{{.MemUsage}}' "$c")
              printf '| %s | %s MiB | %s MiB | %s MiB | %s |\n' "$c" $((cur/1048576)) $((anon/1048576)) $((file/1048576)) "$st"
            done
            echo
            echo "infra's processes (RSS, KiB):"
            echo '```'
            docker exec infra ps -eo rss,comm --sort=-rss | head -12
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # What the deploy play's plan relies on: Compose recreates only what a change touches.
      # Calibrated first — with nothing changed the plan must be empty, or the reading is wrong.
      - name: Check a change to one container recreates only that one
        working-directory: dev
        run: |
          files="-f compose.yaml"; [ -n "${SMOKE_CLAUDE_SESSIONS_DIR:-}" ] && files="$files -f ci/compose.smoke.yaml"
          plan() { docker compose $files --dry-run up -d hub infra destiny-director 2>&1 | grep -i recreate | grep -oE '(dev-hub|dev-cloudflared|infra|or3|destiny-director|dd-postgres|dossier)' | sort -u | tr '\n' ' '; }
          cp .env .env.orig
          got=$(plan); echo "nothing changed: [$got]"; [ -z "$got" ]
          sed -i 's/^DEV_MEM_LIMIT=.*/DEV_MEM_LIMIT=2048m/' .env
          got=$(plan); echo "infra's limit changed: [$got]"; [ "$got" = "infra " ]
          cp .env.orig .env; sed -i 's/^HUB_OFFLOAD=.*/HUB_OFFLOAD=0/' .env
          got=$(plan); echo "the hub's offload switch changed: [$got]"; [ "$got" = "dev-hub " ]
          cp .env.orig .env; rm .env.orig
          echo "PASS  each change recreates only its own container"

      - name: Build dossier straight from its GitHub URL
        working-directory: dev
        run: |
          docker compose build dossier

      # claude-sessions' Dockerfile.dev picks its rustup-init by architecture; this is the amd64
      # half, and the only build of it before zero's. The toolchain must answer as dev, from
      # the PATH the image sets, at the version it pins.
      - name: Build claude-sessions straight from its GitHub URL, and run its toolchain
        working-directory: dev
        run: |
          docker compose build claude-sessions
          v=$(docker run --rm --entrypoint rustc claude-sessions --version)
          echo "$v"
          case "$v" in "rustc 1.99.1 "*) echo "PASS  claude-sessions has its pinned rustc" ;;
            *) echo "FAIL  claude-sessions' rustc is '$v'"; exit 1 ;; esac
          docker run --rm --entrypoint sh claude-sessions -c \
            'cargo clippy --version && rustfmt --version && rust-analyzer --version && rustup target list --installed'

      - name: "On failure: the containers' logs"
        if: failure()
        run: |
          for c in dev-hub infra destiny-director; do echo "=== $c"; docker logs --tail 200 "$c" 2>&1 || true; done
          docker exec dev-hub sh -c 'tail -50 ~/.hub/github-tokens.log; tail -50 ~/.hub/passes.log' 2>&1 || true
