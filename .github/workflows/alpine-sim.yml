name: alpine-sim

# Runs the setup plays (server-install-tailscale.yml, server-create-restore-key.yml,
# server-store-backup-ntfy-url.yml) end to end, server-install-system-files.yml's dry run, zero's
# snapper install as hosts/zero/system/README.md gives it, install-system-file's sudoers
# check and server-start-dev-containers.yml, all against an Alpine container with OpenRC as
# init, reached over ssh (sim/alpine/); and server-unlock-arrays.yml's refusal of OpenRC there
# and its unlock on the runner's own systemd. Every check is named PASS or FAIL in the log,
# and any FAIL fails the job. arm64, so the pinned Tailscale tarball's own binaries run as on zero.
#
# WHAT IT CANNOT CHECK, so nobody reads a green run as more: a real join (no auth key exists
# here; the real tailscale is shown refusing a made-up key, and a stand-in answers `up`), a
# Pi's kernel, ntfy itself (a stand-in answers the test message), and a real tailnet (the
# refusal to restart over one is shown from an address in its range). sim/alpine/README.md
# says more.
#
# A second job, dmcrypt, runs sim/alpine/run-dmcrypt.sh: zero's encrypted array member as
# far as a container takes it (Alpine's cryptsetup and dmcrypt service, the tracked files,
# install-system-file's dmcrypt check, OpenRC's start order), on a loop device, on the
# runner's kernel and not a Pi's. The reboot on zero is the proof of the rest.

on:
  push:
    paths:
      - 'sim/alpine/**'
      - 'ansible/playbooks/server-install-tailscale.yml'
      - 'ansible/playbooks/server-create-restore-key.yml'
      - 'ansible/playbooks/server-store-backup-ntfy-url.yml'
      - 'ansible/playbooks/server-install-system-files.yml'
      - 'ansible/playbooks/server-start-dev-containers.yml'
      - 'ansible/playbooks/server-unlock-arrays.yml'
      - 'ansible/playbooks/files/unlock-volumes.sh'
      - 'sim/microos/host/play-prompts.py'
      - 'dev/Makefile'
      - 'ansible/playbooks/_review-anchor.yml'
      - 'ansible/playbooks/_sync-host-checkout.yml'
      - 'ansible/playbooks/_assert-inventory.yml'
      - 'ansible/callback_plugins/**'
      - 'ansible/ansible.cfg'
      - 'ansible/group_vars/**'
      - 'bin/install-system-file'
      - 'bin/_infra.py'
      - 'hosts/zero/system/**'
      - 'hosts/three/leap/system/**'
      - 'hosts/*/leap/MOVED'
      - '.github/workflows/alpine-sim.yml'
  pull_request:
    paths:
      - 'sim/alpine/**'
      - 'ansible/playbooks/server-install-tailscale.yml'
      - 'ansible/playbooks/server-create-restore-key.yml'
      - 'ansible/playbooks/server-store-backup-ntfy-url.yml'
      - 'ansible/playbooks/server-install-system-files.yml'
      - 'ansible/playbooks/server-start-dev-containers.yml'
      - 'ansible/playbooks/server-unlock-arrays.yml'
      - 'ansible/playbooks/files/unlock-volumes.sh'
      - 'sim/microos/host/play-prompts.py'
      - 'dev/Makefile'
      - 'ansible/playbooks/_review-anchor.yml'
      - 'ansible/playbooks/_sync-host-checkout.yml'
      - 'ansible/playbooks/_assert-inventory.yml'
      - 'ansible/callback_plugins/**'
      - 'ansible/ansible.cfg'
      - 'ansible/group_vars/**'
      - 'bin/install-system-file'
      - 'bin/_infra.py'
      - 'hosts/zero/system/**'
      - 'hosts/three/leap/system/**'
      - 'hosts/*/leap/MOVED'
      - '.github/workflows/alpine-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpine-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup-plays:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # Whole history: the script pushes this commit to the host checkout's origin, and a
      # shallow clone cannot be pushed from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ansible-core
        run: |
          pipx install ansible-core
          ansible --version

      # The real tailscaled opens /dev/net/tun in the container.
      - name: Load the tun module
        run: sudo modprobe tun

      - name: Run the setup plays against the Alpine box
        run: sim/alpine/run-setup-plays.sh

  dmcrypt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the encrypted member's checks against the Alpine box
        run: sim/alpine/run-dmcrypt.sh
