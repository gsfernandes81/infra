name: pi-image

# What the Leap simulation cannot see, because it boots openSUSE's x86_64 image: the Pi
# image the cards are written from. leap-pins.yml checks the binaries' pins.
#
# image: downloads the newest build openSUSE publishes, checks its SHA-256 against the
# .sha256 file beside it, and inspects it read-only (sim/pi-image/inspect.sh): Combustion
# in the initrd, the Wi-Fi firmware, the packages, the boot path, the partition table, and
# for zero the Pi 5's boot files and Ethernet drivers and the array's kernel modules. There
# is no pin of ours: a card is written from the newest build at the day's download, kept on
# two, so this run shows what a rebuild changed. Report-only: it fails only when the
# download or checksum fails.
#
# It trusts openSUSE's server: the image is checked against the .sha256 file beside it, not
# the signed .sha256.asc. It runs the image's own binaries as root, in a chroot, which is
# fine on a throwaway runner and nowhere else.

on:
  push:
    paths: ['.github/workflows/pi-image.yml', 'sim/pi-image/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # arm64, so the image's own rpm and lsinitrd run in a chroot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install btrfs-progs and the initrd tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends btrfs-progs xz-utils zstd cpio \
            initramfs-tools-core binutils device-tree-compiler

      - name: Inspect the newest Pi image
        run: sudo sim/pi-image/inspect.sh "$RUNNER_TEMP/pi"

      - name: Put the answers in the job summary
        if: always()
        run: |
          {
            echo '### The newest Pi image'
            echo '```'
            grep '^ANSWER' "$RUNNER_TEMP/pi/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat "$RUNNER_TEMP/pi/report.txt" 2>/dev/null
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          sudo chmod -R a+r "$RUNNER_TEMP/pi" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-image
          path: |
            ${{ runner.temp }}/pi/report.txt
            ${{ runner.temp }}/pi/packages.txt
            ${{ runner.temp }}/pi/initrd-*.txt
          if-no-files-found: warn
