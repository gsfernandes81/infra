name: microos-sim

# The simulations in plans/microos-cutover.md: boot openSUSE Leap 16.1 in its Immutable
# mode (sim/microos/lib.sh; SIM_OS=microos runs MicroOS, which they were first written
# for) under KVM with a Combustion config, install what a fleet host would carry, and report what
# the plan's open questions turn on (SELinux and bind mounts into /media, Docker and its
# compose plugin, the default reboot policy, bcache's udev rule, packages). The report is the
# job summary and an artifact; the job fails only when the VM does not boot or answer ssh.
#
# WHAT IT CANNOT CHECK, so nobody reads a green run as more: the Pi itself (this is x86_64
# under KVM; the aarch64 job only asks the package repositories), USB bridges, real disks,
# Cloudflare, and any host's own first-boot script. sim/microos/README.md says more.

on:
  push:
    paths: ['sim/microos/**', '.github/workflows/microos-sim.yml', 'leap/**', 'hosts/*/leap/**',
      'hosts/one/*', 'hosts/three/*', 'hosts/zero/system/mirror-backup',
      'ansible/playbooks/server-deploy-compose.yml', 'ansible/playbooks/server-update-leap.yml',
      'ansible/playbooks/_deploy-compose-one.yml', 'ansible/playbooks/_sync-host-checkout.yml',
      'ansible/playbooks/_review-anchor.yml', 'ansible/playbooks/_assert-inventory.yml',
      'ansible/playbooks/files/compose-oneshots.py', 'ansible/callback_plugins/**',
      'ansible/ansible.cfg', 'ansible/group_vars/**', 'ansible/host_vars/**',
      'ansible/requirements.yml', 'ansible/deploy-hooks/**', 'deployments/calibre-web/**',
      'deployments/garmin-mcp/**', 'deployments/send2ereader/**', 'deployments/torrents/**',
      'deployments/syncthing-three/**', '!deployments/*/README.md']
  pull_request:
    paths: ['sim/microos/**', '.github/workflows/microos-sim.yml', 'leap/**', 'hosts/*/leap/**',
      'hosts/one/*', 'hosts/three/*', 'hosts/zero/system/mirror-backup',
      'ansible/playbooks/server-deploy-compose.yml', 'ansible/playbooks/server-update-leap.yml',
      'ansible/playbooks/_deploy-compose-one.yml', 'ansible/playbooks/_sync-host-checkout.yml',
      'ansible/playbooks/_review-anchor.yml', 'ansible/playbooks/_assert-inventory.yml',
      'ansible/playbooks/files/compose-oneshots.py', 'ansible/callback_plugins/**',
      'ansible/ansible.cfg', 'ansible/group_vars/**', 'ansible/host_vars/**',
      'ansible/requirements.yml', 'ansible/deploy-hooks/**', 'deployments/calibre-web/**',
      'deployments/garmin-mcp/**', 'deployments/send2ereader/**', 'deployments/torrents/**',
      'deployments/syncthing-three/**', '!deployments/*/README.md']
  workflow_dispatch:

permissions:
  contents: read

# On main, runs queue rather than cancel: main is what the boxes run, so a report there is
# evidence about a commit the fleet may pull, and a run in progress finishes. On any other
# ref a newer push cancels the run in progress: the commit it was testing is superseded and
# will not merge as it stands, and the new run's `changes` job diffs the whole branch
# against main, so nothing the cancelled run would have covered goes untested. A queued
# branch run used to wait out the whole of the one before it, 40 minutes, and the hub's
# token cannot cancel a run by hand.
concurrency:
  group: microos-sim-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Which of the jobs below this change can affect. The host jobs read the repo widely
    # (leap/, hosts/, ansible/, deployments/), so they always run, and the paths above are
    # theirs. probe, late-disks, docker-store and health-mounts read nothing outside
    # sim/microos/ besides this file: their scripts take only lib.sh, qmp.py, ppm2png.py and
    # their own directory, and their guests see only what those scripts copy in. So on a
    # branch or pull request whose diff against main touches neither sim/microos/ (beyond
    # host/, run-host.sh and README.md, which only the host jobs and readers read) nor this
    # file, they are skipped: they would boot the same scripts against the same image main
    # last ran them on. A push to main, a manual run, and any diff that cannot be computed
    # run everything. A non-host job that starts reading a file outside sim/microos/ must
    # add it to the pattern below, or it will be skipped when that file changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      vms: ${{ steps.diff.outputs.vms }}
    steps:
      # Whole history: the diff is taken from the merge base with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff the change against main
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Every failure below lands on "run everything": a wrong skip is silent, a wrong
          # run costs only time. No grep -q in a pipeline: under pipefail its early exit can
          # SIGPIPE the writer and turn a match into a miss.
          set -u
          vms=true base='' head='' changed='' read_by_vms=''
          case "$EVENT/$REF" in
            push/refs/heads/main) why="a push to main runs every job" ;;
            push/*) head=HEAD; base=$(git merge-base origin/main HEAD) || base='' ;;
            pull_request/*) head=$PR_HEAD; base=$(git merge-base "$PR_BASE" "$PR_HEAD") || base='' ;;
            *) why="a $EVENT run runs every job" ;;
          esac
          if [ -n "$head" ]; then
            if [ -n "$base" ] && changed=$(git diff --name-only "$base" "$head"); then
              read_by_vms=$(printf '%s\n' "$changed" \
                | grep -E '^(sim/microos/|\.github/workflows/microos-sim\.yml$)' \
                | grep -vE '^sim/microos/(host/|run-host\.sh$|README\.md$)' || true)
              if [ -n "$read_by_vms" ]; then
                why="the diff against main touches files the VM jobs read: $(printf "%s" "$read_by_vms" | tr "\n" " ")"
              else
                vms=false
                why="the diff against main touches no file the VM jobs read, so they are skipped"
              fi
            else
              why="no diff against main could be taken, so every job runs"
            fi
          fi
          echo "vms=$vms" >> "$GITHUB_OUTPUT"
          {
            echo "probe, late-disks, docker-store, health-mounts run: **$vms**; $why."
            if [ -n "$changed" ]; then
              echo; echo "Changed since ${base:0:12}:"; echo '```'; printf '%s\n' "$changed"; echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  probe:
    needs: changes
    if: needs.changes.outputs.vms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./sim/microos/ci

      - name: Boot the image and run the probe
        run: sim/microos/run-probe.sh "$RUNNER_TEMP/microos"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/microos/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-probe
          path: |
            ${{ runner.temp }}/microos/report.txt
            ${{ runner.temp }}/microos/serial.log
          if-no-files-found: warn

  late-disks:
    # zero's array in miniature (one bcache cache, two backing disks, btrfs RAID1) on
    # simulated USB disks that appear after boot: does MicroOS assemble and mount it by
    # itself, and what does a RequiresMountsFor= service do meanwhile?
    # One run per variant, so what each setting changes is not confused with another:
    # plain adds nothing, wantedby makes the stand-in service wanted by the mount unit,
    # udev adds a rule that asks for the mount when the array is ready.
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, wantedby, udev]
    needs: changes
    if: needs.changes.outputs.vms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./sim/microos/ci

      - name: Build the array, boot without it, hot-plug it
        run: sim/microos/run-late-disks.sh "$RUNNER_TEMP/late" "${{ matrix.variant }}"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/late/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-late-disks-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/late/report.txt
            ${{ runner.temp }}/late/serial.log
          if-no-files-found: warn

  docker-store:
    # Whether MicroOS's Docker can take over the /var/lib/docker Alpine's Docker leaves on the
    # fleet's SSDs: the store is made by Alpine 3.24's own package, then mounted in the VM.
    needs: changes
    if: needs.changes.outputs.vms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./sim/microos/ci
        with:
          packages: qemu-system-x86 qemu-utils btrfs-progs

      - name: Make an Alpine Docker store and hand it to MicroOS
        run: sim/microos/run-docker-store.sh "$RUNNER_TEMP/store"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/store/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-docker-store
          path: |
            ${{ runner.temp }}/store/report.txt
            ${{ runner.temp }}/store/serial.log
          if-no-files-found: warn

  aarch64-packages:
    # Leap 16.1 on a Pi installs from Leap's aarch64 repositories, which the Leap 16.1
    # container on an arm64 runner also uses. Asking them is enough to know a package exists
    # for the Pi; nothing here boots.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Search the aarch64 repositories
        run: |
          docker run --rm registry.opensuse.org/opensuse/leap:16.1 sh -c '
            zypper --non-interactive --quiet refresh >/dev/null
            uname -m
            for p in docker docker-compose docker-buildx cloudflared tailscale bcache-tools smartmontools \
                btrfsprogs zram-generator syncthing health-checker cryptsetup rsync \
                wpa_supplicant bcm43xx-firmware kernel-firmware-brcm NetworkManager-wifi; do
              echo "== $p"
              zypper --non-interactive --quiet search --match-exact --details "$p" || echo "NOT FOUND: $p"
            done' | tee packages.txt
          { echo '```'; cat packages.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-aarch64-packages
          path: packages.txt
          if-no-files-found: warn

  health-mounts:
    # What stock health-checker does about data mounts: which fstab entries its mount plugin
    # selects, and whether a data disk missing at boot, or a mount that fails at once, rolls
    # a box back or strands it. Reports ANSWER lines; fails only when the harness does.
    needs: changes
    if: needs.changes.outputs.vms == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: ./sim/microos/ci

      - name: Boot with and without the data disk, and watch health-checker
        run: sim/microos/run-health-mounts.sh "$RUNNER_TEMP/health"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/health/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-health-mounts
          path: |
            ${{ runner.temp }}/health/report.txt
            ${{ runner.temp }}/health/serial.log
            ${{ runner.temp }}/health/screen-*
          if-no-files-found: warn

  host:
    # Each Leap host's real first-boot script (hosts/<host>/leap/combustion/script), booted
    # from a stick laid out as leap/make-stick lays it out, with stand-ins for the carry-over
    # and the host's disks; then its ways in, users, disks, Docker, pins and rescue mode are
    # checked. Unlike the jobs above, any FAIL fails the job: this is the script's proof.
    strategy:
      fail-fast: false
      matrix:
        host: [one, three]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: ./sim/microos/ci
        with:
          packages: qemu-system-x86 qemu-utils btrfs-progs

      - name: Install ansible-core and the collections the deploy play uses
        run: |
          # Pinned to a minor series, so a green run speaks for the version the control
          # node runs rather than whatever PyPI serves that day; move it with the phone's.
          pipx install 'ansible-core~=2.22.0'
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible --version

      - name: Boot ${{ matrix.host }}'s first-boot script and check the box it makes
        run: sim/microos/run-host.sh "$RUNNER_TEMP/host" "${{ matrix.host }}"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/host/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leap-host-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/host/report.txt
            ${{ runner.temp }}/host/serial.log
          if-no-files-found: warn
