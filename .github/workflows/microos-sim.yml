name: microos-sim

# The simulations in plans/microos-cutover.md: boot openSUSE Leap 16.1 in its Immutable
# mode (sim/microos/lib.sh; SIM_OS=microos runs MicroOS, which they were first written
# for) under KVM with a Combustion config, install what a fleet host would carry, and report what
# the plan's open questions turn on (SELinux and bind mounts into /media, Docker and its
# compose plugin, the default reboot policy, bcache's udev rule, packages). The report is the
# job summary and an artifact; the job fails only when the VM does not boot or answer ssh.
#
# WHAT IT CANNOT CHECK, so nobody reads a green run as more: the Pi itself (this is x86_64
# under KVM; the aarch64 job only asks the package repositories), USB bridges, real disks,
# Cloudflare, and any host's own first-boot script. sim/microos/README.md says more.

on:
  push:
    paths: ['sim/microos/**', '.github/workflows/microos-sim.yml']
  pull_request:
    paths: ['sim/microos/**', '.github/workflows/microos-sim.yml']
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than cancel: each report is evidence, and a push mid-run would
# otherwise throw away the one in progress.
concurrency:
  group: microos-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils

      - name: Boot the image and run the probe
        run: sim/microos/run-probe.sh "$RUNNER_TEMP/microos"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/microos/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-probe
          path: |
            ${{ runner.temp }}/microos/report.txt
            ${{ runner.temp }}/microos/serial.log
          if-no-files-found: warn

  late-disks:
    # zero's array in miniature (one bcache cache, two backing disks, btrfs RAID1) on
    # simulated USB disks that appear after boot: does MicroOS assemble and mount it by
    # itself, and what does a RequiresMountsFor= service do meanwhile?
    # One run per variant, so what each setting changes is not confused with another:
    # plain adds nothing, wantedby makes the stand-in service wanted by the mount unit,
    # udev adds a rule that asks for the mount when the array is ready.
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, wantedby, udev]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils

      - name: Build the array, boot without it, hot-plug it
        run: sim/microos/run-late-disks.sh "$RUNNER_TEMP/late" "${{ matrix.variant }}"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/late/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-late-disks-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/late/report.txt
            ${{ runner.temp }}/late/serial.log
          if-no-files-found: warn

  docker-store:
    # Whether MicroOS's Docker can take over the /var/lib/docker Alpine's Docker leaves on the
    # fleet's SSDs: the store is made by Alpine 3.24's own package, then mounted in the VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install qemu and btrfs-progs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils btrfs-progs

      - name: Make an Alpine Docker store and hand it to MicroOS
        run: sim/microos/run-docker-store.sh "$RUNNER_TEMP/store"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/store/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-docker-store
          path: |
            ${{ runner.temp }}/store/report.txt
            ${{ runner.temp }}/store/serial.log
          if-no-files-found: warn

  aarch64-packages:
    # Leap 16.1 on a Pi installs from Leap's aarch64 repositories, which the Leap 16.1
    # container on an arm64 runner also uses. Asking them is enough to know a package exists
    # for the Pi; nothing here boots.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Search the aarch64 repositories
        run: |
          docker run --rm registry.opensuse.org/opensuse/leap:16.1 sh -c '
            zypper --non-interactive --quiet refresh >/dev/null
            uname -m
            for p in docker docker-compose docker-buildx cloudflared tailscale bcache-tools smartmontools \
                btrfsprogs zram-generator syncthing health-checker cryptsetup rsync; do
              echo "== $p"
              zypper --non-interactive --quiet search --match-exact --details "$p" || echo "NOT FOUND: $p"
            done' | tee packages.txt
          { echo '```'; cat packages.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-aarch64-packages
          path: packages.txt
          if-no-files-found: warn

  health-mounts:
    # What stock health-checker does about data mounts: which fstab entries its mount plugin
    # selects, and whether a data disk missing at boot, or a mount that fails at once, rolls
    # a box back or strands it. Reports ANSWER lines; fails only when the harness does.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils

      - name: Boot with and without the data disk, and watch health-checker
        run: sim/microos/run-health-mounts.sh "$RUNNER_TEMP/health"

      - name: Put the report in the job summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/health/report.txt" 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microos-health-mounts
          path: |
            ${{ runner.temp }}/health/report.txt
            ${{ runner.temp }}/health/serial.log
            ${{ runner.temp }}/health/screen-*
          if-no-files-found: warn
