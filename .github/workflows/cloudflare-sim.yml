name: cloudflare-sim

# Runs three plays end to end against a stand-in for Cloudflare's API (sim/cloudflare/), so
# each is tested with no Cloudflare account. Every check is named PASS or FAIL in the log,
# and any FAIL fails the job.
#
#   host-tunnel        server-create-host-tunnel.yml, with the runner as a made-up new
#                      host, simnew: a dry run, a real run, a re-run, and the adverse
#                      cases, among them zero and three, which have tunnel configs.
#   fleet-ssh-access   server-create-fleet-ssh-access.yml for `three`, whose leap/MOVED puts
#                      its tunnel config under leap/system/: the refusals, a dry run, a real
#                      run, a re-run, the undo, and a gate that never takes.
#   browser-login      server-create-browser-login.yml for syncthing-three on `three`: the
#                      refusals, a dry run, a real run with the login written before the
#                      CNAME, a re-run, a refused Access write, and a proof that fails
#                      with the hostname open (the CNAME deleted) or not answering (kept).
#
# WHAT IT CANNOT CHECK, so nobody reads a green run as more: Cloudflare's real API (the
# stand-in answers in its envelope, with the fields the plays read, and no more), the real
# edge (no connector runs, and the stand-in answers the Access probes), ssh through a gate
# (the ssh probe is `true`), the yes at the Access play's prompt (an extra var), a real
# login through the browser login, and a real host over ssh (the runner is the host,
# through a local connection).

on:
  push:
    paths:
      - 'sim/cloudflare/**'
      - 'ansible/playbooks/server-create-host-tunnel.yml'
      - 'ansible/playbooks/server-create-fleet-ssh-access.yml'
      - 'ansible/playbooks/_cf-api-token.yml'
      - 'ansible/playbooks/server-create-browser-login.yml'
      - 'ansible/playbooks/_cf-tunnel.yml'
      - 'ansible/playbooks/_cf-dns.yml'
      - 'ansible/playbooks/_cf-access-app.yml'
      - 'ansible/playbooks/_cf-access-emails.yml'
      - 'hosts/*/leap/MOVED'
      - '.github/workflows/cloudflare-sim.yml'
  pull_request:
    paths:
      - 'sim/cloudflare/**'
      - 'ansible/playbooks/server-create-host-tunnel.yml'
      - 'ansible/playbooks/server-create-fleet-ssh-access.yml'
      - 'ansible/playbooks/_cf-api-token.yml'
      - 'ansible/playbooks/server-create-browser-login.yml'
      - 'ansible/playbooks/_cf-tunnel.yml'
      - 'ansible/playbooks/_cf-dns.yml'
      - 'ansible/playbooks/_cf-access-app.yml'
      - 'ansible/playbooks/_cf-access-emails.yml'
      - 'hosts/*/leap/MOVED'
      - '.github/workflows/cloudflare-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tunnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-core
        run: |
          pipx install ansible-core
          ansible --version

      - name: Run the play against the stand-in
        run: sim/cloudflare/run-host-tunnel.sh

  fleet-ssh-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-core
        run: |
          pipx install ansible-core
          ansible --version

      - name: Run the play against the stand-in
        run: sim/cloudflare/run-fleet-ssh-access.sh

  browser-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-core
        run: |
          pipx install ansible-core
          ansible --version

      - name: Run the play against the stand-in
        run: sim/cloudflare/run-browser-login.sh
