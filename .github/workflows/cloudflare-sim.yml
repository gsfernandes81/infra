name: cloudflare-sim

# Runs ansible/playbooks/server-create-host-tunnel.yml end to end against a stand-in for
# Cloudflare's API (sim/cloudflare/), with the runner as the host, so the play is tested with
# no Cloudflare account: a dry run, a real run, a re-run, and the adverse cases. Every check
# is named PASS or FAIL in the log, and any FAIL fails the job.
#
# WHAT IT CANNOT CHECK, so nobody reads a green run as more: Cloudflare's real API (the
# stand-in answers in its envelope, with the fields the shared tasks read, and no more), the
# real edge (no connector runs), Access (this play makes none), and a real host over ssh (the
# runner is the host, through a local connection).

on:
  push:
    paths:
      - 'sim/cloudflare/**'
      - 'ansible/playbooks/server-create-host-tunnel.yml'
      - 'ansible/playbooks/_cf-api-token.yml'
      - 'ansible/playbooks/_cf-tunnel.yml'
      - '.github/workflows/cloudflare-sim.yml'
  pull_request:
    paths:
      - 'sim/cloudflare/**'
      - 'ansible/playbooks/server-create-host-tunnel.yml'
      - 'ansible/playbooks/_cf-api-token.yml'
      - 'ansible/playbooks/_cf-tunnel.yml'
      - '.github/workflows/cloudflare-sim.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tunnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-core
        run: |
          pipx install ansible-core
          ansible --version

      - name: Run the play against the stand-in
        run: sim/cloudflare/run-host-tunnel.sh
