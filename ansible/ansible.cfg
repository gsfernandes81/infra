# Ansible for this fleet. Run from this directory — Ansible reads ansible.cfg from the
# cwd first, which is what makes `ansible fleet -m ping` work with no flags.
#
# Phase 1 is READ-ONLY. Nothing here writes to a host. See docs/management-plane.md.

[defaults]
inventory = ./inventory
roles_path = ./roles

# NOT interpreter_python here. That setting is global, and the control node is Termux,
# which has no /usr/bin/python3. The pin belongs to the fleet, so it lives in
# group_vars/fleet.yml, and localhost gets its own in host_vars/localhost.yml.

# On, and it means Ansible FAILS on an unknown host key rather than prompting: there is no
# tty to prompt on. Connect to each host by hand once (`ssh zero true`) before the first
# run, and accept the fingerprint there, where you can actually read it.
host_key_checking = True

# dense was tried on 2026-08-24, given a second chance the same day, and dropped for
# good. The KeyError below survived giving every fleet host an explicit ansible_host in
# the inventory — so it is not our thin inventory, it is the plugin (likely its handling
# of the delegated localhost task, and not worth a third experiment). The scrollback
# rewriting continued throughout. Verdict final; the evidence is one --check run away if
# anyone doubts it.
#
# dense was tried on 2026-08-24 and lasted one run. Two failures, both the plugin's:
# its v2_runner_on_ok raised KeyError 'ansible_host' — a WARNING per ok task — for
# hosts addressed without an ansible_host var, which is every host in this inventory
# by design (the inventory is deliberately thin; ~/.ssh/config owns the transport).
# And its self-overwriting display assumes lines never wrap: on a phone-width terminal
# long task names do, its cursor-up counts land in earlier lines, and the mess holds
# until a resize forces a redraw. Not fatal like the KeyError, but wrap-hostile drawing
# is the wrong property for the screen it was chosen for. Commented rather than deleted
# so the next person tempted by it finds the verdict where they would put it:
#
#   stdout_callback = community.general.dense
#
# (The collection itself stays — apk needs it. And the historical note stands: the
# ~50 MB memory was the `ansible` metapackage, not the 2.70 MiB collection.)

# Everything below tunes the default callback. Core-only alternatives if it ever
# annoys: minimal, oneline.
# callback_result_format, NOT result_format. The wrong key sat here silently ignored
# from the day it was written until 2026-08-24 — ansible does not warn on unknown ini
# keys — so every run this file's comments described as "yaml output" was actually
# JSON, including the "\n prints literally in diffs" complaint that finally exposed
# it. Proven both ways in an offline harness before this edit: the wrong key renders
# escaped JSON, the right one renders multiline strings as block scalars — which is
# what makes the system-files preview readable at all.
callback_result_format = yaml
display_skipped_hosts = False

# The two below are phone-screen decisions, 2026-08-24.
#
# display_ok_hosts off is most of the win: a clean run collapses to task banners and
# the recap, and only changed/failed lines print. The cost is real and accepted — an
# `ok` that proves a guard PASSED (the HEAD assert, the dirty-tree check) is invisible,
# so a quiet run must be read as "all guards passed", not "no guards ran". failed and
# changed always print, which is what needs eyes.
#
# check_mode_markers stamps "DRY RUN" on the banners, so a --check transcript can never
# be mistaken for a real one when it is read back later — this session's cutover was
# diagnosed twice from pasted transcripts, and which kind they were mattered both times.
display_ok_hosts = False
check_mode_markers = True

# No fact cache. It would be a file of stale truth about a fleet whose whole problem is
# stale truth, and on `two` it would also be continuous SD-card writes.
gathering = smart
fact_caching = memory

[ssh_connection]
# ControlPath=%C is the Termux-specific bit. $HOME there is
# /data/data/com.termux/files/home, long enough that a default control-socket path can
# exceed the 108-character Unix socket limit and fail with an opaque
# `unix_listener: too long for Unix domain socket`. %C is a hash, so it is fixed-length.
# The directory must exist: mkdir -p ~/.ssh/cp
#
# `%C` passes through untouched here. If you ever add a LITERAL percent to this file —
# a password, a path — it must be doubled as `%%`, which is Ansible's own escape for it.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=~/.ssh/cp/%C
pipelining = True

[privilege_escalation]
# Deliberately NOT enabled by default. Most of what this fleet needs Ansible for reads
# fine unprivileged, and a control node that cannot escalate without being asked cannot
# surprise you. The audit playbook opts in per-task and needs -K (--ask-become-pass),
# because `gavin` is not in the `docker` group and NOPASSWD sudo is in roadmap.md's
# "Not doing" list. That is the intended friction, not an oversight.
become = False
become_ask_pass = False
