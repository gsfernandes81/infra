# DEPLOY garmin-mcp — a read-only Garmin Connect MCP server for claude.ai, on whichever host
# hosts/<host>/garmin-mcp places it (`one`). Run from the phone:
#
#     cd ansible
#     ansible-playbook playbooks/server-deploy-garmin-mcp.yml --check -K   # prove
#     ansible-playbook playbooks/server-deploy-garmin-mcp.yml -K           # deploy; stops at the MFA step the first time
#     ansible-playbook playbooks/server-deploy-garmin-mcp.yml -K           # after the MFA block it prints: deploys and probes
#
# Then add a claude.ai custom connector for https://garmin-mcp.<dns_zone>/mcp, leave the
# OAuth fields blank, and paste ~/.config/garmin-mcp/consent-secret from this phone into
# the consent page. deployments/garmin-mcp/README.md is the runbook.
#
# NO --limit / -l, for the reason in server-create-stack-tunnel.yml's header: the host is
# found from the stack's symlink by that play's first play, which `-l one` would skip.
#
# -K: the tunnel credentials belong to uid 65532, and docker needs root — gavin is not in
# the docker group (CLAUDE.md § Privileged commands).
#
# THIS PLAY STARTS THE STACK, unlike the provisioning plays beside it, which stop before
# anything runs. That is docs/management-plane.md § "`bin/compose` goes, at Phase 3":
# Ansible drives stacks through community.docker. garmin-mcp is the first stack it drives.
#
# TWO HALVES:
#   1. server-create-stack-tunnel.yml, imported unchanged with stack=garmin-mcp. It makes the
#      tunnel and the CNAME, writes the credentials outside the checkout, proves the host's
#      compose.yaml, edge.yml and cloudflared.yml match this phone's, writes TUNNEL_ID and
#      TUNNEL_CREDENTIALS into .env (creating it at 0600), and leaves the host in the
#      `stack_target` group with `stack_hostname` set. edge.yml says `access: none`.
#   2. The play below, on that host: it refuses a Garmin password in .env, fills the other
#      four .env lines, checks out the pinned source, brings the stack up, and then proves
#      the result END TO END FROM THIS PHONE — tunnel, nginx, the OAuth metadata, the Garmin
#      login, and the one property the whole design rests on: that the server serves only
#      read tools.
#
# Re-running is the intended way to finish after a partial failure; every step looks before
# it acts. Nothing here rebuilds the image unless its tag (in compose.yaml) is absent.

- name: The stack's tunnel — server-create-stack-tunnel.yml, unchanged
  ansible.builtin.import_playbook: server-create-stack-tunnel.yml
  vars:
    stack: garmin-mcp

- name: Deploy garmin-mcp and prove it
  hosts: stack_target
  gather_facts: false
  become: false

  vars:
    stack: garmin-mcp
    repo_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
    infra_checkout: "{{ ansible_user_dir }}/infra"
    garmin_stack_dir: "{{ infra_checkout }}/deployments/garmin-mcp"
    garmin_src: "{{ ansible_user_dir }}/src/garmin-mcp"
    garmin_url: "https://{{ stack_hostname }}"

    # SOURCE is the one copy of the upstream URL and sha; read here on the control node.
    garmin_source: >-
      {{ (lookup('file', repo_root ~ '/deployments/garmin-mcp/SOURCE').splitlines()
          | reject('match', '^\s*(#|$)') | first).split() }}

    # The consent secret lives on THIS phone, beside the Cloudflare API token file. The
    # password lookup creates it the first time (48 hex chars) and reads it afterwards.
    # Rotation: delete the file and re-run.
    garmin_consent_file: "{{ lookup('env', 'HOME') }}/.config/garmin-mcp/consent-secret"

    # The .env keys compose.yaml requires. The first four are this play's; the TUNNEL_ pair
    # is the stack play's.
    garmin_env_keys: [SRC_ROOT, PUBLIC_BASE_URL, MCP_CONSENT_SECRET, MCP_BEARER_TOKEN, TUNNEL_ID, TUNNEL_CREDENTIALS]

    # ── the read-only proof ─────────────────────────────────────────────────
    # Every read tool at the pinned Taxuspt sha matches this, and no write tool does (the
    # derivation is in compose.yaml beside GARMIN_ENABLED_TOOLS). A write tool enabled later
    # goes in compose.yaml AND here, in one commit — that is the whole procedure.
    garmin_read_prefix: '^(get|count|search)_'
    garmin_allowed_writes: []
    # The single copy of the allowlist, read from compose.yaml rather than repeated.
    garmin_enabled_count: >-
      {{ (lookup('file', repo_root ~ '/deployments/garmin-mcp/compose.yaml') | from_yaml)
         .services['garmin-mcp'].environment.GARMIN_ENABLED_TOOLS.split(',') | length }}
    # tools/list arrives as plain JSON or as one SSE event, depending on what the client
    # accepts. if/else, not ternary: ternary renders both branches, and the wrong one throws.
    garmin_rpc: >-
      {{ (garmin_tools_body | from_json) if (garmin_tools_body | trim).startswith('{')
         else (garmin_tools_body.splitlines() | select('match', '^data:') | first
               | regex_replace('^data:\s*', '') | from_json) }}
    garmin_served_tools: "{{ garmin_rpc.result.tools | map(attribute='name') | list }}"
    garmin_tool_offenders: >-
      {{ garmin_served_tools | reject('match', garmin_read_prefix)
         | reject('in', garmin_allowed_writes) | list }}

    # A new tunnel's DNS can take a minute or two; every probe waits up to five.
    probe_retries: 20
    probe_delay: 15

  tasks:
    - name: The ssh user's home
      ansible.builtin.setup:
        gather_subset: ['!all']

    # ── 1  .env, and no Garmin password in it ───────────────────────────────
    - name: Read .env
      # The stack play has just created it. Under --check on a fresh host it has not, so a
      # missing file is tolerated here and reported as missing keys further down.
      ansible.builtin.slurp:
        src: "{{ garmin_stack_dir }}/.env"
      register: garmin_env_raw
      check_mode: false
      failed_when:
        - garmin_env_raw.content is not defined
        - "'file not found' not in (garmin_env_raw.msg | default('') | lower)"
      no_log: true

    - name: Remember which keys .env has
      ansible.builtin.set_fact:
        garmin_env_present: >-
          {{ (garmin_env_raw.content | default('') | b64decode).splitlines()
             | reject('match', '^\s*(#|$)') | map('regex_replace', '=.*$', '') | list }}

    - name: Refuse a Garmin email or password in .env
      ansible.builtin.assert:
        that:
          - "'GARMIN_EMAIL' not in garmin_env_present"
          - "'GARMIN_PASSWORD' not in garmin_env_present"
        fail_msg: >-
          {{ garmin_stack_dir }}/.env on {{ inventory_hostname }} has
          {{ garmin_env_present | select('match', '^GARMIN_(EMAIL|PASSWORD)$') | list }}.
          Delete those lines. Upstream's README says to put them there; this stack does not
          want them: the server would silently log in with the password whenever its tokens
          failed and write a base64 copy of the tokens beside them. The one-time login in
          deployments/garmin-mcp/README.md prompts for both instead. Nothing was changed.
        success_msg: "no Garmin credentials in .env"

    # ── 2  the four .env lines this play owns ───────────────────────────────
    - name: The consent secret, kept on this phone
      ansible.builtin.set_fact:
        # Lower-case hex only, written as generated. `hexdigits` would include A-F, and any
        # case-folding between the phone file and .env makes the pasted secret a mismatch.
        garmin_consent: "{{ lookup('ansible.builtin.password', garmin_consent_file, length=48, chars=['0123456789abcdef']) }}"
      when: not ansible_check_mode
      no_log: true

    - name: Keep the consent secret's file private
      ansible.builtin.file:
        path: "{{ garmin_consent_file }}"
        mode: "0600"
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Write the consent secret into .env — every run, so deleting the phone file rotates it
      ansible.builtin.lineinfile:
        path: "{{ garmin_stack_dir }}/.env"
        regexp: '^MCP_CONSENT_SECRET='
        line: "MCP_CONSENT_SECRET={{ garmin_consent }}"
        create: false
        mode: "0600"
      when: not ansible_check_mode
      no_log: true

    - name: Write a bearer token into .env — only if there is none, so deleting its line rotates it
      ansible.builtin.lineinfile:
        path: "{{ garmin_stack_dir }}/.env"
        regexp: '^MCP_BEARER_TOKEN='
        line: "MCP_BEARER_TOKEN={{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['0123456789abcdef']) }}"
        create: false
        mode: "0600"
      when:
        - not ansible_check_mode
        - "'MCP_BEARER_TOKEN' not in garmin_env_present"
      no_log: true

    - name: Write SRC_ROOT and PUBLIC_BASE_URL into .env
      ansible.builtin.lineinfile:
        path: "{{ garmin_stack_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: false
        mode: "0600"
      loop:
        - { key: SRC_ROOT, value: "{{ ansible_user_dir }}/src" }
        - { key: PUBLIC_BASE_URL, value: "{{ garmin_url }}" }
      loop_control:
        label: "{{ item.key }}"
      when: garmin_env_raw.content is defined

    # ── 3  the source, at the pinned sha ────────────────────────────────────
    - name: The directory the checkouts live in
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/src"
        state: directory
        mode: "0755"

    - name: Check out {{ garmin_source[1][:7] }} into {{ garmin_src }}
      # force: false refuses a checkout with local modifications; a clean one is moved to the
      # pinned sha, so a reviewed bump needs no step by hand. $SRC_ROOT/garmin-mcp is the path
      # bin/check-sources looks for.
      ansible.builtin.git:
        repo: "{{ garmin_source[0] }}"
        dest: "{{ garmin_src }}"
        version: "{{ garmin_source[1] }}"
        force: false

    - name: What the checkout is at
      ansible.builtin.command: git -C {{ garmin_src }} rev-parse HEAD
      register: garmin_head
      changed_when: false
      check_mode: false
      failed_when: false

    - name: The checkout is at the sha SOURCE pins
      ansible.builtin.assert:
        that: garmin_head.stdout == garmin_source[1]
        fail_msg: >-
          {{ garmin_src }} is at {{ garmin_head.stdout | default('nothing') }},
          SOURCE pins {{ garmin_source[1] }}. Nothing has been started.
        success_msg: "{{ garmin_src }} at {{ garmin_source[1][:7] }}"
      when: not (ansible_check_mode and garmin_head.rc != 0)

    # ── 4  every key compose needs, before compose runs ─────────────────────
    - name: Read .env again
      ansible.builtin.slurp:
        src: "{{ garmin_stack_dir }}/.env"
      register: garmin_env_raw2
      check_mode: false
      failed_when: false
      no_log: true

    - name: Remember what .env has now
      ansible.builtin.set_fact:
        garmin_env_missing: >-
          {{ garmin_env_keys | difference((garmin_env_raw2.content | default('') | b64decode).splitlines()
             | reject('match', '^\s*(#|$)') | map('regex_replace', '=.*$', '') | list) }}
        garmin_bearer: >-
          {{ (garmin_env_raw2.content | default('') | b64decode).splitlines()
             | select('match', '^MCP_BEARER_TOKEN=') | map('regex_replace', '^MCP_BEARER_TOKEN=', '')
             | first | default('') }}
      no_log: true

    - name: Every key compose.yaml requires is in .env
      ansible.builtin.assert:
        that: garmin_env_missing | length == 0
        fail_msg: "{{ garmin_stack_dir }}/.env lacks {{ garmin_env_missing }}. Nothing has been started."
        success_msg: "{{ garmin_env_keys | length }} keys present"
      when: not ansible_check_mode

    - name: Under --check, what a real run would still have to write
      ansible.builtin.debug:
        msg: ".env lacks {{ garmin_env_missing }} — written by a real run before compose starts"
      changed_when: true
      when:
        - ansible_check_mode
        - garmin_env_missing | length > 0

    # ── 5  up ───────────────────────────────────────────────────────────────
    - name: Bring the stack up — built only if garmin-mcp-remote:{{ garmin_source[1][:7] }} is absent
      community.docker.docker_compose_v2:
        project_src: "{{ garmin_stack_dir }}"
        build: policy
        state: present
      become: true
      when: garmin_env_missing | length == 0

    # ── 6  the probes, from this phone, end to end ──────────────────────────
    # Each retries (a new tunnel's DNS, a first boot, a background login), never stops on the
    # module's own failure, and is followed by an assert that says what it means.
    - name: Probe — /healthz answers through the tunnel
      ansible.builtin.uri:
        url: "{{ garmin_url }}/healthz"
        status_code: [200]
      register: garmin_p_health
      until: garmin_p_health.status | default(0) == 200
      retries: "{{ probe_retries }}"
      delay: "{{ probe_delay }}"
      failed_when: false
      delegate_to: localhost
      when: not ansible_check_mode

    - name: The tunnel and nginx are up
      ansible.builtin.assert:
        that: garmin_p_health.status | default(0) == 200
        fail_msg: >-
          {{ garmin_url }}/healthz answered {{ garmin_p_health.status | default('nothing') }}.
          530/1033 is the tunnel (sudo docker logs garmin-mcp-cloudflared on {{ inventory_hostname }});
          502 is the stack (sudo docker compose ps in {{ garmin_stack_dir }}).
        success_msg: "{{ garmin_url }}/healthz → 200"
      when: not ansible_check_mode

    - name: Probe — /mcp without a token
      ansible.builtin.uri:
        url: "{{ garmin_url }}/mcp"
        status_code: [401]
      register: garmin_p_noauth
      failed_when: false
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Probe — the OAuth metadata names this hostname
      ansible.builtin.uri:
        url: "{{ garmin_url }}/.well-known/oauth-protected-resource"
        return_content: true
      register: garmin_p_meta
      failed_when: false
      delegate_to: localhost
      when: not ansible_check_mode

    - name: nginx gates /mcp, and PUBLIC_BASE_URL took effect
      # The 401 cannot prove PUBLIC_BASE_URL: nginx builds its WWW-Authenticate from $host.
      # Only the shim's metadata reads that variable.
      ansible.builtin.assert:
        that:
          - garmin_p_noauth.status | default(0) == 401
          - (garmin_p_meta.json | default({})).resource | default('') == garmin_url ~ '/mcp'
        fail_msg: >-
          /mcp without a token answered {{ garmin_p_noauth.status | default('nothing') }}
          (want 401); the metadata says resource =
          {{ (garmin_p_meta.json | default({})).resource | default('nothing') }}
          (want {{ garmin_url }}/mcp).
        success_msg: "/mcp → 401 without a token; metadata names {{ garmin_url }}/mcp"
      when: not ansible_check_mode

    - name: Probe — is the Garmin login live
      # Login runs in the background after a start, so `pending` is waited out. 200 is ready;
      # 503 carries pending or failed.
      ansible.builtin.uri:
        url: "{{ garmin_url }}/readyz"
        headers: { Authorization: "Bearer {{ garmin_bearer }}" }
        status_code: [200, 503]
        return_content: true
      register: garmin_p_ready
      until: (garmin_p_ready.content | default('{}') | from_json).status | default('') not in ['', 'pending']
      retries: "{{ probe_retries }}"
      delay: "{{ probe_delay }}"
      failed_when: false
      delegate_to: localhost
      when: not ansible_check_mode
      no_log: true

    - name: The Garmin login has not happened yet — this is the one step by hand
      ansible.builtin.debug:
        msg:
          - "/readyz says {{ (garmin_p_ready.content | default('{}') | from_json).status | default('nothing') }}. Either no Garmin login has been made, or its tokens expired (~6 months), or Garmin rate-limited it (429). The fix is the same:"
          - "1. ssh -t {{ inventory_hostname }}"
          - "2. paste, inside that shell (fish):"
          - "     cd {{ garmin_stack_dir }}"
          - "     sudo docker compose run --rm garmin-mcp garmin-mcp-auth; and sudo docker compose restart garmin-mcp"
          - "   It asks for your Garmin email, your password (not echoed, never stored) and the MFA code Garmin sends."
          - "   The restart is not optional: a failed login is final for the running server."
          - "3. re-run this play."
      changed_when: true
      when:
        - not ansible_check_mode
        - (garmin_p_ready.content | default('{}') | from_json).status | default('') != 'ready'

    - name: The Garmin login is live
      ansible.builtin.assert:
        that: (garmin_p_ready.content | default('{}') | from_json).status | default('') == 'ready'
        fail_msg: "Not ready — the block above is what to do. Nothing else is wrong yet."
        success_msg: "/readyz → ready"
      when: not ansible_check_mode

    - name: Probe — the tools the server serves
      ansible.builtin.uri:
        url: "{{ garmin_url }}/mcp"
        method: POST
        headers:
          Authorization: "Bearer {{ garmin_bearer }}"
          Accept: application/json, text/event-stream
        body_format: json
        body: { jsonrpc: "2.0", id: 1, method: tools/list }
        return_content: true
      register: garmin_p_tools
      failed_when: false
      delegate_to: localhost
      when: not ansible_check_mode
      no_log: true

    - name: tools/list answered
      ansible.builtin.assert:
        that: garmin_p_tools.status | default(0) == 200
        fail_msg: "tools/list answered {{ garmin_p_tools.status | default('nothing') }}: {{ (garmin_p_tools.content | default(''))[:300] }}"
        quiet: true
      when: not ansible_check_mode

    - name: Keep the reply
      ansible.builtin.set_fact:
        garmin_tools_body: "{{ garmin_p_tools.content }}"
      when: not ansible_check_mode

    - name: It is a tool list, not an error
      ansible.builtin.assert:
        that: garmin_rpc.error is not defined
        fail_msg: "tools/list returned an error: {{ garmin_rpc.error }}"
        quiet: true
      when: not ansible_check_mode

    - name: READ-ONLY — every served tool is a read tool, and all of the allowlist is served
      ansible.builtin.assert:
        that:
          - garmin_tool_offenders | length == 0
          - garmin_served_tools | length == garmin_enabled_count | int
        fail_msg: >-
          {{ garmin_url }} serves {{ garmin_served_tools | length }} tools against
          {{ garmin_enabled_count }} allowlisted. Outside {{ garmin_read_prefix }} and
          garmin_allowed_writes: {{ garmin_tool_offenders }}. Allowlisted but not served:
          {{ (lookup('file', repo_root ~ '/deployments/garmin-mcp/compose.yaml') | from_yaml)
             .services['garmin-mcp'].environment.GARMIN_ENABLED_TOOLS.split(',')
             | difference(garmin_served_tools) }}.
          STOP THE STACK if anything is listed as outside: sudo docker compose stop, in
          {{ garmin_stack_dir }}.
        success_msg: "{{ garmin_served_tools | length }} tools served, every one a read tool"
      when: not ansible_check_mode

    # ── 7  the record ───────────────────────────────────────────────────────
    - name: What the two containers use
      ansible.builtin.command: >-
        docker stats --no-stream --format '{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.MemUsage{{ '}}' }}'
        garmin-mcp garmin-mcp-cloudflared
      register: garmin_stats
      become: true
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Done
      ansible.builtin.debug:
        msg:
          - "connector URL  {{ garmin_url }}/mcp  (claude.ai → custom connector; leave the OAuth fields blank)"
          - "consent secret {{ garmin_consent_file }} on this phone — paste it on the consent page"
          - "tools          {{ garmin_served_tools | length }}, read-only"
          - "memory         {{ garmin_stats.stdout_lines | default(['(not read)']) | join(' · ') }}"
      changed_when: true
      when: not ansible_check_mode
