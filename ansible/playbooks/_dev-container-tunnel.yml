---
# NOT A PLAYBOOK YOU RUN — the underscore says so. server-create-dev-container.yml
# imports it as its first half; run that. This half provisions the Cloudflare side of a
# dev container's tunnel, over the API.
#
#     cd ansible
#     ansible-playbook playbooks/server-create-dev-container.yml --check    # prove, no -K
#     ansible-playbook playbooks/server-create-dev-container.yml            # apply
#
# Three objects, and every one of them idempotent — each is looked up before it is
# created, so a re-run after a partial failure is the intended way to finish:
#
#   1. a locally-managed tunnel   -> credentials written to {{ infra_secrets }}/tunnel.json on zero
#   2. a proxied CNAME            -> {{ cf_hostname }}
#   3. an Access application      -> self_hosted, no identity provider, and NO policy yet
#
# 1 and 2 are _cf-tunnel.yml since 2026-10-24, shared with server-create-stack-tunnel.yml;
# 3 is this play's own.
#
# THE POLICY AND THE SERVICE TOKENS BELONG TO THE CLIENT PLAY. Until 2026-10-04 this play
# minted one service token per container, printed its secret once, and the owner typed it
# into every client. client-home-ssh-config.yml now mints a token PER CLIENT
# (`<alias>-<client>`) over the same API and adds it to the application's policy itself,
# so no secret is ever shown or pasted and a lost laptop is one token to delete. An
# application with no policy admits nobody, which is the right state between this play
# and the first client run. docs/decisions.md has the row.
#
# WHY THIS IS A PLAYBOOK AND NOT A SCRIPT. It was written as dev/cf-provision.sh first
# and that was the wrong instinct — the same one that put bin/compose in this repo.
# Provisioning the way in to a managed box is management-plane work, and the plane is
# here. Four things follow from being in it rather than beside it: `uri` returns parsed
# JSON so there is no hand-rolled extractor; `--check` is a real dry run, which has
# already caught one bad change in this repo; `no_log` is a mechanism rather than
# discipline; and the API token becomes a Vault variable at Phase 4 with no rewrite.
# It is also not a one-off — dd-dev, ds-dev and or3-dev want the same three objects, and
# rotating the fleet's own tunnel credentials (2e, done 2026-08-29) used most of them.
#
# WHY `uri` AND NOT `community.general.cloudflare_dns`. That module exists and would do
# task 2. It would do only task 2 — tunnel, Access application, policy and service token
# have no module and must be `uri` regardless. One mechanism with one error-handling
# style beats a module for a quarter of the work, and the collection's parameter names
# could not be verified when this was written (Galaxy was unreachable). If someone
# checks them, swapping task 2 is a small, contained change.
#
# THE API TOKEN IS A FILE, ~/.config/cloudflare/api-token (mode 600) on the machine
# running this — read and verified by _cf-api-token.yml, the one tasks file every play
# that talks to Cloudflare imports; group_vars/all.yml names the file and holds the
# instructions printed when it is missing. One token, the union of what every
# play needs; ansible/README.md § "The Cloudflare API token" has the permissions. Until
# 2026-10-04 it was prompted for on every run and deliberately never stored; the owner
# asked for the file and for no prompts, and the trade is recorded in docs/decisions.md.
#
# It must NEVER go in {{ infra_secrets }}: that directory is mounted into the container,
# and a container able to rewrite the Access policy in front of itself is not protected
# by it. Nothing the running container does needs this token. And never in the repo
# checkout, gitignored or not: the checkout is bind-mounted into infra-dev, whose whole
# point is having no route to the fleet.
#
# Deleting the API token in the dashboard costs nothing already built: the tunnel, the
# DNS record, the Access application and the service token all keep working, since none
# of them authenticate with it. Rotation is: delete it there, mint a new one, overwrite
# the file.
#
# WHAT THIS PLAY CANNOT MINT IS THE API TOKEN ITSELF. Cloudflare does have
# POST /user/tokens, and it requires an existing token with User:API Tokens:Edit — so it
# cannot bootstrap from nothing, and neither can anything else. One credential has to be
# made by a person in a browser. That is the whole of the manual surface here, and
# `cloudflared tunnel login` would not avoid it: it is also a browser round trip, and it
# would cover only the tunnel and DNS, leaving Access to be clicked.

- name: Create a dev container's tunnel and Access app
  # zero, because the ONLY thing that lands on a host is the tunnel credentials file. Every
  # Cloudflare call is delegated to the control node — they are HTTPS to a public API and
  # have no business being made from the box being configured.
  hosts: "{{ cf_target | default('zero') }}"
  gather_facts: false
  become: false

  vars:
    cf_api: https://api.cloudflare.com/client/v4
    # group_vars/all.yml, not a literal — _client-dev-ssh.yml derives the client
    # side of the same hostname from that one value, and the two must not be able to
    # disagree about the zone.
    cf_zone: "{{ zone | default(dns_zone) }}"
    cf_name: "{{ container | default('infra-dev') }}"
    cf_hostname: "{{ hostname | default(cf_name ~ '.' ~ cf_zone) }}"
    # Ansible templates a task's arguments BEFORE deciding to skip it, and `uri` declares
    # no check-mode support — so under --check every write is skipped, but its URL and
    # body are still rendered. Any id that only a write could have produced is therefore
    # undefined at that moment, and the render dies with "'cf_tunnel_id' is undefined".
    #
    # THE FILLER GOES INLINE, NOT INTO A set_fact. A set_fact was tried and was worse: it
    # makes the id look defined to the READ tasks as well, and those carry
    # check_mode: false because a read is safe — so `GET /access/apps/WOULD-BE.../policies`
    # went out for real and came back 404. A `when: … is defined` guard on a read is only
    # honest if the fact is genuinely absent. Inline defaults keep it absent.
    #
    # Deliberately not a plausible UUID: if it ever escapes into a real request, that
    # request should fail obviously rather than create something against the wrong object.
    cf_unknown_id: WOULD-BE-CREATED-BY-A-REAL-RUN
    # Where the container's read-only secrets mount points on the host — and so where
    # tunnel.json lives, which is how this play decides whether the tunnel ALREADY EXISTS.
    # Keyed on the container's name, `~/.<name>-secrets`, the convention
    # server-add-authorized-keys.yml also relies on: a literal infra-dev path here made
    # `-e container=or3-dev` read infra-dev's credentials, find its tunnel alive, and CNAME
    # or3-dev at it. -e secrets_dir= for a container whose mount is somewhere else.
    infra_secrets: "{{ secrets_dir | default('~/.' ~ cf_name ~ '-secrets') }}"
    # Irrelevant to a service token, which does not expire with a session. Set explicitly
    # so the value is chosen rather than inherited from a Cloudflare default nobody read.
    cf_session_duration: 24h

    # "API token", and the distinction is not pedantry — it has already cost a round.
    # Cloudflare has TWO things whose names collide:
    #   API token          — My Profile -> API Tokens. Authorises THIS PLAY to call the
    #                        API. It is what the file below holds.
    #   Access service token — Zero Trust -> Access -> Service credentials. A
    #                        client_id/secret pair a MACHINE presents to get THROUGH
    #                        Access. This play makes none: since 2026-10-04 the
    #                        client play mints one per client (client-home-ssh-config.yml).
    # An API token that someone named "service_token" is still an API token.

  tasks:
    # ── the API token: read, checked and verified, in one shared file ─────────
    - name: Read and check the Cloudflare API token
      ansible.builtin.import_tasks: _cf-api-token.yml

    # ── flags this play no longer has ────────────────────────────────────────
    # Someone typing one from a note or from scrollback should be told what changed, not
    # silently handed a run that does something else.
    - name: Check no retired service-token flags were given
      ansible.builtin.assert:
        that:
          - replace_service_token is not defined
          - rotate_service_token is not defined
          - service_token_name is not defined
          - debug_tokens is not defined
        fail_msg: >-
          This play no longer mints service tokens. Each client mints its own, named
          <alias>-<client>, when you run client-home-ssh-config.yml there; a lost secret is
          -e container={{ cf_name }} -e replace_token=true on THAT client, which rotates only its
          own token. Nothing here to rotate or name.
        success_msg: "no retired flags"

    # ── 0–2  the zone and its account, the tunnel, the DNS record ───────────
    # Shared since 2026-10-24 with server-create-stack-tunnel.yml, which gives a compose
    # stack's sidecar connector the same tunnel by the same code. Moved to _cf-tunnel.yml
    # word for word; what changed in the move is listed in its header. Section 3, the
    # Access application, stays here: it is this play's own, and a stack opts into a
    # different one or none at all.
    - name: Create the {{ cf_name }} tunnel and its DNS record
      ansible.builtin.import_tasks: _cf-tunnel.yml
      vars:
        cf_creds_path: "{{ infra_secrets }}/tunnel.json"
        cf_dns_comment: "{{ cf_name }} container tunnel — ansible/playbooks/_dev-container-tunnel.yml"
        cf_dead_tunnel_hint: >-
          The container reads it and fails closed until you do; `make shell` on the host
          still works.

    # ── 3  the Access application, and deliberately no policy ───────────────
    - name: Read the account's Access applications
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps"
        headers: { Authorization: "Bearer {{ cf_token }}" }
      register: cf_app_q
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: "If found: note the existing Access app id"
      ansible.builtin.set_fact:
        cf_app_id: "{{ (cf_app_q.json.result | selectattr('domain', 'defined') | selectattr('domain', 'eq', cf_hostname) | list | first).id }}"
      when: (cf_app_q.json.result | default([]) | selectattr('domain', 'defined') | selectattr('domain', 'eq', cf_hostname) | list) | length > 0

    - name: Write the Access app for {{ cf_hostname }}
      # THIS ONE PUTS UNCONDITIONALLY AND SO ALWAYS REPORTS CHANGED, unlike the DNS record
      # above. Deliberate, and the reason is that Cloudflare normalises what it returns —
      # session_duration, allowed_idps and the launcher flags come back in forms that do
      # not compare equal to what was sent, so a field-by-field check would report a
      # difference on every run and be worse than no check. Converging every time is
      # cheap and correct; the cost is one `changed` in the recap.
      #
      # allowed_idps is deliberately empty and auto_redirect_to_identity false: this
      # application has no identity provider behind it at all. That is the answer to
      # "which IdP" — none, no account is linked to anything, and the only way through is
      # a service token in the policy client-home-ssh-config.yml writes on each client.
      # No policy is written here, so a freshly created application admits nobody.
      ansible.builtin.uri:
        url: >-
          {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps{{
             '/' ~ cf_app_id if cf_app_id is defined else '' }}
        method: "{{ 'PUT' if cf_app_id is defined else 'POST' }}"
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_token }}" }
        body_format: json
        body:
          name: "{{ cf_name }}"
          domain: "{{ cf_hostname }}"
          type: self_hosted
          session_duration: "{{ cf_session_duration }}"
          allowed_idps: []
          auto_redirect_to_identity: false
          app_launcher_visible: false
      register: cf_app_w
      delegate_to: localhost
      changed_when: cf_app_w.json.success | default(false)
      no_log: true

    - name: Note the Access app id
      ansible.builtin.set_fact:
        cf_app_id: "{{ cf_app_w.json.result.id }}"
      when: cf_app_w is not skipped

    # ── what to do next ─────────────────────────────────────────────────────
    - name: "--check only: print what a dry run can show"
      ansible.builtin.debug:
        msg: >-
          --check: every read ran for real and every write was skipped, so what this
          proved is that the API token works, that it can see the zone, and which of the
          three objects already exist. Anything below showing "(not created — --check)"
          does not exist yet. Nothing was created and nothing was changed.
      changed_when: true
      when: ansible_check_mode

    - name: Print the {{ cf_name }} tunnel, app and next steps
      ansible.builtin.debug:
        msg:
          - "tunnel    {{ cf_tunnel_id | default('(not created — --check)', true) }}"
          - "app       {{ cf_app_id | default('(not created — --check)', true) }}"
          - "hostname  {{ cf_hostname }}"
          - "creds     {{ inventory_hostname }}:{{ infra_secrets }}/tunnel.json"
          - "access    application, no identity provider; each client adds its own token"
          - "          to the policy when client-home-ssh-config.yml runs there"
          - ""
          - "{{ 'infra-dev: the host half writes DEV_TUNNEL_HOSTNAME=' ~ cf_hostname ~ ' into dev/.env next.'
                if cf_name == 'infra-dev' else
                cf_name ~ ' lives in its own repo: set DEV_TUNNEL_HOSTNAME=' ~ cf_hostname ~ ' in ITS .env.' }}"
          - "Then `make up` on {{ inventory_hostname }} — NOT restart: the entrypoint reads it at start."
      changed_when: true

    - name: Note {{ cf_hostname }} for dev/.env
      # A host fact survives into the next play of the same run, and that is the only
      # way the host half learns it: _dev-container-host.yml keeps `tunnel_hostname`
      # explicit on its own command line, because there an absent value means "preserve
      # what dev/.env already says" (CLAUDE.md § Repo invariants). Here the value is not
      # absent — this play just created or confirmed the tunnel it names — so deriving is
      # right, and it is derived from the one expression that builds the CNAME.
      ansible.builtin.set_fact:
        dev_tunnel_hostname_from_edge: "{{ cf_hostname }}"

