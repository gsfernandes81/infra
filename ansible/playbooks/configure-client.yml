---
# EVERY SSH BLOCK THIS REPO OWNS, ON THE MACHINE YOU RUN IT FROM. One command.
#
#     cd ansible
#     ansible-playbook playbooks/configure-client.yml --check --diff
#     ansible-playbook playbooks/configure-client.yml
#
# Run it from THIS DIRECTORY — ansible.cfg is read from the cwd and is the only thing
# pointing at ./inventory. _assert-inventory.yml, imported by both halves below, turns a
# wrong working directory into a failure instead of an empty recap and exit 0.
#
# Run it WHEREVER THE CLIENT IS: the phone, or WSL on the laptop. It reaches no host in
# the fleet — it writes ~/.ssh/config on the machine executing it, and from WSL it also
# writes the Windows side of the same laptop through /mnt/c. Nothing here can touch a Pi.
#
# ── THE REGISTRY ────────────────────────────────────────────────────────────────
#
# Four dev containers run on `zero`. The design is one tunnel per container, with its own
# Access service token and a connector inside it — the tunnel's identity travels with the
# container, so moving one to `one` changes no ingress rule anywhere
# (docs/management-plane.md § Addressing).
#
# TWO OF THE FOUR ARE THERE. `infra-dev` and `or3-dev` have their own hostnames and
# tokens. `dd-dev` and `ds-dev` do not yet — that is Phase 5 — and they are not running;
# until then they are reached through `ssh zero` and the published loopback ports. The
# table below lists all four because it is the registry, and `-e prompt_for_token=false`
# is what makes a run against a partly-provisioned fleet skip the ones that are not
# ready by name.
#
#   container   loopback port on zero   image lives in
#   ─────────   ─────────────────────   ──────────────────
#   infra-dev   2225                    this repo, dev/
#   or3-dev     2224                    or3
#   dd-dev      2222                    destiny-director
#   ds-dev      2223                    dossier
#
# THE HOSTNAME COLUMN IS GONE, AND SO ARE THE FOUR `hostname:` IMPORT VARS BELOW. Every
# one of them was the alias with the zone appended — four more spellings of a fact the
# edge already derives that way. A dev container's tunnel hostname IS
# `<alias>.<dns_zone>`, `dns_zone` lives in group_vars/all.yml, and both halves derive it:
# create-dev-tunnel.yml when it creates the CNAME, configure-client-dev.yml when it writes
# the block that names it. A container that wants a hostname off the pattern passes
# `-e hostname=` to configure-client-dev.yml directly; nothing in this table has to.
#
# THIS TABLE IS STILL THE PORT REGISTRY, and it is worth saying what that is now worth.
# It used to be a comment in or3's compose file — docs/management-plane.md's drift table
# opens with that as its worked example of a fact recorded in the newest claimant's app
# repo, where nothing in this repo could contradict it. It moved here on 2026-08-28
# because this file CONSUMED the numbers: every `<alias>-lan` block was built from them,
# so a wrong one was found by somebody using the rescue path.
#
# **That consumer is gone.** The `-lan` aliases were dropped on 2026-08-31, so nothing
# generated is built from these numbers any more and the argument that put them here is
# weaker than it was. They stay because this is still the file you open to add a
# container, and because the ports are what you need for the break-glass hop —
# `ssh <host>`, then `ssh -p <port> dev@127.0.0.1` on that box — which is now typed
# rather than aliased. Read that as: this table is documentation again, and documentation
# drifts. If a number here is ever wrong, nothing will notice but a person.
#
# ── WHEN A CONTAINER'S TUNNEL IS NOT UP YET ─────────────────────────────────────
#
#     ansible-playbook playbooks/configure-client.yml -e prompt_for_token=false
#
# Provisions every container that already has a token on this client and SKIPS the rest,
# naming each one it skipped. Without the flag it prompts, once per container missing a
# token — which is right for a client being set up against a fleet that is fully
# provisioned, and wrong when two of the four tunnels do not exist yet, because the
# prompt for a credential nobody can produce stops the other two from being written.
#
# The order below is deliberate: the two oldest tunnels first, so a partially provisioned
# fleet configures the containers you are most likely to need before it reaches the ones
# it may have to skip.
#
# ── ADDING A FIFTH ──────────────────────────────────────────────────────────────
#
# A row above and an import below — but only after the edge and the host halves exist,
# because a client block is the third of three:
#
#     ansible-playbook playbooks/create-dev-tunnel.yml -e name=<c> -e secrets_dir=<its mount>
#     ansible-playbook playbooks/prepare-dev-host.yml -e tunnel_hostname=<c>.gsrpi.uk
#     ansible-playbook playbooks/configure-client.yml
#
# `tunnel_hostname` on the middle line is STILL SPELLED OUT, and that is not an oversight.
# It is a different variable with different semantics: prepare-dev-host.yml rewrites
# dev/.env wholesale, and its absent-preserves / given-wins-even-if-empty rule is what
# stops a plain re-run blanking a hostname a previous run set. Giving it a derived default
# would make "no -e" mean "turn the tunnel on" for a container deliberately reached on its
# loopback port. Deriving is right where the value is a NAME; it is wrong where absence is
# itself a setting.
#
# NO NEW COLLECTIONS, and no tasks of its own: this file is composition and a table.
# Everything it runs belongs to the two plays it imports.

# ── the servers: the fleet, the mesh, and the LAN and cross-box rescue paths ────
- name: The fleet
  ansible.builtin.import_playbook: configure-client-fleet.yml

# ── the dev containers ─────────────────────────────────────────────────────────
# One import each rather than a loop over the table above, deliberately. configure-client-dev.yml
# prompts for a credential and writes it at 0600; a loop would put those prompts and
# those writes inside `loop:` results, where `no_log` hides which iteration is which and
# a mistake becomes a mistake about a secret. Static imports keep the reviewed
# single-alias play exactly as it is, and each stanza reads as the fact it asserts.
- name: infra-dev
  ansible.builtin.import_playbook: configure-client-dev.yml
  vars:
    alias: infra-dev

- name: or3-dev
  ansible.builtin.import_playbook: configure-client-dev.yml
  vars:
    alias: or3-dev

- name: dd-dev
  ansible.builtin.import_playbook: configure-client-dev.yml
  vars:
    alias: dd-dev

- name: ds-dev
  ansible.builtin.import_playbook: configure-client-dev.yml
  vars:
    alias: ds-dev
