---
# CREATE THE DEV PROJECT'S TUNNEL AND HOST SIDE, in one run, from the control node.
#
#     cd ansible
#     ansible-playbook playbooks/server-create-dev-container.yml --check   # prove
#     ansible-playbook playbooks/server-create-dev-container.yml           # the hub (`ssh dev`)
#     ansible-playbook playbooks/server-create-dev-container.yml -e container=or3-dev -e via_hub=true
#                     # or3-dev's hostname onto the hub's tunnel, at the cutover, so the phone's
#                     # or3-tunnel reaches it unchanged (dev/cloudflared.yml)
#
# Then the deploy play starts it (server-deploy-compose.yml -e deployment=dev -K), and on EACH
# client `client-home-ssh-config.yml -e container=dev` writes the `ssh dev` block.
#
# No -K: nothing here needs root. It needs the Cloudflare API token, read from
# ~/.config/cloudflare/api-token on this machine; if that is missing it prints how to mint
# one and stops — ansible/README.md § "The Cloudflare API token".
#
# TWO NAMES AND NO MORE, since 2026-10-27. `dev`, the hub, is the only dev container with a
# tunnel of its own; `or3-dev` keeps a HOSTNAME, served by the hub's tunnel, for the phone's
# reverse forward to the vessel. Every other dev container is reached through the hub and has
# neither — so any other name is refused here, rather than minting a tunnel nothing serves.
#
# TWO HALVES, imported in the order that lets one run do it all:
#   1. _dev-container-tunnel.yml  the EDGE: tunnel, CNAME, and an Access application with
#                                 NO policy — each client adds its own service token to it
#                                 when client-home-ssh-config.yml runs there. With
#                                 via_hub=true it mints nothing and points the name at the
#                                 hub's tunnel. Idempotent — re-run after a partial failure.
#   2. _dev-host.yml              the HOST, for `dev` only: secrets directories,
#                                 authorized_keys, and the dev project's dev/.env lines.
#
# The edge half runs first so the host half can write the tunnel id into dev/.env in the same
# run, beside the credentials it came from.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: fleet

- name: Check the dev container is dev or or3-dev
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check -e container names dev or or3-dev via the hub
      ansible.builtin.assert:
        that:
          - (container | default('dev')) in ['dev', 'or3-dev']
          - (container | default('dev')) == 'dev' or (via_hub | default(false) | bool)
        fail_msg: >-
          {{ container | default('dev') }}: only `dev` (the hub) has a tunnel, and `or3-dev`
          a hostname on it (-e container=or3-dev -e via_hub=true). Every other dev container
          is reached through the hub and needs nothing here — add it to dev/compose.yaml.
        success_msg: "{{ container | default('dev') }}"

- name: Create the container's tunnel, DNS and Access app
  ansible.builtin.import_playbook: _dev-container-tunnel.yml

- name: "dev only: create the dev project's host side on zero"
  ansible.builtin.import_playbook: _dev-host.yml
  # `when` on an import applies to every task it brings in.
  when: (container | default('dev')) == 'dev'
