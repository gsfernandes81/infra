---
# Add one client's PUBLIC key to the dev containers' authorized_keys on the host.
#
#     cd ansible
#     ansible-playbook playbooks/authorize-dev-client.yml \
#       -e '{"client_pubkey": "ssh-ed25519 AAAA... you@machine"}' --check --diff
#     ansible-playbook playbooks/authorize-dev-client.yml \
#       -e '{"client_pubkey": "ssh-ed25519 AAAA... you@machine"}'
#
# JSON, OR A FILE — NOT `-e client_pubkey=...`. Ansible's k=v extra-var form splits on
# WHITESPACE into several pairs, so a key with a comment on the end arrives as the single
# word "ssh-ed25519" and `authorized_key` fails with "list index out of range", which
# names nothing. The other form takes a path and is easier to type:
#
#     -e client_pubkey_file=~/laptop.pub
#
# RUN IT FROM A CONTROL NODE THAT CAN REACH `zero` — the phone, or WSL if `ssh zero`
# works there. This is the only play in the client set that touches a host: the ssh block
# and the service token are things a client holds, but the key that admits it is a fact
# about the container, and that lives on zero.
#
# IT ALSO REACHES INTO EACH CONTAINER, over that container's own `-sh` ssh alias, to
# refresh the copy sshd reads — see the task's own comment for why that is not a restart
# and why a restart would be the wrong tool. That half is best-effort: a container that is
# down is reported, not fatal, because the host-side write is the durable one.
#
# It APPENDS. `ansible.posix.authorized_key` with the default `exclusive: false` adds a
# line and leaves every other one alone, which is the whole reason this is not a `copy`:
# once a container is reached through a tunnel, that file is the only door, and a botched
# rewrite of it is unrecoverable from anywhere. Re-running with a key already present
# reports ok and changes nothing.
#
# WHY ONLY TWO CONTAINERS BY DEFAULT. `infra-dev` and `or3-dev` read the
# `authorized_keys` in their own secrets mount. `dd-dev` and `ds-dev` do not — their
# sshd_config drop-in names its own AuthorizedKeysFile and serves the HOST account's keys
# (docs/decisions.md, "A start-up warning that names the wrong thing"), so a key added
# here would be a file nothing reads. Authorise those two by adding the key to gavin's
# own ~/.ssh/authorized_keys on zero instead. Override with -e containers='["a","b"]' if
# that ever changes.
#
# THE SECRETS DIRECTORY IS A CONVENTION, AND THIS PLAY PROVES IT RATHER THAN ASSUMING IT.
# infra-dev's is ~/.infra-dev-secrets; the pattern is ~/.<alias>-secrets. or3-dev's real
# path is set in or3's compose file, which is not in this repo — so the play stats the
# directory and REFUSES if it is not there rather than creating a stray one somewhere
# nothing is mounted from. Point it somewhere else per run with:
#
#     -e secrets_dirs='{"or3-dev": "/home/gavin/somewhere-else"}'
#
# NO NEW COLLECTIONS: ansible.builtin, plus ansible.posix.authorized_key, which
# requirements.yml already carries and already explains.

- name: Guard — refuse to run with no inventory
  ansible.builtin.import_playbook: _inventory-guard.yml
  vars:
    required_group: fleet

- name: Authorise a client key on the dev containers that read one
  hosts: "{{ dev_host | default('zero') }}"
  gather_facts: true
  become: false

  vars:
    # Either form. The FILE is the easy one to type on a phone; the inline one has to be
    # JSON, for the reason the assert below spells out.
    #
    # THE PATH IS MADE ABSOLUTE FIRST, because `lookup('file', 'x.pub')` does not mean
    # "x.pub in the directory I am standing in". A relative path is resolved against the
    # PLAYBOOK's directory, so a key sitting in ansible/ is looked for in
    # ansible/playbooks/ and reported missing while `ls` plainly shows it. Expanding ~ and
    # anchoring anything else to $PWD makes the argument mean what it looks like it means.
    pubkey_path: >-
      {{ (client_pubkey_file | default('')) | regex_replace('^~', lookup('env', 'HOME')) }}
    pubkey_file: >-
      {{ pubkey_path if pubkey_path is match('^/')
         else (lookup('env', 'PWD') ~ '/' ~ pubkey_path) }}
    # Only ever read AFTER the file assert below has proved it readable. A lookup that
    # throws inside a fail_msg takes the whole task down while rendering its own error,
    # which is how this play first reported a missing file: forty lines of traceback
    # ending in "Finalization of task args failed", for a wrong relative path.
    pubkey: >-
      {{ (lookup('file', pubkey_file) if client_pubkey_file is defined
          else client_pubkey | default('')) | trim }}
    dev_clients: "{{ containers | default(['infra-dev', 'or3-dev']) }}"
    dev_secrets_overrides: "{{ secrets_dirs | default({}) }}"
    host_home: "{{ ansible_facts['env']['HOME'] }}"

  tasks:
    - name: One of the two forms has to be given
      ansible.builtin.assert:
        that: (client_pubkey_file is defined) or (client_pubkey is defined)
        fail_msg: |
          Give the client's PUBLIC key, one of two ways:

            -e client_pubkey_file=~/laptop.pub
            -e '{"client_pubkey": "ssh-ed25519 AAAAC3NzaC1... you@machine"}'

          NOT -e client_pubkey=ssh-ed25519 AAAA... you@machine — the k=v form splits on
          whitespace and everything after the first space is thrown away.
        success_msg: "a key was given"

    - name: The key file has to be readable ON THE CONTROL NODE
      # delegate_to: localhost, and that is not a detail. This play targets `zero`, so an
      # undelegated stat would look for the key on ZERO — where it is not, and never was.
      # The lookup that reads it runs on the control node like every lookup does, so the
      # check has to be made in the same place as the read.
      ansible.builtin.stat:
        path: "{{ pubkey_file }}"
      register: pkf
      delegate_to: localhost
      run_once: true
      check_mode: false
      when: client_pubkey_file is defined

    - name: Say where it looked, when it is not there
      ansible.builtin.assert:
        that: pkf.stat.exists | default(false)
        fail_msg: >-
          No file at {{ pubkey_file }} on this control node. A relative
          -e client_pubkey_file is resolved against $PWD by this play, so run it from the
          directory holding the key or give an absolute path. Note the file is read HERE,
          not on {{ inventory_hostname }} — every lookup runs on the control node.
        success_msg: "key file readable at {{ pubkey_file }}"
      when: client_pubkey_file is defined

    - name: A public key has to be given, and has to look like one
      # No default. Authorising "" would be a no-op that reports changed, and authorising
      # a private key by mistake is the accident worth spending an assert on: the two
      # differ by one word at the front, and this play's argument is pasted by hand.
      ansible.builtin.assert:
        that:
          - pubkey | length > 0
          - pubkey is search('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-|sk-)')
          - pubkey.split() | length >= 2
          - pubkey.split('\n') | length == 1
        fail_msg: |
          Got: "{{ pubkey }}"

          A key must be at least two whitespace-separated fields — a type and the base64
          body. If what you see above is just "ssh-ed25519", THAT IS THE BUG AND IT IS IN
          HOW IT WAS PASSED, not in the key: `-e key=value` splits on WHITESPACE into
          several key=value pairs, so everything after the first space is silently thrown
          away. It is a truncation that still looks like a key, which is why this task
          counts the fields rather than trusting the prefix.

          Two forms that work. JSON, quoted once:

            -e '{"client_pubkey": "ssh-ed25519 AAAAC3NzaC1... you@machine"}'

          or, easier to type by hand, point at a file:

            -e client_pubkey_file=~/laptop.pub

          If what you have starts with "-----BEGIN", that is the PRIVATE half and must
          not leave the machine it is on.
        success_msg: "public key looks like one"

    - name: Where each container's secrets directory is
      ansible.builtin.set_fact:
        resolved_dirs: >-
          {{ dict(dev_clients | zip(dev_clients | map('regex_replace', '^(.*)$',
             host_home ~ '/.\1-secrets'))) | combine(dev_secrets_overrides) }}

    - name: Each one has to exist already
      # Never created here. An existing secrets directory is the evidence that this is
      # the path the container actually mounts; creating one would put an authorized_keys
      # somewhere nothing reads and report success.
      ansible.builtin.stat:
        path: "{{ resolved_dirs[item] }}"
      register: sd
      loop: "{{ dev_clients }}"
      check_mode: false

    - name: Refuse a directory that is not there
      ansible.builtin.assert:
        that: item.stat.isdir | default(false)
        fail_msg: >-
          {{ resolved_dirs[item.item] }} is not a directory on {{ inventory_hostname }},
          so it is not {{ item.item }}'s secrets mount. Find the host side of that
          container's bind mount — it is in that container's own compose file — and pass
          it: -e secrets_dirs='{"{{ item.item }}": "/the/real/path"}'
      loop: "{{ sd.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create authorized_keys where there is none
      # force: false, so this only ever creates. The append is the next task's job, and a
      # copy that could overwrite is one bad re-run away from locking every client out.
      ansible.builtin.copy:
        content: ""
        dest: "{{ resolved_dirs[item] }}/authorized_keys"
        mode: "0600"
        force: false
      loop: "{{ dev_clients }}"

    - name: Authorise the key
      ansible.posix.authorized_key:
        user: "{{ ansible_facts['user_id'] }}"
        key: "{{ pubkey }}"
        path: "{{ resolved_dirs[item] }}/authorized_keys"
        manage_dir: false
        state: present
      loop: "{{ dev_clients }}"

    # ── and the copy sshd actually reads ─────────────────────────────────────
    # THE HOST FILE IS NOT THE ONE SSHD READS. dev/entrypoint.sh copies
    # $DEV_SECRETS_DIR/authorized_keys to ~/.ssh/authorized_keys at start-up, and
    # sshd_config names that copy — so a key added above reaches a running container only
    # once the copy is refreshed.
    #
    # DO NOT RESTART TO ACHIEVE THAT. sshd is exec'd as PID 1, so restarting it is
    # restarting the container, and every detached abduco session goes with it. sshd reads
    # AuthorizedKeysFile on each authentication attempt, not at start-up, so refreshing
    # the copy is enough and costs nothing.
    #
    # Reached over ssh with the container's own `-sh` alias — the same path the owner
    # would use by hand, so a failure here is fixed by the command that failed. delegated
    # to localhost because that alias is in the CLIENT's ssh config, not zero's. The bare
    # alias would be wrong: it carries a RemoteCommand, which makes `ssh <alias> <cmd>` an
    # error.
    - name: Refresh the copy sshd reads, inside each container
      ansible.builtin.command:
        # expand_argument_vars: false OR THE SCRIPT IS RESOLVED ON THE WRONG MACHINE.
        # `command` expands environment variables in its arguments by default, so `$HOME`
        # below became the CONTROL NODE's home before ssh was ever invoked, and the copy
        # was aimed at a path that exists on the phone and not in the container. It fails
        # loudly rather than silently, but it fails. Everything in this argument is meant
        # for the remote shell; none of it is for ours.
        expand_argument_vars: false
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - "{{ item }}-sh"
          - >-
            d=""; for c in /run/*secrets*; do [ -f "$c/authorized_keys" ] || continue;
            [ -n "$d" ] && { echo "more than one secrets mount: $d and $c" >&2; exit 3; };
            d="$c"; done;
            [ -n "$d" ] || { echo "no secrets mount holding authorized_keys" >&2; exit 2; };
            cp -f "$d/authorized_keys" "$HOME/.ssh/authorized_keys";
            chmod 600 "$HOME/.ssh/authorized_keys";
            echo "refreshed from $d"
      delegate_to: localhost
      register: refreshed
      changed_when: refreshed.rc == 0
      # NOT fatal. The host-side write above is the durable half and has already
      # succeeded; a container that is down, or one this client has no route to, is a
      # thing to report rather than a reason to fail a run that did its job.
      failed_when: false
      loop: "{{ dev_clients }}"

    - name: What now
      ansible.builtin.debug:
        msg: >-
          {{ ['Authorised on: ' ~ (dev_clients | join(', '))]
             + (refreshed.results | selectattr('rc', 'eq', 0)
                | map(attribute='item') | list
                | map('regex_replace', '^(.*)$', '  refreshed \1 live — no restart, sessions kept')
                | list)
             + (refreshed.results | rejectattr('rc', 'eq', 0)
                | map(attribute='item') | list
                | map('regex_replace', '^(.*)$',
                      '  COULD NOT refresh \1 — it will pick the key up at its next start,'
                      ~ ' or run: ssh \1-sh "cp -f /run/*secrets*/authorized_keys'
                      ~ ' ~/.ssh/authorized_keys"')
                | list) }}
      changed_when: true
