---
# MAKE zero's BACKUP KEY, the one zero's nightly push to `three` logs in with, and print the
# two values `three` needs. From the control node:
#
#     cd ansible
#     ansible-playbook playbooks/server-create-backup-key.yml -e target=zero -K
#
# WHAT IT DOES:
#   1. Refuses a host whose backup push is not tracked (hosts/<host>/system/mirror-backup),
#      and one that is not on the tailnet, because the second value it prints is the box's
#      tailnet address: server-install-tailscale.yml first.
#   2. Makes /root/.ssh (0700), then /root/.ssh/mirror-backup, ed25519, comment
#      "<host> mirror-backup", only if no key is there. It NEVER replaces one: three's
#      authorized_keys names the key, so a new one would lock the backup out until three's
#      line is changed too. Rotating it is deleting both files by hand, then this play, then
#      three's line.
#   3. Checks the private key is root's at 0600 and the public key is its pair.
#   4. Prints the public key and `tailscale ip -4`. Send both to the infra agent, which puts
#      them in hosts/three/leap/system/backup-authorized-keys in place of its placeholders;
#      until then leap/make-stick refuses three's stick. It prints the key's fingerprint too,
#      which the agent checks the key against: the key wraps on a phone's screen.
#
# The private key never leaves the box and never reaches this play's output; only the
# public half is read. Under --check it reads and says whether it would make the key.
# sim/alpine/run-setup-plays.sh runs it in CI against an Alpine container.
#
# -K IS REQUIRED: /root/.ssh is root's.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: fleet

- name: Check a target was named
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check -e target names a host in the inventory
      # Without it the play below matches no host and exits 0 having done nothing
      # (_assert-inventory.yml, the same trap).
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['fleet']
        fail_msg: Name the host, -e target=<host>, one in the inventory's fleet group.
        success_msg: "target: {{ target | default('?') }}"

- name: Create a host's backup key
  hosts: "{{ target }}"
  gather_facts: false
  become: false

  vars:
    key: /root/.ssh/mirror-backup
    tailscale_bin: /usr/local/bin/tailscale

  tasks:
    - name: Read whether the backup push is tracked here
      ansible.builtin.stat:
        path: "{{ control_checkout }}/hosts/{{ inventory_hostname }}/system/mirror-backup"
      register: bk_tracked
      delegate_to: localhost

    - name: Check {{ inventory_hostname }} has a backup push
      ansible.builtin.assert:
        that: bk_tracked.stat.exists
        fail_msg: >-
          hosts/{{ inventory_hostname }}/system/mirror-backup is not in this checkout, so
          {{ inventory_hostname }} pushes no backup and needs no key. Nothing has been made.
        success_msg: tracked

    - name: Read whether {{ inventory_hostname }} is on the tailnet
      ansible.builtin.command: "{{ tailscale_bin }} status --json"
      register: bk_ts
      changed_when: false
      failed_when: false
      check_mode: false
      become: true

    - name: Check {{ inventory_hostname }} is on the tailnet
      ansible.builtin.assert:
        that:
          - bk_ts.rc == 0
          - bk_ts.stdout is match('\s*\{')
          - (bk_ts.stdout | from_json).BackendState | default('') == 'Running'
        fail_msg: >-
          {{ inventory_hostname }} is not on the tailnet, and the address three's key line
          needs is its tailnet address. Run server-install-tailscale.yml -e
          target={{ inventory_hostname }} first. Nothing has been made.
        success_msg: on the tailnet

    - name: Create /root/.ssh, root's alone
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    # `creates` is what makes it never overwrite: ssh-keygen runs only when the private key
    # is absent, and under --check it reports whether it would.
    - name: "If absent: create the backup key"
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ inventory_hostname }} mirror-backup", -f, "{{ key }}"]
        creates: "{{ key }}"
      register: bk_made
      become: true

    # The private key is read only by ssh-keygen -y, which prints its public half.
    - name: Read the key's owner and mode and its public half
      ansible.builtin.shell: |
        set -e
        stat -c 'mode=%U %a' {{ key }}
        printf 'derived=%s\n' "$(ssh-keygen -y -f {{ key }} | cut -d' ' -f1,2)"
        printf 'pub=%s\n' "$(cat {{ key }}.pub)"
        printf 'fp=%s\n' "$(ssh-keygen -lf {{ key }}.pub | cut -d' ' -f2)"
      register: bk_read
      changed_when: false
      when: not ansible_check_mode or not bk_made is changed
      become: true

    - name: Read {{ inventory_hostname }}'s tailnet address
      ansible.builtin.command: "{{ tailscale_bin }} ip -4"
      register: bk_ip
      changed_when: false
      check_mode: false
      become: true

    - name: Note the key and the address
      ansible.builtin.set_fact:
        bk: "{{ dict(bk_read.stdout_lines | default([]) | map('split', '=', 1)) }}"
        bk_addr: "{{ bk_ip.stdout_lines[0] | default('') | trim }}"

    - name: Print the two values for three's key line
      ansible.builtin.debug:
        msg: >-
          {{ ['DRY RUN: the key does not exist and would be made; re-run without --check.']
             if ansible_check_mode and bk_made is changed else
             [('Made ' if bk_made is changed else 'Already there, not touched: ') ~ key ~ '.',
              'Send the infra agent these two, for hosts/three/leap/system/backup-authorized-keys:',
              'key:     ' ~ bk.pub | default('?'),
              'address: ' ~ bk_addr,
              'fingerprint: ' ~ bk.fp | default('?') ~ ', for the infra agent to check the key against,'
                ~ ' since a long line wraps on a phone.'] }}
      changed_when: true

    - name: Check the key is root's and the pair matches
      ansible.builtin.assert:
        that:
          - bk.mode | default('') == 'root 600'
          - bk.derived | default('') | length > 0
          - bk.pub | default('') is match(bk.derived | default('') | regex_escape ~ '( |$)')
          - bk_addr is match('^100\.')
        fail_msg: >-
          {{ key }} is {{ bk.mode | default('unreadable') }} (root 600 wanted), its public
          file {{ 'matches' if bk.pub | default('') is match(bk.derived | default('-') | regex_escape) else 'DOES NOT MATCH' }}
          it, and the address read is '{{ bk_addr }}'. Fix that by hand before sending
          anything to the infra agent.
        success_msg: ok
      when: not (ansible_check_mode and bk_made is changed)
