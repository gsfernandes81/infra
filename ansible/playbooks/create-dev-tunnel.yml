---
# Provisions the Cloudflare side of a dev container's tunnel, over the API.
#
#     cd ansible
#     ansible-playbook playbooks/create-dev-tunnel.yml --check    # prove, no -K
#     ansible-playbook playbooks/create-dev-tunnel.yml            # apply
#
# Four objects, and every one of them idempotent — each is looked up before it is
# created, so a re-run after a partial failure is the intended way to finish:
#
#   1. a locally-managed tunnel   -> credentials written to {{ infra_secrets }}/tunnel.json on zero
#   2. a proxied CNAME            -> {{ cf_hostname }}
#   3. an Access service token    -> its secret printed ONCE, for the phone
#   4. an Access application      -> with one non_identity policy naming that token
#
# WHY THIS IS A PLAYBOOK AND NOT A SCRIPT. It was written as dev/cf-provision.sh first
# and that was the wrong instinct — the same one that put bin/compose in this repo.
# Provisioning the way in to a managed box is management-plane work, and the plane is
# here. Four things follow from being in it rather than beside it: `uri` returns parsed
# JSON so there is no hand-rolled extractor; `--check` is a real dry run, which has
# already caught one bad change in this repo; `no_log` is a mechanism rather than
# discipline; and the API token becomes a Vault variable at Phase 4 with no rewrite.
# It is also not a one-off — dd-dev, ds-dev and or3-dev want the same four objects, and
# rotating the fleet's own tunnel tokens wants most of them.
#
# WHY `uri` AND NOT `community.general.cloudflare_dns`. That module exists and would do
# task 2. It would do only task 2 — tunnel, Access application, policy and service token
# have no module and must be `uri` regardless. One mechanism with one error-handling
# style beats a module for a quarter of the work, and the collection's parameter names
# could not be verified when this was written (Galaxy was unreachable). If someone
# checks them, swapping task 2 is a small, contained change.
#
# THE API TOKEN IS NEVER WRITTEN ANYWHERE. vars_prompt keeps it in memory for the run.
# It must NEVER go in {{ infra_secrets }}: that directory is mounted into the container,
# and a container able to rewrite the Access policy in front of itself is not protected
# by it. Nothing the running container does needs this token.
#
# Token scopes (Cloudflare -> My Profile -> API Tokens -> Create Token -> Custom):
#   Zone    : Zone                        : Read     (gsrpi.uk)
#   Zone    : DNS                         : Edit     (gsrpi.uk)
#   Account : Cloudflare Tunnel           : Edit
#   Account : Access: Apps and Policies   : Edit
#   Account : Access: Service Tokens      : Edit
#
# THE API TOKEN IS DISPOSABLE, AND THAT IS THE POINT OF NEVER STORING IT. Nothing keeps
# it: not this repo, not the container, not $INFRA_SECRETS. So delete it in the dashboard
# the moment provisioning is done and mint a fresh one the next time you provision —
# there is no config to update and nothing to break, because nothing was ever holding it.
# A deleted API token also costs nothing already built: the tunnel, the DNS record, the
# Access application and the service token all keep working, since none of them
# authenticate with it.
#
# WHAT THIS PLAY CANNOT MINT IS THE API TOKEN ITSELF. Cloudflare does have
# POST /user/tokens, and it requires an existing token with User:API Tokens:Edit — so it
# cannot bootstrap from nothing, and neither can anything else. One credential has to be
# made by a person in a browser. That is the whole of the manual surface here, and
# `cloudflared tunnel login` would not avoid it: it is also a browser round trip, and it
# would cover only the tunnel and DNS, leaving Access to be clicked.

- name: Provision a dev container's Cloudflare tunnel and Access policy
  # zero, because the ONLY thing that lands on a host is the credentials file. Every
  # Cloudflare call is delegated to the control node — they are HTTPS to a public API and
  # have no business being made from the box being configured.
  hosts: "{{ cf_target | default('zero') }}"
  gather_facts: false
  become: false

  vars:
    cf_api: https://api.cloudflare.com/client/v4
    # group_vars/all.yml, not a literal — configure-client-dev.yml derives the client
    # side of the same hostname from that one value, and the two must not be able to
    # disagree about the zone.
    cf_zone: "{{ zone | default(dns_zone) }}"
    cf_name: "{{ name | default('infra-dev') }}"
    cf_hostname: "{{ hostname | default(cf_name ~ '.' ~ cf_zone) }}"
    # The ACCESS SERVICE TOKEN to put in the policy, BY NAME — not the API token above,
    # which is a different object with a colliding name and no business being named here.
    # Leave it unset unless you minted an Access service token by hand; the default is
    # the tunnel's own name and the play creates one under it.
    #
    # Separate from the tunnel name because a token minted by hand in the dashboard is
    # called whatever it was called that day, and a lookup that silently finds nothing
    # would mint a SECOND one —
    # leaving two tokens with the same purpose, of which the phone holds the secret to
    # only one. If it does not match, this play creates a token and prints its secret.
    cf_st_name: "{{ service_token_name | default(cf_name) }}"
    # Ansible templates a task's arguments BEFORE deciding to skip it, and `uri` declares
    # no check-mode support — so under --check every write is skipped, but its URL and
    # body are still rendered. Any id that only a write could have produced is therefore
    # undefined at that moment, and the render dies with "'cf_tunnel_id' is undefined".
    #
    # THE FILLER GOES INLINE, NOT INTO A set_fact. A set_fact was tried and was worse: it
    # makes the id look defined to the READ tasks as well, and those carry
    # check_mode: false because a read is safe — so `GET /access/apps/WOULD-BE.../policies`
    # went out for real and came back 404. A `when: … is defined` guard on a read is only
    # honest if the fact is genuinely absent. Inline defaults keep it absent.
    #
    # Deliberately not a plausible UUID: if it ever escapes into a real request, that
    # request should fail obviously rather than create something against the wrong object.
    cf_unknown_id: WOULD-BE-CREATED-BY-A-REAL-RUN
    # Where the container's read-only secrets mount points on the host. Matches
    # INFRA_SECRETS in dev/.env; override with -e if that was changed.
    infra_secrets: "{{ secrets_dir | default('~/.infra-dev-secrets') }}"
    # Irrelevant to a service token, which does not expire with a session. Set explicitly
    # so the value is chosen rather than inherited from a Cloudflare default nobody read.
    cf_session_duration: 24h

  vars_prompt:
    # "API token", and the distinction is not pedantry — it has already cost a round.
    # Cloudflare has TWO things whose names collide:
    #   API token          — My Profile -> API Tokens. Authorises THIS PLAY to call the
    #                        API. It is what this prompt wants.
    #   Access service token — Zero Trust -> Access -> Service Auth. A client_id/secret
    #                        pair a MACHINE presents to get THROUGH Access. This play
    #                        creates one and prints it once; the phone holds it.
    # An API token that someone named "service_token" is still an API token.
    - name: cf_api_token
      prompt: "Cloudflare API token (My Profile -> API Tokens, NOT an Access service token)"
      private: true
      confirm: false

  tasks:
    # ── the flag that used to mean delete-and-recreate ──────────────────────
    # It named an operation Cloudflare will not perform on a provisioned container: a
    # service token an Access policy references cannot be deleted (400 / 12139), and
    # this play's own policy is that reference. Rotation does what it was reached for,
    # so the flag is renamed rather than quietly redefined — someone typing the old one
    # from a note or from scrollback should be told what changed, not silently handed a
    # different operation than the word they used.
    - name: Refuse the old flag name
      ansible.builtin.assert:
        that: replace_service_token is not defined
        fail_msg: >-
          -e replace_service_token=true is gone. It deleted the token and minted a new
          one, and Cloudflare refuses that while an Access policy references it — which
          it always does here. Use -e rotate_service_token=true: same intent, one call,
          the token id and the policy untouched, the old secret dead the moment the new
          one is printed.
        success_msg: "no retired flags"

    # ── 0  the token, the zone and the account ─────────────────────────────
    # `check_mode: false` on every read, the same reason audit-fleet.yml carries it: under
    # --check a task is skipped by default, so a dry run would resolve nothing and then
    # fail on every id it needed. A read is safe in check mode by definition. The
    # writes below carry no such line, so --check skips exactly those.
    - name: Resolve the zone and its account
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones?name={{ cf_zone }}"
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
      register: cf_zone_q
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: Fail clearly if the token cannot see the zone
      # Cloudflare answers 200 with success:false for an auth failure, so the status code
      # is not the check — `.json.success` is. A play that read the status alone would
      # carry on and fail later on an empty id, several tasks from the real cause.
      ansible.builtin.assert:
        that:
          - cf_zone_q.json.success | default(false)
          - (cf_zone_q.json.result | default([])) | length > 0
        fail_msg: >-
          The API token could not read zone {{ cf_zone }}. Either the token is wrong, or
          it is missing Zone:Zone:Read on that zone. Nothing has been created.
        success_msg: "zone {{ cf_zone }} is visible to this token"

    - name: Remember the zone and account ids
      ansible.builtin.set_fact:
        cf_zone_id: "{{ cf_zone_q.json.result[0].id }}"
        cf_account_id: "{{ cf_zone_q.json.result[0].account.id }}"

    - name: Which account this play is working in
      # Printed because it is the answer to the question that actually comes up: "why
      # can it not see the object I made?" This id is derived from whoever owns the ZONE,
      # and Access objects live under an ACCOUNT — if you have more than one, a token
      # made in the other one is invisible here and the play would say, correctly and
      # uselessly, that there are none. Neither id is a secret.
      ansible.builtin.debug:
        msg: "zone {{ cf_zone }} = {{ cf_zone_id }} · account = {{ cf_account_id }}"
      changed_when: true

    # ── 1  the tunnel ───────────────────────────────────────────────────────
    # Locally-managed (config_src: local), so ingress lives in the container's own
    # config.yml rather than in the dashboard, and what this hostname answers on is
    # reviewable in dev/entrypoint.sh instead of being a screen someone clicked once.
    - name: Look for an existing credentials file on the host
      ansible.builtin.slurp:
        src: "{{ infra_secrets }}/tunnel.json"
      register: cf_creds_existing
      failed_when: false
      check_mode: false

    - name: Remember the tunnel id if there already is one
      ansible.builtin.set_fact:
        cf_tunnel_id: "{{ (cf_creds_existing.content | b64decode | from_json).TunnelID }}"
      when: cf_creds_existing.content is defined
      no_log: true

    - name: Confirm an existing tunnel is still live on this account
      # A credentials file naming a deleted tunnel is the nastiest state here: the
      # container starts, cloudflared fails, and the hostname resolves to nothing — which
      # looks exactly like the container being down. Catch it now, not at 03:00.
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel/{{ cf_tunnel_id }}"
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
        status_code: [200, 404]
      register: cf_tunnel_q
      delegate_to: localhost
      when: cf_tunnel_id is defined
      check_mode: false
      changed_when: false
      no_log: true

    - name: Refuse to continue on a credentials file naming a dead tunnel
      ansible.builtin.assert:
        that:
          # Three conditions, in this order, because `result` arrives in four shapes and
          # only one of them has a `deleted_at` to read. The whole point of allowing the
          # 404 on this task was to produce the message below, and a raw Jinja error in
          # its place is the opposite of that — which is what happened twice while
          # getting this right:
          #
          #   200, object with deleted_at: null   the live tunnel — the only pass
          #   200, object with a timestamp        deleted; caught by the third condition
          #   404, "result": null                 caught by the first
          #   anything else                       caught by `is mapping`
          #
          # `.get()` rather than `.deleted_at`, because attribute access on a dict that
          # lacks the key yields Undefined and `Undefined is none` RAISES here rather
          # than answering false.
          - cf_tunnel_q.json.success | default(false)
          - cf_tunnel_q.json.result is mapping
          - cf_tunnel_q.json.result.get('deleted_at') is none
        fail_msg: >-
          {{ infra_secrets }}/tunnel.json on {{ inventory_hostname }} names tunnel
          {{ cf_tunnel_id }}, which this account does not have (deleted, or created on
          another account). Move that file aside and re-run to mint a fresh one. The
          container reads it and fails closed until you do; its loopback port still works.
        success_msg: "tunnel {{ cf_tunnel_id }} already exists and is live"
      when: cf_tunnel_id is defined

    - name: Generate a tunnel secret
      # 32 random bytes, base64. Generated here because Cloudflare never sends a tunnel
      # secret back — this is the only moment it exists in the clear, which is why the
      # credentials file is written two tasks later and not at some more convenient point.
      ansible.builtin.set_fact:
        cf_tunnel_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      when: cf_tunnel_id is not defined
      no_log: true

    - name: Create the tunnel
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/cfd_tunnel"
        method: POST
        # Cloudflare answers 201 Created on some creates and 200 on others, with no
        # pattern worth memorising. `uri` defaults to accepting 200 ALONE, so a 201
        # is a task failure on a call that SUCCEEDED — which on the service token
        # meant the object was made and the response carrying its one-and-only
        # secret was censored by no_log and thrown away. Accept both, everywhere.
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
        body_format: json
        body:
          name: "{{ cf_name }}"
          tunnel_secret: "{{ cf_tunnel_secret }}"
          config_src: local
      register: cf_tunnel_new
      delegate_to: localhost
      when: cf_tunnel_id is not defined
      no_log: true

    - name: Remember the new tunnel id
      ansible.builtin.set_fact:
        cf_tunnel_id: "{{ cf_tunnel_new.json.result.id }}"
      when: cf_tunnel_new is not skipped

    - name: Write the credentials file
      # 0600, and the content never reaches a log. This is the one artefact of the whole
      # play that lands on a host, and it is what lets anything claim to be this tunnel.
      ansible.builtin.copy:
        content: >-
          {{ {'AccountTag': cf_account_id,
              'TunnelID': cf_tunnel_id,
              'TunnelSecret': cf_tunnel_secret} | to_json }}
        dest: "{{ infra_secrets }}/tunnel.json"
        mode: "0600"
      when: cf_tunnel_new is not skipped
      no_log: true

    # ── 2  the DNS record ───────────────────────────────────────────────────
    - name: Look for an existing record for the hostname
      # &type=CNAME, not name alone. Cloudflare's name filter returns every record type at
      # that name, so a stale A or AAAA left over from something else would come back
      # first and the PUT below would rewrite THAT record's id into a CNAME — converting
      # an unrelated record instead of managing ours.
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?type=CNAME&name={{ cf_hostname }}"
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
      register: cf_dns_q
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: Is the record already pointing at this tunnel
      # So a converged run reports changed=0. That matters more here than tidiness: this
      # repo reads the recap to tell a no-op from a real one, and a play that always says
      # "changed" is a play whose recap nobody reads.
      #
      # `proxied` is compared too, not just the target. An unproxied record resolves to
      # the tunnel's address and Cloudflare never sees the request, so Access is not in
      # front of it at all — the same reachability with the protection quietly gone.
      ansible.builtin.set_fact:
        cf_dns_ok: >-
          {{ (cf_dns_q.json.result | length) > 0
             and cf_dns_q.json.result[0].content == ((cf_tunnel_id | default('', true)) ~ '.cfargotunnel.com')
             and (cf_dns_q.json.result[0].proxied | default(false) | bool) }}

    - name: The record is already correct
      ansible.builtin.debug:
        msg: "{{ cf_hostname }} already CNAMEs to this tunnel, proxied — leaving it"
      changed_when: true
      when: cf_dns_ok

    - name: Point the record at this tunnel
      # PUT when it exists rather than skipping. A record left pointing at a PREVIOUS
      # tunnel resolves perfectly and reaches nothing — the same failure as above, wearing
      # the same disguise. Making it match costs one call; assuming it matches is the bug.
      ansible.builtin.uri:
        url: >-
          {{ cf_api }}/zones/{{ cf_zone_id }}/dns_records{{
             '/' ~ cf_dns_q.json.result[0].id if (cf_dns_q.json.result | length) > 0 else '' }}
        method: "{{ 'PUT' if (cf_dns_q.json.result | length) > 0 else 'POST' }}"
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
        body_format: json
        body:
          type: CNAME
          name: "{{ cf_hostname }}"
          content: "{{ cf_tunnel_id | default(cf_unknown_id, true) }}.cfargotunnel.com"
          proxied: true
          comment: "{{ cf_name }} container tunnel — ansible/playbooks/create-dev-tunnel.yml"
      register: cf_dns_w
      delegate_to: localhost
      when: not cf_dns_ok
      changed_when: cf_dns_w.json.success | default(false)
      no_log: true

    # ── 3  the service token ────────────────────────────────────────────────
    # Before the application, because the policy has to name it. If you minted one by
    # hand already, pass its name: -e service_token_name=whatever-you-called-it. Its
    # SECRET is not needed here and cannot be read back — only its id goes in the policy.
    - name: List the account's service tokens
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/service_tokens"
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
      register: cf_st_q
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: Remember an existing service token
      ansible.builtin.set_fact:
        cf_st_id: "{{ (cf_st_q.json.result | selectattr('name', 'eq', cf_st_name) | list | first).id }}"
      when: (cf_st_q.json.result | default([]) | selectattr('name', 'eq', cf_st_name) | list) | length > 0

    - name: The raw service-token listing
      # -e debug_tokens=true. Off by default because it is noise on a working run, and
      # available because the alternative — when the summary below says "none" and you
      # believe otherwise — was for me to guess between three explanations. The listing
      # carries ids, names, client_ids and timestamps and NO secrets: Cloudflare returns
      # a service token's secret at creation and never again, which is the same fact that
      # makes this play print it once and loudly.
      ansible.builtin.debug:
        msg: "{{ cf_st_q.json | to_nice_json }}"
      changed_when: true
      when: debug_tokens | default(false) | bool

    - name: Say which service tokens this account has
      # Printed whether or not one matched. A name mismatch is otherwise invisible: the
      # play happily mints a second token, and you are left with two of the same purpose
      # and the secret to only one of them. Seeing the list is what catches it.
      ansible.builtin.debug:
        msg: >-
          ACCESS service tokens (Zero Trust -> Access -> Service Auth; not API tokens) —
          looking for "{{ cf_st_name }}", account has:
          {{ (cf_st_q.json.result | default([]) | map(attribute='name') | list) | join(', ') | default('none', true) }}
          => {{ 'matched ' ~ cf_st_id if cf_st_id is defined else 'NO MATCH, one will be created' }}
      changed_when: true

    - name: Rotate the existing service token, so the phone gets a fresh secret
      # -e rotate_service_token=true. For the case that has already happened here: the
      # token exists in Cloudflare and NOBODY HAS ITS SECRET, because Cloudflare returns
      # it at creation and never again.
      #
      # THIS WAS delete-and-recreate AND CLOUDFLARE REFUSES THAT. A token an Access
      # policy references cannot be deleted — 400, code 12139, `service_token_in_use`,
      # "remove all references to it and try again, or rotate the service token to
      # invalidate existing clients". This play's own policy is that reference, so the
      # delete could never have worked on a container this play had finished
      # provisioning; it could only work on a half-built one. Seen 2026-08-24.
      #
      # Rotate is the operation the error message itself names, and it is better than
      # what it replaces on every count: the token id does not change, so the policy is
      # untouched and no window exists in which the application has nothing to admit;
      # the old secret stops working the instant this returns; and one call replaces
      # three. The response carries client_id and client_secret exactly as a create
      # does, which is why the banner below can take either.
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/service_tokens/{{ cf_st_id }}/rotate"
        method: POST
        # 200 and 201 both, because guessing which one this API answers with is exactly
        # how the only copy of a secret was lost here in August — `uri` defaults to 200,
        # Cloudflare said 201, and the task "failed" after doing the work.
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
      register: cf_st_rot
      delegate_to: localhost
      when: cf_st_id is defined and (rotate_service_token | default(false) | bool)
      # THE FAILURE HAS TO SURVIVE `no_log`. Every call here carries no_log for one
      # reason — the Authorization header is in the module's own invocation, and a
      # failed task prints that — and the price is that it censors the response too, so
      # a refusal arrives as "Status code was 400" and nothing else. Cloudflare puts the
      # reason in the body, and in this play's case the body was the whole diagnosis.
      # Not failing here lets the two tasks below print that body (which holds no
      # credential on an error) and then stop the play deliberately.
      failed_when: false
      no_log: true

    - name: What Cloudflare said, if it refused to rotate the token
      ansible.builtin.debug:
        msg: >-
          POST service_tokens/{{ cf_st_id }}/rotate returned
          {{ cf_st_rot.status | default('?') }}:
          {{ cf_st_rot.json.errors | default(cf_st_rot.msg) | default('no detail') }}
      changed_when: true
      when:
        - cf_st_rot is not skipped
        - cf_st_rot.status | default(0) not in [200, 201]

    - name: Stop if the rotation was refused
      # NOTHING IS HALF-DONE WHEN THIS FIRES, which is the other reason rotate replaced
      # delete-and-recreate: a refusal here leaves the old secret working. If the phone
      # has it, nothing needs doing; if it does not, the account is exactly as stuck as
      # it was a moment ago, and no new object was created to clean up.
      ansible.builtin.assert:
        that: cf_st_rot.status | default(0) in [200, 201]
        fail_msg: >-
          The service token "{{ cf_st_name }}" was NOT rotated, so its old secret still
          works and nothing has changed. A 403 means the API token can list service
          tokens but not edit them — it wants Account : Access: Service Tokens : Edit,
          in the scope list at the top of this file, and it is disposable, so mint one
          with that scope and re-run. Anything else is above; Cloudflare's own message
          is the one to read.
        success_msg: "{{ cf_st_name }} rotated — every client holding the old secret is now out"
      when: cf_st_rot is not skipped

    - name: Create the service token
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/service_tokens"
        method: POST
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
        body_format: json
        body: { name: "{{ cf_st_name }}" }
      register: cf_st_new
      delegate_to: localhost
      # Only when there is nothing to rotate. A token that exists is never recreated —
      # that is what the rotate above is for.
      when: cf_st_id is not defined
      # Same reason as the rotate above: no_log would otherwise censor Cloudflare's
      # explanation of a refusal. It stays on, because the response of a SUCCESSFUL
      # create is the secret itself and that is printed by exactly one task.
      failed_when: false
      no_log: true

    - name: What Cloudflare said, if it refused to create the token
      ansible.builtin.debug:
        msg: >-
          POST service_tokens (name "{{ cf_st_name }}") returned
          {{ cf_st_new.status | default('?') }}:
          {{ cf_st_new.json.errors | default(cf_st_new.msg) | default('no detail') }}
      changed_when: true
      when:
        - cf_st_new is not skipped
        - cf_st_new.status | default(0) not in [200, 201]

    - name: Stop if no token was minted
      ansible.builtin.assert:
        that: cf_st_new.status | default(0) in [200, 201]
        fail_msg: >-
          No service token was created, so the Access policy below would have nothing to
          admit and the container would be unreachable. Nothing was deleted or changed —
          re-run once the reason above is dealt with. A 403 means the API token can read
          service tokens but not edit them; see the scope list at the top of this file.
        success_msg: "a new service token exists; its secret is printed below, once"
      when: cf_st_new is not skipped

    - name: Remember the new service token id
      ansible.builtin.set_fact:
        cf_st_id: "{{ cf_st_new.json.result.id }}"
      when: cf_st_new is not skipped

    - name: The pair to hand over, from whichever call produced it
      # ONE FACT, so there is ONE banner. A create and a rotate return the same shape,
      # and a play with two nearly-identical printings of a credential is a play where
      # one of them drifts. no_log because the fact IS the secret and set_fact echoes
      # its arguments.
      ansible.builtin.set_fact:
        cf_st_creds: "{{ (cf_st_new if cf_st_new is not skipped else cf_st_rot).json.result }}"
        cf_st_verb: "{{ 'minted' if cf_st_new is not skipped else 'rotated' }}"
        # Said in both cases, because "was minted" followed by nothing reads as a
        # sentence that lost its second half — and a rotation's second half is the part
        # that matters: the old pair is dead, not merely superseded.
        cf_st_note: >-
          {{ 'Every client holding the previous secret is refused from now on.'
             if cf_st_new is skipped
             else 'It is new, so nothing was holding an earlier secret.' }}
      when: (cf_st_new is not skipped) or (cf_st_rot is not skipped)
      no_log: true

    - name: The phone's credentials — shown once, never again
      # The ONLY task here without no_log, and deliberately so. Cloudflare returns a
      # service token's secret at creation and never again; a play that hid it would have
      # created a credential nobody can use. Everything else on the wire stays masked.
      #
      # changed_when: true is a display decision and not a lie about state — the same one
      # install-system-files.yml documents. ansible.cfg sets display_ok_hosts = False and a debug
      # task reports ok, so without it THIS BANNER DOES NOT PRINT: the play mints a
      # credential Cloudflare will never show again and says nothing. Found 2026-08-24.
      ansible.builtin.debug:
        # ONE string, not a list of lines. Under callback_result_format = yaml a list
        # renders as quoted, escaped items, and the two lines that have to be transcribed
        # by hand are exactly the ones a leading space forces into quotes. A multiline
        # string renders as a block scalar: real newlines, nothing around the values.
        msg: |
          ─────────── COPY THESE NOW — CLOUDFLARE WILL NOT SHOW THEM AGAIN ───────────

            Client ID      {{ cf_st_creds.client_id }}
            Client Secret  {{ cf_st_creds.client_secret }}

          Service token "{{ cf_st_name }}" was {{ cf_st_verb }}. {{ cf_st_note }}

          Hand them to the client play, which is the only thing that should store them:

              ansible-playbook playbooks/configure-client-dev.yml{{ ' -e replace_token=true' if cf_st_verb == 'rotated' else '' }}

          It prompts for both — the secret is read from the terminal and CANNOT be
          passed with -e, so it reaches neither your shell history nor the process
          list. It writes them to ~/.config/{{ cf_name }}/token at mode 600 and adds the
          ssh config block whose ProxyCommand sources that file.

          Do not put them in fish conf.d. That would place a live credential in the
          environment of every process this account starts, for the sake of one
          command that runs when you ssh.

          Lost them? -e rotate_service_token=true mints a fresh secret for this same
          token. There is no way to read an existing one back.
          ─────────────────────────────────────────────────────────────────────────────
      changed_when: true
      when: cf_st_creds is defined

    - name: Note when no secret was produced this run
      ansible.builtin.debug:
        msg: >-
          An ACCESS service token named "{{ cf_st_name }}" already existed and was left
          alone, so no secret was printed — Cloudflare cannot return one after creation.
          If the phone does not have it, re-run with -e rotate_service_token=true, which
          mints a fresh secret for this same token and invalidates the old one. It does
          NOT delete anything: Cloudflare refuses to delete a token an Access policy
          references, and this play's policy is that reference.
      changed_when: true
      when: cf_st_creds is not defined

    # ── 4  the Access application and its one policy ────────────────────────
    - name: List the account's Access applications
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps"
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
      register: cf_app_q
      delegate_to: localhost
      check_mode: false
      changed_when: false
      no_log: true

    - name: Remember an existing application for this hostname
      ansible.builtin.set_fact:
        cf_app_id: "{{ (cf_app_q.json.result | selectattr('domain', 'eq', cf_hostname) | list | first).id }}"
      when: (cf_app_q.json.result | default([]) | selectattr('domain', 'eq', cf_hostname) | list) | length > 0

    - name: Create or update the Access application
      # THIS ONE PUTS UNCONDITIONALLY AND SO ALWAYS REPORTS CHANGED, unlike the DNS record
      # above. Deliberate, and the reason is that Cloudflare normalises what it returns —
      # session_duration, allowed_idps and the launcher flags come back in forms that do
      # not compare equal to what was sent, so a field-by-field check would report a
      # difference on every run and be worse than no check. Converging every time is
      # cheap and correct; the cost is one `changed` in the recap.
      #
      # allowed_idps is deliberately empty and auto_redirect_to_identity false: this
      # application has no identity provider behind it at all. That is the answer to
      # "which IdP" — none, no account is linked to anything, and the only way through is
      # the service token below.
      ansible.builtin.uri:
        url: >-
          {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps{{
             '/' ~ cf_app_id if cf_app_id is defined else '' }}
        method: "{{ 'PUT' if cf_app_id is defined else 'POST' }}"
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
        body_format: json
        body:
          name: "{{ cf_name }}"
          domain: "{{ cf_hostname }}"
          type: self_hosted
          session_duration: "{{ cf_session_duration }}"
          allowed_idps: []
          auto_redirect_to_identity: false
          app_launcher_visible: false
      register: cf_app_w
      delegate_to: localhost
      changed_when: cf_app_w.json.success | default(false)
      no_log: true

    - name: Remember the application id
      ansible.builtin.set_fact:
        cf_app_id: "{{ cf_app_w.json.result.id }}"
      when: cf_app_w is not skipped

    - name: List the application's policies
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{ cf_app_id }}/policies"
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
      register: cf_pol_q
      delegate_to: localhost
      when: cf_app_id is defined
      check_mode: false
      changed_when: false
      no_log: true

    - name: Create or update the service-token policy
      # Same as the application above: PUTs unconditionally, so it always reports changed.
      #
      # decision: non_identity, and that is not interchangeable with `allow`. `allow` with
      # a service_token include still expects an identity behind the request and sends a
      # headless client to a login page it cannot complete — which presents as the tunnel
      # being broken rather than as the wrong policy type.
      ansible.builtin.uri:
        url: >-
          {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{ cf_app_id | default(cf_unknown_id, true) }}/policies{{
             '/' ~ (cf_pol_q.json.result | selectattr('name', 'eq', 'service token') | list | first).id
             if (cf_pol_q.json.result | default([]) | selectattr('name', 'eq', 'service token') | list) | length > 0
             else '' }}
        method: >-
          {{ 'PUT' if (cf_pol_q.json.result | default([]) | selectattr('name', 'eq', 'service token') | list) | length > 0
             else 'POST' }}
        status_code: [200, 201]
        headers: { Authorization: "Bearer {{ cf_api_token }}" }
        body_format: json
        body:
          name: service token
          decision: non_identity
          include:
            - service_token: { token_id: "{{ cf_st_id | default(cf_unknown_id, true) }}" }
      register: cf_pol_w
      delegate_to: localhost
      when: cf_app_id is defined and cf_st_id is defined
      changed_when: cf_pol_w.json.success | default(false)
      no_log: true

    # ── what to do next ─────────────────────────────────────────────────────
    - name: What a --check run can and cannot tell you
      ansible.builtin.debug:
        msg: >-
          --check: every read ran for real and every write was skipped, so what this
          proved is that the API token works, that it can see the zone, and which of the
          four objects already exist. Anything below showing "(not created — --check)"
          does not exist yet. Nothing was created and nothing was changed.
      changed_when: true
      when: ansible_check_mode

    - name: What was provisioned
      ansible.builtin.debug:
        msg:
          - "tunnel    {{ cf_tunnel_id | default('(not created — --check)', true) }}"
          - "token     {{ cf_st_id | default('(not created — --check)', true) }}"
          - "app       {{ cf_app_id | default('(not created — --check)', true) }}"
          - "hostname  {{ cf_hostname }}"
          - "creds     {{ inventory_hostname }}:{{ infra_secrets }}/tunnel.json"
          - "access    application + one non_identity policy, no identity provider"
          - ""
          - "Set DEV_TUNNEL_HOSTNAME={{ cf_hostname }} in dev/.env, then `make up`"
          - "on {{ inventory_hostname }} — NOT restart: the entrypoint reads it at start."
      changed_when: true

