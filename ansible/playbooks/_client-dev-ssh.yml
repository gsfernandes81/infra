---
# NOT A PLAYBOOK YOU RUN — the underscore says so, as it does for _assert-inventory.yml.
# client-home-ssh-config.yml imports this once per dev container; run THAT. This file is
# the dev-container half of it: it configures the machine you ssh FROM — the phone, or the
# laptop — to reach ONE dev container through its Cloudflare tunnel. Targets the control
# node itself.
#
#     cd ansible
#     ansible-playbook playbooks/client-home-ssh-config.yml --check --diff
#     ansible-playbook playbooks/client-home-ssh-config.yml -e only=or3-dev    # this half, one container
#
# RUN IT FROM THIS DIRECTORY. ansible.cfg is read from the cwd and is the only thing that
# points at ./inventory; from anywhere else `hosts: control` matches nothing and the play
# is skipped whole, with an empty recap and exit 0. `_assert-inventory.yml` below turns
# that silence into a failure — it is imported for exactly this reason and the reasoning
# is in that file.
#
# ONE IMPORT PER CONTAINER, and the defaults are infra-dev's. The wrapper names each one
# with `alias:` on the import; `-e only=<alias>` on the wrapper is how you reach a single
# container from the command line (an `-e alias=` would override every import at once).
#
# THE HOSTNAME IS NOT PASSED. It is `<alias>.<dns_zone>` — the repo standard, derived
# below from the same two values _dev-container-tunnel.yml derives it from. `-e hostname=`
# still wins, for a container that does not follow the pattern.
#
# Everything a run writes is keyed on `alias` — the token file, the ssh block's marker,
# the Windows wrapper — so two containers do not overwrite each other. They did before
# 2026-08-24: the token path and the marker were the literal string `infra-dev`, which is
# invisible until the second container exists and then loses the first one's token to the
# second run.
#
# It answers "how does the service token get used automatically when I ssh in", and the
# answer is deliberately not "export it in your shell profile". See below.
#
# Run it once per client. On a second machine, run it there — the token file and the ssh
# block are per-client, and nothing about this is shared state. The exception, and it is
# the whole point of the Windows half, is WSL: from there C:\Users\gavin is a directory
# this play can write, so ONE RUN IN WSL PROVISIONS TWO CLIENTS.
#
# ── THE LAPTOP IS TWO CLIENTS, AND ANSIBLE ONLY RUNS ON ONE OF THEM ──────────────
#
# Windows cannot be an Ansible target without sshd on it, which is a lot of machinery for
# two files. But under WSL the laptop's Windows home is mounted at /mnt/c/Users/gavin, so
# the play run *in WSL* manages *Windows'* ssh config and token directly — the same trick
# _client-fleet-ssh.yml already uses for the infra-fleet block, and the reason a WSL control node
# is worth having at all. So a single `ansible-playbook playbooks/_client-dev-ssh.yml` in WSL
# writes, on the Linux side:
#
#     ~/.ssh/config                         the block, POSIX ProxyCommand
#     ~/.config/<alias>/token               mode 0600
#
# and on the Windows side, through /mnt/c:
#
#     C:\Users\gavin\.ssh\config            the block, wrapper ProxyCommand
#     C:\Users\gavin\.config\<alias>\token  NTFS permissions — see the warning below
#     C:\Users\gavin\.ssh\cf-access-<alias>.cmd
#
# From Termux, /mnt/c does not exist, the Windows half is skipped, and the ssh block plus
# the wrapper are rendered to a paste file instead. The TOKEN is never rendered to a paste
# file: a secret in a file the owner will open, read and copy out of is a secret in
# scrollback, and this repo's root CLAUDE.md forbids exactly that.
#
# WINDOWS NEEDS A WRAPPER BECAUSE IT HAS NO `sh`. Every POSIX client loads the token in
# one ssh_config line, `ProxyCommand sh -c '. token; exec cloudflared …'`. Win32-OpenSSH
# has no sh, and moving the secret onto the command line to compensate is the one thing
# that is not allowed. So the load-then-exec becomes a batch file — templates/cf-access.cmd.j2 —
# with the same guarantee: the token reaches one short-lived cloudflared's environment and
# nothing else.
#
# THE ONE THING THIS PLAY CANNOT PROMISE ON WINDOWS IS A FILE MODE. /mnt/c is drvfs and
# carries no Unix permissions, so `mode: "0600"` there either fails or silently does
# nothing — and a task that pretends to have set a mode is worse than one that does not
# try (_client-fleet-ssh.yml's Windows task says the same thing about the same mount). What
# protects the Windows token is the NTFS ACL C:\Users\gavin hands down. The play PRINTS
# that ACL when it writes the file. It does not assert on it: this repo's own rule is that
# a check is calibrated against known-good state before its verdict is trusted, and
# nothing here can see that laptop to calibrate against. Read the output once, then trust
# the file.
#
# THE SECRET CANNOT BE PASSED ON THE COMMAND LINE. Not "should not" — the play refuses.
#
# This started as vars_prompt with private: true, which is the obvious spelling and has a
# hole in it: `-e st_client_secret=...` does not collide with the prompt, it SILENTLY
# REPLACES it. Extra vars are the highest-precedence source in Ansible, so the prompt
# never appears, the run looks completely normal, and a live credential is now in fish's
# history and in the process list. A safeguard that is bypassed by the shortest path
# somebody might type is not a safeguard.
#
# So the secret is read by `ansible.builtin.pause` — a TASK, which always runs and has no
# variable name for -e to override — and a first task asserts that `st_client_secret` is
# undefined, which it can only be if somebody passed it. Between them there is no command
# line that gets a secret into this play.
#
# The client ID is a different thing and is treated differently: it is not secret (it is
# the username half), so -e is fine for it and it is prompted for only when absent.
#
#
# THE REASONING BEHIND THE ALIASES THIS WRITES IS docs/ssh-clients.md. It moved there on
# 2026-08-28: it had been inline in the templates, which meant a client's ssh config
# carried the dev-container explanation once PER CONTAINER — 484 lines to say 130 lines
# of configuration. The blocks now keep what you need mid-rescue; the doc keeps the rest.
# NO NEW COLLECTIONS: ansible.builtin throughout.

- name: Guard — refuse to run with no inventory
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: control

- name: Configure this client to reach {{ dev_alias }} over Cloudflare
  hosts: control
  gather_facts: false

  vars:
    dev_alias: "{{ alias | default('infra-dev') }}"
    # DERIVED, and it is the same expression _dev-container-tunnel.yml uses to CREATE the
    # hostname — so a client block cannot name something the edge was never provisioned
    # under. The old default was the literal `infra-dev.gsrpi.uk`, which meant every
    # caller for every OTHER container had to pass a hostname that was, in all four
    # cases, its alias with the zone appended. An override still wins for the exception.
    #
    # `if … is defined`, NOT `| default(…)`, and the difference is not style. Jinja
    # evaluates `default()`'s ARGUMENT eagerly, so `hostname | default(dev_alias ~ '.' ~
    # dns_zone)` dies on an undefined `dns_zone` even when `-e hostname=` was given —
    # the override failing for the sake of a value it does not need. The conditional
    # form never evaluates the branch it does not take, so the escape hatch works on a
    # control node where the variable is missing, which is the one situation somebody
    # reaches for it. (`_dev-container-tunnel.yml`'s `zone | default(dns_zone)` does not
    # have the problem: a bare undefined passes through untouched when `zone` is set.)
    dev_hostname: "{{ hostname if hostname is defined else dev_alias ~ '.' ~ dns_zone }}"
    # lookup('env','HOME'), never ~. On Termux the passwd entry reports /data, which is
    # not writable — the same trap host_vars/localhost.yml already documents for
    # remote_tmp, and it fails here in exactly the same unhelpful way.
    home: "{{ lookup('env', 'HOME') }}"
    # Keyed on the alias, NOT a literal — one directory per container, so provisioning
    # or3-dev does not overwrite the token that reaches infra-dev.
    token_file: "{{ home }}/.config/{{ dev_alias }}/token"
    ssh_config: "{{ home }}/.ssh/config"
    ssh_key: "{{ identity | default('~/.ssh/id_ed25519') }}"
    # The verified path, set by the tasks below. No bare-name fallback: a bare
    # `cloudflared` resolves in your shell and then fails inside ssh's /bin/sh, which
    # presents as the tunnel being down.
    cloudflared: "{{ cfd_resolved }}"

    # ── the Windows half, which only exists when this runs in WSL ────────────
    # `-e windows_home=""` skips Windows entirely, paste file included. That is the one
    # knob; every fail_msg below names it.
    #
    # AN OVERRIDE HAS TO MOVE BOTH SPELLINGS. `-e windows_home=...` changes where WSL
    # writes; `windows_home_win` is what the config and the wrapper NAME, and it does not
    # follow. Pass both or a second Windows account gets files in its own home that point
    # at gavin's.
    #
    # TWO SPELLINGS OF EVERY PATH, STATED RATHER THAN DERIVED. One is how WSL reaches the
    # file, the other is how Windows names it inside the config and the wrapper. A
    # replace() chain over backslashes is clever, and clever is what put a bare
    # `cloudflared` into a ProxyCommand in the first place; _client-fleet-ssh.yml made the same
    # call for the same reason.
    windows_home_wsl: "{{ windows_home | default('/mnt/c/Users/gavin') }}"
    windows_home_win: 'C:\Users\gavin'
    windows_cloudflared: '"C:\Program Files (x86)\cloudflared\cloudflared.exe"'
    windows_cloudflared_wsl: "/mnt/c/Program Files (x86)/cloudflared/cloudflared.exe"

    win_ssh_config: "{{ windows_home_wsl }}/.ssh/config"
    win_token_file_wsl: "{{ windows_home_wsl }}/.config/{{ dev_alias }}/token"
    win_token_file: '{{ windows_home_win }}\.config\{{ dev_alias }}\token'
    win_wrapper_wsl: "{{ windows_home_wsl }}/.ssh/cf-access-{{ dev_alias }}.cmd"
    # No spaces in it, and therefore no quoting in the ssh_config line. Whether
    # Win32-OpenSSH hands a ProxyCommand to cmd.exe or spawns it directly is not a thing
    # to find out during a rescue, so neither quotes nor %USERPROFILE% appear there.
    win_wrapper: '{{ windows_home_win }}\.ssh\cf-access-{{ dev_alias }}.cmd'

    windows_out: "{{ home }}/ssh-dev-block-windows-{{ dev_alias }}.txt"

  tasks:
    # ── refuse a secret that arrived on the command line ────────────────────
    # FIRST, before anything is read or written. `st_client_secret` is never defined by
    # this play, so if it is defined at all it came from -e (or, less likely, from
    # inventory) — and either way it has already been through a shell. Failing here is
    # the only moment at which saying so is still useful.
    - name: Refuse a secret supplied on the command line
      tags: [always]
      ansible.builtin.assert:
        that: st_client_secret is not defined
        fail_msg: |
          The service token secret was passed as a variable. This play will not accept it
          that way, and the reason is not style: an -e value has already been through
          your shell, so it is in fish's history and was visible in the process list for
          the life of the run.

          Re-run with no -e for it. The play prompts, with echo off, and reads from the
          terminal — nothing about that reaches history or argv.

          Since it has now been typed once: close your other fish sessions (each holds
          its own in-memory history and writes it back on exit), then
              history delete --contains TUNNEL_SERVICE_TOKEN
          and grep the value itself out of ~/.local/share/fish/fish_history to confirm.
          If you would rather be certain than tidy, mint a new service token — it costs
          two playbook runs and nothing on zero or in the container ever held this one.
        success_msg: "no secret on the command line"

    # The templates, not the rendered text: that would check only the branches this
    # client's vars select, and the Windows-only ones are the ones that matter. Here,
    # before the token prompt, so a failure costs nothing typed and leaves nothing written.
    # "\r" is admitted for the reason _client-fleet-ssh.yml gives, and the paste
    # file's own wrapper lines are ASCII by hand, not by this.
    - name: Refuse a template that is not ASCII
      tags: [ssh]
      ansible.builtin.assert:
        that: lookup('file', '../templates/' ~ item) is not search('[^\t\n\r -~]')
        fail_msg: >-
          ansible/templates/{{ item }} has a character outside printable ASCII. Everything
          it renders reaches the laptop's Windows side, where the console codepage turns
          an em dash or a box-drawing rule into several characters of something else —
          and in the .cmd wrapper, into a command. Use -, --, or a row of - instead
          (docs/ssh-clients.md).
        quiet: true
      loop:
        - ssh-dev-block.j2
        - cf-access.cmd.j2

    # ── cloudflared has to be here, and it is the one thing this cannot install ──
    - name: Is cloudflared installed
      tags: [always]
      ansible.builtin.command: cloudflared --version
      register: cfd
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Where cloudflared is
      tags: [always]
      # An absolute path in the ProxyCommand rather than a bare name. ssh runs it through
      # /bin/sh, which inherits ssh's environment — and ssh is not always started from a
      # shell that has $PREFIX/bin on PATH. Discovered rather than hardcoded, so this
      # works on a laptop as well as in Termux.
      #
      # `shell`, not `command`: `command -v` is a SHELL BUILTIN, so the command module
      # has nothing to exec and reports cloudflared missing even where it is plainly on
      # PATH — the same bug fixed in _client-fleet-ssh.yml on 2026-08-23.
      ansible.builtin.shell: command -v cloudflared
      register: cfd_path
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Fail early and usefully if it is not
      tags: [always]
      # Before anything is written, so a client without the binary is not left holding a
      # token file and an ssh block that cannot work. Not installed by this play on
      # purpose: on the phone it is 35.7 MiB of METERED data, which is a spend the owner
      # approves rather than a side effect of running a playbook. or3's
      # docs/data-ledger.md carries the figure.
      #
      # IN WSL THIS IS THE ONE THAT CATCHES YOU. The laptop's cloudflared is a Windows
      # binary, and WSL's interop will not resolve it as `cloudflared` — only as
      # `cloudflared.exe`, and only if its directory is on the Windows PATH. So a laptop
      # that reaches zero perfectly well from PowerShell still needs a Linux cloudflared
      # in WSL for the WSL half of this play. The Windows half uses the Windows binary and
      # is checked separately, further down.
      ansible.builtin.assert:
        that: cfd.rc == 0
        fail_msg: |
          cloudflared is not on this machine, and it is required — an ssh:// tunnel
          ingress is not raw TCP at the edge, so only `cloudflared access ssh` can
          speak to it. There is no client-less path.

          It is a single static binary, 35.7 MiB, and on the phone that is METERED.
          Approve the spend, then:

            curl -fsSLo $PREFIX/bin/cloudflared \
              https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-arm64
            echo '7747d94570fb390cf47dcb4f9555c193c6355cda9793f0d878d9049e5d6a7790  '$PREFIX/bin/cloudflared | sha256sum -c -
            chmod +x $PREFIX/bin/cloudflared

          The hash is the one pinned in dev/Dockerfile, checked on 2026-08-22.

          In WSL it is the amd64 build and it goes somewhere on the Linux PATH —
          /usr/local/bin/cloudflared. The Windows cloudflared.exe does NOT satisfy this:
          `command -v cloudflared` will not find it, and the POSIX ProxyCommand written
          into ~/.ssh/config runs under WSL's /bin/sh, not under Windows.
        success_msg: "{{ cfd.stdout_lines[0] | default('cloudflared present') }}"

    - name: Settle on a path — an override wins, discovery is the fallback
      tags: [always]
      # Mirrors _client-fleet-ssh.yml. -e cloudflared_path=... beats detection, and the assert
      # below is on the RESULT either way, so a wrong override cannot slip through.
      ansible.builtin.set_fact:
        cfd_resolved: >-
          {{ cloudflared_path | default(cfd_path.stdout | trim, true) }}

    - name: Check the path we are about to write
      tags: [always]
      ansible.builtin.stat:
        path: "{{ cfd_resolved }}"
      register: cfd_stat
      when: cfd_resolved | length > 0

    - name: Refuse to write a block naming a cloudflared that is not there
      tags: [always]
      # Asserting that detection succeeded proves nothing about the string it produced;
      # asserting the file is there and executable proves the thing the ProxyCommand
      # actually needs.
      ansible.builtin.assert:
        that:
          - cfd_resolved | length > 0
          - cfd_stat.stat.exists | default(false)
          - cfd_stat.stat.executable | default(false)
        fail_msg: >-
          Could not establish an executable cloudflared on this client (resolved to
          '{{ cfd_resolved | default('') }}'). The ssh block's ProxyCommand runs it, and
          a block naming a missing binary looks exactly like the tunnel being down.
          Install it, or pass the path explicitly:
          -e cloudflared_path=/data/data/com.termux/files/usr/bin/cloudflared

    # ── are we in WSL, with the laptop's Windows home in reach? ──────────────
    # THE HOME DIRECTORY, NOT ITS ssh/config. _client-fleet-ssh.yml probes the config file
    # itself, which means a laptop that has never had one falls through to the paste
    # path even though the play could plainly have written it. Probing the home directory
    # and letting blockinfile create the file is strictly more correct, and it is now what
    # both plays do.
    - name: Is the laptop's Windows home reachable from here (i.e. are we in WSL)?
      tags: [always]
      ansible.builtin.stat:
        path: "{{ windows_home_wsl }}"
      register: win_home
      check_mode: false
      when: windows_home_wsl | length > 0

    - name: Settle whether the Windows half runs at all
      tags: [always]
      ansible.builtin.set_fact:
        on_windows_client: >-
          {{ (windows_home_wsl | length > 0)
             and (win_home.stat.exists | default(false))
             and (win_home.stat.isdir | default(false)) }}

    - name: Check the Windows cloudflared, as WSL sees it
      tags: [always]
      # Checkable, because WSL can see it. From Termux it is not, and the paste file
      # says so rather than implying the path was verified.
      ansible.builtin.stat:
        path: "{{ windows_cloudflared_wsl }}"
      register: win_cfd
      check_mode: false
      when: on_windows_client | bool

    - name: Refuse to write a Windows block naming a cloudflared that is not there
      tags: [always]
      # Before any Windows write, same as the POSIX assert above: a client left holding a
      # token and a wrapper that cannot run is worse than one left untouched.
      ansible.builtin.assert:
        that: win_cfd.stat.exists | default(false)
        fail_msg: >-
          {{ windows_home_wsl }} is a directory, so this looks like WSL with the laptop in
          reach — but {{ windows_cloudflared_wsl }} does not exist. The wrapper this play
          writes runs that binary on every tunnel alias, and a wrapper naming a missing
          one fails in a way that reads as the tunnel being down. Install cloudflared on
          Windows, or set -e windows_home="" to skip the Windows half.
      when: on_windows_client | bool

    # ── the service token ────────────────────────────────────────────────────
    - name: Does a token file already exist
      tags: [access]
      ansible.builtin.stat:
        path: "{{ token_file }}"
      register: tf
      check_mode: false

    - name: Does the Windows token file already exist
      tags: [access]
      ansible.builtin.stat:
        path: "{{ win_token_file_wsl }}"
      register: win_tf
      check_mode: false
      when: on_windows_client | bool

    - name: Decide whether a token is being set this run
      tags: [access]
      # Set one when either client is missing it. Otherwise leave both alone, so
      # re-running to fix an ssh block does not demand the secret again — which matters,
      # because a play that asks for a credential every time trains you to keep it
      # somewhere pasteable. -e replace_token=true is the deliberate override, for a
      # rotation.
      #
      # `| default(true)` on the Windows stat is what makes a Termux run behave: the task
      # above is skipped there, and a missing file must not be inferred from a skip.
      ansible.builtin.set_fact:
        setting_token: >-
          {{ (not tf.stat.exists)
             or ((on_windows_client | bool) and not (win_tf.stat.exists | default(true)))
             or (replace_token | default(false) | bool) }}

    # ── the escape hatch, for a container whose tunnel is not up yet ─────────
    - name: Say which container's token is being skipped, and why
      tags: [access]
      # changed_when: true for ansible.cfg's display_ok_hosts = False — a debug reports
      # ok, and this is the one line explaining why an alias has no token on this client.
      #
      # IT SKIPS THE TOKEN, NOT THE CONTAINER. Until 2026-10-02 this was followed by a
      # `meta: end_play`, because the ssh block's ProxyCommand sourced the token file
      # unconditionally and failed as "Connection closed" without it. The ProxyCommand now
      # checks for the file and names this play when it is missing, so the block is safe to
      # write without a token and is written either way — ssh config for every container,
      # Access credentials for the ones that have them.
      ansible.builtin.debug:
        msg: >-
          {{ dev_alias }}: no Access token at {{ token_file }}, and this run was told not
          to ask (-e prompt_for_token=false). Its ssh block is still written; `ssh
          {{ dev_alias }}` will say the token is missing until a run without the flag (or
          with client-home-ssh-config.yml --tags access -e only={{ dev_alias }}) is given one. A container that has
          no tunnel yet gets one from playbooks/server-create-dev-container.yml -e name={{ dev_alias }}.
      changed_when: true
      when:
        - setting_token | bool
        - not (prompt_for_token | default(true) | bool)

    - name: Settle whether this run asks for a token
      tags: [access]
      ansible.builtin.set_fact:
        asking_for_token: >-
          {{ (setting_token | bool) and (prompt_for_token | default(true) | bool)
             and not ansible_check_mode }}

    - name: Nothing to do for the token
      tags: [access]
      ansible.builtin.debug:
        msg: >-
          keeping the token already at {{ token_file }}{{
          ' and ' ~ win_token_file if on_windows_client | bool else '' }} — pass
          -e replace_token=true to replace it after a rotation.
      changed_when: true
      when: not (setting_token | bool)

    - name: What is about to be asked for
      tags: [access]
      # Printed separately because the two prompts below carry no_log, and a suppressed
      # prompt is a cursor sitting there with no explanation. This task says what is
      # wanted; the prompts just take it.
      #
      # IT NAMES THE CONTAINER, AND SO DO THE PROMPTS AND THE PLAY BANNER. client-home-ssh-config.yml
      # imports this play once per container, so without the alias in them you get four
      # identical banners and four identical `Client Secret` cursors and no way to tell
      # which one is being asked for — reported from the laptop, 2026-08-28. A prompt for
      # a credential has to say which credential.
      ansible.builtin.debug:
        msg:
          - "───────────────────────────────────────────────────────────────────────"
          - "{{ dev_alias | upper }} — the Access service token for {{ dev_hostname }}."
          - ""
          - "It is per CONTAINER, not per client, so it is the same pair every other"
          - "client already presents. Read it off one that has it:"
          - "    cat ~/.config/{{ dev_alias }}/token"
          - "Or from the Zero Trust dashboard, the token named {{ dev_alias }} — but the"
          - "secret is shown only at creation, so the dashboard cannot give it back."
          - ""
          - "The ID is not secret and will echo. The secret will not echo."
          - "LEAVE BOTH BLANK to skip it: no token is written, and its ssh block still is."
          - "Neither reaches your shell history: these are read from the terminal, not"
          - "from the command line."
          - "{{ 'Written for BOTH sides of this laptop: WSL and Windows.'
                if on_windows_client | bool else 'Written for this client only.' }}"
          - "───────────────────────────────────────────────────────────────────────"
      changed_when: true
      when: asking_for_token | bool

    - name: Read {{ dev_alias }}'s Client ID
      tags: [access]
      # echo on — the ID is the username half and is not a credential. It can also come
      # from -e st_client_id=..., which is why this is skipped when it is already set.
      ansible.builtin.pause:
        prompt: "  {{ dev_alias }}  Client ID"
        echo: true
      register: id_in
      when: (asking_for_token | bool) and st_client_id is not defined

    - name: Read {{ dev_alias }}'s Client Secret
      tags: [access]
      # THE ONE THAT CANNOT COME FROM THE COMMAND LINE. `pause` is a task, so it always
      # runs and there is no variable name for -e to pre-empt — which is exactly what
      # vars_prompt could not promise. echo: false so it is not on screen either.
      #
      # no_log because the registered result holds user_input verbatim, and `-v` would
      # otherwise print it. That is the same leak in a different costume.
      ansible.builtin.pause:
        prompt: "  {{ dev_alias }}  Client Secret (not echoed)"
        echo: false
      register: secret_in
      no_log: true
      when: asking_for_token | bool

    - name: Settle what was typed — both blank is a skip, not a mistake
      tags: [access]
      # A CONTAINER THAT IS NOT UP HAS NO TOKEN TO GIVE, and client-home-ssh-config.yml asks for
      # all four in one run. Pressing Enter twice is the answer available at that prompt,
      # so it means "skip this one": no token is written, the run goes on to the next
      # container, and the ssh block is written regardless (it says so when used). Asked
      # for on 2026-10-02, after a composed run stopped at a blank prompt for a container
      # that is not up.
      ansible.builtin.set_fact:
        token_id_typed: "{{ st_client_id | default(id_in.user_input | default(''), true) | trim }}"
        token_blank: >-
          {{ (st_client_id | default(id_in.user_input | default(''), true) | trim | length == 0)
             and (secret_in.user_input | default('') | trim | length == 0) }}
      when: asking_for_token | bool

    - name: Say that it was skipped
      tags: [access]
      ansible.builtin.debug:
        msg: >-
          SKIPPED {{ dev_alias }}'s Access token — both halves left blank. Nothing written
          to {{ token_file }}{{ ' (the token already there is kept)' if tf.stat.exists | default(false) else '' }};
          the ssh block is still written. Once its tunnel exists:
          client-home-ssh-config.yml --tags access -e only={{ dev_alias }}.
      changed_when: true
      when: (asking_for_token | bool) and (token_blank | bool)

    - name: One half blank is a mistake — refuse it
      tags: [access]
      # An empty secret writes a file that fails Access with no clue why, and the failure
      # presents as the tunnel being broken. Catch it here, where the cause is on screen.
      # BOTH blank is the skip above; exactly one blank is a slip of the finger.
      ansible.builtin.assert:
        that:
          - token_id_typed | length > 0
          - (secret_in.user_input | default('') | trim) | length > 0
        fail_msg: >-
          {{ dev_alias }}: one of the Client ID and the Client Secret was blank and the other
          was not. Nothing has been written. Leave BOTH blank to skip this container.
          Cloudflare shows a service token's secret only at creation; if it is lost, mint a
          new token rather than guessing.
        success_msg: "both halves present"
      when: (asking_for_token | bool) and not (token_blank | bool)
      # NO no_log HERE, deliberately, and it used to be on. `assert` is an action plugin:
      # it evaluates `that` itself and never templates those values into module args, so
      # the registered result holds the expression TEXT and a boolean — no secret. What
      # no_log did instead was censor this task's own fail_msg, replacing the message
      # written for the moment a blank secret is typed with "the output has been hidden".
      # That is the trap CLAUDE.md records from the service-token play, in a smaller
      # costume: a no_log that hides the failure it exists to explain. It stays on the
      # `pause` and on both `copy` tasks, where it guards an actual value.

    - name: Settle whether a token is written this run
      tags: [access]
      ansible.builtin.set_fact:
        writing_token: "{{ (asking_for_token | bool) and not (token_blank | bool) }}"

    - name: The directory for it
      tags: [access]
      ansible.builtin.file:
        path: "{{ token_file | dirname }}"
        state: directory
        mode: "0700"
      when: writing_token | bool

    - name: Write the token, mode 600
      tags: [access]
      # A SOURCEABLE FILE, not a shell profile and not the ssh config, and the choice is
      # the point of this play:
      #
      #   - not `set -gx` in fish's conf.d: that puts a live credential in the
      #     environment of EVERY process this account starts, for the sake of one command
      #     that runs when you ssh.
      #   - not in the ProxyCommand: a secret on a command line is a secret in ps output
      #     and in shell history. This repo has a rule about that — CLAUDE.md, secrets
      #     never in command_args — and it does not stop applying on the client side.
      #   - not in ~/.ssh/config: that file is routinely pasted, diffed and shared when
      #     something is wrong with it.
      #
      # Sourced by the ProxyCommand below, so the secret is in the environment of exactly
      # one short-lived cloudflared process and nothing else. POSIX sh syntax, because
      # ProxyCommand runs under /bin/sh whatever your login shell is — fish syntax here
      # would fail with a message about `set` that names neither this file nor ssh.
      ansible.builtin.copy:
        dest: "{{ token_file }}"
        mode: "0600"
        content: |
          # Cloudflare Access service token for {{ dev_hostname }}.
          # Written by ansible/playbooks/client-home-ssh-config.yml. Sourced by ~/.ssh/config's
          # ProxyCommand for host `{{ dev_alias }}`. POSIX sh — not fish.
          TUNNEL_SERVICE_TOKEN_ID={{ token_id_typed }}
          TUNNEL_SERVICE_TOKEN_SECRET={{ secret_in.user_input | trim }}
          export TUNNEL_SERVICE_TOKEN_ID TUNNEL_SERVICE_TOKEN_SECRET
      when: writing_token | bool
      no_log: true

    # ── the same token, on the Windows side of the same laptop ───────────────
    - name: The Windows directory for it
      tags: [access]
      ansible.builtin.file:
        path: "{{ win_token_file_wsl | dirname }}"
        state: directory
      # NO mode. /mnt/c is drvfs and does not carry Unix permissions unless mounted with
      # metadata; setting one either fails or silently does nothing, and a task that
      # pretends to have set a mode is worse than one that does not try.
      when: (on_windows_client | bool) and (writing_token | bool)

    - name: Write the Windows token
      tags: [access]
      # A DIFFERENT FILE FROM THE WSL ONE, because %USERPROFILE% and WSL's $HOME are two
      # different homes on two different filesystems. Two copies of the secret on one
      # laptop is the cost of Windows ssh not being able to read the Linux one, and it is
      # stated here rather than discovered later.
      #
      # No `export`, and comments the wrapper's findstr will skip: this file is read by
      # cf-access-<alias>.cmd, not sourced by a shell. LF endings — findstr emits its own
      # line terminators to the `for /f` that consumes it, so the endings here never reach
      # the parser.
      ansible.builtin.copy:
        dest: "{{ win_token_file_wsl }}"
        content: |
          # Cloudflare Access service token for {{ dev_hostname }}.
          # Written by ansible/playbooks/client-home-ssh-config.yml, running in WSL. Read by
          # {{ win_wrapper }} — this file is NOT a shell script and is not sourced.
          #
          # PERMISSIONS HERE ARE NTFS, NOT A UNIX MODE. Ansible cannot set a mode on
          # /mnt/c and does not pretend to; what protects this file is the ACL that
          # C:\Users\gavin hands down. The play prints that ACL when it writes this file.
          TUNNEL_SERVICE_TOKEN_ID={{ token_id_typed }}
          TUNNEL_SERVICE_TOKEN_SECRET={{ secret_in.user_input | trim }}
      when: (on_windows_client | bool) and (writing_token | bool)
      no_log: true

    - name: Read the Windows ACL on the token we just wrote
      tags: [access]
      # Windows' own tool, reached through WSL interop. `command`, so the path is an
      # argument and no shell is involved — and nothing secret is on this command line,
      # only the name of the file.
      #
      # failed_when: false because interop can be switched off, and a laptop whose ACLs
      # cannot be read is not a reason to fail a run that has already written the file.
      ansible.builtin.command:
        argv:
          - /mnt/c/Windows/System32/icacls.exe
          - "{{ win_token_file }}"
      register: win_acl
      changed_when: false
      failed_when: false
      check_mode: false
      when: (on_windows_client | bool) and (writing_token | bool)

    - name: Who can read the Windows token
      tags: [access]
      # A DISPLAY, NOT A VERDICT, and the distinction is deliberate. This repo's rule is
      # that a check is calibrated against known-good state before its verdict is
      # trusted; nothing here can see that laptop, the account names icacls prints are
      # localised, and an assertion built on a guess about either would be the "check
      # that passes for the wrong reason" this repo keeps re-learning about. So it prints
      # and the owner reads it once.
      #
      # changed_when: true because ansible.cfg sets display_ok_hosts = False, and a debug
      # task reports ok — which is how the Access service token banner went unprinted in
      # August. A message that exists to be read has to be marked changed to be seen.
      ansible.builtin.debug:
        msg: "{{ win_acl.stdout | default('') | trim if (win_acl.rc | default(1)) == 0 else acl_unreadable }}"
      vars:
        acl_unreadable: >-
          could not read the ACL (icacls exited {{ win_acl.rc | default('n/a') }}) — WSL
          interop may be off. The token IS written. Check by hand, in PowerShell:
          icacls "{{ win_token_file }}"
      changed_when: true
      when: (on_windows_client | bool) and (writing_token | bool)

    # ── can this client corroborate the identity it would name? ──────────────
    # `IdentitiesOnly yes` is worth having: it stops ssh walking every key an agent holds
    # and hitting MaxAuthTries before reaching the right one. But it is only safe
    # alongside an IdentityFile that EXISTS, because with it set ssh offers an agent key
    # only when its public half matches a named file. On a client whose private key lives
    # in an agent — Windows' OpenSSH agent reached from WSL is the case that found this —
    # neither ~/.ssh/id_ed25519 nor its .pub is on the Linux side, so the pair we wrote
    # left ssh nothing to offer and the container answered "Permission denied (publickey)".
    #
    # Either half is enough: ssh can use the .pub alone to ask the agent for that identity.
    - name: Is there a private key at the path the block would name
      tags: [ssh]
      ansible.builtin.stat:
        path: "{{ ssh_key | regex_replace('^~', home) }}"
      register: idf
      check_mode: false
      when: ssh_key | length > 0

    - name: Is there at least a public key there
      tags: [ssh]
      ansible.builtin.stat:
        path: "{{ (ssh_key | regex_replace('^~', home)) ~ '.pub' }}"
      register: idpub
      check_mode: false
      when: ssh_key | length > 0

    - name: Refuse an identity that was named explicitly and is not there
      tags: [ssh]
      # An explicit -e identity=... that does not resolve is a typo, not an agent client.
      # Guessing past it would write a block that cannot authenticate and say nothing.
      ansible.builtin.assert:
        that: (idf.stat.exists | default(false)) or (idpub.stat.exists | default(false))
        fail_msg: >-
          -e identity={{ ssh_key }} was given, but neither that file nor its .pub exists on
          this client. Point it at a real key, or pass -e identity="" to omit IdentityFile
          and IdentitiesOnly entirely, which is what an agent-only client wants.
      when:
        - identity is defined
        - ssh_key | length > 0

    # The same question for the WINDOWS side, which is a different file: `~` there is
    # C:\Users\gavin, not WSL's home, and the two have different keys on this laptop.
    - name: Is there a key on the Windows side
      tags: [ssh]
      ansible.builtin.stat:
        path: "{{ windows_home_wsl }}/.ssh/{{ ssh_key | basename }}"
      register: win_idf
      check_mode: false
      when:
        - on_windows_client | bool
        - ssh_key | length > 0

    - name: Is there at least a public key on the Windows side
      tags: [ssh]
      ansible.builtin.stat:
        path: "{{ windows_home_wsl }}/.ssh/{{ ssh_key | basename }}.pub"
      register: win_idpub
      check_mode: false
      when:
        - on_windows_client | bool
        - ssh_key | length > 0

    - name: Settle whether either block names an identity at all
      tags: [ssh]
      ansible.builtin.set_fact:
        identity_usable: >-
          {{ (ssh_key | length > 0)
             and ((idf.stat.exists | default(false)) or (idpub.stat.exists | default(false))) }}
        win_identity_usable: >-
          {{ (ssh_key | length > 0)
             and ((win_idf.stat.exists | default(false)) or (win_idpub.stat.exists | default(false))) }}

    - name: Say so when it does not
      tags: [ssh]
      ansible.builtin.debug:
        msg: >-
          No IdentityFile or IdentitiesOnly in {{ dev_alias }}'s block: this client has
          neither {{ ssh_key }} nor its .pub, so its keys come from an agent or ssh's own
          discovery. Naming a missing file alongside IdentitiesOnly is what produces
          "Permission denied (publickey)" with nothing offered.
      changed_when: true
      when: not (identity_usable | bool)

    # ── the ssh config block, on this client ─────────────────────────────────
    - name: Make sure ~/.ssh exists
      tags: [ssh]
      ansible.builtin.file:
        path: "{{ home }}/.ssh"
        state: directory
        mode: "0700"

    - name: Does ~/.ssh/config have CRLF line endings
      tags: [ssh]
      # LF throughout, before any blockinfile below touches the file, on both sides of a
      # laptop. In a CRLF file blockinfile cannot match its own markers (it compares
      # against marker + "\n"), so it writes a second block under the first and ssh reads
      # the stale one. Why LF and not CRLF, why grep and sed rather than `replace`, and
      # why grep's "\r$" must stay double-quoted: the same tasks in
      # _client-fleet-ssh.yml.
      ansible.builtin.command:
        argv: [grep, -qs, "\r$", "{{ ssh_config }}"]
      register: posix_crlf
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Convert ~/.ssh/config to LF, so blockinfile can find its markers
      tags: [ssh]
      ansible.builtin.command:
        argv: [sed, -i, --follow-symlinks, 's/\r$//', "{{ ssh_config }}"]
      when: posix_crlf.rc == 0

    - name: Say that a --check diff of a CRLF ~/.ssh/config is not what the real run writes
      tags: [ssh]
      ansible.builtin.debug:
        msg: >-
          {{ ssh_config }} has CRLF line endings. A real run converts it to LF first; this
          dry run cannot, so the diff below shows the {{ dev_alias }} block ADDED under
          the existing one. The real run edits it in place.
      changed_when: true
      when:
        - ansible_check_mode
        - posix_crlf.rc == 0

    - name: Drop the {{ dev_alias }} blocks written under markers this play no longer uses
      tags: [ssh]
      # THE MARKER NAMES THE PLAYBOOK, so every rename changes the key blockinfile finds
      # its block by: dev-client.yml -> configure-client-dev.yml on 2026-08-29, and
      # configure-client-dev.yml -> client-home-ssh-config.yml (the play you actually
      # run) on 2026-10-04. After the first one, every client provisioned before it kept
      # the old block, and the next run did not edit it — it inserted a second one BELOW
      # it, above `Host *`. ssh takes the first value it obtains, so the stale block's
      # RemoteCommand (`abduco -A claude claude`) and its ProxyCommand, which never
      # checked the token was there, won — while the config visibly held the right ones
      # further down. Found on the phone 2026-10-03, as `ssh infra-dev` never showing
      # the door. CLAUDE.md § Repo invariants: a rename carries an absent row for its
      # old marker, and the list only grows.
      #
      # `create: true` creates nothing here: with state=absent and no file, blockinfile
      # returns "File not present". Without it, a fresh client fails rc=257 on a removal.
      ansible.builtin.blockinfile:
        path: "{{ ssh_config }}"
        create: true
        state: absent
        marker: "{{ item }}"
      loop:
        - "# {mark} {{ dev_alias }} (ansible/playbooks/dev-client.yml)"
        - "# {mark} {{ dev_alias }} (ansible/playbooks/configure-client-dev.yml)"

    - name: The {{ dev_alias }} block in ~/.ssh/config
      tags: [ssh]
      # blockinfile, so re-running edits the block in place instead of appending a second
      # copy — which ssh would not error on, it would just silently use the first.
      #
      # insertbefore, NOT the default append: ssh takes the FIRST value it obtains for
      # each keyword, so a `Host *` block already in this file would win over anything
      # appended after it.
      #
      # ABOVE `Host *`, NOT AT THE TOP OF THE FILE, and the difference is not cosmetic.
      # The anchor here was BOF until 2026-08-25, which is a stronger claim than the
      # requirement: what a specific host needs is to precede the wildcard, and BOF also
      # made it precede everything a human had written. The phone's own header — the file
      # title and its ORDERING RULE, the thing you read first when something is wrong with
      # this file — ended up below two generated blocks, and every dev container
      # provisioned after that would have pushed it down again. `Host *` is the anchor
      # _client-fleet-ssh.yml has always used; both plays now agree, and a hand-kept header stays
      # where its author put it.
      #
      # If `Host *` is absent, blockinfile appends, which is correct for a file that has
      # no defaults section to lose to.
      ansible.builtin.blockinfile:
        path: "{{ ssh_config }}"
        mode: "0600"
        create: true
        insertbefore: '^Host \*\s*$'
        # The marker names the play you RE-RUN, not this imported half: it is what a
        # person reading ~/.ssh/config needs, and it is the key the absent task above has
        # to be told about the next time it changes.
        marker: "# {mark} {{ dev_alias }} (ansible/playbooks/client-home-ssh-config.yml)"
        block: "{{ lookup('template', '../templates/ssh-dev-block.j2') }}"
      vars:
        # identity_named, NOT identity_usable, and the rename is the whole fix.
        # `set_fact` outranks task `vars:` in Ansible's precedence — 19 against 15 — so a
        # task var sharing a fact's name is silently ignored, and BOTH blocks rendered
        # with the POSIX client's answer. The Windows side of this laptop has a key file
        # where WSL does not, so that was the wrong answer for one of them. A name the
        # play never set_facts cannot be shadowed.
        #
        # `| bool` in the template because set_fact turns "True"/"False" into real
        # booleans while a task var stays a string, and a non-empty string is truthy.
        windows: false
        identity_named: "{{ identity_usable }}"
        identity_path: "{{ ssh_key }}"

    # ── and on the Windows side of the same laptop ───────────────────────────
    - name: Make sure the laptop's %USERPROFILE%\.ssh exists
      tags: [ssh]
      # `template` DOES NOT CREATE PARENT DIRECTORIES, and this task runs before the
      # blockinfile that would. Without it, a laptop that has never had an ssh config
      # dies here — after the POSIX block is already written, which is the half-
      # provisioned state every assert in this play is arranged to avoid. `--check` does
      # not predict it either: blockinfile's own makedirs is skipped in check mode and
      # template merely diffs, so the advertised dry run passes and the real one fails.
      #
      # No mode, for the drvfs reason the .config directory task carries.
      ansible.builtin.file:
        path: "{{ windows_home_wsl }}/.ssh"
        state: directory
      when: on_windows_client | bool

    - name: The ProxyCommand wrapper Windows needs instead of `sh -c`
      tags: [ssh]
      # newline_sequence IS THE POINT OF THIS TASK. cmd.exe seeks by byte offset between
      # commands in a batch file and miscounts on an LF-only one, resuming mid-line and
      # running fragments of the comments as commands — a burst of `'ible' is not
      # recognized as an internal or external command`, from the middle of the word
      # "ansible". Found on the laptop 2026-08-28, against a header comment of mine
      # asserting LF was fine here. Nothing in this control plane can run cmd.exe, so
      # that claim was never checkable and should not have been made.
      #
      # Two other spellings were tried and are recorded so nobody repeats them: a
      # `replace('\n', '\r\n')` filter on a lookup silently does nothing, and CRLF in the
      # template file itself survives only while the file has no Jinja in it — the lexer
      # normalises newlines once it does. This parameter is the mechanism the module
      # actually provides, and it leaves the template an ordinary LF file like every
      # other one in the repo.
      ansible.builtin.template:
        src: ../templates/cf-access.cmd.j2
        dest: "{{ win_wrapper_wsl }}"
        newline_sequence: "\r\n"
      # No mode, for the drvfs reason above. The wrapper holds no secret — it names the
      # file that does — so inherited ACLs are the right protection for it anyway.
      when: on_windows_client | bool

    - name: Does the laptop's Windows ssh config have CRLF line endings
      tags: [ssh]
      # The same conversion as for ~/.ssh/config above, for the laptop's Windows file;
      # what drvfs prints while it runs is in _client-fleet-ssh.yml.
      ansible.builtin.command:
        argv: [grep, -qs, "\r$", "{{ win_ssh_config }}"]
      register: win_crlf
      changed_when: false
      failed_when: false
      check_mode: false
      when: on_windows_client | bool

    - name: Convert the laptop's Windows ssh config to LF, so blockinfile can find its markers
      tags: [ssh]
      ansible.builtin.command:
        argv: [sed, -i, --follow-symlinks, 's/\r$//', "{{ win_ssh_config }}"]
      when:
        - on_windows_client | bool
        - win_crlf.rc | default(1) == 0

    - name: Say that a --check diff of a CRLF file is not what the real run writes
      tags: [ssh]
      # The sed above is skipped under --check, so the diffs below are of the CRLF file.
      ansible.builtin.debug:
        msg: >-
          {{ win_ssh_config }} has CRLF line endings. A real run converts it to LF first;
          this dry run cannot, so the diff below shows the {{ dev_alias }} block ADDED
          under the existing one. The real run edits it in place.
      changed_when: true
      when:
        - ansible_check_mode
        - on_windows_client | bool
        - win_crlf.rc | default(1) == 0

    - name: Drop the pre-rename {{ dev_alias }} block from the laptop's Windows ssh config
      tags: [ssh]
      # The same stale block, the same reason, the same first-value-wins loss — see the
      # task that drops it from ~/.ssh/config above.
      ansible.builtin.blockinfile:
        path: "{{ win_ssh_config }}"
        create: true
        state: absent
        marker: "{{ item }}"
      loop:
        - "# {mark} {{ dev_alias }} (ansible/playbooks/dev-client.yml)"
        - "# {mark} {{ dev_alias }} (ansible/playbooks/configure-client-dev.yml)"
      when: on_windows_client | bool

    - name: The {{ dev_alias }} block in the laptop's Windows ssh config
      tags: [ssh]
      # Same marker as the WSL block, in a different file. Two clients, two configs,
      # neither aware of the other — and the same insertbefore rule, because Windows ssh
      # reads its config with exactly the same first-value-wins semantics.
      ansible.builtin.blockinfile:
        path: "{{ win_ssh_config }}"
        create: true
        insertbefore: '^Host \*\s*$'
        marker: "# {mark} {{ dev_alias }} (ansible/playbooks/client-home-ssh-config.yml)"
        block: "{{ lookup('template', '../templates/ssh-dev-block.j2') }}"
      vars:
        windows: true
        identity_named: "{{ win_identity_usable }}"
        # THE BASENAME, under Windows' own ~/.ssh — not ssh_key verbatim. `~` there is
        # C:\Users\gavin, a different home with different keys, and the existence check
        # above already looks for the basename there. Writing a Linux path into the
        # Windows block would name a file that machine does not have, while the check
        # that passed had looked at a different one. Only bites with -e identity=<a
        # custom path>; the default resolves to the same string either way.
        identity_path: "~/.ssh/{{ ssh_key | basename }}"
      when: on_windows_client | bool

    # ── fallback for a control node that cannot see the laptop — Termux ──────
    - name: Otherwise render the Windows block and wrapper to a file, to paste
      tags: [ssh]
      # Only written when the direct write did not happen, so there is never a stale paste
      # file sitting beside a managed one, inviting somebody to paste the older of the
      # two.
      #
      # THE TOKEN IS NOT IN HERE, and that is not an omission. A secret in a file the
      # owner will open, read and copy out of is a secret in scrollback, which is the one
      # place CLAUDE.md says it must never be. The steps below have them type it into the
      # file directly instead.
      ansible.builtin.copy:
        dest: "{{ windows_out }}"
        mode: "0600"
        content: |
          # The Windows half of `{{ dev_alias }}`, for a laptop this control node cannot see.
          # Generated by ansible/playbooks/client-home-ssh-config.yml - edit the templates, not this.
          #
          # RUNNING THIS PLAY FROM WSL DOES ALL OF IT FOR YOU, and checks the cloudflared
          # path first. This file exists for when that is not possible. The paths below
          # are NOT verified: this machine cannot see that filesystem.
          #
          # -- 1. the token, typed rather than pasted from here -------------------
          # In PowerShell. Do NOT put the secret in this file or in a command argument.
          #
          #     mkdir -Force "$env:USERPROFILE\.config\{{ dev_alias }}" | Out-Null
          #     mkdir -Force "$env:USERPROFILE\.ssh" | Out-Null
          #     notepad "{{ win_token_file }}"
          #
          # Two lines, no quotes, no `export`:
          #
          #     TUNNEL_SERVICE_TOKEN_ID=<the id>
          #     TUNNEL_SERVICE_TOKEN_SECRET=<the secret>
          #
          # Then read who can see it, and expect only you, Administrators and SYSTEM:
          #
          #     icacls "{{ win_token_file }}"
          #
          # -- 2. the wrapper, at {{ win_wrapper }} -------------------
          # ---8<--- cf-access-{{ dev_alias }}.cmd ---8<---
          {{ lookup('template', '../templates/cf-access.cmd.j2') }}
          # ---8<--- end ---8<---
          #
          # -- 3. this block, in %USERPROFILE%\.ssh\config, ABOVE its `Host *` ----
          # BEGIN {{ dev_alias }} (ansible/playbooks/client-home-ssh-config.yml)
          {{ lookup('template', '../templates/ssh-dev-block.j2') }}
          # END {{ dev_alias }} (ansible/playbooks/client-home-ssh-config.yml)
      vars:
        windows: true
        identity_named: "{{ win_identity_usable }}"
        # THE BASENAME, under Windows' own ~/.ssh — not ssh_key verbatim. `~` there is
        # C:\Users\gavin, a different home with different keys, and the existence check
        # above already looks for the basename there. Writing a Linux path into the
        # Windows block would name a file that machine does not have, while the check
        # that passed had looked at a different one. Only bites with -e identity=<a
        # custom path>; the default resolves to the same string either way.
        identity_path: "~/.ssh/{{ ssh_key | basename }}"
      when:
        - windows_home_wsl | length > 0
        - not (on_windows_client | bool)

    - name: Is there a token now — the answer the summary below gives
      tags: [always]
      # Read again rather than inferred from this run's choices: under --tags ssh none of
      # those ran, and the file may have come from an earlier run. Same for the block and
      # the Windows token below — the summary states what is on disk, not what this run
      # meant to do, because under --tags access no block was written and under --tags ssh
      # no Windows token was.
      ansible.builtin.stat:
        path: "{{ token_file }}"
      register: token_now
      check_mode: false

    - name: Is there a block now
      tags: [always]
      ansible.builtin.command:
        argv: [grep, -qF, "# BEGIN {{ dev_alias }} (ansible/playbooks/client-home-ssh-config.yml)", "{{ ssh_config }}"]
      register: block_now
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Is there a Windows token now
      tags: [always]
      ansible.builtin.stat:
        path: "{{ win_token_file_wsl }}"
      register: win_token_now
      check_mode: false
      when: on_windows_client | bool

    - name: How to use it
      tags: [always]
      ansible.builtin.debug:
        msg:
          - "ssh {{ dev_alias }}         the claude-sessions menu, over Cloudflare"
          - "ssh {{ dev_alias }} <cmd>   runs it in ~ (in-workspace <cmd> for /workspace); scp/sftp/Zed too"
          - "ssh -t {{ dev_alias }} in-workspace   a login shell in /workspace"
          - "    no -lan alias: break glass by hand with `ssh <host>` and then"
          - "    `ssh -p <port> dev@127.0.0.1`, ports in client-home-ssh-config.yml."
          - ""
          - "wsl/posix: block {{ ('in ' ~ ssh_config) if block_now.rc == 0 else ('NOT in ' ~ ssh_config ~ ' — run with --tags ssh') }}; token {{ ('at ' ~ token_file ~ ' (0600), sourced by the ProxyCommand, so it reaches one cloudflared and no other environment') if token_now.stat.exists | default(false) else ('NOT on this client, so ssh ' ~ dev_alias ~ ' says so and stops: client-home-ssh-config.yml --tags access -e only=' ~ dev_alias ~ ' adds it') }}."
          - ""
          - >-
            windows: {{ 'managed directly — block in ' ~ win_ssh_config ~ ', wrapper at '
            ~ win_wrapper ~ ', token ' ~ (('at ' ~ win_token_file ~ ' (NTFS ACL)')
                if win_token_now.stat.exists | default(false) else 'NOT written yet')
            if on_windows_client | bool
            else ('skipped — windows_home is empty' if windows_home_wsl | length == 0
                  else 'not reachable from here — follow ' ~ windows_out) }}
          - ""
          - "the fleet block is still worth running first on a new client, on both sides"
          - "of a laptop: `ssh <host>` is the first half of the break-glass hop."
      changed_when: true
