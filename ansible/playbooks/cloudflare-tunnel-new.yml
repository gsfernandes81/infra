---
# 2g, phase 1 of 3: create a LOCALLY-MANAGED tunnel alongside the existing one.
#
#   1. cloudflare-tunnel-new.yml      <- you are here. Nothing serves differently.
#   2. cloudflare-tunnel-cutover.yml     repoints DNS and swaps the service.
#   3. cloudflare-tunnel-retire.yml      deletes the old tunnel.
#
# WHY A NEW TUNNEL AT ALL. `config_src` is create-time only: PATCHing it on an existing
# tunnel is rejected (tried 2026-08-23, `1002 Tunnel not found`, on a URL where GET works
# and where PATCH with tunnel_secret had succeeded an hour earlier). So a tunnel whose
# routes live in this repo has to be a new one, and its CNAMEs have to be repointed.
#
# NOTHING HERE SERVES TRAFFIC. The new tunnel has no DNS aimed at it, so it can be
# created, inspected and deleted with no effect on anything. That is the whole point of
# splitting it out: the irreversible-feeling step is phase 2, and this is not it.
#
#   ansible-playbook playbooks/cloudflare-tunnel-new.yml -e target=one -K
#
# -K IS REQUIRED. ansible.cfg sets become_ask_pass = False on purpose — `gavin` has no
# NOPASSWD sudo and roadmap.md's "Not doing" list keeps it that way — so a play needing
# root asks for it explicitly. Two tasks here do: reading the existing credentials (0600
# root) and writing the new ones. You will be asked for the sudo password AND the API
# token, in that order.
#
# THE API TOKEN IS PROMPTED AND NEVER STORED, and every `uri` task is delegated to the
# control node so it is never sent to a Pi. management-plane.md: "The API token goes
# nowhere — prompted, in memory, for one run."

- name: Create a locally-managed tunnel for one host
  hosts: "{{ target | default('one') }}"
  gather_facts: false

  vars_prompt:
    - name: cf_api_token
      prompt: |
        Cloudflare API token (My Profile -> API Tokens, NOT an Access service token).
        Needs Account -> Cloudflare Tunnel -> Edit, and nothing else for this phase
      private: true

  vars:
    cf_api: "https://api.cloudflare.com/client/v4"
    repo_root: "{{ playbook_dir }}/../.."
    cred_file: "/etc/cloudflared/{{ inventory_hostname }}.json"
    new_cred_file: "/etc/cloudflared/{{ inventory_hostname }}-new.json"
    metrics_probe: "http://127.0.0.1:20241"

  tasks:
    # ── read where we are, from the box rather than from anyone's memory ──────
    - name: Read the existing credentials
      ansible.builtin.slurp:
        src: "{{ cred_file }}"
      register: cred_raw
      become: true

    # ── refuse to run twice ────────────────────────────────────────────────────
    # The new credentials file existing means phase 1 already ran on this host. A re-run
    # creates a second orphan tunnel, overwrites the reviewed repo config, and — worst —
    # overwrites ~/.infra-2g-baseline-<host>.json with CURRENT state, which after a
    # cutover records the outage as the baseline: the exact corruption the baseline
    # exists to prevent.
    - name: Check whether phase 1 already left credentials here
      ansible.builtin.stat:
        path: "{{ new_cred_file }}"
      register: new_cred_stat
      become: true

    - name: Refuse a re-run unless it was asked for by name
      ansible.builtin.assert:
        that: force | default(false) | bool
        fail_msg: >-
          {{ new_cred_file }} exists — phase 1 already ran here. A re-run creates a
          second orphan tunnel, overwrites the reviewed repo config, and overwrites the
          saved baseline at ~/.infra-2g-baseline-{{ inventory_hostname }}.json with
          current state — after a cutover, that records the outage as the baseline.
          Override with -e force=true.
      when: new_cred_stat.stat.exists

    - name: Pull out the account and the OLD tunnel id
      ansible.builtin.set_fact:
        cf_account: "{{ (cred_raw.content | b64decode | from_json).AccountTag }}"
        old_tunnel: "{{ (cred_raw.content | b64decode | from_json).TunnelID }}"

    - name: Show what we are working from
      ansible.builtin.debug:
        msg: "account {{ cf_account }}, existing tunnel {{ old_tunnel }}"
      changed_when: true

    # ── capture the ingress the edge is serving RIGHT NOW ─────────────────────
    # From the connector, not from the dashboard and not from this repo. On zero the
    # repo's idea of the ingress was wrong for most of a day and nothing caught it,
    # because a local copy that is ignored looks identical to one that is in force.
    - name: Capture the live ingress from the running connector
      ansible.builtin.uri:
        url: "{{ metrics_probe }}/config"
        return_content: true
      register: live_cfg

    # `.content | from_json`, NOT `.json`. The uri module only populates `.json` when the
    # response carries a JSON content-type, and cloudflared's metrics endpoint does not
    # set one — so `.json` is simply absent and the error names the wrong thing.
    - name: Parse what the connector is serving
      ansible.builtin.set_fact:
        live_ingress: "{{ (live_cfg.content | from_json).config.ingress }}"

    - name: Refuse to proceed on a connector that is not serving rules
      ansible.builtin.assert:
        that: live_ingress | length > 1
        fail_msg: >-
          {{ inventory_hostname }}'s connector reports {{ live_ingress | length }} ingress
          rules. That is the catch-all alone or nothing at all — there is no configuration
          here worth copying, and something is wrong that this play should not paper over.

    # The template drops originRequest entirely. That was safe on zero and one only
    # because every rule happened to carry the default, and two's tunnel is the one
    # nobody has ever inspected — a silently dropped noTLSVerify or httpHostHeader
    # breaks the service after cutover with nothing in the diff to show why. The
    # catch-all's originRequest IS the tunnel default, so any rule differing from it
    # carries per-rule settings the rendered config cannot represent.
    - name: Compare each rule's originRequest against the catch-all's
      ansible.builtin.set_fact:
        origin_mismatches: >-
          {%- set ns = namespace(base={}, bad=[]) -%}
          {%- for r in live_ingress if (r.hostname | default('')) == '' -%}
            {%- set ns.base = r.originRequest | default({}) -%}
          {%- endfor -%}
          {%- for r in live_ingress if (r.hostname | default('')) != '' -%}
            {%- set this = r.originRequest | default({}) -%}
            {%- if this != ns.base -%}
              {%- set keys = ((this.keys() | list) + (ns.base.keys() | list)) | unique | list -%}
              {%- set diff = [] -%}
              {%- for k in keys if this.get(k) != ns.base.get(k) -%}
                {%- set _ = diff.append(k) -%}
              {%- endfor -%}
              {%- set _ = ns.bad.append(r.hostname ~ ' [' ~ (diff | join(', ')) ~ ']') -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.bad | join('; ') }}

    - name: Refuse an ingress the template cannot represent
      ansible.builtin.assert:
        that: origin_mismatches | length == 0
        fail_msg: >-
          These rules carry originRequest settings that differ from the tunnel default
          (the catch-all's), listed as hostname [keys whose values differ]:
          {{ origin_mismatches }}. The rendered config drops per-rule originRequest, so
          cutting over would silently change how these are served. Extend the template
          to carry them before proceeding.

    - name: Say what will be carried across
      ansible.builtin.debug:
        msg: >-
          {{ live_ingress | rejectattr('hostname', 'equalto', '')
             | map(attribute='hostname') | list }}
      changed_when: true

    # ── create the new tunnel ─────────────────────────────────────────────────
    # 32 random bytes, base64, generated HERE. The secret never has to survive a
    # copy-paste out of a browser, and if any later step fails we still hold it.
    - name: Generate the new tunnel secret
      ansible.builtin.set_fact:
        new_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      no_log: true

    # status 200 AND 201: Cloudflare answers 201 on some creates, `uri` accepts 200 by
    # default, and that combination once failed a task that had actually succeeded — with
    # the response no_log'd, so the secret it carried was censored and lost.
    - name: Create the tunnel, locally-managed
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account }}/cfd_tunnel"
        method: POST
        status_code: [200, 201]
        headers:
          Authorization: "Bearer {{ cf_api_token }}"
        body_format: json
        body:
          name: "{{ inventory_hostname }}-local"
          tunnel_secret: "{{ new_secret }}"
          config_src: "local"
      register: created
      delegate_to: localhost
      no_log: true

    - name: Keep the new tunnel id where the rest of the play can see it
      ansible.builtin.set_fact:
        new_tunnel: "{{ created.json.result.id }}"

    - name: The new tunnel exists and nothing points at it yet
      ansible.builtin.debug:
        msg:
          - "new tunnel: {{ new_tunnel }}  (name: {{ inventory_hostname }}-local)"
          - "old tunnel: {{ old_tunnel }}  — still serving every hostname"
          - "no DNS record references the new one, so this is reversible by deleting it"
      changed_when: true

    # ── write the credentials, under a NEW name ───────────────────────────────
    # Not over the live one. The running connector reads that file, and phase 2 is where
    # the swap happens under a watched cycle — not as a side effect of a preparation step.
    - name: Write the new credentials file
      ansible.builtin.copy:
        dest: "{{ new_cred_file }}"
        content: |
          {"AccountTag":"{{ cf_account }}","TunnelID":"{{ new_tunnel }}","TunnelSecret":"{{ new_secret }}"}
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    # ── render the config for review, into the REPO ───────────────────────────
    # Into the repo, never into /etc. The rule is that the bytes reaching /etc are bytes
    # someone read in a diff; generating them into the repo for review is a different act
    # from generating them onto the boot path, which stays rejected.
    - name: Render the candidate config.yml into the repo, for review
      ansible.builtin.template:
        src: ../templates/cloudflared-local-config.yml.j2
        dest: "{{ repo_root }}/hosts/{{ inventory_hostname }}/system/cloudflared-config.yml"
        mode: "0644"
      delegate_to: localhost
      vars:
        tunnel_id: "{{ new_tunnel }}"
        ingress: "{{ live_ingress }}"

    # SAVED FOR PHASE 2, and this is the point of doing it here. Phase 2 may resume into
    # a half-finished cutover where the hostnames are already down; a baseline taken
    # then captures the outage, and the check that compares against it proves nothing.
    # Taken here, while the OLD tunnel is still serving, it is the real thing.
    - name: Baseline every hostname while the old tunnel still serves
      ansible.builtin.uri:
        url: "https://{{ item }}"
        method: HEAD
        timeout: 20
        follow_redirects: none
      register: bl
      failed_when: false
      loop: >-
        {{ live_ingress | selectattr('hostname', 'defined')
           | map(attribute='hostname') | reject('equalto', '') | list }}
      delegate_to: localhost

    - name: Save it for the cutover
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'HOME') }}/.infra-2g-baseline-{{ inventory_hostname }}.json"
        content: >-
          {{ dict(bl.results | map(attribute='item') | list
             | zip(bl.results | map(attribute='status') | list)) | to_nice_json }}
        mode: "0644"
      delegate_to: localhost

    - name: What to do next
      ansible.builtin.debug:
        msg:
          - "1. read the diff: git -C {{ repo_root }} diff hosts/{{ inventory_hostname }}/system/"
          - "   the ingress is now LOAD-BEARING — a hostname missing there is a 404"
          - "2. commit it, and pull on {{ inventory_hostname }}"
          - "3. then: cloudflare-tunnel-cutover.yml"
          - "to abandon instead: delete tunnel {{ new_tunnel }} and rm {{ new_cred_file }}"
      changed_when: true
