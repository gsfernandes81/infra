---
# NOT A PLAYBOOK YOU RUN — the underscore says so. client-home-ssh-config.yml imports
# it; run that. This half writes the laptop's block into this client's ~/.ssh/config: an
# ssh tunnel to the llama-server on the laptop, which clients/emacs/ asks at 127.0.0.1.
#
# WHY A TUNNEL. The laptop and the phone share a LAN nobody here controls, and an
# address on it, by IP or mDNS name, can be taken by anyone who knocks the laptop off.
# ssh checks the laptop's host key before it sends anything, so an impostor gets a
# refused connection and no prompt, no API key, no login. llama-server listens on the
# laptop's 127.0.0.1 only and is never exposed to the LAN. docs/ssh-clients.md § The
# laptop has the reasoning and the laptop's side.
#
# THE HOST KEY IS PINNED HERE, in its own known-hosts file, rather than learned on first
# connect: on this LAN the first answer could be the impostor. It is the laptop's public
# host key, which is not a secret. A new key on the laptop (a reinstall) is a new value
# below and a re-run.
#
# NOT ON WSL. WSL runs on the laptop itself and reaches its llama-server without one.
# Told by WSL_DISTRO_NAME, which WSL sets in every shell, or by either interop entry:
# `WSLInterop` is absent when WSL runs systemd, which registers `WSLInterop-late`.
#
# AT THE TOP OF ~/.ssh/config, not above `Host *` like the other blocks. ssh takes the
# first value it reads, so a `Host *`, `Match` or `Include` above this block would win
# over its pin (StrictHostKeyChecking, UserKnownHostsFile, HostKeyAlias) without a word.
# Nothing above it, nothing can. A block found lower down, where earlier runs put it, is
# moved up.
#
# THIS PLAY WRITES ON THE CLIENT ONLY: one block, one known-hosts file. It reaches no
# host and needs no become. On a whole run it comes after the fleet half, which has
# already made ~/.ssh/config LF; blockinfile cannot find its own markers in a CRLF file.
#
# NO NEW COLLECTIONS: ansible.builtin throughout.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: control

- name: Write the laptop's ssh tunnel block
  hosts: control
  gather_facts: false

  vars:
    # lookup('env','HOME'), never ~: on Termux the passwd entry reports /data.
    home: "{{ lookup('env', 'HOME') }}"
    ssh_config: "{{ home }}/.ssh/config"

    # The laptop: Windows' own OpenSSH server, keys only, the client's key restricted to
    # this one forward (docs/ssh-clients.md § The laptop).
    laptop_alias: g14
    # An address, not G14-GS.local: whether Termux resolves .local names is unproven.
    # A different address for one run is `ssh -o HostName=<ip> g14`; a new default is
    # -e laptop_address=… here, or a change to this line.
    laptop_address: 10.1.0.125
    laptop_port: 22
    laptop_user: gavin
    # C:\ProgramData\ssh\ssh_host_ed25519_key.pub on the laptop, read 2026-11-01, comment
    # dropped. Fingerprint SHA256:ZzNixJrEAhRMvQHyWMT5eIPWiuxR4B6vLtWt6WS0bK4.
    laptop_host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEFFhgwp8xT/WYrrYWrV9vXp7d1sNn2VHw0chUycOwwK
    # 8080 at both ends: llama-server's port on the laptop, and clients/emacs's default.
    laptop_remote_port: 8080
    laptop_local_port: 8080

  tasks:
    - name: Probe for WSL's interop entries
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /proc/sys/fs/binfmt_misc/WSLInterop
        - /proc/sys/fs/binfmt_misc/WSLInterop-late
      register: wsl_probe

    - name: Note whether this client is WSL
      ansible.builtin.set_fact:
        on_wsl: >-
          {{ lookup('env', 'WSL_DISTRO_NAME') | length > 0
             or wsl_probe.results | selectattr('stat.exists') | list | length > 0 }}

    - name: "If WSL: note the laptop block is not needed here"
      ansible.builtin.debug:
        msg: >-
          This is WSL, on the laptop itself: its llama-server is reached without a tunnel,
          so no {{ laptop_alias }} block is written here.
      changed_when: true
      when: on_wsl | bool

    - name: Write the laptop block and its pinned host key
      when: not on_wsl | bool
      block:
        - name: Create ~/.ssh and ~/.ssh/cm, mode 700
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0700"
          loop:
            - "{{ home }}/.ssh"
            - "{{ home }}/.ssh/cm"

        # Its own file, written whole: the user's known_hosts is never edited, and this
        # one cannot pick up a second, learned key for the alias.
        - name: Write the laptop's pinned host key, mode 600
          ansible.builtin.copy:
            dest: "{{ home }}/.ssh/known_hosts.{{ laptop_alias }}"
            content: "{{ laptop_alias }} {{ laptop_host_key }}\n"
            mode: "0600"

        # check_mode: false because it only reads; a missing file reads as empty.
        - name: Read ~/.ssh/config to find the laptop block
          ansible.builtin.slurp:
            src: "{{ ssh_config }}"
          register: laptop_cfg
          failed_when: false
          check_mode: false

        # On top means nothing but blank lines and comments above the marker. Absent
        # counts as not on top, which only matters for a file that already has content.
        - name: Note whether the laptop block is at the top
          ansible.builtin.set_fact:
            laptop_on_top: >-
              {{ ((laptop_cfg.content | default('') | b64decode).split('# BEGIN infra-laptop')[0]).splitlines()
                 | reject('match', '^\s*(#.*)?$') | list | length == 0 }}

        - name: "If not at the top: delete the laptop block"
          ansible.builtin.blockinfile:
            path: "{{ ssh_config }}"
            create: true
            marker: "# {mark} infra-laptop (ansible/playbooks/client-home-ssh-config.yml)"
            state: absent
          when: not laptop_on_top | bool

        - name: Write the laptop block at the top of ~/.ssh/config
          ansible.builtin.blockinfile:
            path: "{{ ssh_config }}"
            create: true
            marker: "# {mark} infra-laptop (ansible/playbooks/client-home-ssh-config.yml)"
            insertbefore: BOF
            block: "{{ lookup('template', '../templates/ssh-laptop-block.j2') }}"
            mode: "0600"
