---
# 2g, phase 3 of 3: delete the old tunnel.
#
#   ansible-playbook playbooks/cloudflare-tunnel-retire.yml -e target=one -K
#
# WHY THIS MATTERS BEYOND TIDINESS. Deleting the tunnel kills its credential outright.
# `one`'s token has been assumed disclosed since it sat world-readable in a 755 init
# script, and a copy of it survived in /etc/init.d/cloudflared.bak-token for a month.
# Rotating would have superseded it; deleting the tunnel makes every copy worthless.
# That is 2e for this host, arriving as a side effect of 2g.
#
# IT IS THE ONE IRREVERSIBLE STEP. A deleted tunnel cannot be recreated with the same
# UUID, so anything still pointing at it is broken permanently rather than for a minute.
# Hence the two guards below, and hence its own file.

- name: Retire a host's old tunnel
  hosts: "{{ target | default('one') }}"
  gather_facts: false

  vars_prompt:
    - name: cf_api_token
      prompt: "Cloudflare API token — Account>Cloudflare Tunnel>Edit, Zone>Zone>Read, Zone>DNS>Edit (last two on gsrpi.uk)"
      private: true

  vars:
    cf_api: "https://api.cloudflare.com/client/v4"
    zone_name: "gsrpi.uk"
    cred_file: "/etc/cloudflared/{{ inventory_hostname }}.json"
    old_cred_file: "/etc/cloudflared/{{ inventory_hostname }}.json.pre-2g"
    probe: "http://127.0.0.1:20241"
    api_hdr:
      Authorization: "Bearer {{ cf_api_token }}"
    # Hostnames knowingly left behind, comma-separated. They point at the old tunnel and
    # will stop resolving to anything when it goes. Naming them is the acknowledgement.
    abandon: ""
    # Delete the doomed tunnel's WARP private-network routes rather than refusing.
    # Opt-in, and it should stay that way: dropping a route someone relies on is not
    # recoverable by re-running anything.
    drop_routes: false

  tasks:
    # ── is this token even a token? ──────────────────────────────────────────
    # FIRST, before anything reads a box or the API. Cloudflare answers a token it will
    # not accept with `9109 Invalid access token` on whatever endpoint you happened to
    # hit, so the failure lands wherever the play got to and looks like that endpoint's
    # problem. `/user/tokens/verify` asks the one question directly, and separates the two
    # causes that are otherwise indistinguishable: a token string that is wrong, expired
    # or not yet active, versus a valid token missing a permission.
    #
    # failed_when: false + print the body + assert — the pattern CLAUDE.md records for a
    # no_log call that can be refused. The body is the only thing that names the cause;
    # the invocation is never printed, because that is where the Authorization header is.
    - name: Verify the API token before using it
      ansible.builtin.uri:
        url: "{{ cf_api }}/user/tokens/verify"
        headers: "{{ api_hdr }}"
      register: tok
      delegate_to: localhost
      run_once: true
      no_log: true
      failed_when: false
      check_mode: false

    - name: Say what Cloudflare said about the token
      ansible.builtin.debug:
        msg: >-
          token verify: HTTP {{ tok.status | default('?') }},
          status {{ tok.json.result.status | default('unknown') }},
          {{ tok.json.errors | default([]) }}
      changed_when: true
      when: (tok.status | default(0)) != 200 or (tok.json.result.status | default('')) != 'active'

    - name: Refuse a token Cloudflare will not accept
      ansible.builtin.assert:
        that:
          - (tok.status | default(0)) == 200
          - (tok.json.result.status | default('')) == 'active'
        fail_msg: |
          Cloudflare will not accept this token at all — this is NOT a missing permission.
          A scope problem gets you a 403 on the specific endpoint with the token still
          verifying as active; this fails verification outright.

          Check, in order: that the whole token was pasted (it is read with echo off, so a
          truncated paste is invisible); that it has not expired or been revoked; that its
          start date is not in the future; and that it is an API token from My Profile ->
          API Tokens rather than a Global API Key or an Access service token.

          Test it by hand without this play. FISH, which is what this fleet runs —
          `read -rs` is bash and fish will not take it:

            read -s TOKEN
            curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify
            curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/zones?name=gsrpi.uk"
            set -e TOKEN

          In bash it is `read -rs TOKEN` and `unset TOKEN`. Either way the token stays out
          of history: only the variable name is on the command line.

          Nothing has been read or changed.
        success_msg: "token verifies as active"

    - name: Read the tunnel we are on now, and the one we left
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: creds
      loop: [ "{{ cred_file }}", "{{ old_cred_file }}" ]
      become: true
      no_log: true

    - name: Name them
      ansible.builtin.set_fact:
        live_tunnel: "{{ (creds.results[0].content | b64decode | from_json).TunnelID }}"
        doomed_tunnel: "{{ (creds.results[1].content | b64decode | from_json).TunnelID }}"
        cf_account: "{{ (creds.results[0].content | b64decode | from_json).AccountTag }}"

    - name: Refuse to delete the tunnel we are currently running
      ansible.builtin.assert:
        that: live_tunnel != doomed_tunnel
        fail_msg: >-
          {{ cred_file }} and {{ old_cred_file }} name the same tunnel. Either the
          cutover never happened or the backup was overwritten — either way this play
          would delete the tunnel {{ inventory_hostname }} is serving from.

    # ── guard 1: the connector we are keeping must be healthy ────────────────
    - name: The live connector must be serving
      ansible.builtin.uri:
        url: "{{ probe }}/ready"
        return_content: true
      register: ready

    - name: Refuse if the replacement is not actually up
      ansible.builtin.assert:
        that: (ready.content | from_json).readyConnections | default(0) > 0
        fail_msg: >-
          {{ inventory_hostname }}'s connector reports no ready connections. Deleting the
          old tunnel now would remove the thing you would fall back to.

    # ── guard 2: nothing may still point at the doomed tunnel ────────────────
    # THIS IS THE ONE THAT MATTERS. A DNS record aimed at a deleted tunnel does not
    # degrade, it stops working permanently — the UUID cannot be recreated.
    # Same shape as the cutover's, and for the same reason: the token preflight proves
    # the token is ACTIVE, not that it is SCOPED. A token without Zone -> Zone -> Read
    # fails here, and a bare `no_log` read reports that as `Status code was 403` with the
    # body — the only place Cloudflare names the missing permission — censored.
    - name: Find the zone
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones?name={{ zone_name }}"
        headers: "{{ api_hdr }}"
      register: zone
      delegate_to: localhost
      no_log: true
      failed_when: false

    - name: List every record in the zone
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones/{{ zone.json.result[0].id | default('') }}/dns_records?per_page=500"
        headers: "{{ api_hdr }}"
      register: allrecs
      delegate_to: localhost
      no_log: true
      failed_when: false
      when: (zone.status | default(0)) == 200

    - name: Say what Cloudflare refused, if it did
      ansible.builtin.debug:
        msg: >-
          zone lookup HTTP {{ zone.status | default('?') }} {{ zone.json.errors | default([]) }};
          record listing HTTP {{ allrecs.status | default('skipped') }}
          {{ allrecs.json.errors | default([]) }}
      changed_when: true
      when: (zone.status | default(0)) != 200 or (allrecs.status | default(0)) != 200

    - name: The token has to be able to read the zone and its records
      ansible.builtin.assert:
        that:
          - (zone.status | default(0)) == 200
          - (zone.json.result | default([]) | length) > 0
          - (allrecs.status | default(0)) == 200
        fail_msg: >-
          Could not read {{ zone_name }} or its records — the bodies are above. The token
          verified as active, so this is scope: Zone -> Zone -> Read and Zone -> DNS ->
          Edit on {{ zone_name }}, beside Account -> Cloudflare Tunnel -> Edit. Nothing
          has been deleted.
        success_msg: "zone and records readable"

    # `| default([], true)` on every Cloudflare result list here and below: a 403 comes
    # back as `result: null`, which is DEFINED, so the plain `default([])` never applies
    # and selectattr/length raise on none with an error that points away from the token.
    # With the assert above, that path is now unreachable rather than merely defended —
    # kept because the defence costs nothing and the next endpoint added here may not be
    # guarded.
    - name: Which records still aim at the doomed tunnel
      ansible.builtin.set_fact:
        stragglers: >-
          {{ allrecs.json.result | default([], true)
             | selectattr('content', 'equalto', doomed_tunnel ~ '.cfargotunnel.com')
             | map(attribute='name') | list }}

    - name: Show them
      ansible.builtin.debug:
        msg: >-
          {{ 'still pointing at ' ~ doomed_tunnel ~ ': ' ~ (stragglers | join(', '))
             if stragglers else 'nothing points at ' ~ doomed_tunnel ~ ' any more' }}
      changed_when: true

    - name: Refuse unless every straggler was named as abandoned
      ansible.builtin.assert:
        that: stragglers | difference(abandon.split(',') | map('trim') | reject('equalto', '') | list) | length == 0
        fail_msg: >-
          These still point at the tunnel about to be deleted, and were not listed as
          abandoned: {{ stragglers | difference(abandon.split(',') | map('trim') | list) | join(', ') }}.
          Either repoint them, or acknowledge losing them with
          -e abandon="{{ stragglers | join(',') }}"

    - name: Note what is being given up
      ansible.builtin.debug:
        msg: >-
          ABANDONING {{ abandon }} — these will stop resolving to anything once the
          tunnel is gone. Their DNS records are left in place; delete them separately
          if you want the names gone too.
      changed_when: true
      when: abandon | length > 0

    # ── guard 3: private network routes ──────────────────────────────────────
    # A tunnel carries more than public hostnames. WARP private-network routes are a
    # separate object entirely, they are NOT visible under Public Hostnames, and
    # Cloudflare refuses to delete a tunnel that still has any (error 1023).
    #
    # Found the hard way on zero, 2026-08-23: the cutover moved every hostname and left
    # these behind pointing at a tunnel with no connector, so WARP access to the LAN was
    # silently broken and no probe we had would have noticed. They are listed here
    # because listing them is the only way anyone finds out.
    - name: List private network routes on the doomed tunnel
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account }}/teamnet/routes?tunnel_id={{ doomed_tunnel }}&is_deleted=false"
        headers: "{{ api_hdr }}"
      register: routes
      failed_when: false
      delegate_to: localhost
      no_log: true

    - name: Show the private network routes
      ansible.builtin.debug:
        msg: >-
          {{ (routes.json.result | default([], true))
             | map(attribute='network') | list | default([], true)
             if (routes.json.result | default([], true)) | length > 0
             else 'no private network routes on ' ~ doomed_tunnel }}
      changed_when: true

    # DROPPED, NOT MOVED. Confirmed 2026-08-23 that WARP is not used here — these are
    # left over from an experiment with WARP VPN to zero and/or WARP-based Access auth.
    # Moving them onto the new tunnel would carry an unused experiment forward; deleting
    # them ends it. If WARP is ever wanted, a route is one API call to recreate.
    - name: Drop the private network routes
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account }}/teamnet/routes/{{ item.id }}"
        method: DELETE
        headers: "{{ api_hdr }}"
        status_code: [200, 202, 204]
      loop: "{{ routes.json.result | default([], true) }}"
      loop_control:
        label: "{{ item.network }}"
      delegate_to: localhost
      no_log: true
      when: drop_routes | bool

    # ITS OWN REGISTER, not `routes` again. A SKIPPED task still overwrites the variable
    # it registers, with a skipped result — so re-using `routes` here erased the real
    # listing whenever drop_routes was false, `routes.json` became undefined,
    # `| default([])` turned that into an empty list, and the guard below passed with a
    # route plainly present. It only refused at all because Cloudflare refused.
    #
    # A guard that disarms itself when its opt-in is absent is worse than no guard: it
    # reports "All assertions passed" over exactly the condition it exists to catch.
    - name: Re-read the routes after dropping them
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account }}/teamnet/routes?tunnel_id={{ doomed_tunnel }}&is_deleted=false"
        headers: "{{ api_hdr }}"
      register: routes_after
      failed_when: false
      delegate_to: localhost
      no_log: true
      when: drop_routes | bool

    - name: What is left, from whichever listing is the real one
      ansible.builtin.set_fact:
        routes_left: >-
          {{ ((routes_after.json.result if (drop_routes | bool) else routes.json.result)
              | default([], true)) }}

    - name: Refuse while private network routes still point here
      ansible.builtin.assert:
        that: routes_left | length == 0
        fail_msg: >-
          {{ routes_left | length }} private network route(s) still point at
          {{ doomed_tunnel }}: {{ routes_left | map(attribute='network') | list | join(', ') }}.
          These are WARP routes, not public hostnames — the cutover did not move them, and
          they have had no connector since it ran. Decide whether they should follow the
          host onto {{ live_tunnel }} or be dropped. To drop them, re-run with
          -e drop_routes=true. Nothing here is deleted in the meantime.

    # ── delete ───────────────────────────────────────────────────────────────
    # Clean up connection records first. Cloudflare refuses to delete a tunnel that still
    # has them, and they outlive the connector — stopping cloudflared does not clear them
    # immediately. Harmless if there are none.
    - name: Clear any lingering connection records
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account }}/cfd_tunnel/{{ doomed_tunnel }}/connections"
        method: DELETE
        headers: "{{ api_hdr }}"
        status_code: [200, 202, 204, 400, 404]
      delegate_to: localhost
      no_log: true

    # no_log HIDES THE HEADERS, WHICH CARRY THE TOKEN — but it also hides the response,
    # and on this task the response IS the diagnostic. That is the failure
    # cloudflare-dev-tunnel.yml already records: a no_log'd 201 censored the only copy of
    # a secret. So the task never fails on its own; the check below reads the registered
    # result and prints only the API's own error list, which contains nothing sensitive.
    - name: Delete the old tunnel
      ansible.builtin.uri:
        url: "{{ cf_api }}/accounts/{{ cf_account }}/cfd_tunnel/{{ doomed_tunnel }}"
        method: DELETE
        headers: "{{ api_hdr }}"
        status_code: [200, 202, 204]
      register: deleted
      failed_when: false
      delegate_to: localhost
      no_log: true

    - name: Say what Cloudflare said, if it refused
      ansible.builtin.debug:
        msg: >-
          DELETE returned {{ deleted.status | default('?') }}:
          {{ deleted.json.errors | default(deleted.msg) | default('no detail') }}
      changed_when: true
      when: deleted.status | default(0) not in [200, 202, 204]

    - name: Fail if the tunnel is still there
      ansible.builtin.assert:
        that: deleted.status | default(0) in [200, 202, 204]
        fail_msg: >-
          The tunnel was not deleted. Nothing else has changed — {{ inventory_hostname }}
          is serving from {{ live_tunnel }} either way, and an undeleted old tunnel with
          no DNS and no connector costs nothing. Read the error above before retrying.

    - name: Done
      ansible.builtin.debug:
        msg:
          - "tunnel {{ doomed_tunnel }} is gone, and every credential for it is now worthless"
          - "{{ inventory_hostname }} serves from {{ live_tunnel }}, routes in hosts/{{ inventory_hostname }}/system/cloudflared-config.yml"
          - "cleanup: rm {{ old_cred_file }} and /etc/cloudflared/{{ inventory_hostname }}-new.json"
          - "and the baseline: rm ~/.infra-2g-baseline-{{ inventory_hostname }}.json"
      changed_when: true
