---
# 2g, phase 2 of 3: swap the host onto the new tunnel and move DNS to follow.
#
#   ansible-playbook playbooks/cloudflare-tunnel-cutover.yml -e target=one -K
#
# Needs a token with BOTH Account -> Cloudflare Tunnel -> Edit and Zone -> DNS -> Edit
# on gsrpi.uk. Prompted, never stored, and every API call is delegated to the control
# node so it never reaches a Pi.
#
# THIS IS THE PHASE WITH AN OUTAGE IN IT, and it is deliberate rather than overlooked.
# Running both connectors at once would avoid it, but that means either a second OpenRC
# service — the phantom-service trap CLAUDE.md warns about — or a detached process
# Ansible has to babysit and reliably kill. On `one`, whose services are recoverable,
# a couple of minutes is the cheaper trade. `zero` is a separate decision.
#
# ORDER: service first, THEN dns. The reverse would repoint hostnames at a tunnel with
# no connector and only reveal whether the new tunnel works after everything had moved.
# This way the new connector has to register and serve the right rules BEFORE any DNS
# record is touched, and aborting before that point costs nothing at all.
#
# EVERY HOSTNAME IS CHECKED AGAINST ITS OWN BASELINE, not against "healthy". `one`'s
# syncthing-torrents 502s today because its origin is down (2c, blocked on the SP900),
# and it must 502 identically afterwards. A check that demanded 200 would fail on a
# thing this change did not touch, and a rollback on that basis would be the wrong
# reason twice over.

- name: Cut a host over to its locally-managed tunnel
  hosts: "{{ target | default('one') }}"
  gather_facts: false
  serial: 1

  vars_prompt:
    - name: cf_api_token
      prompt: "Cloudflare API token — THREE permissions, not phase 1's one: Account>Cloudflare Tunnel>Edit, Zone>Zone>Read, Zone>DNS>Edit (last two on gsrpi.uk)"
      private: true

  vars:
    cf_api: "https://api.cloudflare.com/client/v4"
    zone_name: "gsrpi.uk"
    cred_file: "/etc/cloudflared/{{ inventory_hostname }}.json"
    new_cred_file: "/etc/cloudflared/{{ inventory_hostname }}-new.json"
    # Where install-system-file puts cloudflared-config.yml, per that file's own
    # `infra-path`/`infra-name` header. Named here so the rescue can put the old one back:
    # restoring the credentials alone leaves this file naming a different tunnel.
    cfg_file: "/etc/cloudflared/config.yml"
    repo_cfg: "{{ playbook_dir }}/../../hosts/{{ inventory_hostname }}/system/cloudflared-config.yml"

    # The clone ON THE HOST. Absolute, and not `~`: the install task runs with become,
    # where `~` is root's home and `~/infra` does not exist there.
    # NOT hardcoded any more. `two`'s clone is /srv/infra, not ~gavin/infra — CLAUDE.md
    # § Git & workflow says so, and this play would have chdir'd into a directory that is
    # not there. It fails inside the rescue, so nothing would have been left half-done,
    # but it would have aborted the cutover on the lifeboat for a path typo. The value
    # lives in host_vars, which is where a per-host fact belongs.
    host_repo: "{{ infra_checkout | default('/home/gavin/infra') }}"
    probe: "http://127.0.0.1:20241"
    baseline_file: "{{ lookup('env', 'HOME') }}/.infra-2g-baseline-{{ inventory_hostname }}.json"
    api_hdr:
      Authorization: "Bearer {{ cf_api_token }}"

  tasks:
    # ── is this token even a token? ──────────────────────────────────────────
    # FIRST, before anything reads a box or the API. Cloudflare answers a token it will
    # not accept with `9109 Invalid access token` on whatever endpoint you happened to
    # hit, so the failure lands wherever the play got to and looks like that endpoint's
    # problem. `/user/tokens/verify` asks the one question directly, and separates the two
    # causes that are otherwise indistinguishable: a token string that is wrong, expired
    # or not yet active, versus a valid token missing a permission.
    #
    # failed_when: false + print the body + assert — the pattern CLAUDE.md records for a
    # no_log call that can be refused. The body is the only thing that names the cause;
    # the invocation is never printed, because that is where the Authorization header is.
    - name: Verify the API token before using it
      ansible.builtin.uri:
        url: "{{ cf_api }}/user/tokens/verify"
        headers: "{{ api_hdr }}"
      register: tok
      delegate_to: localhost
      run_once: true
      no_log: true
      failed_when: false
      check_mode: false

    - name: Say what Cloudflare said about the token
      ansible.builtin.debug:
        msg: >-
          token verify: HTTP {{ tok.status | default('?') }},
          status {{ tok.json.result.status | default('unknown') }},
          {{ tok.json.errors | default([]) }}
      changed_when: true
      when: (tok.status | default(0)) != 200 or (tok.json.result.status | default('')) != 'active'

    - name: Refuse a token Cloudflare will not accept
      ansible.builtin.assert:
        that:
          - (tok.status | default(0)) == 200
          - (tok.json.result.status | default('')) == 'active'
        fail_msg: |
          Cloudflare will not accept this token at all — this is NOT a missing permission.
          A scope problem gets you a 403 on the specific endpoint with the token still
          verifying as active; this fails verification outright.

          Check, in order: that the whole token was pasted (it is read with echo off, so a
          truncated paste is invisible); that it has not expired or been revoked; that its
          start date is not in the future; and that it is an API token from My Profile ->
          API Tokens rather than a Global API Key or an Access service token.

          Test it by hand without this play. FISH, which is what this fleet runs —
          `read -rs` is bash and fish will not take it:

            read -s TOKEN
            curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify
            curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/zones?name=gsrpi.uk"
            set -e TOKEN

          In bash it is `read -rs TOKEN` and `unset TOKEN`. Either way the token stays out
          of history: only the variable name is on the command line.

          Nothing has been read or changed.
        success_msg: "token verifies as active"

    # ── are we standing on the thing we are about to stop? ───────────────────
    # This play cycles the target's cloudflared. If Ansible reached the target THROUGH
    # that tunnel, the first thing it does is sever its own connection — which is
    # exactly what happened on 2026-08-23, leaving the host half-cut-over.
    #
    # A session arriving via the local connector shows a LOOPBACK client address,
    # because cloudflared connects to sshd on localhost. Anything else — a LAN address
    # from a jump host — is safe.
    - name: Establish how Ansible is reaching this host
      ansible.builtin.shell: echo "$SSH_CONNECTION"
      register: sshconn
      changed_when: false

    # Two conditions, and the first is not decoration: an EMPTY SSH_CONNECTION means the
    # standing position cannot be established at all, and '?' passing a not-in-loopback
    # test would read as safe. Unknown refuses, the same as loopback — flagged by the
    # batch-1 review agent, 2026-08-24.
    - name: Refuse to cycle the tunnel we are connected through
      ansible.builtin.assert:
        that:
          - sshconn.stdout | trim | length > 0
          - (sshconn.stdout.split() | first | default('?')) not in ['127.0.0.1', '::1']
        fail_msg: >-
          Ansible reached {{ inventory_hostname }} from
          {{ sshconn.stdout.split() | first | default('?') }}, which is loopback — so this
          session arrives through {{ inventory_hostname }}'s own cloudflared, and this
          play would stop it mid-run. Come in over the mesh instead and tell Ansible so:
          -e ansible_host={{ inventory_hostname }}-zero   (or -one / -two)

    # ── the host's clone has to be where we think it is ──────────────────────
    # A `chdir` into a directory that is not there fails inside the block, which fires
    # the rescue for something that is not a rollback. Worse, this value came from
    # CLAUDE.md and hosts/<host>/setup/README.md — both of which describe how a box was
    # BUILT, not what it currently is. `two` was documented at /srv/infra and is not
    # there. The box is the authority; this asks it before anything is written.
    - name: Is the host's clone where host_repo says
      ansible.builtin.stat:
        path: "{{ host_repo }}/.git"
      register: repo_stat
      become: true

    - name: Refuse a host_repo that is not a checkout
      ansible.builtin.assert:
        that: repo_stat.stat.exists | default(false)
        fail_msg: >-
          {{ host_repo }} on {{ inventory_hostname }} is not a git checkout, and this play
          runs bin/install-system-file from there. Find the real one —
          `ls -ld ~gavin/infra /srv/infra` on the box — and set it in
          ansible/host_vars/{{ inventory_hostname }}.yml as `infra_checkout`, or pass
          -e infra_checkout=/the/real/path for this run.
        success_msg: "{{ host_repo }} is a checkout"

    # ── what we are moving from, and to ──────────────────────────────────────
    - name: Read both credentials files
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: creds
      loop: [ "{{ cred_file }}", "{{ new_cred_file }}" ]
      become: true
      no_log: true

    # The REPO CONFIG is what we are cutting over to — it is the reviewed artefact, and
    # the only thing here that survives a half-finished run unambiguously.
    - name: Identify the tunnels
      ansible.builtin.set_fact:
        live_tunnel: "{{ (creds.results[0].content | b64decode | from_json).TunnelID }}"
        new_tunnel: "{{ (creds.results[1].content | b64decode | from_json).TunnelID }}"
        cf_account: "{{ (creds.results[0].content | b64decode | from_json).AccountTag }}"
        target_tunnel: "{{ (lookup('file', repo_cfg) | from_yaml).tunnel }}"

    - name: The new credentials and the reviewed config must name the same tunnel
      ansible.builtin.assert:
        that: new_tunnel == target_tunnel
        fail_msg: >-
          {{ new_cred_file }} is tunnel {{ new_tunnel }} but the reviewed config says
          {{ target_tunnel }}. One of them is from a different run of phase 1.

    # THE CHECK ABOVE READS THE CONTROL NODE, NOT THE HOST — `lookup('file', …)` always
    # does. So it proves the reviewed config is right HERE and says nothing about what
    # install-system-file is about to install THERE, which is read from the host's own
    # clone. On `two`, 2026-08-28, that clone had never been pulled: the install was a
    # no-op that left config.yml naming the OLD tunnel, the credentials were then swapped
    # to the NEW one, and cloudflared could not authenticate a tunnel its config did not
    # name. It surfaced as a 503 with zero ready connections and looked like a slow box.
    - name: Read the reviewed config from the HOST's own clone
      ansible.builtin.slurp:
        src: "{{ host_repo }}/hosts/{{ inventory_hostname }}/system/cloudflared-config.yml"
      register: host_repo_cfg
      become: true

    - name: The host's clone has to carry the reviewed config too
      ansible.builtin.assert:
        that: (host_repo_cfg.content | b64decode | from_yaml).tunnel == new_tunnel
        fail_msg: >-
          {{ host_repo }} on {{ inventory_hostname }} still has tunnel
          {{ (host_repo_cfg.content | b64decode | from_yaml).tunnel }} in
          hosts/{{ inventory_hostname }}/system/cloudflared-config.yml, but phase 1
          produced {{ new_tunnel }}. That clone has not been pulled since the review, so
          installing from it would be a no-op and the credential swap would then point
          the connector at a tunnel its config does not name. Commit and push phase 1's
          config, then on {{ inventory_hostname }}:  git -C {{ host_repo }} pull
        success_msg: "the host's clone carries the reviewed config"

    # RESUMABLE. If the live credentials already name the target, the host half is done
    # — installed, swapped, cycled — and re-running it would achieve nothing while the
    # backup step actively destroyed the rollback. That is not hypothetical: the run on
    # 2026-08-23 lost its connection between the swap and the cycle.
    - name: Has the host already been swapped over?
      ansible.builtin.set_fact:
        swap_done: "{{ live_tunnel == target_tunnel }}"

    - name: Say which half is left
      ansible.builtin.debug:
        msg: >-
          {{ 'host already on ' ~ target_tunnel ~ ' — skipping to DNS'
             if swap_done else 'full cutover: host then DNS' }}
      changed_when: true

    # The hostnames come from the REPO config, not from the old tunnel's ingress. That
    # is the point of the review step: ionic-traces was removed there deliberately, and
    # taking the list from the edge would quietly resurrect it.
    - name: Read the reviewed config to learn which hostnames move
      ansible.builtin.set_fact:
        move_hosts: >-
          {{ (lookup('file', repo_cfg) | from_yaml).ingress
             | selectattr('hostname', 'defined') | map(attribute='hostname') | list }}

    - name: Confirm the plan
      ansible.builtin.debug:
        msg:
          - "host      : {{ inventory_hostname }}"
          - "from      : {{ live_tunnel }}"
          - "to        : {{ target_tunnel }}"
          - "hostnames : {{ move_hosts | join(', ') }}"
          - "NOT moved : anything in the old tunnel but absent above — retired on purpose"
      changed_when: true

    # ── baseline every hostname, while the old tunnel still serves ───────────
    # PREFER THE BASELINE PHASE 1 SAVED. Re-taking it here is wrong on a resumed run:
    # the host may already be cut over with DNS still pointing at a dead tunnel, in
    # which case "baseline" captures the OUTAGE and the final check then confirms the
    # hostnames still match it. That happened on 2026-08-23 — the cutover succeeded and
    # the check that said so proved nothing.
    - name: Look for the baseline phase 1 saved
      ansible.builtin.stat:
        path: "{{ baseline_file }}"
      register: bl_saved
      delegate_to: localhost

    # failed_when: false, NOT status_code. Any status is a valid baseline — what matters
    # is that it is the SAME afterwards. `status_code: -1` looks like "accept anything"
    # and is not: the module compares the real status against that literal list.
    #
    # Expect a spread. On `one`: 200 for ssh-one and bookit, and 302 for torrents and
    # syncthing-torrents, which sit behind Cloudflare Access and are redirected to a
    # login before the origin is ever reached. Access binds to the HOSTNAME, not to the
    # tunnel, so it should survive this unchanged — and comparing to baseline is what
    # will show whether it did.
    - name: Baseline each hostname through the edge
      ansible.builtin.uri:
        url: "https://{{ item }}"
        method: HEAD
        timeout: 20
        follow_redirects: none
      register: baseline
      failed_when: false
      loop: "{{ move_hosts }}"
      delegate_to: localhost
      when: not bl_saved.stat.exists

    - name: Use the saved baseline, or the one just taken
      ansible.builtin.set_fact:
        baseline_status: >-
          {{ (lookup('file', baseline_file) | from_json) if bl_saved.stat.exists
             else dict(move_hosts | zip(baseline.results | map(attribute='status') | list)) }}

    # A hostname added to the reviewed config after phase 1 saved the baseline has no
    # entry here, and the final wait would only discover that as a missing-key error —
    # mid-cutover, after DNS had already moved. Refuse now, while nothing has changed.
    - name: Every hostname that moves must have a baseline entry
      ansible.builtin.assert:
        that: move_hosts | difference(baseline_status.keys() | list) | length == 0
        fail_msg: >-
          {{ move_hosts | difference(baseline_status.keys() | list) | join(', ') }} —
          these hostnames were added to the reviewed config after the baseline was
          saved. Delete {{ baseline_file }} and re-run phase 1, or remove them from
          the config.

    - name: Warn if the baseline is this run's own
      ansible.builtin.debug:
        msg: >-
          No saved baseline at {{ baseline_file }} — using one taken just now. If this is
          a RESUMED run the hostnames may already be down, in which case the final check
          confirms nothing. Verify by hand afterwards.
      changed_when: true
      when: not bl_saved.stat.exists

    - name: Baseline
      ansible.builtin.debug:
        var: baseline_status
      changed_when: true

    # ── find the DNS records, and record where they point ────────────────────
    # no_log HIDES THE REASON A REFUSAL HAPPENED, and CLAUDE.md already records that:
    # "a `no_log` write that can be refused carries `failed_when: false`, then a task that
    # prints the body's error list (never the invocation — that is where the Authorization
    # header is), then an `assert` that stops the play". This is a READ and it was still
    # bare `no_log`, so a 403 arrived as `Status code was 403` with the response censored —
    # and the response body is the only place Cloudflare says WHICH permission is missing.
    # Cost a run on `two`, 2026-08-28.
    - name: Find the zone
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones?name={{ zone_name }}"
        headers: "{{ api_hdr }}"
      register: zone
      delegate_to: localhost
      no_log: true
      failed_when: false

    - name: Say what Cloudflare refused, if it did
      # The body only. NEVER `zone` whole, and never the invocation: that is where the
      # Authorization header lives.
      ansible.builtin.debug:
        msg: >-
          Cloudflare answered {{ zone.status | default('?') }} listing the zone
          {{ zone_name }}: {{ zone.json.errors | default('no error body') }}
      changed_when: true
      when: (zone.status | default(0)) != 200

    - name: The token has to be able to see the zone
      ansible.builtin.assert:
        that:
          - (zone.status | default(0)) == 200
          - (zone.json.result | default([]) | length) > 0
        fail_msg: >-
          Could not list the zone {{ zone_name }} (HTTP {{ zone.status | default('?') }}),
          and the body above says why. The token verified as active at the top of this
          play, so this is a MISSING PERMISSION rather than a bad token: this phase needs
          Zone -> Zone -> Read and Zone -> DNS -> Edit on {{ zone_name }} in addition to
          the Account -> Cloudflare Tunnel -> Edit that phase 1 wanted. Nothing has been
          changed on {{ inventory_hostname }} or at the edge.
        success_msg: "token can see {{ zone_name }}"

    - name: Keep the zone id
      ansible.builtin.set_fact:
        zone_id: "{{ zone.json.result[0].id }}"

    - name: Find each hostname's DNS record
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones/{{ zone_id }}/dns_records?name={{ item }}"
        headers: "{{ api_hdr }}"
      register: recs
      loop: "{{ move_hosts }}"
      delegate_to: localhost
      no_log: true
      failed_when: false

    - name: The token has to be able to read those records
      ansible.builtin.assert:
        that: item.status | default(0) == 200
        fail_msg: >-
          Cloudflare answered {{ item.status | default('?') }} reading the DNS record for
          {{ item.item }}: {{ item.json.errors | default('no error body') }}.
          Zone -> DNS -> Edit on {{ zone_name }} is the permission this needs. Nothing has
          been changed.
      loop: "{{ recs.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Recorded BEFORE anything changes, so a rollback restores the exact previous target
    # rather than assuming it was the old tunnel. Printed, because if this play dies
    # mid-loop the only copy of it is in a register that dies with it.
    - name: Record where each one points now — WRITE THIS DOWN
      ansible.builtin.debug:
        msg: >-
          {{ dict(move_hosts | zip(recs.results
             | map(attribute='json.result.0.content') | list)) }}
      changed_when: true

    # EVERY RECORD MUST CURRENTLY POINT AT THE SAME TUNNEL, and it must not already be
    # the target. A hostname in this host's ingress whose DNS aims somewhere else is a
    # DEAD RULE — it has never routed here — and repointing it would take a working
    # service away from whichever tunnel actually serves it.
    #
    # This is not hypothetical. zero's ingress carries torrents.gsrpi.uk, whose CNAME has
    # always pointed at ONE's tunnel; copied blindly into zero's new config it would have
    # moved one's torrent UI onto zero to fix a rule that had never done anything.
    - name: Where the records point today
      ansible.builtin.set_fact:
        current_targets: >-
          {{ recs.results | map(attribute='json.result.0.content') | list | unique }}

    - name: Refuse if they do not all point at one tunnel that is not the target
      ansible.builtin.assert:
        that:
          - current_targets | length == 1
          - current_targets[0] != target_tunnel ~ '.cfargotunnel.com'
        fail_msg: >-
          These hostnames do not share a single current target:
          {{ dict(move_hosts | zip(recs.results | map(attribute='json.result.0.content') | list)) }}.
          A hostname in this host's ingress whose DNS points elsewhere has never routed
          here — it is a dead rule, and repointing it would move a working service.
          Remove it from the reviewed config rather than carrying it across.
      when: not swap_done

    - name: Refuse if any hostname has no record, or more than one
      ansible.builtin.assert:
        that: item.json.result | length == 1
        fail_msg: >-
          {{ item.item }} resolved to {{ item.json.result | length }} DNS records. One is
          expected; anything else means this play would repoint the wrong thing.
      loop: "{{ recs.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ── the host: config, credentials, cycle ─────────────────────────────────
    # ONE BLOCK, ROLLED BACK AS ONE. The wait below retries and then FAILS if the new
    # connector never registers — AFTER the credentials were swapped — and in the old
    # layout the play simply died there: the restore instructions lived in the NEXT
    # task's fail_msg and never rendered. The rescue performs the restore instead of
    # describing it. The DNS tasks stay outside the block, so a rescued run has moved
    # nothing at the edge.
    - name: Swap the host onto the new tunnel — rescued as one unit
      when: not swap_done
      block:
        # become: true, because install-system-file shells out to sudo for the backup
        # and the write — and inside a command task there is no tty for sudo to prompt
        # on. Run as root, those calls are no-ops. Without it the tool fails safe
        # ("backup failed, nothing written") but it fails, which is a task away from
        # where the work is.
        # BEFORE install-system-file, and symmetric with the credentials backup below.
        # The rescue used to restore only the credentials, which left config.yml naming
        # the NEW tunnel while two.json held the OLD one's — a mismatch cloudflared will
        # not start on. So a rolled-back host came back with its door shut, and the play
        # said "every hostname still points where it did", which was true about DNS and
        # silent about the connector. Found on `two`, 2026-08-28.
        #
        # `-f` guard, same reason as the credentials: never overwrite an existing backup,
        # or a second run erases the only copy of the pre-2g config.
        - name: Back up the live config before replacing it
          ansible.builtin.shell: |
            set -e
            [ -f {{ cfg_file }}.pre-2g ] || {
              cp -a {{ cfg_file }} {{ cfg_file }}.pre-2g
              chmod 644 {{ cfg_file }}.pre-2g
            }
          become: true
          changed_when: true

        - name: Install the reviewed config
          ansible.builtin.command:
            cmd: bin/install-system-file cloudflared-config.yml --commit --allow-content-change
            chdir: "{{ host_repo }}"
          register: inst
          become: true
          changed_when: true

        # `-f` on the backup: NEVER overwrite an existing .pre-2g. On a second run the
        # live file already holds the NEW credentials, so copying it over the backup
        # would erase the only local copy of the old ones — a rollback destroyed by the
        # act of retrying.
        # The installed artefact, not the repo copy — this is the file cloudflared opens.
        # Placed BEFORE the credential swap so a mismatch is a clean abort with the host
        # still on its old tunnel, rather than a rescue after an outage.
        - name: Prove the installed config now names the new tunnel
          ansible.builtin.slurp:
            src: "{{ cfg_file }}"
          register: installed_cfg
          become: true

        - name: Refuse to swap credentials the installed config does not match
          ansible.builtin.assert:
            that: (installed_cfg.content | b64decode | from_yaml).tunnel == new_tunnel
            fail_msg: >-
              {{ cfg_file }} still names tunnel
              {{ (installed_cfg.content | b64decode | from_yaml).tunnel }} after
              install-system-file ran, but the new credentials are for {{ new_tunnel }}.
              Nothing has been swapped and the host is still on its old tunnel.
            success_msg: "installed config names {{ new_tunnel }}"

        - name: Back up the old credentials, then put the new ones in place
          ansible.builtin.shell: |
            set -e
            [ -f {{ cred_file }}.pre-2g ] || {
              cp -a {{ cred_file }} {{ cred_file }}.pre-2g
              chmod 600 {{ cred_file }}.pre-2g
            }
            cp -a {{ new_cred_file }} {{ cred_file }}
            chmod 600 {{ cred_file }}
          become: true
          changed_when: true

        # stop, poll until the metrics port clears, start. `rc-service restart` does
        # not wait and cloudflared's grace period is 30s — that killed six respawns on
        # zero.
        - name: Cycle the connector onto the new tunnel
          ansible.builtin.shell: |
            rc-service cloudflared stop >/dev/null 2>&1
            i=0
            while [ $i -lt 45 ]; do
              netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' || break
              i=$((i+2)); sleep 2
            done
            netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' && exit 1
            rc-service cloudflared start >/dev/null 2>&1
          become: true
          changed_when: true

        - name: Wait for the NEW connector to register
          ansible.builtin.uri:
            url: "{{ probe }}/ready"
            return_content: true
          register: ready
          until: (ready.content | default('{}') | from_json).readyConnections | default(0) > 0
          # 24 x 5s, not 12. The original budget was set on `one` and `zero` — a Pi 4 and
          # a Pi 5. `two` is an ARM1176 with no AES acceleration, and 60s is not obviously
          # enough there for a fresh tunnel to register four edge connections. Overridable
          # with -e ready_retries=N; raising it costs only a slower failure.
          retries: "{{ ready_retries | default(24) }}"
          delay: 5

        - name: Check it is serving the reviewed rules, not the old ones
          ansible.builtin.uri:
            url: "{{ probe }}/config"
            return_content: true
          register: now_cfg

        - name: The rules in force must match the file we reviewed
          ansible.builtin.assert:
            # reject the EMPTY hostname, not just undefined ones. The connector reports
            # the catch-all as `"hostname": ""` — a defined key — while the YAML omits
            # the key altogether, so `selectattr('hostname', 'defined')` counts five
            # against four and fails on a config that is perfectly correct.
            that: >-
              ((now_cfg.content | from_json).config.ingress
               | selectattr('hostname', 'defined') | map(attribute='hostname')
               | reject('equalto', '') | list | sort)
              == (move_hosts | sort)
            fail_msg: >-
              The connector came up but is serving a different set of hostnames than
              the reviewed config. The rescue below puts the old credentials back and
              cycles; DNS has NOT been touched.

      rescue:
        # The .pre-2g backup only exists once the swap task has run. A failure before
        # that — install-system-file refusing the diff, say — leaves the live
        # credentials untouched, and an unconditional cp would turn that clean abort
        # into a broken rescue.
        - name: Restore the pre-2g credentials
          ansible.builtin.shell: |
            set -e
            if [ -f {{ cred_file }}.pre-2g ]; then
              cp -a {{ cred_file }}.pre-2g {{ cred_file }}
              chmod 600 {{ cred_file }}
              touch /tmp/.cutover-restored
            fi
          become: true
          changed_when: true

        # Only when something was actually restored. A failure at the install step —
        # before any swap — fires this rescue too, and cycling there is a pointless
        # outage on a clean abort. The marker file is written by the restore above.
        # The other half of the restore. Without it the box comes back with the old
        # credentials and the new config, which do not name the same tunnel.
        - name: Restore the pre-2g config
          ansible.builtin.shell: |
            set -e
            if [ -f {{ cfg_file }}.pre-2g ]; then
              cp -a {{ cfg_file }}.pre-2g {{ cfg_file }}
              chmod 644 {{ cfg_file }}
              touch /tmp/.cutover-restored
            fi
          become: true
          changed_when: true

        - name: Cycle the connector back onto the old tunnel
          ansible.builtin.shell: |
            [ -f /tmp/.cutover-restored ] || exit 0
            rm -f /tmp/.cutover-restored
            rc-service cloudflared stop >/dev/null 2>&1
            i=0
            while [ $i -lt 45 ]; do
              netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' || break
              i=$((i+2)); sleep 2
            done
            netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' && exit 1
            rc-service cloudflared start >/dev/null 2>&1
          become: true
          changed_when: true

        # A ROLLBACK THAT IS NOT VERIFIED IS A CLAIM. The rescue said the host was back
        # on the old tunnel without ever asking the connector, so a failed cycle-back
        # read exactly like a successful one.
        - name: Did the old connector actually come back
          ansible.builtin.uri:
            url: "{{ probe }}/ready"
            return_content: true
          register: back_ready
          until: (back_ready.content | default('{}') | from_json).readyConnections | default(0) > 0
          retries: "{{ ready_retries | default(24) }}"
          delay: 5
          failed_when: false

        - name: Say so if it did not
          ansible.builtin.debug:
            msg: >-
              THE ROLLBACK RESTORED THE FILES BUT THE CONNECTOR IS NOT SERVING —
              {{ inventory_hostname }}'s tunnel is DOWN. Reach it over the mesh
              ({{ inventory_hostname }}-one or -zero, which do not use its tunnel) and
              look: rc-service cloudflared status, then run it in the foreground, because
              this host logs nowhere until 2f is done here.
          changed_when: true
          when: (back_ready.content | default('{}') | from_json).readyConnections | default(0) | int == 0

        - name: Stop here — rolled back, DNS never touched
          ansible.builtin.fail:
            msg: >-
              The new connector never came up serving the reviewed rules, so
              {{ cred_file }}.pre-2g was restored over {{ cred_file }} and the
              connector was cycled back onto {{ live_tunnel }}. No DNS record was
              touched — every hostname still points where it did. Fix the tunnel and
              re-run; the .pre-2g backup is still in place.

    # A RESUMED run skips the whole block, but the connector still has to be up and
    # serving the reviewed rules before any DNS record moves — the same wait and
    # verify, re-run as a sanity check. No rescue here: this run changed nothing on
    # the host, so there is nothing to roll back, and the fail_msg says what to do
    # by hand.
    - name: Wait for the connector to register (resumed run)
      ansible.builtin.uri:
        url: "{{ probe }}/ready"
        return_content: true
      register: ready
      until: (ready.content | default('{}') | from_json).readyConnections | default(0) > 0
      retries: 12
      delay: 5
      when: swap_done

    - name: Check it is serving the reviewed rules, not the old ones (resumed run)
      ansible.builtin.uri:
        url: "{{ probe }}/config"
        return_content: true
      register: now_cfg
      when: swap_done

    - name: The rules in force must match the file we reviewed (resumed run)
      ansible.builtin.assert:
        that: >-
          ((now_cfg.content | from_json).config.ingress
           | selectattr('hostname', 'defined') | map(attribute='hostname')
           | reject('equalto', '') | list | sort)
          == (move_hosts | sort)
        fail_msg: >-
          The connector came up but is serving a different set of hostnames than the
          reviewed config. DNS has NOT been touched — restore
          {{ cred_file }}.pre-2g over {{ cred_file }} and cycle to go back.
      when: swap_done

    - name: The new tunnel is live and no DNS has moved yet
      ansible.builtin.debug:
        msg: >-
          connector on {{ new_tunnel }} is serving {{ move_hosts | length }} rules.
          Every hostname is DOWN from here until its record is repointed, below.
      changed_when: true

    # ── move DNS, one record at a time ───────────────────────────────────────
    - name: Repoint each hostname at the new tunnel
      ansible.builtin.uri:
        url: "{{ cf_api }}/zones/{{ zone_id }}/dns_records/{{ item.json.result[0].id }}"
        method: PATCH
        headers: "{{ api_hdr }}"
        body_format: json
        body:
          content: "{{ new_tunnel }}.cfargotunnel.com"
        status_code: [200, 201]
      loop: "{{ recs.results }}"
      loop_control:
        label: "{{ item.item }}"
      delegate_to: localhost
      no_log: true

    - name: Wait for each hostname to answer as it did before
      ansible.builtin.uri:
        url: "https://{{ item }}"
        method: HEAD
        timeout: 20
        follow_redirects: none
      register: after
      failed_when: false
      until: after.status == baseline_status[item]
      retries: 10
      delay: 6
      loop: "{{ move_hosts }}"
      delegate_to: localhost

    - name: Done
      ansible.builtin.debug:
        msg:
          - "every hostname answers as it did before the cutover"
          - "the previous tunnel now has no DNS pointing at it, and no connector"
          - "next: cloudflare-tunnel-retire.yml, once you are happy to lose it"
          - "cleanup here: rm {{ new_cred_file }} and {{ cred_file }}.pre-2g"
      changed_when: true
