---
# Phase 1 — the read-only fleet inventory. What actually runs where.
#
#     cd ansible && ansible-playbook playbooks/server-generate-fleet-inventory.yml -K
#
# This CHANGES NOTHING on any host. Every task is a read, every one is
# `changed_when: false`, and there is no handler, no template and no copy aimed at a
# target. The only file written is the report, on the control node. A full run then
# commits it there and asks before pushing (the vars below, and decisions.md).
#
# WHY -K IS NEEDED, and why that is the design rather than a wart:
#   `gavin` is not in the `docker` group — decisions.md, because it is root-equivalent —
#   and NOPASSWD sudo is in roadmap.md's "Not doing". So reading the docker socket costs
#   one password prompt per run. That is fine for a human-run inventory and it is exactly
#   why a scheduled run of it was never simple: it would need passwordless sudo on zero
#   and one, which this repo refuses. The scheduled read-only run from `two` (Phase 8) was
#   dropped on 2026-10-25, no control node inside the fleet; if scheduled reports come back,
#   the shape is probably the one bin/hw-inventory already uses — each host writes its own
#   report locally, and the control node fetches it unprivileged.
#
# `check_mode: false` on the command tasks is deliberate: under --check, command/shell are
# skipped by default, so a `--check` run of a read-only playbook would report nothing and
# look like success. A read is safe in check mode by definition.

- name: Read what runs on the fleet and write the report
  hosts: fleet
  gather_facts: true
  become: false

  vars:
    # COMMITTING THE REPORT, 2026-10-24 (owner). A FULL run with a real change commits
    # docs/fleet-inventory.md on its own, with a short machine-written message, and asks
    # before pushing. -e commit=false writes the file only; -e push=true pushes without
    # asking (for a scheduled run); -e push=false commits and leaves the push to you.
    # A partial run and --check never commit or push: the file's header says a partial
    # report must not be committed over a full one. Partial means a host left out by --limit
    # OR one that did not answer — ansible_play_hosts drops a host once it is unreachable or
    # fails, where ansible_play_hosts_all would still list it and commit its section erased.
    inventory_commit: "{{ commit | default(true) | bool }}"
    inventory_full: "{{ (ansible_play_hosts | sort) == (groups['fleet'] | sort) }}"
    inventory_path: docs/fleet-inventory.md
    # The message (owner, 2026-10-25): when the report was generated, and which machines
    # changed, from the committed report against the new one with the Generated line ignored.
    inventory_summary_py: |
      import re, subprocess, sys
      repo, path = sys.argv[1], sys.argv[2]
      def parse(text):
          hosts, host, sec = {}, None, None
          for line in text.split('\n'):
              m = re.match(r'^## `([^`]+)`', line)
              if m:
                  host, sec = m.group(1), 'system'
                  hosts.setdefault(host, {})
                  continue
              m = re.match(r'^### (.+)', line)
              if m and host:
                  sec = m.group(1).strip().lower()
                  continue
              if host and not line.startswith('Generated '):
                  hosts[host].setdefault(sec, []).append(line)
          return hosts
      old = subprocess.run(['git', '-C', repo, 'show', 'HEAD:' + path], capture_output=True, text=True).stdout
      o, n = parse(old), parse(open(repo + '/' + path).read())
      changed = [h for h in sorted(set(o) | set(n)) if o.get(h) != n.get(h)]
      new = open(repo + '/' + path).read()
      m = re.search(r'^Generated (\d{4}-\d\d-\d\d)T(\d\d:\d\d)', new, re.M)
      when = f'{m.group(1)} {m.group(2)} UTC' if m else 'now'
      print(f'fleet inventory: regenerated {when}, ' + (f"changed on {', '.join(changed)}" if changed else 'header changed only'))

  tasks:
    # ── before writing anything: this checkout must be origin/main exactly ──────────
    # Fetch, never pull: pulling would change the very playbook being run under you.
    # Behind means origin has commits you have not read; ahead means a push would publish
    # your own unpushed work along with the report. Either way, you decide, not this play.
    - name: "Full run: fetch origin to compare this checkout with it"
      ansible.builtin.command:
        cmd: git fetch --quiet origin
        chdir: "{{ control_checkout }}"
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full

    - name: "Full run: count commits this checkout and origin/main differ by"
      ansible.builtin.command:
        cmd: git rev-list --left-right --count HEAD...origin/main
        chdir: "{{ control_checkout }}"
      register: inventory_ahead_behind
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full

    - name: "Full run: read uncommitted edits to the report"
      # The same test as the one after writing, Generated line ignored, so the timestamp an
      # unchanged run leaves behind does not refuse the next run. Staged edits count too.
      ansible.builtin.command:
        cmd: git diff HEAD --numstat -I '^Generated ' -- {{ inventory_path }}
        chdir: "{{ control_checkout }}"
      register: inventory_dirty
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full

    - name: "Full run: check this checkout is origin/main, report unedited"
      ansible.builtin.assert:
        that:
          - (inventory_ahead_behind.stdout.split() | map('int') | list) == [0, 0]
          - inventory_dirty.stdout | length == 0
        fail_msg: >-
          This checkout is {{ (inventory_ahead_behind.stdout.split() | default(['?', '?']))[0] }} ahead
          of and {{ (inventory_ahead_behind.stdout.split() | default(['?', '?']))[1] }} behind
          origin/main{{ ', and docs/fleet-inventory.md has uncommitted edits' if inventory_dirty.stdout | default('') else '' }}.
          Behind: `git pull` and read what came in. Ahead: push or set aside your commits.
          Edits: discard them (the file is generated). Or run with -e commit=false.
          Nothing has been written.
        quiet: true
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full

    - name: Read the listening TCP sockets on {{ inventory_hostname }}
      # The authoritative answer to "what is published here" — better than any compose
      # file, because it is what the kernel thinks. -p needs root for process names; the
      # socket list itself does not, so a failed become still leaves useful output.
      #
      # ss(8) is iproute2, and only `zero` has it — BusyBox provides netstat but not ss,
      # so this read came back UNREADABLE on `one` and `two` until the fallback existed.
      # netstat is the right fallback rather than a second-best one: docs/recovery.md
      # already greps `netstat -tln` to check the ports after a reboot, so it is the tool
      # this fleet reaches for anyway.
      #
      # Spelled as an explicit if/else, not `command -v ss && ss || netstat`: CLAUDE.md
      # records that `a && b || c` tests b's status, so a present-but-failing ss would
      # silently fall through and the output would not say which tool answered.
      ansible.builtin.shell: |
        if command -v ss >/dev/null 2>&1; then
          ss -H -ltnp
        else
          echo "# ss(8) absent on this host — netstat below, different columns"
          netstat -tlnp 2>/dev/null || netstat -tln
        fi
      register: audit_sockets
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    - name: "If containerized: read containers and their ports"
      # One inspect per host rather than ps + inspect merged in Jinja. `xargs -r` is what
      # stops a host with no containers running a bare `docker inspect` and failing.
      #
      # The {% raw %} guard is load-bearing: Docker's --format is Go template syntax and
      # uses the same {{ }} delimiters as Jinja, so without it Ansible tries to resolve
      # `.Name` as an Ansible variable and the task dies before docker ever sees it.
      #
      # NEVER WIDEN THIS FORMAT STRING TO `{{json .}}`, AND NEVER ADD `.Config.Env`.
      # Eight named fields are extracted on purpose. `ionic-traces` and `destiny-director`
      # pass their secrets with `env_file:`, so those containers' Config.Env holds a live
      # Discord token and a MySQL root password — and this task's output is rendered into
      # docs/fleet-inventory.md, which is COMMITTED. A dump-everything format would put
      # those secrets in git history, where CLAUDE.md's two-way scan would find them only
      # after the fact. `{{json .}}` is the obvious simplification and it is the bug.
      #
      # Naming one more field is not the same act as widening, and .HostConfig.NetworkMode
      # is here because WITHOUT IT THE REPORT WAS WRONG. NetworkSettings.Ports is empty for
      # a container that does not own its network stack, so both Syncthings and qBittorrent
      # rendered a bare `—` under Published — which reads as "publishes nothing" and is the
      # opposite of true: zero's Syncthing serves 8384/22000 on the host's own stack, and
      # `torrent` is reachable on 8080 through gluetun's namespace. That is this repo's
      # recurring failure shape — an empty result and a different answer collapsing into
      # one cell — so the template distinguishes them and this field is what lets it.
      #
      # `.Id` is last and is NOT rendered. It exists so the template can turn NetworkMode's
      # `container:<64 hex>` back into the peer's name. A container id changes on every
      # recreate, and recreating gluetun is a routine, expected act here (port-forwarding.md
      # — it is how you get a new forwarded port), so rendering the raw id would put a
      # meaningless one-line diff in a COMMITTED file every time. A generated file whose
      # diffs are usually noise stops being read, which costs more than the id ever bought.
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ container_cli }} ps -aq | xargs -r {{ container_cli }} inspect --format
        '{% raw %}{{.Name}}|{{.Config.Image}}|{{.State.Status}}|{{.HostConfig.RestartPolicy.Name}}|{{index .Config.Labels "com.docker.compose.project"}}|{{.HostConfig.NetworkMode}}|{{range $p, $c := .NetworkSettings.Ports}}{{if $c}}{{(index $c 0).HostIp}}:{{(index $c 0).HostPort}}->{{$p}} {{end}}{{end}}|{{.Id}}{% endraw %}'
        | sed 's|^/||'
      args:
        executable: /bin/sh
      register: audit_containers
      changed_when: false
      check_mode: false
      failed_when: false
      become: true
      when: inventory_hostname in groups['containerized'] | default([])

    - name: "If containerized: read the named volumes"
      # Here because a dev container's volume IS its login and its history — 22 MB of
      # transcripts in or3-dev's case — so a volume nobody has listed is a thing nobody
      # knows they would lose. See docs/management-plane.md.
      ansible.builtin.command: >-
        {{ container_cli }} volume ls --format
        '{% raw %}{{.Name}}{% endraw %}'
      register: audit_volumes
      changed_when: false
      check_mode: false
      failed_when: false
      become: true
      when: inventory_hostname in groups['containerized'] | default([])

    - name: Read the btrfs subvolumes on {{ inventory_hostname }}
      # Asked for by the owner, 2026-10-24: the inventories named the disks that hold btrfs
      # but nothing recorded the subvolumes, so on `one` the four older ones existed in this
      # repo only as subvolid=256…259 in fstab.
      #
      # NO MOUNT, and that is the point of how it is spelt. The obvious shape mounts the
      # array's top level (fstab's noauto /mnt on `one`, /mnt/ext on `zero`) and lists it,
      # and the owner's first ask was to do that on a throwaway directory rather than /mnt.
      # Neither is needed: `btrfs subvolume list -a` lists EVERY subvolume of the filesystem
      # a path is on, whatever is or is not mounted, so any mounted /media/* path is enough
      # and this play stays one that changes nothing on any host. Each filesystem is listed
      # once, through its first mountpoint, keyed by its uuid.
      #
      # gen is dropped by the template: it moves on every write, and this file is committed.
      # Sizes are not read: without qgroups (not enabled here; enabling them is a change)
      # the only per-subvolume figure is `btrfs filesystem du`, a walk of every file —
      # hundreds of GiB of Immich on the critical box — which is not a read to put in an
      # inventory. Each mount is printed with its filesystem's uuid, so the template says
      # where each subvolume is mounted without confusing two filesystems' subvolume 256.
      ansible.builtin.shell: |
        if ! command -v btrfs >/dev/null 2>&1; then
          echo "== no btrfs-progs"
          exit 0
        fi
        awk '$3 == "btrfs" { print $2, $4 }' /proc/self/mounts | {
          seen=""
          while read -r mp opts; do
            uuid=$(btrfs filesystem show "$mp" 2>/dev/null | sed -n 's/.*uuid: *\([0-9a-f-]*\).*/\1/p' | head -n 1)
            if [ -z "$uuid" ]; then
              echo "== unreadable $mp"
              continue
            fi
            echo "== mount $uuid $mp $opts"
            case " $seen " in *" $uuid "*) continue ;; esac
            seen="$seen $uuid"
            echo "== filesystem $uuid $mp"
            btrfs subvolume list -a "$mp" || echo "== unreadable $mp"
          done
        }
      args:
        executable: /bin/sh
      register: audit_btrfs
      changed_when: false
      check_mode: false
      failed_when: false
      become: true

    - name: "If a read failed: print what could not be read"
      # A partial inventory that looks complete is the wrong-reason pass this repo keeps
      # designing against. If a read failed, say so on the host it failed on.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: could not read
          {{ 'sockets ' if audit_sockets.rc | default(1) != 0 else '' }}
          {{ 'containers ' if (audit_containers.rc | default(0)) not in [0] else '' }}
          {{ 'btrfs ' if audit_btrfs.rc | default(1) != 0 or '== unreadable' in audit_btrfs.stdout | default('') else '' }}
          — the report will show this as UNREADABLE, not as empty.
      changed_when: true
      when: >-
        audit_sockets.rc | default(1) != 0
        or (audit_containers.rc | default(0)) not in [0]
        or audit_btrfs.rc | default(1) != 0
        or '== unreadable' in audit_btrfs.stdout | default('')

    - name: Write docs/fleet-inventory.md
      # In THIS play, delegated, rather than a second play against localhost. A second
      # play is the obvious shape and it has a trap: `--limit zero` excludes localhost
      # too, so the play matches no hosts, the report is silently never written, and the
      # run still reports ok=4 failed=0. Delegating keeps the render inside the play that
      # gathered the facts, so it happens whatever --limit says.
      #
      # run_once with the linear strategy runs this after every host has finished the
      # tasks above, so hostvars are fully populated by the time the template renders.
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/fleet-inventory.md.j2"
        dest: "{{ fleet_inventory_report }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true
      vars:
        # lookups always run on the control node, so this is its clock and not
        # some audited host's — which matters, since one thing this play has already
        # found is a host whose container timestamps sit in 1970.
        report_generated: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        # Which hosts this run actually asked. A --limit run renders the others as
        # UNREACHABLE, and without this line a partial report is indistinguishable from
        # a full one where two hosts were down.
        audited_hosts: "{{ ansible_play_hosts_all }}"

    # ── after writing: commit a real change, then ask before pushing ────────────────
    - name: "If a host is missing: say nothing is committed"
      ansible.builtin.debug:
        msg: >-
          Not committed: {{ groups['fleet'] | difference(ansible_play_hosts) | join(', ') }}
          {{ 'was' if (groups['fleet'] | difference(ansible_play_hosts) | length) == 1 else 'were' }}
          left out or did not answer, and a partial report is never committed.
      changed_when: true
      delegate_to: localhost
      run_once: true
      when: inventory_commit and not inventory_full and not ansible_check_mode

    - name: "Full run: check the report changed beyond its Generated line"
      ansible.builtin.command:
        cmd: git diff --numstat -I '^Generated ' -- {{ inventory_path }}
        chdir: "{{ control_checkout }}"
      register: inventory_changed
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode

    - name: "If nothing changed: say there is nothing to commit"
      ansible.builtin.debug:
        msg: Unchanged since its last commit apart from the Generated line, so nothing is committed.
      changed_when: true
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length == 0

    - name: "If it changed: check the report for secret names"
      # CLAUDE.md's name-based scan, on the one file being committed. The play extracts named
      # container fields and never Config.Env, so a hit means something new leaked in.
      ansible.builtin.command:
        cmd: grep -nEI 'PRIVATE_KEY|DISCORD_TOKEN|OPENVPN_PASSWORD|ROOT_PASSWORD|PBKDF2|eyJhIjoi' {{ inventory_path }}
        chdir: "{{ control_checkout }}"
      register: inventory_secrets
      changed_when: false
      check_mode: false
      failed_when: inventory_secrets.rc == 0
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0

    - name: "If it changed: write the commit message"
      ansible.builtin.command:
        argv: [python3, -I, -c, "{{ inventory_summary_py }}", "{{ control_checkout }}", "{{ inventory_path }}"]
      register: inventory_message
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0

    - name: "If it changed: commit the report, and only the report"
      # A pathspec commit takes this file's working-tree state and nothing else, so anything
      # you had staged stays out of it.
      ansible.builtin.command:
        argv: [git, commit, --quiet, -m, "{{ inventory_message.stdout | trim }}", --, "{{ inventory_path }}"]
        chdir: "{{ control_checkout }}"
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0

    - name: "If committed: print the commit"
      ansible.builtin.command:
        cmd: git show --stat --format=%s HEAD
        chdir: "{{ control_checkout }}"
      register: inventory_show
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0

    - name: "If committed: show what would be pushed"
      ansible.builtin.debug:
        msg: "{{ inventory_show.stdout_lines }}"
      changed_when: true
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0

    - name: "If committed: ask before pushing"
      ansible.builtin.pause:
        prompt: "Push this commit to origin/main? [y/N]"
      register: inventory_answer
      delegate_to: localhost
      run_once: true
      when:
        - inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0
        - push is not defined

    - name: "If confirmed: push the commit"
      ansible.builtin.command:
        cmd: git push --quiet origin HEAD:main
        chdir: "{{ control_checkout }}"
      register: inventory_push
      failed_when: false
      delegate_to: localhost
      run_once: true
      when:
        - inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0
        - (push | default(false) | bool) if push is defined else ((inventory_answer.user_input | default('') | lower) in ['y', 'yes'])

    - name: "If committed: say whether it was pushed"
      ansible.builtin.debug:
        msg: >-
          {{ 'pushed to origin/main' if (inventory_push.rc | default(1)) == 0 else
             ('push FAILED, the commit is local: ' ~ (inventory_push.stderr | default('')) | trim) if inventory_push is not skipped else
             'not pushed: the commit is local; `git push` when ready' }}
      changed_when: true
      delegate_to: localhost
      run_once: true
      when: inventory_commit and inventory_full and not ansible_check_mode and inventory_changed.stdout | length > 0
