---
# EVERY SSH BLOCK THIS REPO OWNS, ON THE MACHINE YOU RUN IT FROM. One command.
#
#     cd ansible
#     ansible-playbook playbooks/client-home-ssh-config.yml --check --diff
#     ansible-playbook playbooks/client-home-ssh-config.yml
#
# ONE CONTAINER, by name — the token-rotation path, and the way to add a token for a
# container whose tunnel has only just been created:
#
#     ansible-playbook playbooks/client-home-ssh-config.yml -e container=or3-dev -e replace_token=true
#
# `container`, NOT `alias`. Each import below pins `alias:` for its container; an `-e alias=`
# would outrank both (extra vars win) and configure the same container twice.
# `container` is read by the `when:` on each import and nowhere else. With it the fleet half is
# skipped too, so the run touches exactly one block and one token.
#
# Run it from THIS DIRECTORY — ansible.cfg is read from the cwd and is the only thing
# pointing at ./inventory. _assert-inventory.yml, imported by both halves below, turns a
# wrong working directory into a failure instead of an empty recap and exit 0.
#
# Run it WHEREVER THE CLIENT IS: the phone, or WSL on the laptop. It reaches no host in
# the fleet — it writes ~/.ssh/config on the machine executing it, and from WSL it also
# writes the Windows side of the same laptop through /mnt/c. Nothing here can touch a Pi.
#
# ── THE REGISTRY ────────────────────────────────────────────────────────────────
#
# SINCE THE 2026-10-27 CUTOVER THE WAY IN IS `dev`, the hub: one tunnel, one hostname
# (`dev.<dns_zone>`), its connector a sidecar in dev/compose.yaml, and the hub's menu lists
# every dev container's sessions (dev/README.md). The one other door is or3-dev's: its
# hostname rides the hub's tunnel (dev/cloudflared.yml) and still reaches or3-dev's own sshd,
# where the phone's or3-tunnel reverse forward lands.
#
#   container   image lives in
#   ─────────   ──────────────────
#   dev         this repo, dev/hub/ — the hub
#   or3-dev     or3
#
# RETIRED, their blocks removed by _client-retired-dev-ssh.yml on a whole run: infra-dev,
# dd-dev, ds-dev. Each had a tunnel of its own until the cutover; each is a row in the hub's
# menu now. Run this from main only after the cutover's step 7 — before it, the old doors are
# still the way in, and this would remove them.
#
# NO PORT COLUMN since 2026-10-04: nothing is published on the host any more. The way in
# is the tunnel; break glass is `ssh -t <host> 'cd ~/infra/dev && make shell'` (docker
# exec, sudo asks). docs/decisions.md has the row.
#
# ── TOKENS ARE MINTED, NOT PASTED ──────────────────────────────────────────────
#
# Each import below mints THIS client's own Access service token for its container,
# named `<alias>-<client>`, over the Cloudflare API, and adds it to the container's
# policy. The fleet gets one too, `fleet-<client>`, never expiring, for the Access gate on
# the Pis' ssh hostnames (_client-fleet-token.yml; the gate is
# server-create-fleet-ssh-access.yml). It needs the API token at ~/.config/cloudflare/api-token on this machine and
# prints how to mint one if it is missing. A container with no Access application yet is
# skipped with a message, blocks still written.
#
# THE TWO HALVES ARE TAGGED, so either runs alone:
#
#     ansible-playbook playbooks/client-home-ssh-config.yml --tags ssh       # blocks only, no API token needed
#     ansible-playbook playbooks/client-home-ssh-config.yml --tags access    # tokens only
#
# The order below is deliberate: the hub first, then or3-dev's door, then the retired ones' removal.
#
# ── ADDING A DOOR ───────────────────────────────────────────────────────────────
#
# A row above and an import below — but only after the edge and the host halves exist,
# because a client block is the third of three:
#
#     ansible-playbook playbooks/server-create-dev-container.yml -e container=<alias> -e secrets_dir=<its mount>
#     ansible-playbook playbooks/client-home-ssh-config.yml
#
# The first line is the edge half for any alias and, for `dev`, the host half as well. A new
# dev container needs no alias at all — the hub's menu lists it once dev/compose.yaml names
# its repo (HUB_REPO_*) — so a row here is for a door, not for another container. An alias
# taken out of `retired_aliases` in _client-retired-dev-ssh.yml first, if it was ever there.
#
# NO NEW COLLECTIONS, and no tasks of its own: this file is composition and a table.
# Everything it runs belongs to the two plays it imports.

# ── a typo in -e container= must not be a silent, successful, empty run ─────────────
# Every import below is gated on `container`, so a misspelt alias skips all of them and exits
# 0 with an empty recap — the exact shape _assert-inventory.yml exists to prevent.
- name: Check -e container names a dev container
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check -e container, if given, names a known dev container
      ansible.builtin.assert:
        that: container is not defined or container in ['dev', 'or3-dev']
        fail_msg: "-e container={{ container | default('') }} names no dev container; the registry in this file's header has the two"
        success_msg: "{{ 'one container: ' ~ container if container is defined else 'every container' }}"

# ── the servers: the fleet, the mesh, and the LAN and cross-box rescue paths ────
- name: Write the fleet ssh block on this client
  ansible.builtin.import_playbook: _client-fleet-ssh.yml
  # Tagged `ssh` here, not task by task inside it: the fleet play is ssh config and the
  # script its ProxyCommand runs, and no service token is read or written there, so the
  # whole of it is the `ssh` half.
  tags: [ssh]
  # `when` on an import applies to every task the import brings in, which is what makes
  # -e container=<alias> a one-container run rather than a whole one.
  when: container is not defined

# After the block, so the script that loads the token exists whatever this half does. The
# token is the `access` half, and a client without one still connects to an ungated host.
- name: Mint this client's fleet ssh token
  ansible.builtin.import_playbook: _client-fleet-token.yml
  tags: [access]
  when: container is not defined

# ── the dev containers ─────────────────────────────────────────────────────────
# One import each rather than a loop over the table above, deliberately. _client-dev-ssh.yml
# mints a credential and writes it at 0600; a loop would put those calls and those writes
# inside `loop:` results, where `no_log` hides which iteration is which and a mistake
# becomes a mistake about a secret. Static imports keep the reviewed
# single-alias play exactly as it is, and each stanza reads as the fact it asserts.
- name: Write ssh block and token for dev, the hub
  ansible.builtin.import_playbook: _client-dev-ssh.yml
  vars:
    alias: dev
  when: container is not defined or container == 'dev'

- name: Write ssh block and token for or3-dev
  ansible.builtin.import_playbook: _client-dev-ssh.yml
  vars:
    alias: or3-dev
  when: container is not defined or container == 'or3-dev'

# Last, and on a whole run only: what the old per-container doors left on this client.
- name: Remove the retired dev containers' ssh blocks
  ansible.builtin.import_playbook: _client-retired-dev-ssh.yml
  tags: [ssh]
  when: container is not defined
