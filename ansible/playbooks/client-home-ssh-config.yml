---
# EVERY SSH BLOCK THIS REPO OWNS, ON THE MACHINE YOU RUN IT FROM. One command.
#
#     cd ansible
#     ansible-playbook playbooks/client-home-ssh-config.yml --check --diff
#     ansible-playbook playbooks/client-home-ssh-config.yml
#
# ONE CONTAINER, by name — the token-rotation path, and the way to add a token for a
# container whose tunnel has only just been created:
#
#     ansible-playbook playbooks/client-home-ssh-config.yml -e only=or3-dev -e replace_token=true
#
# `only`, NOT `alias`. Each import below pins `alias:` for its container; an `-e alias=`
# would outrank all four (extra vars win) and configure the same container four times.
# `only` is read by the `when:` on each import and nowhere else. With it the fleet half is
# skipped too, so the run touches exactly one block and one token.
#
# Run it from THIS DIRECTORY — ansible.cfg is read from the cwd and is the only thing
# pointing at ./inventory. _assert-inventory.yml, imported by both halves below, turns a
# wrong working directory into a failure instead of an empty recap and exit 0.
#
# Run it WHEREVER THE CLIENT IS: the phone, or WSL on the laptop. It reaches no host in
# the fleet — it writes ~/.ssh/config on the machine executing it, and from WSL it also
# writes the Windows side of the same laptop through /mnt/c. Nothing here can touch a Pi.
#
# ── THE REGISTRY ────────────────────────────────────────────────────────────────
#
# Four dev containers run on `zero`, one tunnel each, with its own hostname
# (`<alias>.<dns_zone>`) and a connector inside it — the tunnel's identity travels with the
# container, so moving one to `one` changes no ingress rule anywhere
# (docs/management-plane.md § Addressing). `infra-dev` and `or3-dev` have tunnels; `dd-dev`
# and `ds-dev` do not yet (Phase 5) and are not running. Every one gets its ssh block; a
# container with no Access application yet gets no token, and `ssh <c>` says so.
#
#   container   image lives in
#   ─────────   ──────────────────
#   infra-dev   this repo, dev/
#   or3-dev     or3
#   dd-dev      destiny-director
#   ds-dev      dossier
#
# NO PORT COLUMN since 2026-10-04: nothing is published on the host any more. The way in
# is the tunnel; break glass is `ssh -t <host> 'cd ~/infra/dev && make shell'` (docker
# exec, sudo asks). docs/decisions.md has the row.
#
# ── TOKENS ARE MINTED, NOT PASTED ──────────────────────────────────────────────
#
# Each import below mints THIS client's own Access service token for its container,
# named `<alias>-<client>`, over the Cloudflare API, and adds it to the container's
# policy. It needs the API token at ~/.config/cloudflare/api-token on this machine and
# prints how to mint one if it is missing. A container with no Access application yet is
# skipped with a message, blocks still written.
#
# THE TWO HALVES ARE TAGGED, so either runs alone:
#
#     ansible-playbook playbooks/client-home-ssh-config.yml --tags ssh       # blocks only, no API token needed
#     ansible-playbook playbooks/client-home-ssh-config.yml --tags access    # tokens only
#
# The order below is deliberate: the two containers with tunnels first.
#
# ── ADDING A FIFTH ──────────────────────────────────────────────────────────────
#
# A row above and an import below — but only after the edge and the host halves exist,
# because a client block is the third of three:
#
#     ansible-playbook playbooks/server-create-dev-container.yml -e name=<c> -e secrets_dir=<its mount>
#     ansible-playbook playbooks/client-home-ssh-config.yml
#
# The first line is the edge half for any container and, for infra-dev only, the host
# half as well — the other containers' host side lives in their own repos. The host half
# learns the hostname from the edge half within that one run; on its own command line
# `tunnel_hostname` stays explicit, because there an absent value means "preserve what
# dev/.env already says" rather than "turn the tunnel on" (CLAUDE.md § Repo invariants).
#
# NO NEW COLLECTIONS, and no tasks of its own: this file is composition and a table.
# Everything it runs belongs to the two plays it imports.

# ── a typo in -e only= must not be a silent, successful, empty run ─────────────
# Every import below is gated on `only`, so a misspelt alias skips all of them and exits
# 0 with an empty recap — the exact shape _assert-inventory.yml exists to prevent.
- name: Refuse an `only` that names no container
  hosts: localhost
  gather_facts: false
  tasks:
    - name: only names a container in the registry above
      ansible.builtin.assert:
        that: only is not defined or only in ['infra-dev', 'or3-dev', 'dd-dev', 'ds-dev']
        fail_msg: "-e only={{ only | default('') }} names no dev container; the registry in this file's header has the four"
        success_msg: "{{ 'one container: ' ~ only if only is defined else 'every container' }}"

# ── the servers: the fleet, the mesh, and the LAN and cross-box rescue paths ────
- name: The fleet
  ansible.builtin.import_playbook: _client-fleet-ssh.yml
  # Tagged `ssh` here, not task by task inside it: the fleet play is ssh config and nothing
  # else — no Access token is read or written — so the whole of it is the `ssh` half.
  tags: [ssh]
  # `when` on an import applies to every task the import brings in, which is what makes
  # -e only=<container> a one-container run rather than a whole one.
  when: only is not defined

# ── the dev containers ─────────────────────────────────────────────────────────
# One import each rather than a loop over the table above, deliberately. _client-dev-ssh.yml
# mints a credential and writes it at 0600; a loop would put those calls and those writes
# inside `loop:` results, where `no_log` hides which iteration is which and a mistake
# becomes a mistake about a secret. Static imports keep the reviewed
# single-alias play exactly as it is, and each stanza reads as the fact it asserts.
- name: infra-dev
  ansible.builtin.import_playbook: _client-dev-ssh.yml
  vars:
    alias: infra-dev
  when: only is not defined or only == 'infra-dev'

- name: or3-dev
  ansible.builtin.import_playbook: _client-dev-ssh.yml
  vars:
    alias: or3-dev
  when: only is not defined or only == 'or3-dev'

- name: dd-dev
  ansible.builtin.import_playbook: _client-dev-ssh.yml
  vars:
    alias: dd-dev
  when: only is not defined or only == 'dd-dev'

- name: ds-dev
  ansible.builtin.import_playbook: _client-dev-ssh.yml
  vars:
    alias: ds-dev
  when: only is not defined or only == 'ds-dev'
