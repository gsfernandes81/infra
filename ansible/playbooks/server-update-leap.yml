---
# UPDATE ONE LEAP HOST, by hand, as every update on this fleet is (docs/decisions.md §
# Updates are by hand on every host). From the control node, one host at a time:
#
#     cd ansible
#     ansible-playbook playbooks/server-update-leap.yml -e target=one -K
#
# WHAT IT DOES, in order, and a failure at any step stops it before the reboot:
#   1. Refuses a host that is not openSUSE Leap. Alpine hosts update with apk.
#   2. Shows what is running there, and asks before going on: the reboot ends every
#      container and every live session (one carries the dev hub's agents).
#   3. `transactional-update up`, which builds the update into a new snapshot and touches
#      nothing running. It reports any package a lock held back, as the Pi's boot
#      firmware is locked (decisions.md § The Pi's boot firmware is locked).
#   4. Reports the Compose openSUSE's repositories offer: at 5.5.0 or newer, the host can
#      go back to the package (decisions.md § Leap hosts carry upstream's Compose).
#   5. Moves cloudflared and Compose to leap/pins, downloading each from its release and
#      installing it only on a SHA-256 match, and keeps the binary it replaces:
#      /usr/local/lib/cloudflared.previous and /usr/local/lib/docker/docker-compose.previous.
#      cloudflared is NOT restarted: this play's own connection may run through it.
#   6. Proves the new cloudflared before the reboot that starts it: it runs, reports its
#      pin, and validates this box's tunnel config. If not, the previous binary goes back
#      and the play stops short of the reboot, so a bad pin never costs the way in.
#   7. Reboots, and waits for the box to answer this play again.
#   8. Reports what changed, then is done only once both ways in answer: the tunnel serving
#      (cloudflared's ready connections) and the tailnet reaching another fleet host
#      (tailscale ping, a relayed path counting), nothing failed but openSUSE's known
#      first-boot unit, and both pins in place. On a host with a locked array, the report
#      ends with the unlock command, printed even when a check after the reboot fails.
#
# The update recipes every login shows (leap/motd) are installed before the update, so
# they are in the snapshot it builds.
#
# -K IS REQUIRED: every step past the first runs as root.
#
# MOVING A PIN is a commit to leap/pins (both architectures' SHA-256), then this play.
# Going back is the same install from the .previous file, by hand (leap/README.md).
#
# Under --check it reads, reports what it would move, and changes nothing: no update, no
# download, no reboot. The simulation (sim/microos/run-host.sh) runs it for real, with
# -e confirm=yes, which answers the question in step 2 for a run nobody types into, and
# -e ways_in_check=false, since its stand-in tunnel cannot connect and it has no tailnet;
# the play says so in its report.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: fleet

- name: Check a target was named
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read {{ inventory_hostname }}'s OS
      ansible.builtin.slurp:
        src: /etc/os-release
      register: upd_os

    - name: Check {{ inventory_hostname }} runs openSUSE Leap
      ansible.builtin.assert:
        that: (upd_os.content | b64decode) is search('^ID="?opensuse-leap"?$', multiline=True)
        fail_msg: >-
          {{ inventory_hostname }} is not openSUSE Leap, and this play updates only Leap
          hosts. Nothing has been touched.
        success_msg: "{{ (upd_os.content | b64decode) | regex_search('PRETTY_NAME=\"?([^\"\\n]*)', '\\1') | default(['Leap'], true) | first }}"

    # key=value lines, each printed even when its value is empty, so a missing or odd
    # binary cannot shift the others. check_mode: false, here and below, on reads that
    # change nothing: --check would otherwise skip them and have nothing to report.
    - name: Read the architecture, kernel and pinned versions
      ansible.builtin.shell: &read_versions |
        printf 'arch=%s\n' "$(uname -m)"
        printf 'kernel=%s\n' "$(uname -r)"
        printf 'cloudflared=%s\n' "$({{ cloudflared_bin }} --version 2>/dev/null | sed -n 's/.*version \([^ ]*\).*/\1/p' | head -n 1)"
        printf 'compose=%s\n' "$({{ compose_bin }} version --short 2>/dev/null | sed 's/^v//' | head -n 1)"
        printf 'array=%s\n' "$(grep -qE '^[^#].*noauto' /etc/crypttab 2>/dev/null && echo locked || echo none)"
      register: upd_before
      changed_when: false
      check_mode: false

    - name: Note the pins and what is installed
      ansible.builtin.set_fact:
        upd_was: "{{ dict(upd_before.stdout_lines | map('split', '=')) }}"

    - name: Check leap/pins has both pins for this architecture
      ansible.builtin.assert:
        that:
          - upd_was.arch in ['aarch64', 'x86_64']
          - pins.cloudflared_version | default('') | length > 0
          - pins['cloudflared_sha256_' ~ upd_was.arch] | default('') | length == 64
          - pins.compose_version | default('') | length > 0
          - pins['compose_sha256_' ~ upd_was.arch] | default('') | length == 64
        fail_msg: "{{ pins_file }} lacks a version or a {{ upd_was.arch }} SHA-256. Nothing has been touched."
        success_msg: >-
          cloudflared {{ upd_was.cloudflared or 'missing' }} -> {{ pins.cloudflared_version | default('?') }},
          Compose {{ upd_was.compose or 'missing' }} -> {{ pins.compose_version | default('?') }}

    - name: Note the release assets for this architecture
      ansible.builtin.set_fact:
        upd_asset: >-
          {{ {'aarch64': {'cloudflared': 'arm64', 'compose': 'aarch64'},
              'x86_64': {'cloudflared': 'amd64', 'compose': 'x86_64'}}[upd_was.arch] }}
        upd_cfd_moves: "{{ upd_was.cloudflared != pins.cloudflared_version }}"
        upd_compose_moves: "{{ upd_was.compose != pins.compose_version }}"

    - name: Read the containers running there
      ansible.builtin.command: docker ps --format '{{ "{{" }}.Names{{ "}}" }}'
      register: upd_containers
      changed_when: false
      failed_when: false
      check_mode: false
      become: true

    - name: Ask before updating and rebooting
      ansible.builtin.pause:
        prompt: |
          {{ inventory_hostname }} will be updated and REBOOTED. Running there now:
            {{ ('Docker did not answer: ' ~ (upd_containers.stderr | default('') | trim)) if upd_containers.rc | default(1) != 0
               else (upd_containers.stdout_lines | join(', ') if upd_containers.stdout_lines else 'no containers') }}
          The reboot ends all of them, and every live session. Go on? [y/N]
      register: upd_answer
      when: confirm != 'yes' and not ansible_check_mode

    - name: Check the answer was yes
      ansible.builtin.assert:
        that: confirm == 'yes' or ansible_check_mode or (upd_answer.user_input | default('') | lower) in ['y', 'yes']
        fail_msg: Not confirmed. Nothing has been touched.
        success_msg: going on

    - name: Install the update recipes every login shows
      ansible.builtin.copy:
        src: "{{ control_checkout }}/leap/motd"
        dest: /etc/motd.d/50-infra-updates
        mode: "0644"
      become: true

    # Async, polled: an update on a Pi can run for tens of minutes without a word, and a
    # silent ssh session through the tunnel may be dropped on the way.
    - name: Update into a new snapshot (transactional-update)
      ansible.builtin.command: transactional-update --non-interactive up
      register: upd_tu
      changed_when: "'New default snapshot' in upd_tu.stdout | default('')"
      async: 3600
      poll: 15
      become: true

    # zypper lists what it will not install under one line, indented, wrapping as it goes;
    # a lock is one reason, the Pi's boot firmware being locked (decisions.md).
    - name: Note the updates zypper held back
      ansible.builtin.set_fact:
        upd_held: >-
          {{ upd_tu.stdout | default('') | regex_findall('will NOT be installed:\n((?:[ \t]+\S.*(?:\n|$))+)')
             | join(' ') | split | unique }}

    - name: Read the Compose openSUSE offers
      ansible.builtin.shell: >-
        zypper --non-interactive --no-refresh info docker-compose |
        sed -n 's/^Version *: *//p' | head -n 1
      register: upd_leap_compose
      changed_when: false
      failed_when: false
      check_mode: false
      become: true

    - name: "If cloudflared is off its pin: download it"
      ansible.builtin.get_url:
        url: "https://github.com/cloudflare/cloudflared/releases/download/{{ pins.cloudflared_version }}/cloudflared-linux-{{ upd_asset.cloudflared }}"
        dest: /var/tmp/infra-cloudflared
        checksum: "sha256:{{ pins['cloudflared_sha256_' ~ upd_was.arch] }}"
        mode: "0755"
        force: true
      when: upd_cfd_moves | bool
      become: true

    - name: "If cloudflared moves: keep the current as previous"
      ansible.builtin.copy:
        src: "{{ cloudflared_bin }}"
        dest: "{{ cloudflared_previous }}"
        remote_src: true
        mode: "0755"
      when: upd_cfd_moves | bool and upd_was.cloudflared != ''
      become: true

    - name: "If cloudflared moves: install the pinned binary"
      ansible.builtin.copy:
        src: /var/tmp/infra-cloudflared
        dest: "{{ cloudflared_bin }}"
        remote_src: true
        mode: "0755"
      when: upd_cfd_moves | bool and not ansible_check_mode
      become: true

    - name: "If Compose is off its pin: download it"
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ pins.compose_version }}/docker-compose-linux-{{ upd_asset.compose }}"
        dest: /var/tmp/infra-docker-compose
        checksum: "sha256:{{ pins['compose_sha256_' ~ upd_was.arch] }}"
        mode: "0755"
        force: true
      when: upd_compose_moves | bool
      become: true

    - name: "If Compose moves: keep the current as previous"
      ansible.builtin.copy:
        src: "{{ compose_bin }}"
        dest: "{{ compose_previous }}"
        remote_src: true
        mode: "0755"
      when: upd_compose_moves | bool and upd_was.compose != ''
      become: true

    - name: "If Compose moves: install the pinned binary"
      ansible.builtin.copy:
        src: /var/tmp/infra-docker-compose
        dest: "{{ compose_bin }}"
        remote_src: true
        mode: "0755"
      when: upd_compose_moves | bool and not ansible_check_mode
      become: true

    - name: Remove the downloads
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/var/tmp/infra-cloudflared, /var/tmp/infra-docker-compose]
      become: true

    # The reboot restarts the tunnel this play may have come in by, so the binary it will
    # start is proved first (CLAUDE.md § Changing the thing you are connected through).
    - name: Prove the new cloudflared before the reboot
      when: not ansible_check_mode
      block:
        - name: Run the installed cloudflared, and validate the tunnel config
          ansible.builtin.shell: |
            set -e
            v=$({{ cloudflared_bin }} --version | sed -n 's/.*version \([^ ]*\).*/\1/p' | head -n 1)
            echo "version $v"
            [ "$v" = '{{ pins.cloudflared_version }}' ]
            if [ -e /etc/cloudflared/config.yml ]; then
              {{ cloudflared_bin }} tunnel --config /etc/cloudflared/config.yml ingress validate
            fi
            {{ compose_bin }} version --short | grep -qx 'v\{0,1\}{{ pins.compose_version }}'
          register: upd_proof
          changed_when: false
          become: true
      rescue:
        - name: "If unproved: put the previous cloudflared back"
          ansible.builtin.copy:
            src: "{{ cloudflared_previous }}"
            dest: "{{ cloudflared_bin }}"
            remote_src: true
            mode: "0755"
          when: upd_cfd_moves | bool and upd_was.cloudflared != ''
          become: true

        - name: "If unproved: put the previous Compose back"
          ansible.builtin.copy:
            src: "{{ compose_previous }}"
            dest: "{{ compose_bin }}"
            remote_src: true
            mode: "0755"
          when: upd_compose_moves | bool and upd_was.compose != ''
          become: true

        - name: "If unproved: stop before the reboot"
          ansible.builtin.fail:
            msg: >-
              The pinned binaries did not prove themselves:
              {{ upd_proof.stdout | default('') }} {{ upd_proof.stderr | default('') }}.
              The previous ones are back in place and nothing has rebooted. The update's
              snapshot is built and waits for the next boot; leap/pins is the thing to look at.

    - name: Reboot {{ inventory_hostname }}
      ansible.builtin.reboot:
        msg: server-update-leap.yml is rebooting this box
        reboot_timeout: 900
      become: true

    # ── after the reboot: read everything, report, then judge ────────────────
    - name: "Ways in: wait for the tunnel's ready connections"
      ansible.builtin.command: curl -fsS -m 5 http://127.0.0.1:20241/ready
      register: upd_ready
      until: upd_ready.rc == 0 and (upd_ready.stdout | from_json).readyConnections | default(0) > 0
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false
      when: ways_in_check | bool and not ansible_check_mode

    # --until-direct=false: a relayed path is still a way in, and zero is remote.
    - name: "Ways in: check Tailscale reaches {{ tailnet_peer }}"
      ansible.builtin.command: tailscale ping --until-direct=false -c 3 {{ tailnet_peer }}
      register: upd_tailnet
      until: upd_tailnet.rc == 0
      retries: 6
      delay: 10
      changed_when: false
      failed_when: false
      when: ways_in_check | bool and not ansible_check_mode

    - name: Read the units that failed this boot
      ansible.builtin.shell: |
        timeout 600 systemctl is-system-running --wait >/dev/null 2>&1 || true
        systemctl --failed --no-legend --plain | awk '{print $1}'
      register: upd_failed
      changed_when: false
      become: true
      when: not ansible_check_mode

    - name: Read the kernel and pinned versions after
      ansible.builtin.shell: *read_versions
      register: upd_after_raw
      changed_when: false
      when: not ansible_check_mode

    # openSUSE's import-pubring-from-rpmdb (bsc#1245786) can fail on a boot whose rpm
    # database has new keys, after importing every one; harmless, and fixed upstream
    # (sim/microos/host/checks.sh). Any other failed unit is a failure here.
    - name: Note what the checks after the reboot found
      ansible.builtin.set_fact:
        upd_now: "{{ dict(upd_after_raw.stdout_lines | default([]) | map('split', '=')) }}"
        upd_bad_units: "{{ upd_failed.stdout_lines | default([]) | reject('equalto', 'import-pubring-from-rpmdb.service') | list }}"
        upd_tunnel_ok: "{{ upd_ready.rc | default(1) == 0 and ((upd_ready.stdout | default('{}') | from_json).readyConnections | default(0)) > 0 }}"
        upd_tailnet_ok: "{{ upd_tailnet.rc | default(1) == 0 }}"

    - name: Print what changed, and what is next
      # changed_when: true, or display_ok_hosts = False in ansible.cfg hides the report this
      # play exists to give (ansible.cfg, beside the setting).
      ansible.builtin.debug:
        msg: >-
          {{ (['DRY RUN: nothing was updated, downloaded or rebooted.'] if ansible_check_mode else
              [inventory_hostname ~ (' updated into a new snapshot' if upd_tu.changed else ' had no update to install')
               ~ ' and rebooted: kernel ' ~ upd_was.kernel ~ ' -> ' ~ upd_now.kernel | default('?') ~ '.']) +
             ['cloudflared ' ~ (upd_was.cloudflared or 'missing') ~ ' -> ' ~ pins.cloudflared_version ~
                (', the previous kept at ' ~ cloudflared_previous if upd_cfd_moves | bool and upd_was.cloudflared != '' else '') ~ '.',
              'Compose ' ~ (upd_was.compose or 'missing') ~ ' -> ' ~ pins.compose_version ~
                (', the previous kept at ' ~ compose_previous if upd_compose_moves | bool and upd_was.compose != '' else '') ~ '.',
              'openSUSE offers Compose ' ~ (upd_leap_compose.stdout | default('') | trim or 'unknown') ~
                '; at 5.5.0 or newer the host can go back to the package (decisions.md).',
              ('Held back by zypper: ' ~ (upd_held | join(' ')) ~ '.') if upd_held else 'Nothing was held back.'] +
             ([] if ansible_check_mode else
              ['Ways in: NOT CHECKED (-e ways_in_check=false).' if not ways_in_check | bool else
               'Ways in: the tunnel ' ~ ('serving' if upd_tunnel_ok | bool else 'NOT SERVING') ~ ', the tailnet ' ~
                ('reaching ' if upd_tailnet_ok | bool else 'NOT REACHING ') ~ tailnet_peer ~ '.',
               ('Failed units: ' ~ upd_bad_units | join(', ') ~ '.') if upd_bad_units else 'No unit failed but any known one.']) +
             (['The array is locked; unlock it as hosts/three/leap/README.md § Unlocking says.']
                if not ansible_check_mode and upd_now.array | default('') == 'locked' else []) }}
      changed_when: true

    - name: Check both ways in, the units and the pins
      ansible.builtin.assert:
        that:
          - not ways_in_check | bool or upd_tunnel_ok | bool
          - not ways_in_check | bool or upd_tailnet_ok | bool
          - upd_bad_units | length == 0
          - upd_now.cloudflared | default('') == pins.cloudflared_version
          - upd_now.compose | default('') == pins.compose_version
        fail_msg: >-
          {{ inventory_hostname }} came back, but not whole; the report above says which
          part. The update is in place: `systemctl status <unit>` there says why a unit
          failed, and `sudo transactional-update rollback` then a reboot goes back to the
          snapshot before.
        success_msg: done
      when: not ansible_check_mode
