---
# NOT A PLAYBOOK YOU RUN — the underscore says so. client-home-ssh-config.yml imports it;
# run that. This is its fleet half: the fleet's ssh aliases, into this control node's
# ~/.ssh/config.
#
# Companion to _client-dev-ssh.yml, which owns the dev-container blocks in the same file.
# Separate markers, separate blocks, neither aware of the other — blockinfile edits its
# own block in place, so re-running either one cannot disturb the other or append a
# duplicate.
#
# THIS PLAY WRITES ON THE CONTROL NODE ONLY: the ssh block, and the small script its
# ProxyCommand runs (~/.config/fleet/access-ssh, which loads this client's fleet Access
# token into cloudflared when there is one; _client-fleet-token.yml mints the token). It
# touches no host in the fleet, needs no become, and reaches nothing over the network. It
# is safe to re-run at any time, including from a rescue.
#
#   ansible-playbook playbooks/client-home-ssh-config.yml --tags ssh
#
# FROM THIS DIRECTORY. ansible.cfg is read from the cwd and is the only thing pointing at
# ./inventory; run from anywhere else, `hosts: control` matches nothing and the play is
# skipped whole with an empty recap and exit 0. _assert-inventory.yml turns that silence
# into a failure — its header carries the reasoning.
#
# The Windows laptop cannot be an Ansible target without sshd on it, which is a lot of
# machinery for one file. So the play also renders the block with a Windows cloudflared
# path to a local file, for pasting — one source of truth for the host list either way.
#
#
# THE REASONING BEHIND THE ALIASES THIS WRITES IS docs/ssh-clients.md. It moved there on
# 2026-08-28: it had been inline in the templates, which meant a client's ssh config
# carried the dev-container explanation once PER CONTAINER — 484 lines to say 130 lines
# of configuration. The blocks now keep what you need mid-rescue; the doc keeps the rest.
# NO NEW COLLECTIONS: ansible.builtin throughout.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: control

- name: Write the fleet ssh block on this control node
  hosts: control
  gather_facts: false

  vars:
    # lookup('env','HOME'), never ~. On Termux the passwd entry reports /data, which is
    # not writable — host_vars/localhost.yml documents the same trap for remote_tmp.
    home: "{{ lookup('env', 'HOME') }}"
    ssh_config: "{{ home }}/.ssh/config"

    # The LAN addresses, in one place. These are what a jump host resolves, so they are
    # the fleet's own view of itself rather than anything DNS knows.
    ip_zero: "192.168.86.100"
    ip_one: "192.168.86.101"
    ip_two: "192.168.86.102"

    # The laptop, as WSL sees it. Set EITHER of these to "" to skip the Windows half
    # entirely. From WSL these are directly writable, so the block is MANAGED there rather
    # than pasted — which is most of what makes a WSL control node worth having at all.
    #
    # THE PROBE IS THE HOME DIRECTORY, NOT THE CONFIG FILE. It used to be the config, which
    # meant a laptop that had never had one fell through to the paste path even though the
    # play could plainly have written it — `create: true` on the blockinfile below closes
    # that, and _client-dev-ssh.yml probes the same way for the same reason.
    windows_home: "/mnt/c/Users/gavin"
    windows_ssh_config: "{{ windows_home }}/.ssh/config"

    # Two spellings of one binary: the first is written into the config and is read by
    # Windows ssh; the second is the same file as WSL sees it, so it can be checked.
    # Stated rather than derived — a replace() chain over backslashes is clever, and
    # clever is what put a bare `cloudflared` into a ProxyCommand in the first place.
    windows_cloudflared: '"C:\Program Files (x86)\cloudflared\cloudflared.exe"'
    windows_cloudflared_wsl: "/mnt/c/Program Files (x86)/cloudflared/cloudflared.exe"

    windows_out: "{{ home }}/ssh-fleet-block-windows.txt"

    # The phone's Termux sshd, reached over `adb forward`. The uid is Android's for the
    # Termux app and CHANGES if the app is reinstalled — Termux's own config carried a
    # stale u0a593 for some time. If `ssh s24` starts refusing, check this first.
    s24_user: "u0_a414"

    # The adb hop is a laptop thing: from the phone itself, s24 is localhost and there is
    # nothing to forward. Set per-render below, never globally.
    adb_jump: false

    # Connection multiplexing. Win32-OpenSSH has never implemented it — ControlMaster
    # there fails with `getsockname failed: Not a socket`, which reads like a network
    # fault. On for POSIX clients, off for the Windows render.
    multiplex: true

    # The fleet's Access token, and the script that hands it to cloudflared. The token
    # is minted and written by _client-fleet-token.yml; this play writes the script, which
    # holds no secret, so `--tags ssh` alone leaves a working (if tokenless) client.
    fleet_dir: "{{ home }}/.config/fleet"
    fleet_token_file: "{{ fleet_dir }}/token"
    fleet_access_ssh: "{{ fleet_dir }}/access-ssh"

    # The PHONE's copy of that script, as the phone names it. The -s24 aliases have the
    # phone run it over ssh, so this is a Termux path and is never executed on the client
    # writing this file. Absolute, because a non-interactive ssh session's PATH is not
    # Termux's interactive one.
    phone_fleet_access_ssh: "/data/data/com.termux/files/home/.config/fleet/access-ssh"

    # The Windows side of the laptop: the wrapper that is the fleet ProxyCommand there, and
    # the token it reads. Two spellings each, stated rather than derived, as above.
    windows_home_win: 'C:\Users\gavin'
    win_fleet_wrapper: '{{ windows_home_win }}\.ssh\cf-access-fleet.cmd'
    win_fleet_wrapper_wsl: "{{ windows_home }}/.ssh/cf-access-fleet.cmd"
    win_fleet_token_file: '{{ windows_home_win }}\.config\fleet\token'

    # Which ProxyCommand the block renders. Set per render, never globally.
    windows: false

  tasks:
    # BEST EFFORT ONLY — the assertion below is on the RESULT, not on this succeeding.
    #
    # `shell`, not `command`: `command -v` is a SHELL BUILTIN, so the command module has
    # nothing to exec and reports cloudflared missing on a host where it is plainly on
    # PATH. That is what failed on Termux, 2026-08-23. _client-dev-ssh.yml had the same task
    # with the failure hidden behind `| default('cloudflared', true)` until 2026-08-24,
    # when it was fixed to this same resolve-then-stat pattern — detection is still not
    # to be trusted anywhere; the stat on the result is the guard.
    - name: Read where cloudflared is on PATH
      ansible.builtin.shell: command -v cloudflared
      register: cfd_path
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Note which cloudflared path the fleet block uses
      ansible.builtin.set_fact:
        cfd_resolved: >-
          {{ cloudflared_path | default(cfd_path.stdout | trim, true) }}

    # THE ACTUAL GUARD. Whatever path we are about to write into every tunnel alias, it
    # has to exist and be executable HERE. Asserting that detection succeeded proves
    # nothing about the string it produced; asserting the file is there proves the thing
    # that matters. An absolute path, not a bare name: ssh runs ProxyCommand through
    # /bin/sh, whose PATH is not your interactive one, so a bare name resolves in your
    # shell and then fails inside ssh — which presents as the tunnel being down.
    - name: Probe the chosen cloudflared path
      ansible.builtin.stat:
        path: "{{ cfd_resolved }}"
      register: cfd_stat
      when: cfd_resolved | length > 0

    - name: Check the chosen cloudflared exists and is executable
      ansible.builtin.assert:
        that:
          - cfd_resolved | length > 0
          - cfd_stat.stat.exists | default(false)
          - cfd_stat.stat.executable | default(false)
        fail_msg: >-
          Could not establish an executable cloudflared on this control node
          (resolved to '{{ cfd_resolved | default('') }}'). Every tunnel alias in this
          block runs it as a ProxyCommand, and a block naming a missing binary looks
          exactly like a fleet-wide outage. Install it, or pass the path explicitly:
          -e cloudflared_path=/data/data/com.termux/files/usr/bin/cloudflared

    # The template, not the rendered block: that would check only the branches this
    # client's vars select, and the Windows-only stanzas are the ones that matter. Before
    # anything is written, so a failure leaves no client half-done. "\r" is admitted: a
    # checkout with core.autocrlf, or a template saved from a Windows editor, renders to
    # LF anyway (the Jinja lexer normalises newlines), so refusing it would blame a dash
    # that is not there. NOT GUARDED: the paste file's own wrapper lines further down,
    # which are ASCII by hand.
    - name: Check the fleet ssh templates are plain ASCII
      ansible.builtin.assert:
        that: lookup('file', '../templates/' ~ item) is not search('[^\t\n\r -~]')
        fail_msg: >-
          ansible/templates/{{ item }} has a character outside printable ASCII.
          The laptop's copy of this block is read and edited under a Windows codepage,
          where an em dash or a box-drawing rule turns into several characters of
          something else, and in the .cmd wrapper into a command. Use -, --, or a row of -
          instead (docs/ssh-clients.md).
        quiet: true
      loop:
        - ssh-fleet-block.j2
        - fleet-access-ssh.sh.j2
        - cf-access-fleet.cmd.j2

    - name: Create ~/.ssh if missing, mode 700
      ansible.builtin.file:
        path: "{{ home }}/.ssh"
        state: directory
        mode: "0700"

    # ControlPath sockets. Absent, every multiplexed connection fails with an opaque
    # `unix_listener: cannot bind` that reads like a network problem.
    - name: Create ~/.ssh/cp for Ansible's ControlPath sockets
      # ~/.ssh/cp, and it is NOT the same directory as ~/.ssh/cm below. Two multiplexing
      # configs coexist and each needs its own socket directory:
      #
      #   ~/.ssh/cp   ansible.cfg's `ssh_args = … -o ControlPath=~/.ssh/cp/%C`
      #   ~/.ssh/cm   the infra-fleet block's `ControlPath ~/.ssh/cm/%n-%r`
      #
      # Only the second was created here, so a control node that had run the client plays
      # still failed the first time it ran a play against a fleet HOST:
      #
      #   unix_listener: cannot bind to path ~/.ssh/cp/<hash>: No such file or directory
      #
      # reported as UNREACHABLE, which reads like a network fault and is a missing mkdir.
      # It hid for months because `hosts: control` plays connect locally and never
      # multiplex, so the phone — where the directory was made by hand, as ansible.cfg
      # says to — was the only node that had ever needed it.
      ansible.builtin.file:
        path: "{{ home }}/.ssh/cp"
        state: directory
        mode: "0700"

    - name: Create ~/.ssh/cm for the fleet block's ControlPath
      ansible.builtin.file:
        path: "{{ home }}/.ssh/cm"
        state: directory
        mode: "0700"

    - name: Create ~/.ssh/config if missing, mode 600
      ansible.builtin.file:
        path: "{{ ssh_config }}"
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    # LF THROUGHOUT, BEFORE ANY blockinfile TOUCHES THE FILE, removals included — here
    # and again for the laptop's Windows file below. blockinfile finds its block by
    # comparing each line to the marker plus os.linesep, "\n" here, so in a CRLF file its
    # own markers do not match: it inserts a second block below the first, ssh, taking
    # the first value it obtains, keeps reading the stale one, and the removals find
    # nothing. Not only a Windows file's problem: WSL's own ~/.ssh/config turned out to be
    # CRLF too, on 2026-10-03, by the dry run's diff adding an infra-dev block under the
    # one already there. LF, not CRLF, because LF is the only ending blockinfile can
    # write, and every ssh here, Windows OpenSSH included, reads it; the .cmd wrapper is
    # the one file that must be CRLF, and _client-dev-ssh.yml says why.
    #
    # grep and sed, not `replace`: that module opens the file with universal newlines,
    # never sees a "\r", and reports ok. rc 2 is a missing or unreadable file: missing only
    # under --check, where the touch above creates nothing and blockinfile's `create`
    # handles it on the real run; unreadable, and blockinfile fails with its own message.
    #
    # THE DOUBLE QUOTES ON grep's "\r$" ARE LOAD-BEARING: YAML turns them into a real CR.
    # Single-quoted, GNU grep reads `\r` as the letter r, matches every config, and the
    # sed reports changed on every run. sed's `\r` and --follow-symlinks are GNU sed's,
    # which is what WSL (Debian/Ubuntu) and Termux both ship; busybox sed has neither.
    # Only a CR at the end of a line is stripped; a lone one is text, and stays. The grep
    # asks exactly that question, "\r$" and not "\r", or a lone CR would make the sed
    # report changed, and the --check notice fire, on every run forever.
    - name: Probe ~/.ssh/config for CRLF line endings
      ansible.builtin.command:
        argv: [grep, -qs, "\r$", "{{ ssh_config }}"]
      register: posix_crlf
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "If CRLF: convert ~/.ssh/config to LF"
      ansible.builtin.command:
        argv: [sed, -i, --follow-symlinks, 's/\r$//', "{{ ssh_config }}"]
      when: posix_crlf.rc == 0

    # The sed above does not run under --check, so neither do its consequences: the
    # removals find nothing and the diff shows a second block under the stale one. Said
    # here because the play comment is not what the person running --check is reading.
    - name: "--check, CRLF: print why the diff is wrong"
      ansible.builtin.debug:
        msg: >-
          {{ ssh_config }} has CRLF line endings. A real run converts it to LF first; this
          dry run cannot, so the diff below shows the fleet block ADDED under the existing
          one. The real run edits it in place.
      changed_when: true
      when:
        - ansible_check_mode
        - posix_crlf.rc == 0

    # THE MARKER NAMES THE PLAYBOOK, so the 2026-08-29 rename (ssh-client.yml ->
    # configure-client-fleet.yml) orphaned every block written before it: the next run
    # inserted a second fleet block instead of editing the first, and ssh, taking the
    # first value it obtains, kept reading the old one. Harmless for the Pis, whose
    # stanzas match; not for anything the template has since changed or dropped — the
    # `zero-dev-*` aliases lived on in the old block. The 2026-10-04 rename to
    # client-home-ssh-config.yml (the play you run; this half is imported by it) adds the
    # second entry. _client-dev-ssh.yml carries the same task for its own blocks, where
    # the stale one hid the claude-sessions door.
    - name: Delete old-marker fleet blocks from ~/.ssh/config
      ansible.builtin.blockinfile:
        path: "{{ ssh_config }}"
        create: true
        state: absent
        marker: "{{ item }}"
      loop:
        - "# {mark} infra-fleet (ansible/playbooks/ssh-client.yml)"
        - "# {mark} infra-fleet (ansible/playbooks/configure-client-fleet.yml)"

    # The script before the block that names it, so a run that stops between the two
    # leaves the old block, which works, rather than a block naming a missing script.
    - name: Create ~/.config/fleet, mode 700
      ansible.builtin.file:
        path: "{{ fleet_dir }}"
        state: directory
        mode: "0700"

    - name: Write the fleet ProxyCommand script, mode 700
      ansible.builtin.template:
        src: ../templates/fleet-access-ssh.sh.j2
        dest: "{{ fleet_access_ssh }}"
        mode: "0700"
      vars:
        cloudflared: "{{ cfd_resolved }}"

    # insertbefore, NOT the default append. `Host *` carries the defaults and must stay
    # last: ssh takes the first value it obtains, so a fleet block placed after it would
    # silently lose to it. If `Host *` is absent the block appends, which is correct for
    # a file that has no defaults section yet.
    - name: Write the fleet block in ~/.ssh/config above Host *
      ansible.builtin.blockinfile:
        path: "{{ ssh_config }}"
        create: true
        # Names the play you RE-RUN, not this imported half — see _client-dev-ssh.yml.
        marker: "# {mark} infra-fleet (ansible/playbooks/client-home-ssh-config.yml)"
        insertbefore: '^Host \*\s*$'
        block: "{{ lookup('template', '../templates/ssh-fleet-block.j2') }}"
        mode: "0600"
      vars:
        cloudflared: "{{ cfd_resolved }}"

    # ── the Windows laptop ────────────────────────────────────────────────
    # Under WSL, C:\Users\gavin\.ssh\config is a real writable file at /mnt/c/... So
    # from there the block is MANAGED rather than pasted, and the host list cannot
    # diverge between the two clients by anyone forgetting to paste.
    - name: Probe for the laptop's Windows home through WSL
      ansible.builtin.stat:
        path: "{{ windows_home }}"
      register: win_home
      check_mode: false
      when:
        - windows_home | length > 0
        - windows_ssh_config | length > 0

    - name: Note whether the laptop's Windows side is written
      ansible.builtin.set_fact:
        on_windows_client: >-
          {{ (windows_home | length > 0)
             and (windows_ssh_config | length > 0)
             and (win_home.stat.exists | default(false))
             and (win_home.stat.isdir | default(false)) }}

    # Checkable after all, because WSL can see it. This was the one string in this play
    # nobody had verified; from Termux it still is, and the paste file says so.
    - name: "WSL only: probe for the Windows cloudflared.exe"
      ansible.builtin.stat:
        path: "{{ windows_cloudflared_wsl }}"
      register: win_cfd
      when: on_windows_client | bool

    - name: "WSL only: check Windows has cloudflared.exe"
      ansible.builtin.assert:
        that: win_cfd.stat.exists | default(false)
        fail_msg: >-
          {{ windows_home }} is a directory, so this looks like WSL with the laptop in
          reach — but {{ windows_cloudflared_wsl }} does not exist. Writing the block
          anyway would give the laptop a ProxyCommand that fails on every tunnel alias.
          Install cloudflared on Windows, or set -e windows_home="" to skip the Windows
          half.
      when: on_windows_client | bool

    # LF, for the reasons given where ~/.ssh/config gets the same three tasks above.
    # Under drvfs, sed -i can also print "preserving permissions ... Operation not
    # permitted" and still exit 0: the refusal that keeps `mode:` off these tasks.
    - name: "WSL only: probe the Windows ssh config for CRLF"
      ansible.builtin.command:
        argv: [grep, -qs, "\r$", "{{ windows_ssh_config }}"]
      register: win_crlf
      changed_when: false
      failed_when: false
      check_mode: false
      when: on_windows_client | bool

    - name: "WSL, if CRLF: convert the Windows ssh config to LF"
      ansible.builtin.command:
        argv: [sed, -i, --follow-symlinks, 's/\r$//', "{{ windows_ssh_config }}"]
      when:
        - on_windows_client | bool
        - win_crlf.rc | default(1) == 0

    - name: "--check, Windows CRLF: print why the diff is wrong"
      ansible.builtin.debug:
        msg: >-
          {{ windows_ssh_config }} has CRLF line endings. A real run converts it to LF
          first; this dry run cannot, so the diff below shows the fleet block ADDED under
          the existing one. The real run edits it in place.
      changed_when: true
      when:
        - ansible_check_mode
        - on_windows_client | bool
        - win_crlf.rc | default(1) == 0

    # Two markers this play no longer writes, either of which shadows the managed block
    # the same way. The pre-rename one, as on the POSIX side. And the BARE `infra-fleet`
    # the Termux paste file below carried until 2026-10-03 — a laptop built by pasting
    # it and later managed from WSL got a second block under it, the pasted one first.
    #
    # `create: true` creates nothing on a removal — with no file, blockinfile returns
    # "File not present" — but without it a missing file fails rc=257.
    - name: "WSL only: delete old-marker Windows fleet blocks"
      ansible.builtin.blockinfile:
        path: "{{ windows_ssh_config }}"
        create: true
        state: absent
        marker: "{{ item }}"
      loop:
        - "# {mark} infra-fleet (ansible/playbooks/ssh-client.yml)"
        - "# {mark} infra-fleet (ansible/playbooks/configure-client-fleet.yml)"
        - "# {mark} infra-fleet"
      when: on_windows_client | bool

    # The fleet wrapper, before the block that names it, for the reason the POSIX script
    # comes before the POSIX block. CRLF and no mode, for the reasons on the dev
    # containers' wrapper task in _client-dev-ssh.yml.
    - name: "WSL only: create the Windows .ssh directory"
      ansible.builtin.file:
        path: "{{ windows_home }}/.ssh"
        state: directory
      when: on_windows_client | bool

    - name: "WSL only: write cf-access-fleet.cmd"
      ansible.builtin.template:
        src: ../templates/cf-access-fleet.cmd.j2
        dest: "{{ win_fleet_wrapper_wsl }}"
        newline_sequence: "\r\n"
      when: on_windows_client | bool

    # No `mode:`. /mnt/c is drvfs and does not carry Unix permissions unless mounted with
    # metadata — setting one either fails or silently does nothing, and a task that
    # pretends to have set a mode is worse than one that does not try.
    #
    # LF, and the whole file is LF by now: see the conversion above.
    - name: "WSL only: write the Windows fleet ssh block"
      ansible.builtin.blockinfile:
        path: "{{ windows_ssh_config }}"
        create: true
        marker: "# {mark} infra-fleet (ansible/playbooks/client-home-ssh-config.yml)"
        insertbefore: '^Host \*\s*$'
        block: "{{ lookup('template', '../templates/ssh-fleet-block.j2') }}"
      vars:
        cloudflared: "{{ windows_cloudflared }}"
        adb_jump: true
        multiplex: false
        windows: true
      when: on_windows_client | bool

    # Fallback for a control node that cannot see the laptop — Termux. Only written when
    # the direct write did not happen, so there is never a stale paste file sitting next
    # to a managed one, inviting someone to paste the older of the two.
    - name: "If not WSL: write the Windows block to a paste file"
      ansible.builtin.copy:
        dest: "{{ windows_out }}"
        mode: "0600"
        content: |
          # Paste this into the laptop's ~/.ssh/config, ABOVE its `Host *` block.
          # Generated by ansible/playbooks/client-home-ssh-config.yml - edit the template, not this.
          #
          # The cloudflared path below is NOT verified: this control node cannot see the
          # laptop's filesystem. Run this play from WSL and it manages that file directly,
          # checking the path first.
          #
          # The fleet ProxyCommand on Windows is a wrapper, saved with CRLF endings at
          # {{ win_fleet_wrapper }}. The laptop's fleet token is minted by running the play
          # in WSL; there is no way to make it from here.
          # ---8<--- cf-access-fleet.cmd ---8<---
          {{ lookup('template', '../templates/cf-access-fleet.cmd.j2') }}
          # ---8<--- end ---8<---
          #
          # BEGIN infra-fleet (ansible/playbooks/client-home-ssh-config.yml)
          {{ lookup('template', '../templates/ssh-fleet-block.j2') }}
          # END infra-fleet (ansible/playbooks/client-home-ssh-config.yml)
      vars:
        cloudflared: "{{ windows_cloudflared }}"
        adb_jump: true
        multiplex: false
        windows: true
      # Both conditions. -e windows_ssh_config="" means "skip the Windows half entirely",
      # as the vars comment promises — but with it empty the stat above is skipped, its
      # `exists` defaults false, and this fallback would write the paste file anyway.
      when:
        - windows_home | length > 0
        - windows_ssh_config | length > 0
        - not (on_windows_client | bool)

    - name: Print where the fleet block was written
      ansible.builtin.debug:
        msg:
          - "wrote the infra-fleet block into {{ ssh_config }}, and {{ fleet_access_ssh }}, its ProxyCommand"
          - >-
            windows: {{ 'managed directly at ' ~ windows_ssh_config
            if on_windows_client | bool
            else ('skipped — windows_home or windows_ssh_config is empty'
                  if (windows_home | length == 0 or windows_ssh_config | length == 0)
                  else 'not reachable from here — paste from ' ~ windows_out) }}
          - "verify with: ssh -G two-zero | grep -E 'proxycommand|hostname|user'"
      changed_when: true
