---
# The first playbook in this repo that CHANGES a host. Everything before it reads.
#
#     ansible-playbook playbooks/packages.yml --check --diff --limit one   # prove (no -K)
#     ansible-playbook playbooks/packages.yml -K --diff --limit one        # apply
#
# Apply smallest blast radius first: one, then two, then zero.
#
# The lists are in group_vars/fleet.yml and host_vars/<host>.yml, and the split is the
# point: base_packages is nearly everything, and the only per-host entry is the container
# runtime, because `two` had docker and containerd removed deliberately. Unexplained
# divergence between the three boxes is treated as the bug — it is what made audit.yml
# grow a netstat branch and made one's hardware.md look hand-edited.
#
# ansible.builtin ONLY — NO COLLECTIONS.
#   This fleet runs ansible-core, not the `ansible` metapackage, because the control node
#   is a phone on a metered radio and the metapackage is ~50 MB of collections for AWS,
#   Azure and VMware to talk to three Pis. So `community.general.apk` is not available and
#   neither is anything else outside ansible.builtin. An earlier version of this file used
#   `ansible.builtin.apk`, which simply does not exist — apk has always been in
#   community.general — and it failed at the first task. The same mistake had already cost
#   a run with `stdout_callback = yaml`. See ansible/README.md.
#
# INSTALL ONLY. NOTHING HERE MAY EVER REMOVE A PACKAGE.
#   `apk del` reclaims orphaned dependencies, and CLAUDE.md records the cost: on `two`,
#   iptables was present only as an auto-installed dependency of docker/k3s, and netavark
#   shells out to it while not depending on it — so a tidy-up would have broken rootless
#   podman networking days later, for a reason nobody would connect back. Anything found
#   installed that these lists do not name is left alone.
#
# WHY THE FALLBACKS STAY
#   Installing iproute2 does not license deleting the netstat branch in audit.yml. A host
#   built tomorrow has not run this playbook yet, and that branch is what makes its
#   Listening section a reading rather than an UNREADABLE. Packages remove the need to
#   *rely* on a fallback, not the need to *have* one.

- name: Bring every host up to the declared package set
  hosts: fleet
  gather_facts: true
  become: false

  vars:
    declared_packages: "{{ base_packages + (extra_packages | default([])) }}"

  tasks:
    - name: Find which declared packages are absent
      # Unprivileged: `apk info -e` reads the installed database and needs no root, so a
      # --check run of this playbook needs no sudo password at all. That matters — the
      # cheapest way to look should not require the credential that lets you change things.
      #
      # check_mode: false because a read is safe in check mode by definition, and without
      # it --check would skip this and report nothing to install on every host.
      ansible.builtin.shell: |
        for p in {{ declared_packages | join(' ') }}; do
          apk info -e "$p" >/dev/null 2>&1 || printf '%s ' "$p"
        done
      register: pkg_missing
      changed_when: false
      check_mode: false

    - name: Say what is missing, by name
      # The whole reason for doing this by hand rather than with a package module: the
      # dry run names the packages. A module reports one changed/not-changed for the set,
      # which tells you something will happen but not what — and "something will happen"
      # on a remote box you cannot see is not a thing worth acting on.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ ('WOULD INSTALL — ' + pkg_missing.stdout | trim)
             if pkg_missing.stdout | trim
             else 'complete, nothing to install' }}

    - name: Install the missing packages
      # argv form, so a package name can never be re-split by a shell.
      #
      # `add` and nothing else. Not `upgrade`, not `--upgrade`: this must never become an
      # unscheduled kernel or docker bump on a remote box because someone wanted lsusb.
      # `--no-cache` refreshes the index for this transaction without leaving cache files
      # behind — relevant on `two`, where writes land on the SD card.
      #
      # `command` is skipped under --check automatically, which is what makes the dry run
      # above a genuine dry run rather than a description of something already done.
      ansible.builtin.command:
        argv: "{{ ['apk', 'add', '--no-cache'] + pkg_missing.stdout.split() }}"
      when: pkg_missing.stdout | trim | length > 0
      become: true
      register: pkg_add
      changed_when: pkg_add.rc == 0

    - name: Confirm nothing is still missing
      # Re-read rather than trust the installer's exit code. apk returning 0 says the
      # transaction ran; this says the packages are actually there, which is the claim
      # the playbook is really making.
      ansible.builtin.shell: |
        for p in {{ declared_packages | join(' ') }}; do
          apk info -e "$p" >/dev/null 2>&1 || printf '%s ' "$p"
        done
      register: pkg_recheck
      changed_when: false
      check_mode: false
      when: pkg_missing.stdout | trim | length > 0

    - name: Fail if the re-read disagrees with the install
      ansible.builtin.assert:
        that: not (pkg_recheck.stdout | default('') | trim)
        fail_msg: >-
          {{ inventory_hostname }}: apk exited 0 but these are still absent —
          {{ pkg_recheck.stdout | trim }}. A package name in the lists is probably wrong
          for this architecture; `two` is armhf and does not carry everything.
        success_msg: "{{ inventory_hostname }}: all declared packages present"
      when: pkg_missing.stdout | trim | length > 0
