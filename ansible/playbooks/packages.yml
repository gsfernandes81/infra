---
# The first playbook in this repo that CHANGES a host. Everything before it reads.
#
#     ansible-playbook playbooks/packages.yml -K --check --diff --limit one   # prove
#     ansible-playbook playbooks/packages.yml -K --diff --limit one           # apply
#
# Apply smallest blast radius first: one, then two, then zero.
#
# The lists are in group_vars/fleet.yml and host_vars/<host>.yml, and the split is the
# point: base_packages is nearly everything, and the only per-host entry is the container
# runtime, because `two` had docker and containerd removed deliberately. Unexplained
# divergence between the three boxes is treated as the bug — it is what made audit.yml
# grow a netstat branch and made one's hardware.md look hand-edited.
#
# INSTALL ONLY. NOTHING HERE MAY EVER REMOVE A PACKAGE.
#   `apk del` reclaims orphaned dependencies, and CLAUDE.md records the cost: on `two`,
#   iptables was present only as an auto-installed dependency of docker/k3s, and netavark
#   shells out to it while not depending on it — so a tidy-up would have broken rootless
#   podman networking days later, for a reason nobody would connect back. Anything found
#   installed that these lists do not name is left alone.
#
# WHY THE FALLBACKS STAY
#   Installing iproute2 does not license deleting the netstat branch in audit.yml. A host
#   built tomorrow has not run this playbook yet, and that branch is what makes its
#   Listening section a reading rather than an UNREADABLE. Packages remove the need to
#   *rely* on a fallback, not the need to *have* one.
#
# No platform guard. An earlier version asserted `pkg_mgr == 'apk'` before doing anything;
# that is scaffolding, and stand-up is heading into Ansible too, at which point these
# playbooks should compose rather than each re-checking the platform. The apk module fails
# clearly enough on its own when apk is not there.

- name: Bring every host up to the declared package set
  hosts: fleet
  gather_facts: true
  become: true

  tasks:
    - name: Install the base set and this host's runtime
      # state: present, never latest. `latest` would turn a package playbook into an
      # unscheduled upgrade of whatever it names, on boxes where a kernel or docker bump
      # is something you do while watching, not a side effect of adding lsusb.
      ansible.builtin.apk:
        name: "{{ base_packages + (extra_packages | default([])) }}"
        state: present
        update_cache: true
      register: pkg_result

    - name: Say what happened, per host
      # The apk module reports one changed/not-changed for the whole set, so this names
      # the host and leaves the detail to --diff. A run that changes nothing is the
      # expected steady state and should read as that, not as nothing having happened.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'PACKAGES INSTALLED — see --diff for which' if pkg_result.changed
             else 'already complete, nothing to do' }}
