---
# DEPLOY send2ereader, on whichever host hosts/<host>/send2ereader places it (`one`), at
# bookit.<dns_zone>. Run from the control node:
#
#     cd ansible
#     ansible-playbook playbooks/server-deploy-send2ereader.yml --check -K   # prove
#     ansible-playbook playbooks/server-deploy-send2ereader.yml -K           # deploy
#
# NO --limit / -l: the host is found from the deployment's symlink by the first play of
# server-create-deployment-tunnel.yml, which `-l one` would skip.
#
# -K: the tunnel credentials file belongs to uid 65532, and docker needs root (gavin is not
# in the docker group, CLAUDE.md § Privileged commands).
#
# What one run does, in order:
#   1. server-create-deployment-tunnel.yml, imported unchanged: it pulls the host's checkout
#      to this control node's commit, makes or finds the tunnel, points the bookit record at
#      it, and writes TUNNEL_ID and TUNNEL_CREDENTIALS into .env.
#   2. The play below proves `one` can fetch the pinned image from ghcr, pulls it if it is
#      not there yet, starts both services, checks the app runs that image, and probes
#      bookit from this control node.
# The first run after the sidecar commit is the cutover: bookit is down from the record's
# repoint in step 1 until the start in step 2, which is the pull plus a few seconds.
#
# NOTHING IS BUILT ON `one`. The app is the fork's CI-built image, a literal in
# compose.yaml with its tag (the fork commit) and digest. `pull: missing` is right for a
# digest: an unchanged one is already there and Compose leaves the container alone, and a
# new one is missing, so it is pulled and the container recreated. The ghcr probe runs in
# --check too, because a real run has already moved the bookit record when it gets here.
#
# Re-running is the intended way to finish after a partial failure.

- name: Create the send2ereader tunnel and DNS record
  ansible.builtin.import_playbook: server-create-deployment-tunnel.yml
  vars:
    deployment: send2ereader

- name: Pull and start send2ereader, then probe it
  hosts: deployment_target
  gather_facts: false
  become: false

  vars:
    deployment: send2ereader
    s2e_dir: "{{ infra_checkout }}/deployments/send2ereader"
    s2e_url: "https://{{ deployment_hostname }}"
    # The app's image, read from compose.yaml on the control node: the one copy of it.
    # ghcr.io/<repo>:<tag>@sha256:<digest>, and the probe below needs the parts. Matched
    # whole, with no capture group: a group reference ('\\1') in a folded block reaches
    # regex_search in a form it cannot parse and fails with "'NoneType' object has no
    # attribute 'group'" (found by running it, 2026-10-25). The sidecar's image is not on
    # ghcr, so this matches the app's alone.
    s2e_image: >-
      {{ lookup('file', control_checkout ~ '/deployments/send2ereader/compose.yaml')
         | regex_search('ghcr\.io/\S+@sha256:[0-9a-f]{64}') }}
    s2e_repo: "{{ s2e_image.split('@')[0].split(':')[0] | regex_replace('^ghcr\\.io/', '') }}"
    s2e_tag: "{{ s2e_image.split('@')[0].split(':')[1] }}"
    s2e_digest: "{{ s2e_image.split('@')[1] }}"
    # The .env keys compose.yaml requires, both written by the tunnel play.
    s2e_env_keys: [TUNNEL_ID, TUNNEL_CREDENTIALS]
    s2e_env_lines: >-
      {{ (s2e_env_raw.content | default('') | b64decode).splitlines()
         | reject('match', '^\s*(#|$)') | select('search', '=') | list }}
    s2e_env: >-
      {{ dict(s2e_env_lines | map('regex_replace', '=.*$', '')
              | zip(s2e_env_lines | map('regex_replace', '^[^=]*=', ''))) }}
    # A new record can take a minute or two to answer; each probe waits up to five.
    probe_retries: 20
    probe_delay: 15

  tasks:
    # ── 1  .env ─────────────────────────────────────────────────────────────
    - name: Read the {{ deployment }} .env on {{ inventory_hostname }}
      # Nothing in this file is a secret (the tunnel's secret is the file it names), but it
      # is read quietly anyway, so a secret added to it later never lands in a log.
      ansible.builtin.slurp:
        src: "{{ s2e_dir }}/.env"
      register: s2e_env_raw
      check_mode: false
      failed_when: false
      no_log: true

    - name: Check .env has every key compose.yaml needs
      ansible.builtin.assert:
        that: s2e_env_keys | difference(s2e_env.keys() | list) | length == 0
        fail_msg: >-
          {{ s2e_dir }}/.env lacks {{ s2e_env_keys | difference(s2e_env.keys() | list) }},
          which the tunnel play above writes. Nothing has been started.
        success_msg: "{{ s2e_env_keys | length }} keys present"
      when: not ansible_check_mode

    # ── 2  the image, as `one` will fetch it ────────────────────────────────
    # Anonymous, as `one`'s docker pulls it: no credential is kept on `one`, so the package
    # must be public. Calibrated 2026-10-25 against f7fc0d2's image: token, then 200.
    - name: Read an anonymous ghcr pull token on {{ inventory_hostname }}
      ansible.builtin.uri:
        url: "https://ghcr.io/token?scope=repository:{{ s2e_repo }}:pull"
        return_content: true
      register: s2e_ghcr_token
      check_mode: false
      failed_when: false

    - name: Probe the pinned image on ghcr from {{ inventory_hostname }}
      ansible.builtin.uri:
        url: "https://ghcr.io/v2/{{ s2e_repo }}/manifests/{{ s2e_digest }}"
        method: HEAD
        headers:
          Authorization: "Bearer {{ s2e_ghcr_token.json.token | default('') }}"
          Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json
      register: s2e_ghcr
      check_mode: false
      failed_when: false

    - name: Check ghcr serves {{ s2e_tag[:7] }} to {{ inventory_hostname }}
      ansible.builtin.assert:
        that: s2e_ghcr.status | default(0) == 200
        fail_msg: >-
          ghcr answered {{ s2e_ghcr.status | default('nothing') }} for {{ s2e_repo }}@{{ s2e_digest[:19] }}
          from {{ inventory_hostname }}. 401 or 403 means the package is not public; 404, that
          the digest in compose.yaml is wrong or was deleted; nothing, that {{ inventory_hostname }}
          cannot reach ghcr.io. Nothing has been started.
        success_msg: "ghcr serves {{ s2e_repo }}:{{ s2e_tag[:7] }} to {{ inventory_hostname }}"

    - name: "--check only: print what a real run would do"
      ansible.builtin.debug:
        msg: >-
          A real run pulls {{ s2e_repo }}:{{ s2e_tag[:7] }} if {{ inventory_hostname }} lacks
          it, starts {{ deployment }} and its sidecar, and probes {{ s2e_url }}. Nothing was
          pulled or started.
      changed_when: true
      when: ansible_check_mode

    # ── 3  up ───────────────────────────────────────────────────────────────
    - name: Pull and start {{ deployment }} and its sidecar
      community.docker.docker_compose_v2:
        project_src: "{{ s2e_dir }}"
        pull: missing
        state: present
      become: true
      when: not ansible_check_mode

    # ── 4  the probes, from this control node, end to end ───────────────────
    # failed_when: false AND ignore_errors: true, as in server-deploy-garmin-mcp.yml: no
    # answer at all fails `uri` whatever failed_when says, and exhausted retries mark the
    # task failed. The assert after each says what the answer means.
    - name: Wait for the upload page through the tunnel
      ansible.builtin.uri:
        url: "{{ s2e_url }}/"
        return_content: true
      register: s2e_p_upload
      until: s2e_p_upload.status | default(0) == 200
      retries: "{{ probe_retries }}"
      delay: "{{ probe_delay }}"
      failed_when: false
      ignore_errors: true
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Check bookit serves the upload page
      ansible.builtin.assert:
        that:
          - s2e_p_upload.status | default(0) == 200
          - "'id=\"uploadform\"' in s2e_p_upload.content | default('')"
        fail_msg: >-
          {{ s2e_url }}/ answered {{ s2e_p_upload.status | default('nothing') }}. 530 or 1033
          is the tunnel (sudo docker logs send2ereader-cloudflared on {{ inventory_hostname }});
          502 is the app (sudo docker compose ps in {{ s2e_dir }}); a 200 without the upload
          form is something other than send2ereader answering.
        success_msg: "{{ s2e_url }}/ serves the upload page"
      when: not ansible_check_mode

    - name: Probe the key page as a Kobo would
      # The server picks the page by user agent: an e-reader gets the page that shows a key.
      ansible.builtin.uri:
        url: "{{ s2e_url }}/"
        headers:
          User-Agent: Mozilla/5.0 (Linux; U; Android 2.0; en-us;) AppleWebKit/538.1 (KHTML, like Gecko) Version/4.0 Mobile Safari/538.1 (Kobo Touch 0377/4.20.14622)
        return_content: true
      register: s2e_p_key
      failed_when: false
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Check bookit gives an e-reader the key page
      ansible.builtin.assert:
        that:
          - s2e_p_key.status | default(0) == 200
          - "'id=\"keyoutput\"' in s2e_p_key.content | default('')"
        fail_msg: "{{ s2e_url }}/ as a Kobo answered {{ s2e_p_key.status | default('nothing') }} without the key page."
        success_msg: "{{ s2e_url }}/ gives an e-reader the key page"
      when: not ansible_check_mode

    # ── 5  the image it runs, and the port that is gone ─────────────────────
    # Image IDs, not names: .Config.Image is whatever string the container was created
    # with, and how Docker records a tag-plus-digest reference is not worth betting a
    # false failure on. The ID the container runs against the ID the pinned reference
    # resolves to answers the question directly, and a container left from the old build
    # on `one` fails it.
    - name: Read the image ID the {{ deployment }} container runs
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{% raw %}{{.Image}}{% endraw %}", send2ereader]
      register: s2e_running
      changed_when: false
      failed_when: false
      become: true
      when: not ansible_check_mode

    - name: Read the image ID of the pinned {{ s2e_tag[:7] }}
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{% raw %}{{.Id}}{% endraw %}", "{{ s2e_image }}"]
      register: s2e_pinned
      changed_when: false
      failed_when: false
      become: true
      when: not ansible_check_mode

    - name: Check {{ deployment }} runs the pinned image
      ansible.builtin.assert:
        that:
          - s2e_running.rc == 0 and s2e_pinned.rc == 0
          - s2e_running.stdout == s2e_pinned.stdout
        fail_msg: >-
          send2ereader runs {{ s2e_running.stdout | default('?', true) }}, the pinned
          {{ s2e_tag[:7] }} is {{ s2e_pinned.stdout | default('not on ' ~ inventory_hostname, true) }}.
          sudo docker compose up -d in {{ s2e_dir }} recreates it.
        success_msg: "send2ereader runs {{ s2e_repo }}:{{ s2e_tag[:7] }}"
      when: not ansible_check_mode

    - name: Read the {{ deployment }} container's published ports
      # docker inspect, not community.docker.docker_container_info: that module needs the
      # Python Docker SDK and requests on the target, which `one` does not have
      # (ansible/README.md § "Where prefer the standard tool loses"). The {% raw %} guard
      # keeps Jinja off Docker's own Go template.
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{% raw %}{{json .HostConfig.PortBindings}}{% endraw %}", send2ereader]
      register: s2e_ports
      changed_when: false
      become: true
      when: not ansible_check_mode

    - name: Check {{ deployment }} publishes nothing on the host
      # The point of the sidecar. A port left published is a second way in that skips the
      # tunnel, and the probes above would pass with it.
      ansible.builtin.assert:
        that: (s2e_ports.stdout | from_json | default({}, true)) == {}
        fail_msg: >-
          send2ereader still publishes {{ s2e_ports.stdout | default('?') }}
          on {{ inventory_hostname }}. compose.yaml has no ports:, so the running container is
          an older one: sudo docker compose up -d in {{ s2e_dir }}.
        success_msg: "send2ereader publishes nothing on {{ inventory_hostname }}"
      when: not ansible_check_mode

    - name: Print what is running and what is left
      ansible.builtin.debug:
        msg:
          - "{{ s2e_url }} served by the {{ deployment }} sidecar, image {{ s2e_tag[:7] }}"
          - ""
          - "Once, after the first deploy: install one's host tunnel configuration without"
          - "bookit (deployments/send2ereader/README.md, 'Once, after that first run')."
      changed_when: true
      when: not ansible_check_mode
