---
# TASKS, NOT A PLAY — a hostname's proxied CNAME to a tunnel, looked up before it is
# written. Section 2 of _cf-tunnel.yml, moved here on 2026-11-18 so a second hostname on a
# tunnel that already exists gets its record by the same code:
#
#   _cf-tunnel.yml                    imports it after making or finding the tunnel
#   server-create-browser-login.yml   imports it for a browser hostname on a host's own
#                                     tunnel, only once an Access login covers that name
#
# Moved word for word but for one input: the refusal's last sentences are
# cf_dns_if_refused, defaulting to the text every _cf-tunnel.yml importer printed before,
# since "the tunnel and its credentials exist" is not what a refusal means to the login play.
#
# ── what the importer sets ───────────────────────────────────────────────────
#   cf_api, cf_token, cf_zone_id   from the play, _cf-api-token.yml and the zone read
#   cf_hostname       the CNAME to write
#   cf_tunnel_id      the tunnel it points at; undefined only under --check, before a
#                     tunnel exists, where the write is skipped and cf_unknown_id fills it
#   cf_unknown_id     that filler
#   cf_dns_comment    the record's comment at Cloudflare, naming who manages it
#   cf_dns_if_refused optional: what a refused write leaves, for the fail message
#
# It registers cf_dns_q and cf_dns_w, which the importer may read afterwards: the record as
# it was before this ran, and the write, if one was made.

- name: Read the CNAME record for {{ cf_hostname }}
  # &type=CNAME, not name alone. Cloudflare's name filter returns every record type at
  # that name, so a stale A or AAAA left over from something else would come back
  # first and the PUT below would rewrite THAT record's id into a CNAME — converting
  # an unrelated record instead of managing ours.
  ansible.builtin.uri:
    url: "{{ cf_api }}/zones/{{ cf_zone_id }}/dns_records?type=CNAME&name={{ cf_hostname }}"
    headers: { Authorization: "Bearer {{ cf_token }}" }
  register: cf_dns_q
  delegate_to: localhost
  check_mode: false
  changed_when: false
  no_log: true

- name: Note whether the CNAME already points at the tunnel
  # So a converged run reports changed=0. That matters more here than tidiness: this
  # repo reads the recap to tell a no-op from a real one, and a play that always says
  # "changed" is a play whose recap nobody reads.
  #
  # `proxied` is compared too, not just the target. An unproxied record resolves to
  # the tunnel's address and Cloudflare never sees the request, so Access is not in
  # front of it at all — the same reachability with the protection quietly gone.
  ansible.builtin.set_fact:
    cf_dns_ok: >-
      {{ (cf_dns_q.json.result | length) > 0
         and cf_dns_q.json.result[0].content == ((cf_tunnel_id | default('', true)) ~ '.cfargotunnel.com')
         and (cf_dns_q.json.result[0].proxied | default(false) | bool) }}

- name: "If correct: print that the CNAME is left as it is"
  ansible.builtin.debug:
    msg: "{{ cf_hostname }} already CNAMEs to this tunnel, proxied — leaving it"
  changed_when: true
  when: cf_dns_ok

- name: "If wrong or missing: check the comment fits"
  # Cloudflare refuses a record whose comment is over 100 characters (error 9313), and
  # only after the play has done everything before the write. Checked here instead, before
  # any call, so a long name fails with a sentence rather than half-way through. Found on
  # 2026-11-19, when syncthing-three's comment came to 104.
  ansible.builtin.assert:
    that: (cf_dns_comment | length) <= 100
    fail_msg: >-
      The DNS comment for {{ cf_hostname }} is {{ cf_dns_comment | length }} characters, and
      Cloudflare takes at most 100: "{{ cf_dns_comment }}". Shorten cf_dns_comment in the
      play that sets it. Nothing was written.
    success_msg: The DNS comment for {{ cf_hostname }} fits.
  delegate_to: localhost
  when: not cf_dns_ok

- name: "If wrong or missing: write the tunnel's CNAME"
  # PUT when it exists rather than skipping. A record left pointing at a PREVIOUS
  # tunnel resolves perfectly and reaches nothing — the same failure as above, wearing
  # the same disguise. Making it match costs one call; assuming it matches is the bug.
  ansible.builtin.uri:
    url: >-
      {{ cf_api }}/zones/{{ cf_zone_id }}/dns_records{{
         '/' ~ cf_dns_q.json.result[0].id if (cf_dns_q.json.result | length) > 0 else '' }}
    method: "{{ 'PUT' if (cf_dns_q.json.result | length) > 0 else 'POST' }}"
    status_code: [200, 201]
    headers: { Authorization: "Bearer {{ cf_token }}" }
    body_format: json
    body:
      type: CNAME
      name: "{{ cf_hostname }}"
      content: "{{ cf_tunnel_id | default(cf_unknown_id, true) }}.cfargotunnel.com"
      proxied: true
      comment: "{{ cf_dns_comment }}"
  register: cf_dns_w
  delegate_to: localhost
  when: not cf_dns_ok
  changed_when: cf_dns_w.json.success | default(false)
  failed_when: false
  no_log: true

- name: "If the CNAME was refused: print why"
  ansible.builtin.debug:
    msg: >-
      {{ cf_hostname }}: HTTP {{ cf_dns_w.status | default('?') }}:
      {{ cf_dns_w.json.errors | default(cf_dns_w.msg) | default('no detail') }}
  changed_when: true
  when:
    - cf_dns_w is not skipped
    - (cf_dns_w.status | default(0) not in [200, 201]) or not (cf_dns_w.json.success | default(false))

- name: "If wrong or missing: check the CNAME was written"
  ansible.builtin.assert:
    that:
      - cf_dns_w.status | default(0) in [200, 201]
      - cf_dns_w.json.success | default(false)
    fail_msg: >-
      {{ cf_hostname }} does not point at this tunnel. {{ cf_dns_if_refused | default('The
      tunnel and its credentials exist; a re-run picks them up and tries the record again.') }}
      A 403 is a missing DNS : Edit; "record already exists" means an A/AAAA at that name to
      remove first.
    quiet: true
  when: cf_dns_w is not skipped
