---
# The first playbook in this repo that CHANGES a host. Everything before it reads.
#
#     ansible-playbook playbooks/install-packages.yml --check --diff --limit one      # prove, no -K
#     ansible-playbook playbooks/install-packages.yml -K --diff --limit one           # apply
#
# Apply smallest blast radius first: one, then two, then zero.
#
# The lists are in group_vars/fleet.yml and host_vars/<host>.yml, and the split is the
# point: base_packages is nearly everything, and the only per-host entry is the container
# runtime, because `two` had docker and containerd removed deliberately. Unexplained
# divergence between the three boxes is treated as the bug — it is what made audit-fleet.yml
# grow a netstat branch and made one's hardware.md look hand-edited.
#
# NEEDS community.general — see ../requirements.yml. An earlier version of this file did
# the work with a hand-rolled `apk info -e` loop and `command: apk add`, on the reasoning
# that collections were expensive over a metered radio. That reasoning was wrong on the
# numbers: community.general is 2.70 MiB, not the ~50 MiB of the `ansible` metapackage it
# was confused with. It was also inconsistent — this repo is dropping `bin/compose`
# because stock tooling is knowledge that transfers, and a bespoke shell loop is
# repo-specific knowledge in exactly the same way.
#
# INSTALL ONLY. NOTHING HERE MAY EVER REMOVE A PACKAGE.
#   `apk del` reclaims orphaned dependencies, and CLAUDE.md records the cost: on `two`,
#   iptables was present only as an auto-installed dependency of docker/k3s, and netavark
#   shells out to it while not depending on it — so a tidy-up would have broken rootless
#   podman networking days later, for a reason nobody would connect back. Anything found
#   installed that these lists do not name is left alone. That is why `state: present`
#   rather than any spelling that prunes.
#
# WHY THE FALLBACKS STAY
#   Installing iproute2 does not license deleting the netstat branch in audit-fleet.yml. A host
#   built tomorrow has not run this playbook yet, and that branch is what makes its
#   Listening section a reading rather than an UNREADABLE. Packages remove the need to
#   *rely* on a fallback, not the need to *have* one.

- name: Bring every host up to the declared package set
  hosts: fleet
  gather_facts: true
  become: false

  vars:
    declared_packages: "{{ base_packages + (extra_packages | default([])) }}"

  tasks:
    - name: Install the base set and this host's runtime
      # state: present, never latest. `latest` would turn a package playbook into an
      # unscheduled upgrade of whatever it names, on boxes where a kernel or docker bump
      # is something you do while watching, not a side effect of adding lsusb.
      community.general.apk:
        name: "{{ declared_packages }}"
        state: present
        # Updating the index WRITES to the host — /var/cache/apk and apk's log. A --check
        # run must not do that: a check with a side effect is a small version of exactly
        # what this repo keeps designing against. Verified unprivileged on all three,
        # 2026-08-21: `apk update` fails with "Unable to open log: Permission denied".
        update_cache: "{{ not ansible_check_mode }}"
      # Escalate only when actually installing. `apk add --simulate` needs no root —
      # measured on all three hosts, same day — so a --check run of this playbook costs no
      # sudo password at all. That matters more than it looks: the cheapest, safest way to
      # ask "what would change" is the one you will actually run before changing anything,
      # so it is the one that must not demand a credential. An earlier revision had -K on
      # --check purely because the play escalated unconditionally.
      become: "{{ not ansible_check_mode }}"
      register: pkg

    - name: Name what changed
      # The module returns the packages it acted on, so say them. "Something changed on
      # zero" is not actionable when you cannot see zero; a list of names is.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ ('changed — ' + (pkg.packages | default([]) | join(', '))) if pkg.changed
             else 'already complete, nothing to do' }}
      changed_when: true

    - name: Re-read the installed set
      # Not redundant with the module, and not distrust of it: the module reports that its
      # transaction ran, this reports that the packages are present, and those are
      # different claims. CLAUDE.md's rule is to verify from output or by re-reading state
      # with unprivileged tools — `apk info -e` is exactly that, and needs no root.
      ansible.builtin.shell: |
        for p in {{ declared_packages | join(' ') }}; do
          apk info -e "$p" >/dev/null 2>&1 || printf '%s ' "$p"
        done
      register: still_absent
      changed_when: false
      check_mode: false
      become: false

    - name: Fail if anything declared is still absent
      # Skipped under --check, where the install has deliberately not happened yet and the
      # re-read is only telling you what a real run would install.
      ansible.builtin.assert:
        that: not (still_absent.stdout | trim)
        fail_msg: >-
          {{ inventory_hostname }}: these are still absent after the install —
          {{ still_absent.stdout | trim }}. A package name in the lists is probably wrong
          for this architecture; `two` is armhf and does not carry everything.
        success_msg: "{{ inventory_hostname }}: all declared packages present"
      when: not ansible_check_mode

    - name: Under --check, say what a real run would install
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: would install —
          {{ still_absent.stdout | trim | default('nothing, already complete', true) }}
      changed_when: true
      when: ansible_check_mode
