---
# THE CLOUDFLARE API TOKEN, read and verified — a TASKS file, imported by every play that
# talks to Cloudflare (the four server-*-tunnel plays and the client play):
#
#     - ansible.builtin.import_tasks: _cf-api-token.yml
#
# Underscore-prefixed like _assert-inventory.yml: not a thing you run. It leaves ONE fact,
# `cf_token`, for the importing play's Authorization headers, and stops the play on every
# other outcome. One copy, because the previous arrangement — three prompts, each
# describing a different permission list, checked against nothing — is what drift between
# copies looks like (docs/decisions.md, 2026-10-04).
#
# WHERE THE TOKEN COMES FROM: the file group_vars/all.yml names, ~/.config/cloudflare/
# api-token on the machine running the play, mode 600. Never the command line, never a
# prompt: `-e cf_api_token=` is refused below, and a prompt is a paste. When the file is
# missing the play prints cf_api_token_howto — also in all.yml, the one copy of the
# minting steps — and stops.
#
# WHY THE FACT IS `cf_token` AND NOT `cf_api_token`. A fact set on localhost survives into
# every later play of the same run, and client-home-ssh-config.yml imports the client half
# once per container. Had the file been read into the name the guard checks, the second
# container's guard would have refused the first container's read as a secret typed on
# the command line. Found by the 2026-10-04 review before it ran anywhere.
#
# `run_once` and `delegate_to: localhost` because the importing play may be targeting a
# Pi: the file is on the control node, and one host's read is every host's read.

- name: Refuse an API token supplied on the command line
  # `-e cf_api_token=` is the highest-precedence source there is and would silently beat
  # the file, after the value had already been through your shell.
  ansible.builtin.assert:
    that: cf_api_token is not defined
    fail_msg: >-
      cf_api_token was passed as a variable. It is read from {{ cf_api_token_file }} and
      nowhere else: an -e value is in your shell history and was in the process list.
      Re-run without it, then in fish `history delete --contains cf_api_token`.
    success_msg: "no API token on the command line"
  run_once: true

- name: Look for the API token file on this machine
  ansible.builtin.stat:
    path: "{{ cf_api_token_file }}"
  register: cf_tok_file
  delegate_to: localhost
  run_once: true
  check_mode: false

- name: How to get one, when there is none
  ansible.builtin.debug:
    msg: "{{ cf_api_token_howto }}"
  changed_when: true
  run_once: true
  when: not cf_tok_file.stat.exists

- name: Stop without one
  ansible.builtin.assert:
    that: cf_tok_file.stat.exists
    fail_msg: "no API token file; the instructions are above"
    success_msg: "API token file present"
  run_once: true

- name: Refuse a token file anyone but you can read
  ansible.builtin.assert:
    that: cf_tok_file.stat.mode in ['0600', '0400']
    fail_msg: >-
      {{ cf_api_token_file }} is mode {{ cf_tok_file.stat.mode }}. chmod 600 it: it is an
      API token with write access to every tunnel in this fleet.
    success_msg: "API token file is mode {{ cf_tok_file.stat.mode }}"
  run_once: true

- name: Read the API token from the file
  ansible.builtin.set_fact:
    cf_token: "{{ lookup('file', cf_api_token_file) | trim }}"
  no_log: true

- name: Refuse an empty token file
  ansible.builtin.assert:
    that: cf_token | length > 0
    fail_msg: "{{ cf_api_token_file }} is empty"
    success_msg: "API token in hand"
  run_once: true

# ── is this token even a token? ──────────────────────────────────────────────
# BEFORE anything reads a box or the API. Cloudflare answers a token it will not accept
# with `9109 Invalid access token` on whatever endpoint you happened to hit, so the
# failure lands wherever the play got to and looks like that endpoint's problem.
# `/user/tokens/verify` asks the one question directly, and separates the two causes that
# are otherwise indistinguishable: a token string that is wrong, expired, not yet active
# or account-owned rather than user-owned, versus a valid token missing a permission.
#
# failed_when: false + print the body + assert — the pattern CLAUDE.md records for a
# no_log call that can be refused. The body is the only thing that names the cause; the
# invocation is never printed, because that is where the Authorization header is.
- name: Verify the API token before using it
  ansible.builtin.uri:
    url: "{{ cf_api }}/user/tokens/verify"
    headers: { Authorization: "Bearer {{ cf_token }}" }
  register: tok
  delegate_to: localhost
  run_once: true
  no_log: true
  failed_when: false
  check_mode: false

- name: Say what Cloudflare said about the token
  ansible.builtin.debug:
    msg: >-
      token verify: HTTP {{ tok.status | default('?') }},
      status {{ tok.json.result.status | default('unknown') }},
      {{ tok.json.errors | default([]) }}
  changed_when: true
  run_once: true
  when: (tok.status | default(0)) != 200 or (tok.json.result.status | default('')) != 'active'

- name: Refuse a token Cloudflare will not accept
  ansible.builtin.assert:
    that:
      - (tok.status | default(0)) == 200
      - (tok.json.result.status | default('')) == 'active'
    fail_msg: |
      Cloudflare will not accept this token at all — this is NOT a missing permission.
      A scope problem gets you a 403 on the specific endpoint with the token still
      verifying as active; this fails verification outright.

      Check, in order: that the whole token is in {{ cf_api_token_file }} (a truncated
      paste is invisible — `wc -c` it, a token is 40 characters); that it has not expired
      or been revoked; that its start date is not in the future; and that it is a USER
      token from My Profile -> API Tokens rather than an Account API Token, a Global API
      Key or an Access service token. An account-owned token fails this exact call.

      Test it by hand without this play, in fish:

        curl -s -H "Authorization: Bearer $(cat {{ cf_api_token_file }})" {{ cf_api }}/user/tokens/verify

      Nothing has been read or changed.
    success_msg: "token verifies as active"
  run_once: true
