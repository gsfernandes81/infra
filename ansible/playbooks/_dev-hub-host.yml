---
# NOT A PLAYBOOK YOU RUN — the underscore says so. server-create-dev-container.yml imports it
# for `-e container=dev`, after the edge half has made the hub's tunnel, DNS record and Access
# application. This is the hub's HOST side on `zero`: what has to exist before `make up` can
# start the hub and its cloudflared sidecar.
#
#     cd ansible
#     ansible-playbook playbooks/server-create-dev-container.yml -e container=dev --check --diff
#     ansible-playbook playbooks/server-create-dev-container.yml -e container=dev
#
# What it makes, and nothing else:
#   - ~/.dev-secrets at 0700 (the edge half wrote tunnel.json into it, gavin-owned, 0600 —
#     dev/compose.yaml runs the sidecar as gavin so it can read that);
#   - authorized_keys in it, with this control node's key: the clients allowed to `ssh dev`.
#     Another client's key is server-add-authorized-keys.yml's job;
#   - HOST_UID and HOST_GID (the checkout's owner), HUB_SECRETS and HUB_TUNNEL_ID in dev/.env, by line, starting one from .env.example if
#     there is none. The tunnel id beside the credentials it came from, in the same run, so
#     the two cannot name different tunnels.
#
# THE HUB'S OWN KEY IS NOT HERE, and must never be: the hub makes it at first start in its
# own volume, and it is never on the host, the control node or any other container
# (decisions.md, the dev-pool rows). Nothing to fetch, nothing to register.
#
# IT SETS UP AND DOES NOT START, the rule _dev-container-host.yml states at length: the
# lifecycle is dev/Makefile's. `ssh -t zero 'cd ~/infra/dev && make up'`.

- name: Create the dev hub's secrets and its dev/.env lines
  hosts: "{{ dev_host | default('zero') }}"
  gather_facts: true
  become: false

  vars:
    infra_src: "{{ src_dir | default(ansible_facts['env']['HOME'] ~ '/infra') }}"
    hub_secrets: "{{ secrets_dir | default(ansible_facts['env']['HOME'] ~ '/.dev-secrets') }}"
    # The same default and the same JSON override as _dev-container-host.yml's, for the
    # reasons given there.
    dev_client_pubkey: >-
      {{ client_pubkey if client_pubkey is defined
         else lookup('file', lookup('env', 'HOME') ~ '/.ssh/id_ed25519.pub') }}

  tasks:
    - name: Create the hub's secrets directory at mode 0700
      ansible.builtin.file:
        path: "{{ hub_secrets }}"
        state: directory
        mode: "0700"

    - name: Install the client ssh key in the hub's authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_facts['user_id'] }}"
        key: "{{ dev_client_pubkey }}"
        path: "{{ hub_secrets }}/authorized_keys"
        manage_dir: false
        state: present

    - name: Write the hub's authorized_keys mode as 0600
      ansible.builtin.file:
        path: "{{ hub_secrets }}/authorized_keys"
        mode: "0600"
        state: file
      when: not ansible_check_mode

    - name: "If no dev/.env: copy it from dev/.env.example"
      # force: false — an existing .env serves every container in the project and is never
      # replaced; the lines below are the only ones this play owns.
      ansible.builtin.copy:
        src: "{{ infra_src }}/dev/.env.example"
        dest: "{{ infra_src }}/dev/.env"
        remote_src: true
        mode: "0600"
        force: false

    - name: Read who owns the checkout's dev/ directory
      ansible.builtin.stat:
        path: "{{ infra_src }}/dev"
      register: dev_dir_owner
      check_mode: false

    # The uid every image's `dev` user is built at, so files shared with the host read as
    # gavin's. The Makefile reads the same owner with stat; these two lines are what the deploy
    # play's compose runs with, since it does not go through make.
    - name: Write HOST_UID and HOST_GID in dev/.env
      ansible.builtin.lineinfile:
        path: "{{ infra_src }}/dev/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        mode: "0600"
      loop:
        - { key: HOST_UID, value: "{{ dev_dir_owner.stat.uid }}" }
        - { key: HOST_GID, value: "{{ dev_dir_owner.stat.gid }}" }
      loop_control:
        label: "{{ item.key }}"
      when: not ansible_check_mode

    - name: Write HUB_SECRETS in dev/.env
      ansible.builtin.lineinfile:
        path: "{{ infra_src }}/dev/.env"
        regexp: '^HUB_SECRETS='
        line: "HUB_SECRETS={{ hub_secrets }}"
        mode: "0600"
      when: not ansible_check_mode

    # The edge half's own fact, from this same run. Under --check a tunnel that does not
    # exist yet has no id, and the line is not written — never a placeholder, which would
    # read as configured.
    - name: "If the tunnel exists: write HUB_TUNNEL_ID in dev/.env"
      ansible.builtin.lineinfile:
        path: "{{ infra_src }}/dev/.env"
        regexp: '^HUB_TUNNEL_ID='
        line: "HUB_TUNNEL_ID={{ cf_tunnel_id }}"
        mode: "0600"
      when:
        - not ansible_check_mode
        - cf_tunnel_id is defined
        - cf_tunnel_id | length > 0

    - name: Print the hub's host side and the steps left
      ansible.builtin.debug:
        msg:
          - "secrets   {{ hub_secrets }} (0700): authorized_keys, tunnel.json"
          - "env       {{ infra_src }}/dev/.env: HUB_SECRETS, HUB_TUNNEL_ID {{ cf_tunnel_id | default('(not yet — --check)', true) }}"
          - ""
          - "Then, in this order:"
          - "  1. on zero: `tunnel` in COMPOSE_PROFILES in dev/.env (the example has it), then"
          - "       ssh -t {{ inventory_hostname }} 'cd {{ infra_src }}/dev && make up'"
          - "  2. on each client: ansible-playbook playbooks/client-home-ssh-config.yml -e container=dev"
          - "  3. ssh dev"
      changed_when: true
