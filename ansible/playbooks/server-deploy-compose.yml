---
# REDEPLOY A COMPOSE DEPLOYMENT whose files or pinned images changed in git, on whichever host
# hosts/<host>/<name> places it. Run from the control node:
#
#     cd ansible
#     ansible-playbook playbooks/server-deploy-compose.yml -e deployment=immich --check -K  # plan only
#     ansible-playbook playbooks/server-deploy-compose.yml -e deployment=immich -K          # ask, then do
#     ansible-playbook playbooks/server-deploy-compose.yml -e deployment=all -K             # each in turn
#     ansible-playbook playbooks/server-deploy-compose.yml -e deployment=garmin-mcp -e recreate=true -K
#
# NO --limit / -l: the host is read from the deployment's symlink, as in
# server-create-deployment-tunnel.yml, and `-l` would skip the play that finds it.
# -K because docker needs root and gavin is not in the docker group (CLAUDE.md § Privileged
# commands).
#
# WHAT ONE DEPLOYMENT GOES THROUGH, in order, and a refusal at any step touches nothing:
#   1. The host's checkout is pulled fast-forward only and must be clean under the
#      deployment and on exactly the commit this checkout reviewed. Uncommitted edits here
#      stop the run: the host runs the commit, not what is on this screen.
#   2. PLAN. Compose is asked what `up` would do, as a dry run, and the answer is printed:
#      which containers would be created or recreated, and which images pulled. Nothing has
#      changed. A deployment with nothing to do says so and is not asked about.
#      Compose's dry run cannot plan past an image the host lacks, so when one is missing a
#      real run PULLS first (every pullable image; those already present only get a registry
#      check). That touches no container, honours each service's pull_policy and leaves
#      a buildable image to `up`; a "no" leaves the images on the host. Under --check nothing
#      is pulled: the registry is asked that each one exists, and the plan names them.
#   3. ASK, once, for this deployment: "Redeploy immich on zero? [y/N]". Anything but y/yes
#      skips it. `--check` stops after the plan and never asks.
#   4. DO. `up`, which pulls a pinned digest only if the host lacks it and builds a built
#      image only if its tag is absent, each service's pull_policy honoured.
#      Then the container ids are compared with the ids from before, so what was recreated
#      is read, not assumed (CLAUDE.md § Verifying changes), and the play waits for
#      healthchecks and fails naming any container that is not up.
#
# `deployment=all` runs that for every deployment this play may touch, ONE AT A TIME, `one`
# before `zero`, each
# with its own plan and its own question. It stops at the first failure and does not go on
# to the next, so a broken deployment is never followed by a second change. A "no" skips
# only that deployment. `-e assume_yes=true` skips the question for ONE named deployment and
# is refused with `all`, so the per-deployment question cannot be switched off for the lot.
#
# `-e recreate=true` recreates every container of ONE named deployment even when nothing in
# it changed, so the plan has something to ask about and the probe hook runs. It is how a
# probe is exercised without a change, and how garmin-mcp is restarted after its Garmin
# login lapses (its README). Refused with `all`, for the same reason as assume_yes.
#
# WHAT IT WILL NOT TOUCH, and says so rather than silently skipping:
#   ionic-traces              `up` would start it if it is stopped. Since 2026-10-25 it is
#                             not linked from hosts/ at all, so the play never finds it; the
#                             exclusion stays as a second lock, so re-adding the link to
#                             place it again cannot also start it unasked.
#   anything on a host outside the `containerized` inventory group.
#
# DEPLOYMENT-SPECIFIC CHECKS are hook files, found by name and run only if they exist:
#   ansible/deploy-hooks/<name>/preflight.yml   before the .env check and the plan: what must
#                                                be true for the plan to mean anything
#                                                (send2ereader: its image can be fetched from
#                                                ghcr; torrents: the forwarded port before the
#                                                change). It may CREATE what is missing and
#                                                nothing else (garmin-mcp: its generated .env
#                                                lines and the source checkout, on a first
#                                                bring-up), never under --check, and never
#                                                touches a container.
#   ansible/deploy-hooks/<name>/prepare.yml     after you answer y and before `up`: host-side
#                                                files the deployment needs, written only for
#                                                a change you confirmed (calibre-web: the
#                                                kepubify link Calibre-Web will accept;
#                                                garmin-mcp: the source moved to SOURCE's sha;
#                                                immich: a database dump off the array)
#   ansible/deploy-hooks/<name>/probe.yml       after a redeploy, once every container is up:
#                                                end-to-end checks (send2ereader: the page,
#                                                the image it runs, no published port;
#                                                torrents: port forwarding came back;
#                                                garmin-mcp: the served tools and the login)
# They are included from _deploy-compose-one.yml, so they see `dep` ({host, name}) and
# `dep_dir` (the deployment's directory on that host) and run on the control node, delegating host work to
# dep.host themselves. A hook that needs a variable defines it. They live under ansible/, not
# deployments/, because they are how the fleet is managed and deployments/ is what a
# deployment is. Required .env keys are not hooks: the play reads every `${VAR:?}` out of
# compose.yaml and checks the host's .env names it, so the list cannot go stale.
#
# FIRST BRING-UP is server-bring-up-deployment.yml, which runs the tunnel play and then this
# one, with `bringup=true` so the .env check waits for a real run (a --check cannot see keys
# the tunnel play has yet to write). A routine redeploy never touches Cloudflare.
#
# The discovery half runs anywhere, including where no host is reachable, so
# `-e deployment=all --check` there shows what would be covered and what is left alone.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: fleet

- name: Find the deployments to redeploy
  hosts: localhost
  gather_facts: false
  vars:
    deploy_excluded:
      ionic-traces: excluded here, since up would start it if it is stopped
  tasks:
    - name: Check what to redeploy was named
      ansible.builtin.assert:
        that:
          - deployment is defined
          - deployment is match('^[a-z0-9][a-z0-9-]*$')
          - not (deployment == 'all' and (assume_yes | default(false) | bool))
          - not (deployment == 'all' and (recreate | default(false) | bool))
        fail_msg: >-
          Say which: -e deployment=<name> (a directory under deployments/), or -e deployment=all
          to go through every one in turn. -e assume_yes=true skips the question and
          -e recreate=true recreates every container, each for one named deployment, and both
          are refused with all.
        success_msg: "deployment {{ deployment | default('?') }}"

    - name: Find the hosts/<host>/<name> symlinks
      ansible.builtin.find:
        paths: "{{ control_checkout }}/hosts"
        patterns: "*"
        file_type: link
        recurse: true
        depth: 2
      register: deploy_links

    - name: Note the host and name of each symlink
      ansible.builtin.set_fact:
        deploy_candidates: >-
          {{ (deploy_candidates | default([]))
             + [{'host': item.path.split('/')[-2], 'name': item.path.split('/')[-1]}] }}
      loop: "{{ deploy_links.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Find each candidate's compose.yaml
      ansible.builtin.stat:
        path: "{{ control_checkout }}/deployments/{{ item.name }}/compose.yaml"
      loop: "{{ deploy_candidates | default([]) }}"
      loop_control:
        label: "{{ item.host }}/{{ item.name }}"
      register: deploy_composes

    - name: Note the deployments this play may redeploy
      ansible.builtin.set_fact:
        deploy_keep: "{{ (deploy_keep | default([])) + [item.item] }}"
      loop: "{{ deploy_composes.results }}"
      loop_control:
        label: "{{ item.item.host }}/{{ item.item.name }}"
      when:
        - item.stat.exists
        - item.item.host in groups['containerized']
        - item.item.name not in deploy_excluded

    - name: Note why each of the others is left alone
      ansible.builtin.set_fact:
        deploy_left: >-
          {{ (deploy_left | default([]))
             + [item.item.host ~ '/' ~ item.item.name ~ ': '
                ~ (deploy_excluded[item.item.name] if item.item.name in deploy_excluded else
                   'not a docker host' if item.item.host not in groups['containerized'] else
                   'no compose.yaml')] }}
      loop: "{{ deploy_composes.results }}"
      loop_control:
        label: "{{ item.item.host }}/{{ item.item.name }}"
      when: item.item not in (deploy_keep | default([]))

    - name: Order them, one before zero and then by name
      # Written out, so a new container host has to be added here.
      ansible.builtin.set_fact:
        deploy_targets: >-
          {{ ((deploy_keep | default([])) | selectattr('host', 'eq', 'one') | sort(attribute='name') | list)
             + ((deploy_keep | default([])) | selectattr('host', 'eq', 'zero') | sort(attribute='name') | list) }}

    - name: Pick what this run covers
      ansible.builtin.set_fact:
        deploy_run: >-
          {{ deploy_targets if deployment == 'all'
             else (deploy_targets | selectattr('name', 'eq', deployment) | list) }}

    - name: Check {{ deployment }} can be redeployed here
      ansible.builtin.assert:
        that: deploy_run | length > 0
        fail_msg: >-
          Nothing to redeploy for "{{ deployment }}". Left alone, and why:
          {{ deploy_left | default([]) | join('; ') }}. Otherwise it needs a
          hosts/<host>/{{ deployment }} symlink on a docker host and a compose.yaml.
        success_msg: "{{ deploy_run | map(attribute='name') | join(', ') }}"

    - name: Check this checkout is committed and note its commit
      ansible.builtin.import_tasks: _review-anchor.yml
      vars:
        anchor_paths: [deployments, hosts]
        anchor_untouched: Nothing has been touched on any host.

    - name: Note the commit the hosts must be on
      ansible.builtin.set_fact:
        deploy_ctl_head: "{{ anchor_head_raw.stdout | trim }}"

    - name: Print the order, and what is left alone
      ansible.builtin.debug:
        msg:
          - "In turn: {{ deploy_run | map(attribute='host') | zip(deploy_run | map(attribute='name')) | map('join', '/') | join(', ') }}"
          - "Left alone: {{ deploy_left | default(['nothing']) | join('; ') }}"
      changed_when: true
      when: deployment == 'all'

- name: Redeploy each in turn, asking before each
  hosts: localhost
  gather_facts: false
  tasks:
    # A failure here ends the run: the play is on one host, so Ansible stops the loop and
    # no later deployment is started. A "no" is not a failure and goes on to the next.
    - name: Go through the deployments one at a time
      ansible.builtin.include_tasks: _deploy-compose-one.yml
      loop: "{{ deploy_run }}"
      loop_control:
        loop_var: dep
        label: "{{ dep.host }}/{{ dep.name }}"

    - name: Print what happened to each
      ansible.builtin.debug:
        msg: "{{ deploy_summary | default(['nothing was run']) }}"
      changed_when: true

    - name: If any were declined, say so in the closing line
      # Read by callback_plugins/infra.py, which then closes the run in yellow instead of
      # green: declining is not a failure, but it is not "completed successfully" either.
      ansible.builtin.set_stats:
        data:
          incomplete: >-
            the following deployment{{ '' if deploy_declined | length == 1 else 's' }}
            {{ 'was' if deploy_declined | length == 1 else 'were' }} declined:
            {{ deploy_declined | join(', ') }}
        per_host: false
      when: deploy_declined | default([]) | length > 0
