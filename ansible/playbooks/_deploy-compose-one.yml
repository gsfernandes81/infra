---
# NOT A PLAYBOOK YOU RUN — server-deploy-compose.yml includes this once per deployment, with
# `dep` set to {host, name}. Its header says what the whole run does; this file is one
# deployment's turn: refuse, plan, ask, do, check. Every host task is delegated, because the
# calling play is on the control node (it has to be, to ask a question in a terminal), and a
# delegated task reads `ansible_*` connection variables from the target but NOT its other
# group variables, which is why `infra_checkout` is taken from hostvars below.

- name: Note where {{ dep.name }} lives on {{ dep.host }}
  ansible.builtin.set_fact:
    dep_dir: "{{ hostvars[dep.host].infra_checkout }}/deployments/{{ dep.name }}"
    dep_skipped: false
    # -e recreate=true makes the plan and the `up` recreate every container, so a deployment
    # whose files did not change can still be put through the question, `up` and its probe.
    dep_recreate: "{{ 'always' if (recreate | default(false) | bool) else 'auto' }}"

# ── the host's checkout, pulled to the commit this control node reviewed ────
- name: Pull the host's checkout, check its commit
  ansible.builtin.import_tasks: _sync-host-checkout.yml
  vars:
    sync_host: "{{ dep.host }}"
    sync_paths: ["deployments/{{ dep.name }}/"]
    anchor_head: "{{ deploy_ctl_head }}"

# ── what must be true first ──────────────────────────────────────────────────
# The preflight hook runs before the .env check, because a hook may be what fills .env in:
# garmin-mcp's writes the lines it generates itself when they are missing, so a first
# bring-up can be planned. The check after it is then the backstop for the hook as well.
- name: Stat the preflight hook for {{ dep.name }}
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/preflight.yml"
  register: dep_preflight

- name: "If it has a preflight hook: run it"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/preflight.yml"
  when: dep_preflight.stat.exists

- name: Note the variables compose.yaml requires
  # Every ${VAR:?message}, which is how this repo says "absent should stop Compose". The
  # pattern avoids backslashes on purpose: a folded YAML scalar passes them to Jinja as they
  # are, and a lookbehind-free [$][{] reads the same everywhere.
  ansible.builtin.set_fact:
    dep_required: >-
      {{ lookup('file', control_checkout ~ '/deployments/' ~ dep.name ~ '/compose.yaml')
         | regex_findall('[$][{]([A-Za-z0-9_]+):[?]') | unique | list }}

- name: Read the variable names in .env for {{ dep.name }}
  # Names only: sed prints the part before the `=`, so a value never reaches a register or a
  # log. No .env at all is rc 2, and reads as no names.
  ansible.builtin.command:
    cmd: sed -nE 's/^[[:space:]]*(export[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=.*/\2/p' .env
    chdir: "{{ dep_dir }}"
  register: dep_env_names
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: "{{ dep.host }}"
  when: dep_required | length > 0

- name: Check .env has the names {{ dep.name }} requires
  # Skipped under --check for a first bring-up only: the keys are written by the tunnel play
  # in a real run, which a dry run cannot see (CLAUDE.md § Privileged commands).
  ansible.builtin.assert:
    that: dep_required | difference(dep_env_names.stdout_lines | default([])) | length == 0
    fail_msg: >-
      {{ dep.host }}:{{ dep_dir }}/.env lacks
      {{ dep_required | difference(dep_env_names.stdout_lines | default([])) }}, which compose.yaml
      requires. TUNNEL_ID and TUNNEL_CREDENTIALS are written by server-create-deployment-tunnel.yml
      (server-bring-up-deployment.yml runs it); a preflight hook may write its own (garmin-mcp's
      does, outside --check); the rest are the owner's to put there. No container was touched.
    success_msg: "{{ dep_required | length }} required variables present"
  when:
    - dep_required | length > 0
    - not (ansible_check_mode and (bringup | default(false) | bool))

# ── a --check of a first bring-up stops here ─────────────────────────────────
# Compose cannot plan without the variables it requires, and for a first bring-up those
# include the tunnel keys that only a real run of the tunnel play writes. So the plan and
# everything after it wait for the real run, where the tunnel half has written them first.
- name: "--check, bring-up: say the plan waits"
  ansible.builtin.debug:
    msg: >-
      --check of a first bring-up: the plan for {{ dep.name }} needs the tunnel keys that
      a real run writes to .env before this step, so it is skipped. Everything above ran.
  changed_when: true
  when: ansible_check_mode and (bringup | default(false) | bool)

- name: Plan, ask, redeploy and check
  when: not (ansible_check_mode and (bringup | default(false) | bool))
  block:
    # ── images the host lacks, which Compose's dry run cannot plan past ────────
    # The dry run fakes the pull and then asks the REAL daemon about the image when it plans the
    # recreate (compose v5.6.1, pkg/dryrun/dryrunclient.go: ImageInspect is faked only for
    # pullServiceImage and buildContainerVolumes), so any bump fails with "No such image". So
    # what the host lacks is read first. A real run pulls it before the plan; that touches no
    # container. Under --check, or for an image only `up` can build, the plan names it instead.
    - name: Read the images {{ dep.name }} uses
      # Image references only, and each is pinned in compose.yaml or its override, so no .env
      # value is printed.
      ansible.builtin.command:
        cmd: docker compose config --images
        chdir: "{{ dep_dir }}"
      register: dep_images
      changed_when: false
      check_mode: false
      become: true
      delegate_to: "{{ dep.host }}"

    - name: Check which images {{ dep.host }} lacks
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, present, "{{ item }}"]
      loop: "{{ dep_images.stdout_lines | unique }}"
      register: dep_img_before
      changed_when: false
      failed_when: false
      check_mode: false
      become: true
      delegate_to: "{{ dep.host }}"

    - name: Note the images missing on {{ dep.host }}
      ansible.builtin.set_fact:
        dep_missing: "{{ dep_img_before.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"

    - name: "If images are missing: pull images for {{ dep.name }}"
      # Under --check the module runs `pull --dry-run`, which still asks the registry for each
      # reference, so a pinned digest that does not exist fails here, before any question.
      # The module's default policy passes NO --policy flag: --policy, like `up --pull`,
      # overrides every service's pull_policy (cmd/compose/pull.go). Without it a service that
      # sets none is refreshed, which for a pinned digest already present is a registry check
      # and no download. ignore_buildable leaves an image with a build: section to `up`.
      community.docker.docker_compose_v2_pull:
        project_src: "{{ dep_dir }}"
        ignore_buildable: true
      become: true
      delegate_to: "{{ dep.host }}"
      when: dep_missing | length > 0

    - name: "If pulled: check which images are still missing"
      # Its own register: a skipped task would overwrite the one above (CLAUDE.md § Shell traps).
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, present, "{{ item }}"]
      loop: "{{ dep_missing }}"
      register: dep_img_after
      changed_when: false
      failed_when: false
      become: true
      delegate_to: "{{ dep.host }}"
      when:
        - dep_missing | length > 0
        - not ansible_check_mode

    - name: Note the images Compose cannot plan past
      ansible.builtin.set_fact:
        dep_unplannable: >-
          {{ dep_missing if ansible_check_mode else
             (dep_img_after.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'eq', 0)
              | map(attribute='item') | list) }}

    # ── the plan: Compose's own dry run, nothing changed ───────────────────────
    - name: "If no image is missing: plan {{ dep.name }}, dry run"
      # check_mode true on the task itself, so even a real run only ever asks here. The module
      # runs `up --dry-run`; `actions` lists what it would do to each container and image.
      #
      # pull: policy, here and on the real `up`, and never `missing`: any --pull overrides
      # EVERY service's pull_policy (compose v5.6.1, cmd/compose/create.go, Apply), so
      # `missing` would make garmin-mcp's `pull_policy: never` look for its tag on Docker Hub
      # before building it. A service that sets none gets Compose's default, which is
      # `missing` anyway. A dry run builds nothing (pkg/dryrun's ImageBuild is a no-op, and
      # bake has its own dry-run branch).
      community.docker.docker_compose_v2:
        project_src: "{{ dep_dir }}"
        pull: policy
        recreate: "{{ dep_recreate }}"
        state: present
      check_mode: true
      register: dep_plan
      become: true
      delegate_to: "{{ dep.host }}"
      when: dep_unplannable | length == 0

    - name: Note the plan's lines for {{ dep.name }}
      # Compose renames a container it is replacing to <12 hex>_<name> while it builds the new
      # one, and the dry run reports that rename as a second container "Starting". It is the same
      # container, so those entries are left out. Read defensively: the key names are the
      # module's to change, and the whole entry is the fallback so a plan is never blanks.
      # With an image Compose cannot plan past, the plan is that image, and `up` recreates
      # every container using it; others change only if their own config did.
      ansible.builtin.set_fact:
        dep_plan_changed: "{{ (dep_unplannable | length > 0) or (dep_plan.changed | default(false)) }}"
        dep_plan_lines: >-
          {% if dep_unplannable | length > 0 %}{{ ['the host lacks ' ~ (dep_unplannable | join(', '))
              ~ (', which up pulls or builds' if ansible_check_mode else ', which up builds')
              ~ ', and recreates the containers using it. Compose cannot plan past a missing image,'
              ~ ' so any other container changes only if its own config did'] }}{% else %}{% set out = [] %}{% for a in dep_plan.actions | default([]) %}{% if a.id is not defined or a.id is not match('^[0-9a-f]{12}_') %}{% set _ = out.append((a.what | default('?')) ~ ' ' ~ (a.id | default(a.msg | default(a | string))) ~ ': ' ~ (a.status | default(''))) %}{% endif %}{% endfor %}{{ out }}{% endif %}

    - name: Print what up would do to {{ dep.name }}
      ansible.builtin.debug:
        msg: >-
          {{ dep.name }} on {{ dep.host }}:
          {{ 'would change: ' ~ (dep_plan_lines | join('; ')) if dep_plan_changed | bool else 'nothing to change.' }}
      changed_when: true

    # ── ask ──────────────────────────────────────────────────────────────────────
    - name: "If changes and not --check: ask about {{ dep.name }}"
      ansible.builtin.pause:
        prompt: >-
          Redeploy {{ dep.name }} on {{ dep.host }}?
          Containers above are recreated, with a short outage. [y/N]
      register: dep_answer
      when:
        - (dep_plan_changed | bool)
        - not ansible_check_mode
        - not (assume_yes | default(false) | bool)

    - name: Note whether to go ahead with {{ dep.name }}
      ansible.builtin.set_fact:
        dep_go: >-
          {{ (dep_plan_changed | bool) and not ansible_check_mode and
             ((assume_yes | default(false) | bool) or
              ((dep_answer.user_input | default('') | lower) in ['y', 'yes'])) }}

    # ── do ───────────────────────────────────────────────────────────────────────
    - name: Stat the prepare hook for {{ dep.name }}
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/prepare.yml"
      register: dep_prepare
      when: dep_go | bool

    - name: "If going ahead and it has a prepare hook: run it"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/prepare.yml"
      when:
        - dep_go | bool
        - dep_prepare.stat.exists | default(false)

    - name: "If going ahead: read container ids of {{ dep.name }}"
      ansible.builtin.command:
        cmd: docker compose ps -a --format '{% raw %}{{.Name}} {{.ID}}{% endraw %}'
        chdir: "{{ dep_dir }}"
      register: dep_ids_before
      changed_when: false
      become: true
      delegate_to: "{{ dep.host }}"
      when: dep_go | bool

    - name: "If going ahead: redeploy {{ dep.name }}"
      community.docker.docker_compose_v2:
        project_src: "{{ dep_dir }}"
        pull: policy
        recreate: "{{ dep_recreate }}"
        state: present
      register: dep_up
      become: true
      delegate_to: "{{ dep.host }}"
      when: dep_go | bool

    - name: "If going ahead: wait for {{ dep.name }} to settle"
      # `starting` is a healthcheck that has not answered yet; `Restarting` is a crash loop. Both
      # read as not yet; the check after says what the end state means.
      ansible.builtin.command:
        cmd: docker compose ps -a --format '{% raw %}{{.Name}} {{.Status}}{% endraw %}'
        chdir: "{{ dep_dir }}"
      register: dep_status
      until: dep_status.stdout is not search('starting|Restarting')
      retries: 20
      delay: 15
      changed_when: false
      become: true
      delegate_to: "{{ dep.host }}"
      when: dep_go | bool

    - name: "If going ahead: read those container ids again"
      ansible.builtin.command:
        cmd: docker compose ps -a --format '{% raw %}{{.Name}} {{.ID}}{% endraw %}'
        chdir: "{{ dep_dir }}"
      register: dep_ids_after
      changed_when: false
      become: true
      delegate_to: "{{ dep.host }}"
      when: dep_go | bool

    - name: "If going ahead: check {{ dep.name }} is all up"
      ansible.builtin.assert:
        that: dep_status.stdout_lines | reject('search', ' Up ') | list | length == 0
        fail_msg: >-
          Not up after the redeploy on {{ dep.host }}:
          {{ dep_status.stdout_lines | default([]) | reject('search', ' Up ') | join('; ') }}.
          The rest of this run is stopped. `sudo docker compose logs` in {{ dep_dir }} says why;
          the deployment is as the failed `up` left it.
        success_msg: "{{ dep.name }}: all containers up"
      when: dep_go | bool

    - name: Stat the probe hook for {{ dep.name }}
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/probe.yml"
      register: dep_probe
      when: dep_go | bool

    - name: "If going ahead and it has a probe hook: run it"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/probe.yml"
      when:
        - dep_go | bool
        - dep_probe.stat.exists | default(false)

    - name: "If going ahead: compare the ids before and after"
      # Recreated means a new id. A container whose id did not change was left alone, which is
      # the point of reading ids and not StartedAt (CLAUDE.md § Verifying changes).
      ansible.builtin.set_fact:
        dep_before: "{{ dict(dep_ids_before.stdout_lines | map('split', ' ') | map('first')
                        | zip(dep_ids_before.stdout_lines | map('split', ' ') | map('last'))) }}"
        dep_after: "{{ dict(dep_ids_after.stdout_lines | map('split', ' ') | map('first')
                       | zip(dep_ids_after.stdout_lines | map('split', ' ') | map('last'))) }}"
      when: dep_go | bool

    - name: "If going ahead: print which were recreated"
      ansible.builtin.debug:
        msg: >-
          {{ dep.name }}: recreated {{ dep_after | dict2items
               | rejectattr('value', 'eq', '') | selectattr('key', 'in', dep_after.keys())
               | rejectattr('value', 'in', dep_before.values()) | map(attribute='key') | list or 'none' }};
          unchanged {{ dep_after | dict2items | selectattr('value', 'in', dep_before.values())
               | map(attribute='key') | list or 'none' }}
      changed_when: true
      when: dep_go | bool

    - name: "If declined: note it for the closing line"
      ansible.builtin.set_fact:
        deploy_declined: "{{ (deploy_declined | default([])) + [dep.host ~ '/' ~ dep.name] }}"
      when:
        - (dep_plan_changed | bool)
        - not ansible_check_mode
        - not (dep_go | bool)

    - name: Note what happened to {{ dep.name }}
      ansible.builtin.set_fact:
        deploy_summary: >-
          {{ (deploy_summary | default([])) + [dep.host ~ '/' ~ dep.name ~ ': ' ~
             ('redeployed' if dep_go | bool else
              'plan only (--check)' if ansible_check_mode and (dep_plan_changed | bool) else
              'nothing to change' if not (dep_plan_changed | bool) else
              'skipped, not confirmed')] }}

- name: "--check, bring-up: note the plan waits"
  ansible.builtin.set_fact:
    deploy_summary: "{{ (deploy_summary | default([])) + [dep.host ~ '/' ~ dep.name ~ ': the plan waits for the real run (--check of a first bring-up)'] }}"
  when: ansible_check_mode and (bringup | default(false) | bool)
