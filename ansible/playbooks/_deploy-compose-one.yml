---
# NOT A PLAYBOOK YOU RUN — server-deploy-compose.yml includes this once per deployment, with
# `dep` set to {host, name}. Its header says what the whole run does; this file is one
# deployment's turn: refuse, plan, ask, do, check. Every host task is delegated, because the
# calling play is on the control node (it has to be, to ask a question in a terminal), and a
# delegated task reads `ansible_*` connection variables from the target but NOT its other
# group variables, which is why `infra_checkout` is taken from hostvars below.

- name: Note where {{ dep.name }} lives on {{ dep.host }}
  ansible.builtin.set_fact:
    dep_dir: "{{ hostvars[dep.host].infra_checkout }}/deployments/{{ dep.name }}"
    dep_skipped: false

# ── the host's checkout, pulled to the commit this control node reviewed ────
- name: Pull the host's checkout and check it is the reviewed commit
  ansible.builtin.import_tasks: _sync-host-checkout.yml
  vars:
    sync_host: "{{ dep.host }}"
    sync_paths: ["deployments/{{ dep.name }}/"]
    anchor_head: "{{ deploy_ctl_head }}"

# ── what must be true first ──────────────────────────────────────────────────
- name: Note the variables compose.yaml requires
  # Every ${VAR:?message}, which is how this repo says "absent should stop Compose". The
  # pattern avoids backslashes on purpose: a folded YAML scalar passes them to Jinja as they
  # are, and a lookbehind-free [$][{] reads the same everywhere.
  ansible.builtin.set_fact:
    dep_required: >-
      {{ lookup('file', control_checkout ~ '/deployments/' ~ dep.name ~ '/compose.yaml')
         | regex_findall('[$][{]([A-Za-z0-9_]+):[?]') | unique | list }}

- name: Read the variable names in {{ dep.name }}'s .env
  # Names only: sed prints the part before the `=`, so a value never reaches a register or a
  # log. No .env at all is rc 2, and reads as no names.
  ansible.builtin.command:
    cmd: sed -nE 's/^[[:space:]]*(export[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=.*/\2/p' .env
    chdir: "{{ dep_dir }}"
  register: dep_env_names
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: "{{ dep.host }}"
  when: dep_required | length > 0

- name: Check {{ dep.name }}'s .env names what compose.yaml requires
  # Skipped under --check for a first bring-up only: the keys are written by the tunnel play
  # in a real run, which a dry run cannot see (CLAUDE.md § Privileged commands).
  ansible.builtin.assert:
    that: dep_required | difference(dep_env_names.stdout_lines | default([])) | length == 0
    fail_msg: >-
      {{ dep.host }}:{{ dep_dir }}/.env lacks
      {{ dep_required | difference(dep_env_names.stdout_lines | default([])) }}, which compose.yaml
      requires. TUNNEL_ID and TUNNEL_CREDENTIALS are written by server-create-deployment-tunnel.yml
      (server-bring-up-deployment.yml runs it); the rest are the owner's to put there.
      Nothing was changed.
    success_msg: "{{ dep_required | length }} required variables present"
  when:
    - dep_required | length > 0
    - not (ansible_check_mode and (bringup | default(false) | bool))

- name: Stat {{ dep.name }}'s preflight hook
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/preflight.yml"
  register: dep_preflight

- name: "If it has a preflight hook: run it"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/preflight.yml"
  when: dep_preflight.stat.exists

# ── the plan: Compose's own dry run, nothing changed ─────────────────────────
- name: Plan {{ dep.name }}, as a dry run
  # check_mode true on the task itself, so even a real run only ever asks here. The module
  # runs `up --dry-run`; `actions` lists what it would do to each container and image.
  community.docker.docker_compose_v2:
    project_src: "{{ dep_dir }}"
    pull: missing
    state: present
  check_mode: true
  register: dep_plan
  become: true
  delegate_to: "{{ dep.host }}"

- name: Note the plan's lines for {{ dep.name }}
  # Compose renames a container it is replacing to <12 hex>_<name> while it builds the new
  # one, and the dry run reports that rename as a second container "Starting". It is the same
  # container, so those entries are left out. Read defensively: the key names are the
  # module's to change, and the whole entry is the fallback so a plan is never blanks.
  ansible.builtin.set_fact:
    dep_plan_lines: >-
      {% set out = [] %}{% for a in dep_plan.actions | default([]) %}{% if a.id is not defined or a.id is not match('^[0-9a-f]{12}_') %}{% set _ = out.append((a.what | default('?')) ~ ' ' ~ (a.id | default(a.msg | default(a | string))) ~ ': ' ~ (a.status | default(''))) %}{% endif %}{% endfor %}{{ out }}

- name: Print what up would do to {{ dep.name }}
  ansible.builtin.debug:
    msg: >-
      {{ dep.name }} on {{ dep.host }}:
      {{ 'would change: ' ~ (dep_plan_lines | join('; ')) if dep_plan.changed else 'nothing to change.' }}
  changed_when: true

# ── ask ──────────────────────────────────────────────────────────────────────
- name: "If changes and not --check: ask about {{ dep.name }}"
  ansible.builtin.pause:
    prompt: >-
      Redeploy {{ dep.name }} on {{ dep.host }}?
      Containers above are recreated, with a short outage. [y/N]
  register: dep_answer
  when:
    - dep_plan.changed
    - not ansible_check_mode
    - not (assume_yes | default(false) | bool)

- name: Note whether to go ahead with {{ dep.name }}
  ansible.builtin.set_fact:
    dep_go: >-
      {{ dep_plan.changed and not ansible_check_mode and
         ((assume_yes | default(false) | bool) or
          ((dep_answer.user_input | default('') | lower) in ['y', 'yes'])) }}

# ── do ───────────────────────────────────────────────────────────────────────
- name: "If going ahead: read {{ dep.name }}'s container ids"
  ansible.builtin.command:
    cmd: docker compose ps -a --format '{% raw %}{{.Name}} {{.ID}}{% endraw %}'
    chdir: "{{ dep_dir }}"
  register: dep_ids_before
  changed_when: false
  become: true
  delegate_to: "{{ dep.host }}"
  when: dep_go | bool

- name: "If going ahead: redeploy {{ dep.name }}"
  community.docker.docker_compose_v2:
    project_src: "{{ dep_dir }}"
    pull: missing
    state: present
  register: dep_up
  become: true
  delegate_to: "{{ dep.host }}"
  when: dep_go | bool

- name: "If going ahead: wait for {{ dep.name }} to settle"
  # `starting` is a healthcheck that has not answered yet; `Restarting` is a crash loop. Both
  # read as not yet; the check after says what the end state means.
  ansible.builtin.command:
    cmd: docker compose ps -a --format '{% raw %}{{.Name}} {{.Status}}{% endraw %}'
    chdir: "{{ dep_dir }}"
  register: dep_status
  until: dep_status.stdout is not search('starting|Restarting')
  retries: 20
  delay: 15
  changed_when: false
  become: true
  delegate_to: "{{ dep.host }}"
  when: dep_go | bool

- name: "If going ahead: read {{ dep.name }}'s container ids again"
  ansible.builtin.command:
    cmd: docker compose ps -a --format '{% raw %}{{.Name}} {{.ID}}{% endraw %}'
    chdir: "{{ dep_dir }}"
  register: dep_ids_after
  changed_when: false
  become: true
  delegate_to: "{{ dep.host }}"
  when: dep_go | bool

- name: "If going ahead: check every {{ dep.name }} container is up"
  ansible.builtin.assert:
    that: dep_status.stdout_lines | reject('search', ' Up ') | list | length == 0
    fail_msg: >-
      Not up after the redeploy on {{ dep.host }}:
      {{ dep_status.stdout_lines | default([]) | reject('search', ' Up ') | join('; ') }}.
      The rest of this run is stopped. `sudo docker compose logs` in {{ dep_dir }} says why;
      the deployment is as the failed `up` left it.
    success_msg: "{{ dep.name }}: all containers up"
  when: dep_go | bool

- name: Stat {{ dep.name }}'s probe hook
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/probe.yml"
  register: dep_probe
  when: dep_go | bool

- name: "If going ahead and it has a probe hook: run it"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../deploy-hooks/{{ dep.name }}/probe.yml"
  when:
    - dep_go | bool
    - dep_probe.stat.exists | default(false)

- name: "If going ahead: compare the ids before and after"
  # Recreated means a new id. A container whose id did not change was left alone, which is
  # the point of reading ids and not StartedAt (CLAUDE.md § Verifying changes).
  ansible.builtin.set_fact:
    dep_before: "{{ dict(dep_ids_before.stdout_lines | map('split', ' ') | map('first')
                    | zip(dep_ids_before.stdout_lines | map('split', ' ') | map('last'))) }}"
    dep_after: "{{ dict(dep_ids_after.stdout_lines | map('split', ' ') | map('first')
                   | zip(dep_ids_after.stdout_lines | map('split', ' ') | map('last'))) }}"
  when: dep_go | bool

- name: "If going ahead: print which were recreated"
  ansible.builtin.debug:
    msg: >-
      {{ dep.name }}: recreated {{ dep_after | dict2items
           | rejectattr('value', 'eq', '') | selectattr('key', 'in', dep_after.keys())
           | rejectattr('value', 'in', dep_before.values()) | map(attribute='key') | list or 'none' }};
      unchanged {{ dep_after | dict2items | selectattr('value', 'in', dep_before.values())
           | map(attribute='key') | list or 'none' }}
  changed_when: true
  when: dep_go | bool

- name: Note what happened to {{ dep.name }}
  ansible.builtin.set_fact:
    deploy_summary: >-
      {{ (deploy_summary | default([])) + [dep.host ~ '/' ~ dep.name ~ ': ' ~
         ('redeployed' if dep_go | bool else
          'plan only (--check)' if ansible_check_mode and dep_plan.changed else
          'nothing to change' if not dep_plan.changed else
          'skipped, not confirmed')] }}
