---
# SET UP ONE LEAP PI after Combustion's offline first boot, or again to put back what
# drifted (plans/pi-setup.md; decisions.md § Every Leap Pi). For hosts in `leap`:
#
#     cd ansible
#     ansible-playbook playbooks/server-setup-leap.yml -e target=one -K
#
# A fresh Pi has no way in yet: it is reached over the LAN at its DHCP address, through
# another box (`two` when the Pi is `one`), and HostKeyAlias checks its carried host key:
#
#     ansible-playbook playbooks/server-setup-leap.yml -e target=three -K \
#       -e ansible_host=192.168.86.57 -e 'ansible_ssh_common_args=-J one -o HostKeyAlias=three'
#
# WHAT IT DOES, in order, safe to run again: what is missing of the packages, locks,
# repository and /media mountpoints, in one snapshot, then a reboot; a report of packages
# on no list; the leap/pins binaries; the checkout, groups, users and carry-over; the
# tracked /etc files; fstab, units, firewalld, snapper, motd; restarts by the rule
# (decisions.md § Every Leap Pi); the reboot that needs; the ways in. A fresh Pi reboots twice:
# a transactional-update install is usable only after a reboot, and the image likely has
# no python3 or git, so the packages go in first, with raw, before anything else.
#
# -K is required. --check changes nothing, on a host already set up. -e confirm=yes answers
# both questions; -e ways_in_check=false skips the ways in, as in the update play.

- name: Check the inventory is loaded
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: leap

- name: Check a Leap target was named
  hosts: localhost
  gather_facts: false
  tasks:
    # Without MOVED, bin/install-system-file would read the host's Alpine copies.
    - name: Check -e target names a moved host in leap
      ansible.builtin.assert:
        that:
          - target is defined and target in groups['leap']
          - (control_checkout ~ '/hosts/' ~ target ~ '/leap/MOVED') is file
        fail_msg: Name a host in the leap group with -e target=<host>, one with a hosts/<host>/leap/MOVED.
        success_msg: "target: {{ target | default('?') }}"

- name: Set up a Leap host's packages and checkout
  hosts: "{{ target }}"
  gather_facts: false

  vars:
    repo_head: >-
      {{ lookup('ansible.builtin.file', control_checkout ~ '/hosts/' ~ inventory_hostname
         ~ '/leap/system/tailscale.repo', rstrip=false) }}
    repo_dest: >-
      {{ repo_head | regex_search('(?m)^# infra-path:\s*(\S+)', '\1') | first }}/{{
         repo_head | regex_search('(?m)^# infra-name:\s*(\S+)', '\1') | first }}
    setup_mounts: >-
      {{ (lookup('ansible.builtin.file', control_checkout ~ '/hosts/' ~ inventory_hostname
          ~ '/leap/fstab.append', errors='ignore') or '').splitlines()
         | reject('match', '^\s*(#|$)') | map('split') | map(attribute='1')
         | select('match', '^/media/') | list }}
    setup_missing: "{{ setup_lack.stdout_lines | select('match', '^package=') | map('regex_replace', '^package=', '') | list }}"
    setup_nomount: "{{ setup_lack.stdout_lines | select('match', '^mount=') | map('regex_replace', '^mount=', '') | list }}"
    setup_lacks: "{{ setup_lack.stdout_lines | select('match', '^(package|lock|repo|mount)=') | list }}"
    setup_snapshot: "{{ setup_lacks | length > 0 }}"
    cloudflared_bin: /usr/local/bin/cloudflared
    cloudflared_previous: /usr/local/lib/cloudflared.previous
    compose_bin: /usr/local/lib/docker/cli-plugins/docker-compose
    compose_previous: /usr/local/lib/docker/docker-compose.previous
    carry: /root/carry
    confirm: ""

  tasks:
    # Bytes sent from here (the repository, its key, fstab.append, motd, pins) are the commit.
    - name: Check the bytes sent from here are committed
      ansible.builtin.import_tasks: _review-anchor.yml
      vars:
        anchor_paths: [hosts/, leap/]
        anchor_untouched: Nothing was set up.

    # raw, since the image may have no python, and check_mode: false, since --check skips
    # raw. --whatprovides, so a name another package provides (python3) reads as present.
    - name: Read the OS, and the packages and locks missing
      ansible.builtin.raw: |
        cat /etc/os-release
        for p in {{ leap_packages | map('quote') | join(' ') }}; do
          rpm -q --whatprovides "$p" >/dev/null 2>&1 || echo "package=$p"
        done
        for l in {{ leap_package_locks | map('quote') | join(' ') }}; do
          grep -qxF "solvable_name: $l" /etc/zypp/locks 2>/dev/null || echo "lock=$l"
        done
        [ -e {{ repo_dest | quote }} ] || echo repo=absent
        for m in {{ setup_mounts | map('quote') | join(' ') }}; do [ -d "$m" ] || echo "mount=$m"; done
      register: setup_lack
      changed_when: false
      check_mode: false
      become: true

    - name: Check {{ inventory_hostname }} runs openSUSE Leap
      ansible.builtin.assert:
        that: setup_lack.stdout is search('^ID="?opensuse-leap"?\r?$', multiline=True)
        fail_msg: "{{ inventory_hostname }} is not openSUSE Leap. Nothing has been touched."
        quiet: true

    # Compose's plugin directory too, which copy will not make for _leap-pins.yml. Then
    # ONE snapshot, so a refused reboot changes nothing running and a rollback undoes it
    # all: the key and repository before zypper reads them, the locks before the install,
    # then the packages and the mountpoints the read-only root refuses outside one. First
    # the clock, which a Pi lacks until it syncs: HTTPS refuses every download until then,
    # and a plain HTTP Date header needs no certificate. The key and repository are the one
    # place bytes for /etc cross the connection, since there is no checkout before git.
    - name: "If anything is missing: build the package snapshot"
      ansible.builtin.raw: |
        set -e
        if [ "$(timedatectl show -p NTPSynchronized --value)" != yes ]; then
          date -u -s "$(curl -fsSI -m 30 http://download.opensuse.org/ | sed -n 's/^[Dd]ate: *//p' | tr -d '\r')" || true
        fi
        mkdir -p {{ compose_bin | dirname }}
        trap 'rm -rf /root/infra-bootstrap' EXIT
        install -d -m 0700 /root/infra-bootstrap
        printf '%s' {{ lookup('ansible.builtin.file', control_checkout ~ '/leap/tailscale-repo.gpg', rstrip=false) | b64encode | quote }} | base64 -d > /root/infra-bootstrap/key
        printf '%s' {{ repo_head | b64encode | quote }} | base64 -d > /root/infra-bootstrap/repo
        tu='transactional-update --non-interactive'
        $tu run sh -c {{ setup_inner | quote }}
        {% if setup_missing %}$tu --continue pkg install {{ setup_missing | map('quote') | join(' ') }}{% endif %}

        {% if setup_nomount %}$tu --continue run mkdir -p {{ setup_nomount | map('quote') | join(' ') }}{% endif %}
      vars:
        setup_inner: >-
          set -e; rpm --import /root/infra-bootstrap/key;
          install -D -m 0644 /root/infra-bootstrap/repo {{ repo_dest | quote }};
          for l in {{ leap_package_locks | map('quote') | join(' ') }}; do
          grep -qxF "solvable_name: $l" /etc/zypp/locks 2>/dev/null ||
          zypper --non-interactive addlock "$l"; done
      register: setup_tx
      changed_when: true
      when: setup_snapshot | bool and not ansible_check_mode
      become: true

    - name: Reboot into the package snapshot
      ansible.builtin.import_tasks: _leap-reboot.yml
      vars:
        reboot_for: "{{ ['the package snapshot (' ~ setup_lacks | join(' ') ~ ')'] if setup_tx is changed else [] }}"
        reboot_must: true

    # zypper's record of what was installed by request, less what provides each list entry
    # and less the image's baseline, which Combustion writes and one and three predate.
    - name: Read the packages installed by request
      ansible.builtin.shell: |
        listed=$(rpm -q --whatprovides --qf '%{NAME}\n' {{ leap_packages | map('quote') | join(' ') }} | grep -v ' ')
        if [ -r /etc/infra/image-packages ]; then echo baseline; else echo none; fi
        zypper --quiet --no-refresh packages --userinstalled |
          awk -F'|' 'NF >= 3 && $1 ~ /^ *i/ { gsub(/ /, "", $3); print $3 }' | sort -u |
          grep -vxF "$listed" | grep -vxF "$(cat /etc/infra/image-packages 2>/dev/null)" || true
      register: setup_extras
      changed_when: false
      check_mode: false
      become: true

    - name: Print the packages on no list, which stay
      ansible.builtin.debug:
        msg: >-
          On no list{{ '' if setup_extras.stdout_lines[0] == 'baseline' else " (no baseline, so the image's own too)" }}:
          {{ setup_extras.stdout_lines[1:] | join(' ') or 'none' }}. Removing one is the owner's call.
      changed_when: true

    - name: Read the versions and leap/pins
      ansible.builtin.import_tasks: _leap-pins-read.yml
      vars:
        pins_untouched: Nothing past the packages was set up.

    - name: Move cloudflared and Compose to leap/pins
      ansible.builtin.import_tasks: _leap-pins.yml
      vars:
        pins_untouched: Nothing past the pinned binaries was set up; leap/pins is the thing to look at.

    # As gavin. One already there is left; one with no commit fails the system files pull.
    - name: "If there is no checkout: clone it"
      ansible.builtin.command:
        cmd: git clone --quiet https://github.com/gsfernandes81/infra.git {{ infra_checkout }}
        creates: "{{ infra_checkout }}"

    # The first boot gave him bash, since the image has no fish until the packages.
    - name: Make fish gavin's shell
      ansible.builtin.user:
        name: gavin
        shell: /usr/bin/fish
      become: true

    # Before the carry-over and the tracked files that name them. A group at another gid
    # stops the play, since files would belong to the wrong number.
    - name: Read the groups
      ansible.builtin.getent:
        database: group

    - name: Check no group of the same name has another gid
      ansible.builtin.assert:
        that: >-
          item.name not in ansible_facts.getent_group
          or ansible_facts.getent_group[item.name][1] == item.gid | string
        fail_msg: A {{ item.name }} group exists at another gid than {{ item.gid }}. Nothing was changed.
        quiet: true
      loop: "{{ leap_groups | default([]) }}"

    # Each of leap_groups at its gid, and a group of its own for each system user.
    - name: Make each group
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid | default(omit) }}"
        system: "{{ item.gid is not defined }}"
      loop: "{{ leap_groups | default([]) + leap_system_users | default([]) }}"
      become: true

    - name: Add each group's members
      ansible.builtin.user:
        name: "{{ item.1 }}"
        groups: "{{ item.0.name }}"
        append: true
      loop: "{{ leap_groups | default([]) | subelements('members') }}"
      become: true

    - name: Make each system user, with no password
      ansible.builtin.user:
        name: "{{ item.name }}"
        group: "{{ item.name }}"
        system: true
        create_home: false
        home: "{{ item.home }}"
        shell: "{{ item.shell }}"
        comment: "{{ item.comment }}"
      loop: "{{ leap_system_users | default([]) }}"
      become: true

    # Root's, so a user cannot change its own keys, ssh config or the host key it trusts.
    - name: Make each system user's home and .ssh, root's
      ansible.builtin.file:
        path: "{{ item.0.home }}{{ item.1 }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ leap_system_users | default([]) | product(['', '/.ssh']) | list }}"
      become: true

    # Only a new box has /root/carry; find skips paths that do not exist.
    - name: Read what Combustion staged in /root/carry
      ansible.builtin.find:
        paths: ["{{ carry }}/env", "{{ carry }}/home"]
        patterns: ["*.env", ".*-secrets"]
        file_type: any
        hidden: true
      register: setup_carry
      become: true

    # Each .env into its deployment at 0600, each secrets directory into gavin's home, his.
    - name: "If staged: put each in place"
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: >-
          {{ infra_checkout ~ '/deployments/' ~ item | basename | regex_replace('[.]env$', '') ~ '/.env'
             if item is match('.*[.]env$') else '/home/gavin/' }}
        remote_src: true
        owner: gavin
        group: gavin
        mode: "{{ '0600' if item is match('.*[.]env$') else omit }}"
      loop: "{{ setup_carry.files | map(attribute='path') | list }}"
      become: true

    # As the plays write them: KEY=value, TUNNEL_CREDENTIALS and dev's *_SECRETS.
    - name: "If staged: read the secrets each .env names"
      ansible.builtin.shell: cat {{ carry }}/env/*.env 2>/dev/null | grep -E '^(TUNNEL_CREDENTIALS|[A-Z_]+_SECRETS)=' || true
      register: setup_named
      changed_when: false
      check_mode: false
      become: true

    # Each carried directory dev's .env names: the dev stack reads them as group 1001
    # (decisions.md § The dev stack runs as 1001 on every host), directories 0750 and files
    # 0640. Under --check they are not in place yet.
    - name: "If staged: give the dev stack's secrets group 1001"
      ansible.builtin.file:
        path: "{{ item }}"
        group: "1001"
        mode: u=rwX,g=rX,o=
        recurse: true
      loop: >-
        {{ setup_named.stdout_lines | select('match', '^[A-Z_]+_SECRETS=') | map('regex_replace', '^[^=]*=', '')
           | select('in', setup_carry.files | map(attribute='path') | map('basename') | map('regex_replace', '^', '/home/gavin/'))
           | list }}
      when: not ansible_check_mode
      become: true

    # For the cloudflared image's user, as server-create-deployment-tunnel.yml leaves it.
    - name: "If staged: give each tunnel credentials file 65532"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "65532"
        group: "65532"
        mode: "0600"
      loop: "{{ setup_named.stdout_lines | select('match', '^TUNNEL_CREDENTIALS=/home/gavin/') | map('regex_replace', '^[^=]*=', '') | list }}"
      when: not ansible_check_mode
      become: true

    - name: Remove /root/carry
      ansible.builtin.file:
        path: "{{ carry }}"
        state: absent
      become: true

# For this host only: its hosts line is fleet otherwise, and a fresh Pi's -e ansible_host
# would send every fleet host's run to this box. Its guards are its own, unchanged.
- name: Install the tracked /etc files on this host
  ansible.builtin.import_playbook: server-install-system-files.yml
  vars:
    system_files_hosts: "{{ target }}"

- name: Finish a Leap host, and reboot it if it needs
  hosts: "{{ target }}"
  gather_facts: false

  vars:
    confirm: ""
    ways_in_check: true
    # From the system files play's dry run; a real run installed exactly these, or stopped.
    setup_changed: "{{ dry.results | rejectattr('stdout', 'search', 'Nothing to do') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    setup_refused: "{{ dry.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    setup_restart: "{{ leap_restart_on_change | dict2items | selectattr('key', 'in', setup_changed) | map(attribute='value') | unique | list }}"
    setup_held: "{{ setup_changed | select('in', leap_reboot_on_change) | list }}"
    setup_reasons: >-
      {{ setup_held + (['the fstab entries'] if setup_fstab is changed else [])
         + (['a new snapshot'] if setup_pending.stdout | trim == 'waits' else []) }}
    # A refused reboot leaves the five on their old files, so nothing is proved then.
    setup_waits: "{{ setup_reasons | length > 0 and not reboot_go | bool and not ansible_check_mode }}"
    setup_proved: "{{ ways_in_check | bool and not setup_waits | bool and not ansible_check_mode }}"
    setup_tunnel_ok: "{{ upd_ready.rc | default(1) == 0 and (upd_ready.stdout | default('{}') | from_json).readyConnections | default(0) > 0 }}"
    setup_tailnet_ok: "{{ upd_tailnet.rc | default(1) == 0 }}"
    setup_now: "{{ dict(setup_after.stdout_lines | default([]) | map('split', '=')) }}"
    # openSUSE's import-pubring-from-rpmdb fails harmlessly, as the update play says.
    setup_bad: "{{ upd_failed.stdout_lines | default([]) | reject('equalto', 'import-pubring-from-rpmdb.service') | list }}"
    # Reconnect only when the run came in on another address of the static one's LAN, the
    # lease the new profile replaces: never through an ssh alias or a simulation's 127.0.0.1.
    setup_reconnect: >-
      {{ leap_static_address if setup_changed | select('match', '.*\.nmconnection$') | list
         and ansible_host != leap_static_address
         and ansible_host is match((leap_static_address | regex_replace('\d+$', '')) | regex_escape)
         else '' }}

  tasks:
    # Each line appended if missing; no markers or comments, since the fstab is entries only.
    - name: Add fstab.append's entries to /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ item }}"
      loop: >-
        {{ (lookup('ansible.builtin.file', control_checkout ~ '/hosts/' ~ inventory_hostname
            ~ '/leap/fstab.append', errors='ignore') or '').splitlines() | reject('match', '^\s*(#|$)') | list }}
      register: setup_fstab
      become: true

    # daemon_reload first, for the unit files the system files play may have installed.
    - name: Enable the units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
      loop: "{{ leap_units_enabled + leap_extra_units_enabled | default([]) }}"
      register: setup_enabled
      become: true

    - name: Mask the units Leap would otherwise start
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop: "{{ leap_units_masked }}"
      become: true

    - name: Keep rescue mode's ways in
      ansible.builtin.command:
        cmd: systemctl add-wants rescue.target {{ item }}
        creates: /etc/systemd/system/rescue.target.wants/{{ item }}
      loop: "{{ leap_rescue_wants }}"
      become: true

    # Starting a stopped unit is not a restart; the common units all wait for the reboot.
    - name: Start each newly enabled unit of the host's own
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop: "{{ setup_enabled.results | selectattr('changed') | map(attribute='item') | difference(leap_units_enabled) }}"
      when: not ansible_check_mode
      become: true

    # Then a reload, firewalld's own restart, which the rule allows.
    - name: Add each firewalld service missing, and reload
      ansible.builtin.shell: |
        added=$(for s in {{ leap_firewalld_services | map('quote') | join(' ') }}; do
          firewall-cmd -q --permanent --query-service="$s" ||
            { firewall-cmd -q --permanent --add-service="$s" && echo "$s"; }
        done)
        [ -z "$added" ] || { firewall-cmd -q --reload && echo "$added"; }
      register: setup_fw
      changed_when: setup_fw.stdout | length > 0
      when: leap_firewalld_services | default([]) | length > 0
      become: true

    # Only on a host whose host_vars name the list, which must then name root's too.
    - name: "If the host names snapper configs: set the list"
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/snapper
        regexp: '^SNAPPER_CONFIGS='
        line: SNAPPER_CONFIGS="{{ leap_snapper_configs | join(' ') }}"
      when: leap_snapper_configs is defined
      become: true

    - name: Install the update recipes every login shows
      ansible.builtin.copy:
        src: "{{ control_checkout }}/leap/motd"
        dest: /etc/motd.d/50-infra-updates
        mode: "0644"
      become: true

    - name: Restart each running unit whose file changed
      ansible.builtin.command: systemctl try-restart {{ item }}
      changed_when: true
      loop: "{{ setup_restart }}"
      when: not ansible_check_mode
      become: true

    # The snapshot root is mounted from, against btrfs's default: one built, not yet booted.
    - name: Read whether a new snapshot waits
      ansible.builtin.shell: |
        cur=$(findmnt -n -o SOURCE / | sed -n 's|.*\[/*\(.*\)\]$|\1|p')
        def=$(btrfs subvolume get-default / | sed -n 's|.* path /*||p')
        [ -n "$cur" ] && [ -n "$def" ] && [ "$cur" != "$def" ] && echo waits || echo none
      register: setup_pending
      changed_when: false
      check_mode: false
      become: true

    - name: Reboot if anything needs it
      ansible.builtin.import_tasks: _leap-reboot.yml
      vars:
        reboot_for: "{{ setup_reasons }}"
        reboot_must: false
        reboot_to: "{{ setup_reconnect }}"

    - name: Read whether a tunnel and a tailnet login exist
      ansible.builtin.shell: |
        f=$(sed -n 's/^credentials-file: *//p' /etc/cloudflared/config.yml 2>/dev/null)
        if [ -n "$f" ] && [ -s "$f" ]; then echo tunnel; fi
        tailscale status --json 2>/dev/null | jq -r .BackendState
      register: setup_ways
      changed_when: false
      check_mode: false
      become: true

    - name: Prove the ways in, and read the failed units
      ansible.builtin.import_tasks: _leap-prove.yml
      vars:
        prove_tunnel: "{{ 'tunnel' in setup_ways.stdout_lines and not setup_waits | bool }}"
        prove_tailnet: "{{ 'Running' in setup_ways.stdout_lines and not setup_waits | bool }}"

    # The same command as the read before the pins moved.
    - name: Read the kernel and pinned versions after
      ansible.builtin.shell: "{{ upd_before.cmd }}"
      register: setup_after
      changed_when: false
      when: not ansible_check_mode

    # changed_when: true, or display_ok_hosts = False hides the report (ansible.cfg).
    - name: Print what changed, and what is next
      ansible.builtin.debug:
        msg:
          - "{{ 'DRY RUN: nothing was changed.' if ansible_check_mode else inventory_hostname ~ ' is set up.' }}"
          - "cloudflared {{ upd_was.cloudflared or 'missing' }} -> {{ pins.cloudflared_version }}, Compose {{ upd_was.compose or 'missing' }} -> {{ pins.compose_version }}."
          - "Tracked files changed: {{ setup_changed | join(', ') or 'none' }}."
          - "REFUSED by install-system-file: {{ setup_refused | join(', ') or 'none' }}."
          - "Restarted where running: {{ setup_restart | join(', ') or 'nothing' }}."
          - "{{ 'NOT REBOOTED, so these wait for the next boot' if setup_waits | bool else 'Reboot' }} for: {{ setup_reasons | join(', ') or 'nothing' }}."
          - "Tunnel: {{ 'none yet' if 'tunnel' not in setup_ways.stdout_lines else 'not proved' if not setup_proved | bool
              else 'serving' if setup_tunnel_ok | bool else 'NOT SERVING' }}."
          - "Tailnet to {{ tailnet_peer }}: {{ 'not joined yet' if 'Running' not in setup_ways.stdout_lines
              else 'not proved' if not setup_proved | bool else 'reaching' if setup_tailnet_ok | bool else 'NOT REACHING' }}."
          - "Failed units: {{ setup_bad | join(', ') or 'none' }}."
          - "Array: {{ 'locked; server-unlock-arrays.yml unlocks it' if setup_now.array | default('') == 'locked' else 'none locked' }}."
      changed_when: true

    - name: Check the files, ways in, units and pins
      ansible.builtin.assert:
        that:
          - setup_refused | length == 0
          - not setup_proved | bool or 'tunnel' not in setup_ways.stdout_lines or setup_tunnel_ok | bool
          - not setup_proved | bool or 'Running' not in setup_ways.stdout_lines or setup_tailnet_ok | bool
          - setup_bad | length == 0
          - setup_now.cloudflared | default('') == pins.cloudflared_version
          - setup_now.compose | default('') == pins.compose_version
        fail_msg: >-
          {{ inventory_hostname }} is set up, but not whole; the report above says which part.
          Running the play again is safe.
        success_msg: done
      when: not ansible_check_mode
