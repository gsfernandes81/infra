---
# GIVE A COMPOSE STACK ITS OWN TUNNEL — for a cloudflared SIDECAR in the stack, not a rule
# in the host's tunnel. Run from the phone:
#
#     cd ansible
#     ansible-playbook playbooks/server-create-stack-tunnel.yml -e stack=calibre-web --check -K
#     ansible-playbook playbooks/server-create-stack-tunnel.yml -e stack=calibre-web -K
#
# -K because the credentials file belongs to uid 65532, the user cloudflare/cloudflared
# runs as, so reading and writing it needs root — even under --check, where the read of an
# existing file is what tells the play whether the tunnel already exists. The Cloudflare
# API token comes from ~/.config/cloudflare/api-token as for every play that talks to it.
#
# NOTHING IS STARTED. Like every play here, this provisions and stops; the stack comes up
# by hand afterwards, and the play ends by printing how. The order matters for a stack with
# a login: the probe at the end proves the login is in front of the hostname BEFORE
# anything answers behind it.
#
# ── what it reads, and where it is derived from ──────────────────────────────
#   deployments/<stack>/edge.yml        access: browser | none, and an optional bypass_path
#   deployments/<stack>/cloudflared.yml the tracked ingress; checked, never written
#   hosts/<host>/<stack>                the symlink placing the stack on a host. The host is
#                                       READ FROM IT — exactly one must exist — so there is
#                                       no -e target to disagree with it.
#   group_vars/all.yml dns_zone         the hostname is <stack>.<dns_zone>, never written
#                                       beside the stack name (CLAUDE.md § Repo invariants)
#
# ── what it makes ────────────────────────────────────────────────────────────
#   1. a locally-managed tunnel, named <stack>       } _cf-tunnel.yml, shared with
#   2. a proxied CNAME <stack>.<dns_zone>            } _dev-container-tunnel.yml
#   3. credentials at ~/.<stack>-secrets/tunnel.json on the host, 65532:65532 0600 — OUTSIDE
#      the repo checkout, the same ~/.<name>-secrets convention as the dev containers
#   4. TUNNEL_ID and TUNNEL_CREDENTIALS in the stack's .env on the host. The sidecar has no
#      shell to read the id out of the credentials (infra-dev's entrypoint does that), and
#      `tunnel run` needs it, so compose passes ${TUNNEL_ID} — written by the same run that
#      wrote the credentials, so the two cannot name different tunnels.
#   5. ONLY for `access: browser`: an Access application on the hostname admitting the
#      addresses in ~/.config/cloudflare/access-emails, and, with a bypass_path, a second
#      application on that path that lets everyone through — for a client that cannot log
#      in (the Kobo). Access path matching is by prefix and the most specific application
#      wins, so the probe proves `/` still asks for a login after the bypass exists.
#   `access: none` makes no Access objects at all — for a stack whose clients cannot pass
#   Access and which has its own auth (garmin-mcp, behind claude.ai's connector).
#
# Re-running is the intended way to finish after a partial failure, and a converged run
# changes nothing but the two Access applications, which PUT unconditionally — the reason
# is beside the same choice in _dev-container-tunnel.yml.
#
# The reasoning for all of it is docs/decisions.md § "Sidecar, not baked-in".

- name: Guard — refuse to run with no inventory
  ansible.builtin.import_playbook: _assert-inventory.yml
  vars:
    required_group: fleet

- name: Read the stack's edge, and find the host it is placed on
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Name the stack
      ansible.builtin.assert:
        that:
          - stack is defined
          - stack is match('^[a-z0-9][a-z0-9-]*$')
        fail_msg: >-
          Say which stack: -e stack=<name>, a directory under deployments/ that has an
          edge.yml. Lower case, digits and hyphens — it becomes a hostname.
        success_msg: "stack {{ stack }}"

    - name: Look for its edge.yml
      ansible.builtin.stat:
        path: "{{ repo_root }}/deployments/{{ stack }}/edge.yml"
      register: edge_stat

    - name: Refuse a stack with no edge.yml
      ansible.builtin.assert:
        that: edge_stat.stat.exists
        fail_msg: >-
          deployments/{{ stack }}/edge.yml does not exist. It is what says whether this
          stack wants an Access login; a stack without one is not ready for a tunnel.
        success_msg: "deployments/{{ stack }}/edge.yml"

    - name: Read it
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/deployments/{{ stack }}/edge.yml"
        name: stack_edge

    - name: Refuse an edge.yml this play cannot act on exactly
      ansible.builtin.assert:
        that:
          - stack_edge.access is defined
          - stack_edge.access in ['browser', 'none']
          - stack_edge.bypass_path is not defined or stack_edge.access == 'browser'
          - >-
            stack_edge.bypass_path is not defined
            or (stack_edge.bypass_path is match('^/[A-Za-z0-9._~-]+(/[A-Za-z0-9._~-]+)*/$'))
          - (stack_edge | list | difference(['access', 'bypass_path'])) | length == 0
        fail_msg: >-
          deployments/{{ stack }}/edge.yml must say `access: browser` or `access: none`,
          and may add `bypass_path: /some/path/` — leading and trailing slash, browser only,
          because a bypass under no login means nothing. Nothing else is read, and an
          unknown key is refused rather than ignored: {{ stack_edge }}
        success_msg: "access {{ stack_edge.access }}{{ ', bypass ' ~ stack_edge.bypass_path if stack_edge.bypass_path is defined else '' }}"

    - name: Find where the stack is placed
      ansible.builtin.find:
        paths: "{{ repo_root }}/hosts"
        patterns: "{{ stack }}"
        file_type: link
        recurse: true
        depth: 2
      register: stack_links

    - name: Refuse a stack placed on no host, or on more than one
      # One sidecar means one tunnel, and two connectors on one tunnel are replicas: the edge
      # would split requests between two hosts. Not a state to create by accident.
      ansible.builtin.assert:
        that:
          - stack_links.files | length == 1
          - (stack_links.files[0].path | dirname | basename) in groups['fleet']
        fail_msg: >-
          Expected exactly one hosts/<host>/{{ stack }} symlink, on a host in the
          inventory; found {{ stack_links.files | map(attribute='path') | list }}.
          `ln -s ../../deployments/{{ stack }} hosts/<host>/{{ stack }}` places it.
        success_msg: "placed on {{ stack_links.files[0].path | dirname | basename }}"

    - name: Read the tracked ingress
      ansible.builtin.set_fact:
        stack_host: "{{ stack_links.files[0].path | dirname | basename }}"
        stack_hostname: "{{ stack ~ '.' ~ dns_zone }}"
        stack_ingress: "{{ lookup('file', repo_root ~ '/deployments/' ~ stack ~ '/cloudflared.yml') | from_yaml }}"

    - name: Refuse an ingress that does not match what this play provisions
      # The hostname in cloudflared.yml is a literal, because nothing boot-path is generated
      # from a template; this is the check that keeps that literal and the derived name the
      # same. And no `tunnel:` key — the id comes from .env, written beside the credentials.
      ansible.builtin.assert:
        that:
          - stack_ingress.tunnel is not defined
          - stack_ingress['credentials-file'] | default('') == '/etc/cloudflared/creds.json'
          - stack_ingress.ingress[0].hostname | default('') == stack_hostname
          - stack_ingress.ingress[-1].service | default('') == 'http_status:404'
        fail_msg: >-
          deployments/{{ stack }}/cloudflared.yml should carry no `tunnel:` (the id comes
          from .env), `credentials-file: /etc/cloudflared/creds.json`, a first rule for
          {{ stack_hostname }}, and the http_status:404 catch-all last.
        success_msg: "cloudflared.yml routes {{ stack_hostname }}"

    - name: Put the host in the group the next play runs on
      ansible.builtin.add_host:
        name: "{{ stack_host }}"
        groups: [stack_target]
        stack_edge: "{{ stack_edge }}"
        stack_hostname: "{{ stack_hostname }}"
      changed_when: false

- name: Provision the stack's tunnel, and its Access login if it has one
  hosts: stack_target
  gather_facts: false
  become: false

  vars:
    cf_api: https://api.cloudflare.com/client/v4
    cf_zone: "{{ dns_zone }}"
    cf_name: "{{ stack }}"
    cf_hostname: "{{ stack_hostname }}"
    # The filler for ids only a write could produce, inline wherever one is rendered. Why
    # inline and not a set_fact is beside its definition in _dev-container-tunnel.yml.
    cf_unknown_id: WOULD-BE-CREATED-BY-A-REAL-RUN
    # A week. The login sits in front of a reading app on a personal account; a daily
    # one-time PIN would be friction with nothing bought. The bypass path has no session.
    cf_session_duration: 168h
    # The known-good Access application the probe calibrates against before it trusts its
    # own verdict (CLAUDE.md § Verifying changes). It has to be a hostname that IS behind
    # an Access login and whose origin is irrelevant, because Access answers first.
    access_calibration_hostname: "torrents.{{ dns_zone }}"
    # Twelve tries ten seconds apart: a CNAME made seconds ago can take that long to resolve
    # from the phone's resolver, and a probe that gave up sooner would fail a good run.
    probe_retries: 12
    # Where the host's checkout is. Its .env is where host-specific values live.
    infra_checkout: "{{ ansible_user_dir }}/infra"

  tasks:
    # ── before anything is made: every input this run will need ─────────────
    - name: The Cloudflare API token
      ansible.builtin.import_tasks: _cf-api-token.yml

    - name: Look for the Access email list
      ansible.builtin.stat:
        path: "{{ cf_access_emails_file }}"
      register: cf_emails_stat
      delegate_to: localhost
      when: stack_edge.access == 'browser'

    - name: How to make one, when there is none
      ansible.builtin.debug:
        msg: "{{ cf_access_emails_howto }}"
      changed_when: true
      when:
        - stack_edge.access == 'browser'
        - not cf_emails_stat.stat.exists

    - name: Stop without one — BEFORE the hostname exists, so it never exists without a login
      ansible.builtin.assert:
        that: cf_emails_stat.stat.exists
        fail_msg: "No {{ cf_access_emails_file }}; see above. Nothing has been created."
        quiet: true
      when: stack_edge.access == 'browser'

    - name: Read the addresses
      ansible.builtin.set_fact:
        cf_access_emails: >-
          {{ lookup('file', cf_access_emails_file).splitlines()
             | map('trim') | reject('match', '^(#|$)') | list }}
      when: stack_edge.access == 'browser'

    - name: Refuse an empty or garbled list
      # An application whose allow policy admits nobody is safe but useless; one that admits
      # a typo is a login that never arrives. Count only, never the addresses — this repo
      # is public and so are screenshots of its runs.
      ansible.builtin.assert:
        that:
          - cf_access_emails | length > 0
          - cf_access_emails | reject('match', '^[^@\s]+@[^@\s]+\.[^@\s]+$') | list | length == 0
        fail_msg: >-
          {{ cf_access_emails_file }} needs at least one address, one per line, and every
          non-comment line must look like an address. Nothing has been created.
        success_msg: "{{ cf_access_emails | length }} address(es) will be admitted"
      when: stack_edge.access == 'browser'

    - name: Learn the ssh user's home on the host
      ansible.builtin.setup:
        gather_subset: ['!all']

    - name: Confirm the host has pulled this stack
      # The .env written below lives in the host's checkout. If the commit adding the stack
      # has not reached the host yet, the play would create a deployments/<stack>/ that git
      # then refuses to pull over. Stop instead.
      ansible.builtin.stat:
        path: "{{ infra_checkout }}/deployments/{{ stack }}/compose.yaml"
      register: host_compose
      check_mode: false

    - name: Refuse a host whose checkout does not have the stack
      ansible.builtin.assert:
        that: host_compose.stat.exists
        fail_msg: >-
          {{ infra_checkout }}/deployments/{{ stack }}/compose.yaml is not on
          {{ inventory_hostname }}. `ssh {{ inventory_hostname }}`, then
          `cd ~/infra; git pull --ff-only`, and re-run. Nothing has been created.
        success_msg: "{{ inventory_hostname }}'s checkout has {{ stack }}"

    - name: The secrets directory, outside the checkout
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.{{ stack }}-secrets"
        state: directory
        mode: "0700"

    # ── 0–2  the zone and account, the tunnel, the DNS record ──────────────
    - name: The tunnel and its DNS record
      ansible.builtin.import_tasks: _cf-tunnel.yml
      vars:
        cf_creds_path: "{{ ansible_user_dir }}/.{{ stack }}-secrets/tunnel.json"
        cf_creds_become: true
        # cloudflare/cloudflared is distroless `nonroot`, USER 65532:65532 in its Dockerfile.
        # Docker resolves a bind mount as root, so the 0700 directory above does not stop
        # the container; the file's own owner and mode are what it is checked against.
        cf_creds_owner: "65532"
        cf_creds_group: "65532"
        cf_dns_comment: "{{ stack }} sidecar tunnel — ansible/playbooks/server-create-stack-tunnel.yml"
        cf_dead_tunnel_hint: >-
          The sidecar reads it and cannot connect until you do; the stack's other services
          are unaffected.

    # ── 3  the two .env lines the sidecar needs ─────────────────────────────
    - name: Write TUNNEL_ID and TUNNEL_CREDENTIALS into the stack's .env
      # lineinfile, so every other line — the ones you fill from .env.example — is left
      # alone. Neither value is a secret; the secret is the file the second one names.
      ansible.builtin.lineinfile:
        path: "{{ infra_checkout }}/deployments/{{ stack }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: true
        mode: "0600"
      loop:
        - { key: TUNNEL_ID, value: "{{ cf_tunnel_id | default(cf_unknown_id, true) }}" }
        - { key: TUNNEL_CREDENTIALS, value: "{{ ansible_user_dir }}/.{{ stack }}-secrets/tunnel.json" }
      loop_control:
        label: "{{ item.key }}"

    # ── 4  the Access login, for `access: browser` only ─────────────────────
    - name: Access, for a browser-facing stack
      when: stack_edge.access == 'browser'
      block:
        - name: List the account's Access applications
          ansible.builtin.uri:
            url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps"
            headers: { Authorization: "Bearer {{ cf_token }}" }
          register: cf_app_q
          delegate_to: localhost
          check_mode: false
          changed_when: false
          no_log: true

        - name: Name the two applications, and find any that exist
          # Matched on the domain OR the name this play gives it, so a domain Cloudflare
          # normalises on the way back (a trailing slash, say) still finds its application
          # instead of creating a second one on every run.
          ansible.builtin.set_fact:
            cf_login_app_name: "{{ stack }}"
            cf_bypass_app_name: "{{ stack }} {{ stack_edge.bypass_path | default('') }} (no login)"
            cf_bypass_domain: "{{ stack_hostname ~ stack_edge.bypass_path | default('') }}"
            cf_login_app: >-
              {{ ((cf_app_q.json.result | default([]) | selectattr('domain', 'eq', stack_hostname) | list)
                  + (cf_app_q.json.result | default([]) | selectattr('name', 'eq', stack) | list))
                 | first | default({}) }}

        - name: Find the bypass application, if there is one to find
          ansible.builtin.set_fact:
            cf_bypass_app: >-
              {{ ((cf_app_q.json.result | default([]) | selectattr('domain', 'eq', cf_bypass_domain) | list)
                  + (cf_app_q.json.result | default([]) | selectattr('name', 'eq', cf_bypass_app_name) | list))
                 | first | default({}) }}
          when: stack_edge.bypass_path is defined

        # ── the login application ──
        - name: Create or update the login application
          # allowed_idps is left out, which means every login method the account has — the
          # same ones torrents uses. auto_redirect off so the method picker shows.
          ansible.builtin.uri:
            url: >-
              {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps{{
                 '/' ~ cf_login_app.id if cf_login_app else '' }}
            method: "{{ 'PUT' if cf_login_app else 'POST' }}"
            status_code: [200, 201]
            headers: { Authorization: "Bearer {{ cf_token }}" }
            body_format: json
            body:
              name: "{{ cf_login_app_name }}"
              domain: "{{ stack_hostname }}"
              type: self_hosted
              session_duration: "{{ cf_session_duration }}"
              auto_redirect_to_identity: false
              app_launcher_visible: false
          register: cf_login_w
          delegate_to: localhost
          failed_when: false
          changed_when: cf_login_w.json.success | default(false)
          no_log: true

        - name: What Cloudflare said, if it refused the login application
          ansible.builtin.debug:
            msg: >-
              {{ stack_hostname }}: HTTP {{ cf_login_w.status | default('?') }}:
              {{ cf_login_w.json.errors | default(cf_login_w.msg) | default('no detail') }}
          changed_when: true
          when:
            - cf_login_w is not skipped
            - cf_login_w.status | default(0) not in [200, 201]

        - name: Stop if the login application was not made
          ansible.builtin.assert:
            that: cf_login_w.status | default(0) in [200, 201]
            fail_msg: >-
              No Access application on {{ stack_hostname }}. DO NOT START THE STACK: the
              hostname exists and nothing is in front of it. A 403 means the API token
              lacks Account : Access: Apps and Policies : Edit.
            quiet: true
          when: cf_login_w is not skipped

        - name: Remember the login application's id
          ansible.builtin.set_fact:
            cf_login_app_id: "{{ cf_login_w.json.result.id if cf_login_w is not skipped else cf_login_app.id }}"
          # Under --check the write is skipped, so this is the existing id or nothing — and
          # nothing leaves the fact genuinely undefined, which is what the read below tests.
          when: (cf_login_w is not skipped) or (cf_login_app | length > 0)

        - name: List the login application's policies
          ansible.builtin.uri:
            url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{ cf_login_app_id }}/policies"
            headers: { Authorization: "Bearer {{ cf_token }}" }
          register: cf_login_pol_q
          delegate_to: localhost
          check_mode: false
          changed_when: false
          no_log: true
          when: cf_login_app_id is defined

        - name: Write the allow policy — the addresses in the list, nobody else
          # Replaces the include list rather than adding to it: the file is the whole truth,
          # so removing an address there and re-running removes it here.
          ansible.builtin.uri:
            url: >-
              {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{
                 cf_login_app_id | default(cf_unknown_id) }}/policies{{
                 ('/' ~ cf_login_pol.id) if cf_login_pol else '' }}
            method: "{{ 'PUT' if cf_login_pol else 'POST' }}"
            status_code: [200, 201]
            headers: { Authorization: "Bearer {{ cf_token }}" }
            body_format: json
            body:
              name: "{{ cf_login_pol.name | default('allowed people') }}"
              decision: allow
              precedence: "{{ cf_login_pol.precedence | default(1) }}"
              include: "{{ cf_access_emails | map('community.general.dict_kv', 'email') | map('community.general.dict_kv', 'email') | list }}"
              exclude: []
              require: []
          vars:
            cf_login_pol: >-
              {{ cf_login_pol_q.json.result | default([])
                 | selectattr('decision', 'eq', 'allow') | list | first | default({}) }}
          register: cf_login_pol_w
          delegate_to: localhost
          failed_when: false
          changed_when: cf_login_pol_w.json.success | default(false)
          no_log: true

        - name: What Cloudflare said, if it refused the allow policy
          ansible.builtin.debug:
            msg: >-
              allow policy on {{ stack_hostname }}: HTTP {{ cf_login_pol_w.status | default('?') }}:
              {{ cf_login_pol_w.json.errors | default(cf_login_pol_w.msg) | default('no detail') }}
          changed_when: true
          when:
            - cf_login_pol_w is not skipped
            - cf_login_pol_w.status | default(0) not in [200, 201]

        - name: Stop if the allow policy was not written
          ansible.builtin.assert:
            that: cf_login_pol_w.status | default(0) in [200, 201]
            fail_msg: >-
              The login application exists but its allow policy was refused. An application
              with no policy admits nobody, so this fails closed — but the stack is not
              usable until a re-run writes it.
            quiet: true
          when: cf_login_pol_w is not skipped

        # ── the bypass application, when edge.yml names a path ──
        - name: Create or update the no-login application on {{ stack_edge.bypass_path | default('(none)') }}
          ansible.builtin.uri:
            url: >-
              {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps{{
                 '/' ~ cf_bypass_app.id if cf_bypass_app else '' }}
            method: "{{ 'PUT' if cf_bypass_app else 'POST' }}"
            status_code: [200, 201]
            headers: { Authorization: "Bearer {{ cf_token }}" }
            body_format: json
            body:
              name: "{{ cf_bypass_app_name }}"
              domain: "{{ cf_bypass_domain }}"
              type: self_hosted
              session_duration: "{{ cf_session_duration }}"
              auto_redirect_to_identity: false
              app_launcher_visible: false
          register: cf_bypass_w
          delegate_to: localhost
          failed_when: false
          changed_when: cf_bypass_w.json.success | default(false)
          no_log: true
          when: stack_edge.bypass_path is defined

        - name: What Cloudflare said, if it refused the no-login application
          ansible.builtin.debug:
            msg: >-
              {{ cf_bypass_domain }}: HTTP {{ cf_bypass_w.status | default('?') }}:
              {{ cf_bypass_w.json.errors | default(cf_bypass_w.msg) | default('no detail') }}
          changed_when: true
          when:
            - cf_bypass_w is not skipped
            - cf_bypass_w.status | default(0) not in [200, 201]

        - name: Stop if the no-login application was not made
          ansible.builtin.assert:
            that: cf_bypass_w.status | default(0) in [200, 201]
            fail_msg: >-
              No application on {{ cf_bypass_domain }}. This fails closed — that path still
              asks for a login, so the client that needs it cannot sync — and a re-run
              finishes it.
            quiet: true
          when: cf_bypass_w is not skipped

        - name: Remember the no-login application's id
          ansible.builtin.set_fact:
            cf_bypass_app_id: "{{ cf_bypass_w.json.result.id if cf_bypass_w is not skipped else cf_bypass_app.id }}"
          when:
            - stack_edge.bypass_path is defined
            - (cf_bypass_w is not skipped) or (cf_bypass_app | length > 0)

        - name: List the no-login application's policies
          ansible.builtin.uri:
            url: "{{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{ cf_bypass_app_id }}/policies"
            headers: { Authorization: "Bearer {{ cf_token }}" }
          register: cf_bypass_pol_q
          delegate_to: localhost
          check_mode: false
          changed_when: false
          no_log: true
          when: cf_bypass_app_id is defined

        - name: Write the bypass policy — everyone, on that path only
          # `bypass`, not `allow` with everyone: allow still runs an identity check, which
          # the Kobo cannot answer. What guards the path now is the stack's own token in the
          # URL — which is why that path is all this covers, and why the probe below checks
          # that `/` still asks for a login once this exists.
          ansible.builtin.uri:
            url: >-
              {{ cf_api }}/accounts/{{ cf_account_id }}/access/apps/{{
                 cf_bypass_app_id | default(cf_unknown_id) }}/policies{{
                 ('/' ~ cf_bypass_pol.id) if cf_bypass_pol else '' }}
            method: "{{ 'PUT' if cf_bypass_pol else 'POST' }}"
            status_code: [200, 201]
            headers: { Authorization: "Bearer {{ cf_token }}" }
            body_format: json
            body:
              name: "{{ cf_bypass_pol.name | default('no login on this path') }}"
              decision: bypass
              precedence: "{{ cf_bypass_pol.precedence | default(1) }}"
              include: [{ everyone: {} }]
              exclude: []
              require: []
          vars:
            cf_bypass_pol: >-
              {{ cf_bypass_pol_q.json.result | default([])
                 | selectattr('decision', 'eq', 'bypass') | list | first | default({}) }}
          register: cf_bypass_pol_w
          delegate_to: localhost
          failed_when: false
          changed_when: cf_bypass_pol_w.json.success | default(false)
          no_log: true
          when: stack_edge.bypass_path is defined

        - name: What Cloudflare said, if it refused the bypass policy
          ansible.builtin.debug:
            msg: >-
              bypass policy on {{ cf_bypass_domain }}: HTTP {{ cf_bypass_pol_w.status | default('?') }}:
              {{ cf_bypass_pol_w.json.errors | default(cf_bypass_pol_w.msg) | default('no detail') }}
          changed_when: true
          when:
            - cf_bypass_pol_w is not skipped
            - cf_bypass_pol_w.status | default(0) not in [200, 201]

        - name: Stop if the bypass policy was not written
          ansible.builtin.assert:
            that: cf_bypass_pol_w.status | default(0) in [200, 201]
            fail_msg: >-
              The no-login application exists but its policy was refused. It fails closed —
              an application with no policy admits nobody — and a re-run finishes it.
            quiet: true
          when: cf_bypass_pol_w is not skipped

    # ── 5  the probe: is the login in front, before anything answers behind it ──
    # Access answers at the edge before a request reaches the tunnel, so all of this is
    # provable with the stack still stopped: a login is a 302 to <team>.cloudflareaccess.com,
    # and the bypass path is anything else (530 while no connector runs). Calibrated first
    # against a hostname known to be behind a login — if that does not read as one, the
    # probe is wrong, not the new application.
    # Each probe carries failed_when: false, so `uri` never stops the play on its own — not
    # on a status, and not on -1 (no answer: DNS, TLS, refused), which fails `uri` whatever
    # status_code says. The assert after each one is what speaks, with the reason in words.
    # Calibrated against a hostname that did not resolve yet.
    - name: The probe
      when:
        - stack_edge.access == 'browser'
        - not ansible_check_mode
      block:
        - name: "Calibrate: {{ access_calibration_hostname }} is behind a login, so it must read as one"
          ansible.builtin.uri:
            url: "https://{{ access_calibration_hostname }}/"
            follow_redirects: none
          register: probe_cal
          failed_when: false
          delegate_to: localhost
          changed_when: false

        - name: The calibration reads as a login
          ansible.builtin.assert:
            that:
              - probe_cal.status == 302
              - "'cloudflareaccess.com' in (probe_cal.location | default(''))"
            fail_msg: >-
              {{ access_calibration_hostname }} answered 302 to {{ probe_cal.location | default('?') }},
              not to cloudflareaccess.com — so this probe cannot recognise a login and its
              verdict below would mean nothing. Fix the probe; nothing about {{ stack }} is
              known to be wrong yet.
            success_msg: "a login looks like: 302 -> {{ probe_cal.location | urlsplit('hostname') }}"

        - name: "{{ stack_hostname }}/ must ask for a login"
          # Retries because a CNAME made seconds ago may not resolve yet from the phone.
          ansible.builtin.uri:
            url: "https://{{ stack_hostname }}/"
            follow_redirects: none
          register: probe_root
          failed_when: false
          until: probe_root.status == 302
          retries: "{{ probe_retries }}"
          delay: 10
          delegate_to: localhost
          changed_when: false

        - name: "{{ stack_hostname }}/ reads as a login"
          ansible.builtin.assert:
            that:
              - probe_root.status == 302
              - "'cloudflareaccess.com' in (probe_root.location | default(''))"
            fail_msg: >-
              {{ stack_hostname }}/ answered HTTP {{ probe_root.status }}{{
              ' (' ~ probe_root.msg ~ ')' if probe_root.status == -1 else '' }}{{
              ', redirecting to ' ~ probe_root.location if probe_root.location is defined else '' }}
              — not an Access login. DO NOT START THE STACK. If it does not resolve yet,
              re-run in a few minutes; everything before the probe is already done.
            success_msg: "{{ stack_hostname }}/ asks for a login"

        - name: "{{ stack_hostname }}{{ stack_edge.bypass_path | default('') }} must NOT ask for one"
          # A path below the bypass, not the bypass itself, because that is what the client
          # requests. Any status is accepted; only a redirect to Access is a failure.
          ansible.builtin.uri:
            url: "https://{{ stack_hostname }}{{ stack_edge.bypass_path }}infra-probe"
            follow_redirects: none
          register: probe_bypass
          failed_when: false
          delegate_to: localhost
          changed_when: false
          when: stack_edge.bypass_path is defined

        - name: The bypass path reads as open
          ansible.builtin.assert:
            that:
              - probe_bypass.status != -1
              - "'cloudflareaccess.com' not in (probe_bypass.location | default(''))"
            fail_msg: >-
              {{ stack_edge.bypass_path }} still redirects to the Access login. The bypass
              application is not taking precedence; the client on that path cannot reach it.
            success_msg: >-
              {{ stack_edge.bypass_path }} is open (HTTP {{ probe_bypass.status }}{{
              ' — no connector yet, as expected before the stack starts' if probe_bypass.status == 530 else '' }})
          when: stack_edge.bypass_path is defined

    # ── what to do next ─────────────────────────────────────────────────────
    - name: What a --check run can and cannot tell you
      ansible.builtin.debug:
        msg: >-
          --check: every read ran for real and every write was skipped, so what this proved
          is that the API token works, that it can see the zone, that {{ inventory_hostname }}
          has the stack, and which objects already exist. The probe did not run. Nothing was
          created and nothing was changed.
      changed_when: true
      when: ansible_check_mode

    - name: What was provisioned, and what is next
      ansible.builtin.debug:
        msg:
          - "tunnel    {{ cf_tunnel_id | default('(not created — --check)', true) }}"
          - "hostname  {{ stack_hostname }}"
          - "creds     {{ inventory_hostname }}:{{ ansible_user_dir }}/.{{ stack }}-secrets/tunnel.json (65532, 0600)"
          - "env       TUNNEL_ID and TUNNEL_CREDENTIALS in {{ infra_checkout }}/deployments/{{ stack }}/.env"
          - "access    {{ 'login for the addresses in ' ~ cf_access_emails_file if stack_edge.access == 'browser' else 'NONE — the stack is its own gate' }}"
          - "{{ ('bypass    ' ~ stack_edge.bypass_path ~ ' — no login') if stack_edge.bypass_path is defined else '' }}"
          - ""
          - "Next: the rest of .env from .env.example, then start it — deployments/{{ stack }}/README.md."
      changed_when: true
