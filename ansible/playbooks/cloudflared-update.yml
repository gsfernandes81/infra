---
# Update cloudflared on ONE host, deliberately, in a staggered rollout.
#
#   ansible-playbook playbooks/cloudflared-update.yml \
#       -e target=one -e version=2026.9.1 -e sha256=<hash for that host's arch> -K
#
# NOT IN USE, decided 2026-08-23. The hosts autoupdate, staggered by check frequency
# (one 6h, two 72h, zero 240h — see hosts/*/system/cloudflared). This play is the gated
# alternative: explicit version, hash on the command line, each stage refusing while an
# earlier one is unhealthy. It needs a human free to run it, and the reason updates were
# not happening was exactly that nobody was. It becomes worth using once uptime
# monitoring exists and the gate can be driven by something other than a person.
#
# It also refuses to run while the target's connector carries --autoupdate-freq, which
# means today it refuses everywhere. That is correct: anything it installed would be
# replaced within one check interval.
#
# WHY AUTOUPDATE WAS BRIEFLY OFF. It was on, and it was live — all three binaries were rewritten on
# 14 August 2026, the day 2026.8.2 released, on a fleet where cloudflared was installed
# by hand half a year earlier. It replaced a boot-path binary with unverified bytes on a
# 24-hour cycle, on the box that terminates every tunnel into this fleet.
#
# And it could not fix what was wrong. cloudflared updates itself with a build matching
# ITS OWN architecture, not the machine's, so a fleet that started with one 32-bit binary
# copied to all three hosts stays 32-bit forever — including on two arm64 boxes. Only an
# explicit install breaks that loop.
#
# THE ROLLOUT ORDER IS one -> two -> zero, and each stage REFUSES while an earlier one is
# unhealthy. That is what makes the stagger worth anything: a calendar gap only helps if
# somebody notices a failure inside it, and nothing on this fleet alerts. Making the next
# stage check its predecessors turns the gap into a test rather than a hope.
#
# THE HASH IS REQUIRED, per arch, and that is deliberate friction. dev/Dockerfile makes
# the argument: "A pin alone says 'the same version'; a hash says 'the same bytes'."
# Download it once, check it, and put the value on the command line where it is reviewed.

- name: Update cloudflared on one host
  hosts: "{{ target }}"
  gather_facts: false

  vars:
    # Days that must pass after a predecessor was updated. 0 to skip the wait — the
    # health gate below still applies, and it is the half that actually verifies.
    soak_days: 3

    # one first: non-critical. two second: the lifeboat. zero last: Immich, the tunnel
    # everyone comes in through, and the box whose failure is worst to discover late.
    predecessors:
      one: []
      two: ["one"]
      zero: ["one", "two"]

    # ONE BUILD FLEET-WIDE, and it is chosen rather than derived. See
    # docs/decisions.md § "One cloudflared build on all three". Deriving from `uname -m`
    # would give `two` the only copy of its own architecture — making the lifeboat the
    # canary for a binary no earlier stage has run, which is exactly what the rollout
    # order exists to avoid. Override per host with -e asset=arm64 if that is ever
    # revisited; the host's real architecture is reported either way.
    fleet_asset: arm

    state_dir: "{{ lookup('env', 'HOME') }}/.infra-cfd"
    probe: "http://127.0.0.1:20241"
    bin: /usr/bin/cloudflared

  tasks:
    - name: Require a version and a hash
      ansible.builtin.assert:
        that:
          - version is defined and version | length > 0
          - sha256 is defined and sha256 | length == 64
        fail_msg: >-
          Needs -e version=<tag> and -e sha256=<sha256 of the asset for THIS host's
          architecture>. One hash per arch per release; the fleet spans two arches, so a
          full rollout uses two different hashes. That is the point — the value is read
          by a person before it is installed.

    # ── the gate ─────────────────────────────────────────────────────────────
    - name: Check every predecessor is still serving
      ansible.builtin.uri:
        url: "{{ probe }}/ready"
        return_content: true
      register: pred
      loop: "{{ predecessors[inventory_hostname] }}"
      delegate_to: "{{ item }}"

    - name: Refuse while an earlier stage is unhealthy
      ansible.builtin.assert:
        that: (item.content | from_json).readyConnections | default(0) > 0
        fail_msg: >-
          {{ item.item }} was updated before {{ inventory_hostname }} in this rollout and
          is not serving. Fix that first — carrying a bad version forward to the next box
          is exactly what the ordering exists to prevent.
      loop: "{{ pred.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: When each predecessor was last updated
      ansible.builtin.stat:
        path: "{{ state_dir }}/{{ item }}"
      register: pred_state
      loop: "{{ predecessors[inventory_hostname] }}"
      delegate_to: localhost

    # Soak state is per control node — there are three (Termux, WSL, the container),
    # each with its own ~/.infra-cfd — so a missing file does not mean "never updated":
    # it may mean the predecessor was updated from a DIFFERENT control node, and its
    # soak time simply is not known here. The assert below silently skips missing files
    # (selectattr on stat.exists), so without this gate an unknown soak passes as if it
    # had elapsed.
    - name: Refuse while any predecessor's soak time is unknown here
      ansible.builtin.assert:
        that: >-
          (pred_state.results | selectattr('stat.exists') | list | length)
          == (predecessors[inventory_hostname] | length)
        fail_msg: >-
          Only {{ pred_state.results | selectattr('stat.exists') | list | length }} of
          {{ predecessors[inventory_hostname] | length }} predecessors have a state file
          under {{ state_dir }}. There are three control nodes (Termux, WSL, the
          container), each with its own ~/.infra-cfd, so a missing file may mean that
          predecessor was updated from a DIFFERENT control node and its soak time is
          unknown here. If you know it has soaked, override with
          -e accept_unknown_soak=true.
      when: not (accept_unknown_soak | default(false) | bool)

    - name: Refuse until each predecessor has soaked
      ansible.builtin.assert:
        that: >-
          (now(utc=true).strftime('%s') | int - item.stat.mtime | int)
          > (soak_days | int * 86400)
        fail_msg: >-
          {{ item.item }} was updated
          {{ ((now(utc=true).strftime('%s') | int - item.stat.mtime | int) / 86400)
             | round(1) }} days ago and the soak is {{ soak_days }}. A version that
          breaks something slowly has not had time to show it yet. Override with
          -e soak_days=0 if you have a reason.
      loop: "{{ pred_state.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    # ── refuse to fight autoupdate ───────────────────────────────────────────
    # If the running process still has --autoupdate-freq, whatever we install here gets
    # replaced within a day and the rollout means nothing.
    - name: Is autoupdate still enabled
      ansible.builtin.shell: |
        pid=$(cat /var/run/cloudflared.pid)
        xargs -0 -n1 echo < /proc/$pid/cmdline | grep -c autoupdate-freq || true
      register: au
      changed_when: false
      become: true

    - name: Refuse while autoupdate would overwrite this
      ansible.builtin.assert:
        that: au.stdout | trim | int == 0
        fail_msg: >-
          {{ inventory_hostname }}'s connector is running with --autoupdate-freq, so
          anything installed here is replaced within 24 hours. Install the tracked init
          script first — it sets --no-autoupdate — and cycle:
          bin/install-system-file cloudflared --commit --allow-content-change

    # ── what is there now ────────────────────────────────────────────────────
    - name: What this host actually is
      ansible.builtin.command: uname -m
      register: uname_m
      changed_when: false

    - name: Which asset to install, and what would have been native
      ansible.builtin.set_fact:
        cfd_arch: "{{ asset | default(fleet_asset) }}"
        native_arch: >-
          {{ {'aarch64': 'arm64', 'armv6l': 'arm', 'armv7l': 'arm',
              'x86_64': 'amd64'}[uname_m.stdout | trim] | default('?') }}

    # Said out loud rather than hidden. Running a 32-bit build on aarch64 depends on the
    # kernel's AArch32 support — a dependency nobody chose and arm64 distributions have
    # been drifting away from. If it ever goes, cloudflared stops starting at the next
    # reboot, on the box everything is reached through.
    - name: Note where the asset differs from the machine
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is {{ uname_m.stdout | trim }} (native asset
          {{ native_arch }}) and is being given {{ cfd_arch }} — deliberate, see
          docs/decisions.md. It runs via the kernel's 32-bit compat layer.
      when: cfd_arch != native_arch

    - name: Record what is installed before we touch it
      ansible.builtin.stat:
        path: "{{ bin }}"
        checksum_algorithm: sha256
      register: before
      become: true

    - name: Say what is about to change
      ansible.builtin.debug:
        msg:
          - "host {{ inventory_hostname }} is {{ uname_m.stdout | trim }} -> asset {{ cfd_arch }}"
          - "installed now: {{ before.stat.checksum | default('nothing') }}"
          - "installing:    {{ sha256 }}  ({{ version }})"

    # The disk checksum alone is not enough to end here: an interrupted run can leave
    # the swap done and the cycle not, so the file matches while the RUNNING process is
    # still the old binary — mv replaced the path, but the process keeps its old inode.
    # {{ bin }} --version would answer for the new file, not the process, which is
    # exactly the case this exists to catch; /proc/<pid>/exe IS that inode, so ask it.
    # Empty output (no pidfile, dead pid) counts as needing a cycle.
    - name: What version the running process actually is
      ansible.builtin.shell: |
        pid=$(cat /var/run/cloudflared.pid 2>/dev/null) || exit 0
        [ -n "$pid" ] && [ -d "/proc/$pid" ] || exit 0
        /proc/$pid/exe --version 2>/dev/null || true
      register: runver
      changed_when: false
      become: true

    # Two separate questions: does the FILE need replacing, does the PROCESS need
    # cycling. After an interrupted run the answers differ.
    - name: Decide what this run still has to do
      ansible.builtin.set_fact:
        needs_install: "{{ (before.stat.checksum | default('')) != sha256 }}"
        needs_cycle: "{{ version not in (runver.stdout | default('')) }}"

    # Confirmed on target on disk AND in the running process: record it before ending,
    # because the next stage's soak gate reads this file and a rollout finished from
    # another angle (or re-run) would otherwise never write it.
    - name: Make sure the state directory exists (already on target)
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      when: not needs_install and not needs_cycle

    # modification_time: preserve — create the file if missing, but NEVER bump the
    # mtime of one that exists. The mtime IS the soak clock, and a no-op re-run that
    # touched it would restart the next stage's soak for no reason. (Flagged by the
    # batch-2 agent as a literal-instruction artefact, fixed in review.)
    - name: Note this host is confirmed on target
      ansible.builtin.file:
        path: "{{ state_dir }}/{{ inventory_hostname }}"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      delegate_to: localhost
      when: not needs_install and not needs_cycle

    - name: Nothing to do if disk and running process are both already that version
      ansible.builtin.meta: end_host
      when: not needs_install and not needs_cycle

    - name: Warn when the disk is on target but the process is not
      ansible.builtin.debug:
        msg: >-
          {{ bin }} on disk already matches {{ sha256 }} but the running process is not
          {{ version }} — an earlier run swapped the binary and was interrupted before
          the cycle. Skipping download/backup/swap; cycling and verifying only.
      when: not needs_install and needs_cycle

    # ── download, verify, prove it runs, then install ────────────────────────
    # get_url verifies the checksum itself and refuses to write a mismatch. Downloaded
    # ON THE HOST: the control node is a phone on a metered radio, and 36 MiB there is a
    # spend or3's data-ledger.md tracks. The Pis are on the house connection.
    - name: Fetch the new binary beside the old one
      ansible.builtin.get_url:
        url: "https://github.com/cloudflare/cloudflared/releases/download/{{ version }}/cloudflared-linux-{{ cfd_arch }}"
        dest: "{{ bin }}.new"
        checksum: "sha256:{{ sha256 }}"
        mode: "0755"
        owner: root
        group: root
      become: true
      when: needs_install | bool

    # A binary of the right arch that still cannot execute here is the failure this
    # catches — and the one the fleet has been living with, in reverse, for six months.
    - name: Prove it actually runs on this machine
      ansible.builtin.command: "{{ bin }}.new --version"
      register: newver
      changed_when: false
      become: true
      when: needs_install | bool

    # ── swap, cycle and verify, with rollback ────────────────────────────────
    # block/rescue rather than until + failed_when:false + a conditional rollback task:
    # whether a retries-exhausted task counts as failed varies across ansible-core
    # versions, and on the versions where it does, the old conditional "Put the old
    # binary back" never ran — the play just stopped with the new, dead binary in
    # place. rescue runs on a failure however it is signalled.
    - name: Swap and cycle, rolling back if the new version does not serve
      block:
        - name: Back up the running one, then swap
          ansible.builtin.shell: |
            set -e
            cp -a {{ bin }} {{ bin }}.pre-{{ version }}
            mv {{ bin }}.new {{ bin }}
            chmod 0755 {{ bin }}
          become: true
          changed_when: true
          when: needs_install | bool

        - name: Cycle the connector
          ansible.builtin.shell: |
            rc-service cloudflared stop >/dev/null 2>&1
            i=0
            while [ $i -lt 45 ]; do
              netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' || break
              i=$((i+2)); sleep 2
            done
            netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' && exit 1
            rc-service cloudflared start >/dev/null 2>&1
          become: true
          changed_when: true

        - name: Wait for it to register
          ansible.builtin.uri:
            url: "{{ probe }}/ready"
            return_content: true
          register: ready
          until: (ready.content | default('{}') | from_json).readyConnections | default(0) > 0
          retries: 12
          delay: 5
          failed_when: false

        # The assert is the real gate: if the exhausted retries above were swallowed by
        # failed_when:false, this still fails into the rescue; if they were not, the
        # rescue already has it. Either way the rollback runs.
        - name: Require the new version to be serving
          ansible.builtin.assert:
            that: (ready.content | default('{}') | from_json).readyConnections | default(0) > 0
            fail_msg: >-
              {{ version }} is not serving on {{ inventory_hostname }} — rolling back.

      rescue:
        # The pre-{{ version }} backup may be absent on the cycle-only path if the
        # earlier interrupted run's backup was already cleaned up; then restoring is
        # impossible and cycling back is all that can be done — the fail below still
        # says what state the host is in.
        - name: Put the old binary back
          ansible.builtin.shell: |
            set -e
            if [ -f {{ bin }}.pre-{{ version }} ]; then
              mv {{ bin }}.pre-{{ version }} {{ bin }}
              chmod 0755 {{ bin }}
            fi
            rc-service cloudflared stop >/dev/null 2>&1
            i=0
            while [ $i -lt 45 ]; do
              netstat -tln 2>/dev/null | grep -q '127\.0\.0\.1:20241 ' || break
              i=$((i+2)); sleep 2
            done
            rc-service cloudflared start >/dev/null 2>&1
          become: true
          changed_when: true

        - name: Report the rollback and stop
          ansible.builtin.fail:
            msg: >-
              {{ version }} did not come up on {{ inventory_hostname }}. The previous
              binary has been restored and the connector cycled back — check it is
              serving before doing anything else. Do NOT run the next stage: the gate
              would have caught this anyway, which is the point of it.

    # ── record, for the next stage's soak ────────────────────────────────────
    - name: Make sure the state directory exists
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Note when this host was updated
      ansible.builtin.file:
        path: "{{ state_dir }}/{{ inventory_hostname }}"
        state: touch
        mode: "0644"
      delegate_to: localhost

    - name: Done
      ansible.builtin.debug:
        msg:
          # newver is skipped on the cycle-only path (no download happened); the cycle
          # + verify above is what proves the host is on {{ version }} either way.
          - "{{ inventory_hostname }} now runs {{ newver.stdout | default(version) | trim }} ({{ cfd_arch }})"
          - "previous binary kept at {{ bin }}.pre-{{ version }} — remove it once you are happy"
          - "next stage will refuse for {{ soak_days }} days, and while this host is unhealthy"
