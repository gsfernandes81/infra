---
# Fleet-wide variables.
#
# host_vars/ is empty and that is deliberate: it is where per-host values go when one stack
# needs different values on different hosts. Nothing needs that yet — no stack in this repo
# runs on two hosts. (Syncthing looks like it does and does not: zero's syncs the general
# share, one's distributes completed torrents from inside the torrents stack. Two jobs, two
# definitions.) The directory exists now so Phase 4 is an addition rather than a
# restructure. See docs/management-plane.md.

# The container CLI, per host group. Only [containerized] hosts are asked.
container_cli: docker

# Pinned rather than discovered: all three hosts have /usr/bin/python3 — bin/hw-inventory
# and bin/check-system-drift are Python and run there — and discovery on a minimal Alpine
# both warns and can pick wrong. Scoped to the fleet, never global: the control node is
# Termux and has no such path.
ansible_python_interpreter: /usr/bin/python3
