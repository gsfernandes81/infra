---
# Fleet-wide variables.

# The container CLI, per host group. Only [containerized] hosts are asked.
container_cli: docker

# Pinned rather than discovered: all three hosts have /usr/bin/python3 — bin/hw-inventory
# and bin/check-system-drift are Python and run there — and discovery on a minimal Alpine
# both warns and can pick wrong. Scoped to the fleet, never global: the control node is
# Termux and has no such path.
ansible_python_interpreter: /usr/bin/python3

# ---------------------------------------------------------------- packages
#
# EVERY package the fleet installs is here unless there is very strong justification for
# it being per-host. Today exactly one thing clears that bar — the container runtime —
# and it is per-host because the hosts genuinely differ: `two` had docker and containerd
# removed deliberately and must never get them back.
#
# The bias is deliberate and it is the opposite of where this list started. A first pass
# scattered smartmontools, btrfs-progs, bcache-tools, docs and zram-init across host_vars
# on the reasoning that each host should carry only what its hardware needs. That produces
# three machines that differ in ways nobody chose, which is what a fallback is written
# against: audit.yml grew a netstat branch because ss was on one host out of three, and
# one's hardware.md looked hand-edited for a week because usbutils was on two out of three.
# Every divergence here has to earn itself; unexplained divergence is the bug.
#
# INSTALLING A TOOL IS NOT ENABLING IT.
#   zram-init on `zero` does not mean zero runs zram — host-setup.md says it has the RAM
#   and does not, and Alpine's package is a wrapper script plus a modprobe.d conf with no
#   service to start. smartmontools on `two` does not mean anything polls: two has no
#   hw-inventory.toml, so SMART is skipped there entirely, and `smartd` must never be put
#   in a runlevel on `one` — see the landmine in CLAUDE.md. Having the tool present means
#   it is there when a box is broken and the network is not helping.
base_packages:
  - bcache-tools
  - btrfs-progs
  - ca-certificates   # cloudflared validates Cloudflare's edge against this on all three;
                      # hosts/two/setup/README.md notes losing it cuts the only way in
  - curl
  # NO `docs`. It was here, and the --check run of 2026-08-21 is why it is not.
  #
  # `docs` is a metapackage that pulls the `-doc` subpackage of everything already
  # installed, so it expands differently on every host — the opposite of the
  # standardisation it was added for. On `one` it resolved to the entire TeX Live
  # documentation set (texmf-dist-langarabic-doc, texmf-dist-langcjk-doc, texlive-doc,
  # ghostscript-doc …) plus X11 library docs, onto a 1 GB Pi; on `two` it was ~90 -doc
  # packages onto the lifeboat's SD card. Neither was asked for and neither is a tool.
  #
  # The original intent — man pages present when a box is broken and the network is not
  # helping — is still reasonable and still unserved: `mandoc` + `man-pages` gives the
  # Linux man pages but not per-tool ones, since those live in each package's own -doc.
  # If that is wanted it is its own decision, with the per-host size measured first.
  - fish
  - git
  - htop
  - hwids-usb
  - iproute2          # ss(8) — its absence is why audit.yml carries a netstat branch
  - iptables          # named explicitly so `apk del`'s orphan reclaim can never take it:
                      # netavark shells out to it while not depending on it, which is the
                      # trap in CLAUDE.md that broke rootless podman days after a cleanup
  - lsblk
  - python3
  - smartmontools
  - sudo
  - usbutils          # lsusb -t — absent on one, where BusyBox answers -t with a flat list
  - zram-init
