---
# The container runtime, and nothing else. If something new lands here it needs the same
# kind of justification this has: the hosts genuinely cannot share it.
extra_packages:
  - docker
  - docker-cli-compose

# The one other exception: server-update-leap.yml's tailnet check after a reboot pings
# zero from every other host (group_vars/fleet.yml), so zero pings three.
tailnet_peer: three
