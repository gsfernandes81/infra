# Every dev container on zero, in one Compose project, with the hub that is the way in to
# all of them (decided 2026-10-25, built 2026-10-26 — docs/decisions.md § "Dev containers:
# one compose file in infra"; plans/dev-pool.md has what is left). Bring it up with
# `make up` in this directory; `gavin` is not in the docker group, so nothing here runs
# from an agent session.
#
#   hub          claude-sessions' menu over every container, and the offload timer. `ssh dev`.
#   cloudflared  the hub's tunnel, a sidecar as Phase 3 settled for deployments.
#   infra        this repo's container. The rest, each another repo's, built from its own
#                Dockerfile.dev.
#
# EVERY CONTAINER STARTS BY DEFAULT (owner, 2026-10-27): `make up`, the deploy and a plain
# `docker compose up` start them all. Only the tunnel has a profile, because a box or a CI
# runner without its credentials must still come up. On a 4 GB box that rests on a rule, not
# a mechanism, until the pool (plans/dev-pool.md) caps them together: a container starts
# nothing that keeps running beyond what the base starts. Its child-init.sh syncs and returns,
# and a bot, a server or a test run is started by hand in a session. `make stop C=<name>`
# stops one until the next `make up` or deploy.
#
# EACH CONTAINER IS NAMED FOR ITS REPO, and nothing else (owner, 2026-10-27): the service, the
# container, the hostname and the hub's HUB_REPO_<NAME> are all the repo's name,
# so `ssh dev`'s menu reads as the list of repos. They were `<short>-dev` until then (infra-dev,
# dd-dev …); the volumes keep those old names, since a volume name is where a login lives, and
# dev/Makefile refuses to start while a container of an old name still exists.
#
# The invariants in ../README.md apply here as everywhere: no `..`; `name:` declared;
# host-specific values only from the gitignored .env, a `:?` default where absence must stop
# Compose. A REQUIRED VARIABLE STOPS COMPOSE EVEN FOR A SERVICE WHOSE PROFILE IS OFF —
# checked with Compose 5.6.1 on 2026-10-26 — so every container's paths are in .env from the
# start, and the tunnel's id is not `:?` (the cloudflared service says why).
name: dev

# THE BASE IMAGE TAG, stated once (gsrpi-dev-base, built from Dockerfile.base). Every build
# below takes it as BASE_TAG; dev/Makefile and .github/workflows/dev-base.yml read this line,
# so keep its shape: `x-base-tag: &base-tag <tag>`. Bumping it is what publishes a new base.
x-base-tag: &base-tag 2026.10.26

# THE CLAUDE LOGIN, ONE SWITCH: CLAUDE_UNDOCUMENTED_SHARED_LOGINS, SET BELOW, true OR false (owner,
# 2026-10-27). Its value is the default written into the line, `:-true` or `:-false`, and only that:
# dev/Makefile refuses a .env that sets the variable, and runs Compose through `sudo env`, which
# drops the caller's environment, so what git holds is what runs.
#   true    SHARED — every dev container on one full login (Remote Control included), in the
#           claude-login volume; log in once, in any of them, and all follow
#   false   EACH ITS OWN — each container's login in its own *-claude volume, as before
# Tracked here, not in .env: it is a choice about how the fleet behaves, not a host value, so git
# says when it flipped and the deploy play applies it. Flipping it is a commit and a redeploy,
# which recreates the dev containers; then `make login C=<c>` wherever `make status` reads logged
# out. dev/Makefile checks the line's shape, so keep it: `${CLAUDE_UNDOCUMENTED_SHARED_LOGINS:-true}`
# or `:-false}` at its end.
# It rests on CLAUDE_SECURESTORAGE_CONFIG_DIR, UNDOCUMENTED: Claude Code reads its login file and
# takes its refresh lock there, so containers sharing it refresh once between them, as processes
# on one machine do (read from 2.1.311's code and proved against a stand-in login server,
# decisions.md). ~/.claude-logins/true is the shared volume; ~/.claude-logins/false is the
# container's own config volume mounted a second time, so false reads ~/.claude's own login file.
x-claude-login-dir: &claude-login-dir /home/dev/.claude-logins/${CLAUDE_UNDOCUMENTED_SHARED_LOGINS:-true}

# EACH CONTAINER'S REPO, stated once. Its service clones it (DEV_REPO), and the hub mints that
# container's GitHub token for it and nothing else (HUB_REPO_*, below) — one anchor each, so the
# two cannot name different repos.
x-repo-infra: &repo-infra gsfernandes81/infra
x-repo-or3: &repo-or3 gsfernandes81/or3
x-repo-dd: &repo-dd gsfernandes81/destiny-director
x-repo-ds: &repo-ds gsfernandes81/dossier
x-repo-invective: &repo-invective gsfernandes81/invective
x-repo-nibbles: &repo-nibbles gsfernandes81/nibbles
x-repo-ionic: &repo-ionic gsfernandes81/ionic-traces
x-repo-claude-sessions: &repo-claude-sessions gsfernandes81/claude-sessions

# What every dev container shares. A child sets its own build, name, repo, secrets and
# volumes beside these.
x-dev: &dev
  init: true
  # restart: no, as every dev container always was: each holds live claude sessions, and an
  # unattended restart at 03:00 would bring them back with nobody watching. A reboot leaves
  # them down, which recovery.md says is the expected resting state. The hub is the exception
  # (below): it runs no claude.
  restart: "no"
  networks: [dev]
  # The hub installs the binary every container's hooks, agent and offload pass run before
  # any container starts, and the drop-in below is a subpath of its volume that must exist
  # to be mounted at all.
  depends_on:
    hub:
      condition: service_healthy
  # ONE MEMORY POOL for every dev container (plans/dev-pool.md): a parent cgroup whose limit
  # the boot file in hosts/zero/system/ writes. Empty — the default until that file is
  # installed and proved — leaves each container under Docker's own parent, exactly as today;
  # Compose drops an empty cgroup_parent rather than passing it (checked, Compose 5.6.1). Set
  # DEV_CGROUP_PARENT=/devpool in .env once the pool exists. The per-container mem_limit
  # stays either way, as a ceiling inside it.
  cgroup_parent: ${DEV_CGROUP_PARENT:-}

# What every dev container mounts from the hub's volume, read-only: the binary at
# /opt/claude-sessions/bin (on the base's PATH), the skill, the hub's public key — and the
# hooks drop-in as Claude Code's managed-settings.d, a subpath mount rather than a symlink so
# Claude Code reads a plain directory of plain files. Read-only, so no claude in a container
# can rewrite the hooks every claude runs.
#
# NOCOPY ON EVERY DEV CONTAINER'S MOUNT OF A HUB VOLUME (these two and the token mounts below).
# Docker copies an image's mountpoint INTO an empty volume each time a container using it is
# created, ownership included, and Compose creates every container before it starts any. So on
# a whole-project `up` the hub's creation made the still-empty volume dev's, then infra's
# and or3's made it root's again from their root-owned mountpoints, and the hub could not
# install into it (zero, 2026-10-27: hub-health "claude-sessions is not installed"). Only the
# hub's own mount copies, so only its dev-owned mountpoint decides.
x-opt: &opt
  type: volume
  source: claude-sessions
  target: /opt/claude-sessions
  read_only: true
  volume:
    nocopy: true
x-managed: &managed
  type: volume
  source: claude-sessions
  target: /etc/claude-code/managed-settings.d
  read_only: true
  volume:
    subpath: managed-settings.d
    nocopy: true

x-claude-login: &claude-login
  type: volume
  source: claude-login
  target: /home/dev/.claude-logins/true
  volume:
    nocopy: true

services:
  # ── the hub ───────────────────────────────────────────────────────────────────
  hub:
    build:
      context: hub
      args:
        USER_UID: ${HOST_UID:?set HOST_UID in dev/.env — the checkout owner's uid; the dev host play writes it}
        USER_GID: ${HOST_GID:?set HOST_GID in dev/.env — the checkout owner's gid; the dev host play writes it}
    image: dev-hub
    container_name: dev-hub
    # `dev` is what the menu's home is headed with, and what `ssh dev` names.
    hostname: dev
    init: true
    # The door, and it runs no claude: back after a reboot with nobody needing to start it.
    restart: unless-stopped
    networks: [dev]
    environment:
      # (No container list here: the hub derives the containers the menu and the offloader
      # reach from the HUB_REPO_* names below, so the list is stated once.)
      CLAUDE_SESSIONS_REMOTE: /opt/claude-sessions/bin/claude-sessions
      HUB_OFFLOAD: ${HUB_OFFLOAD:-1}
      # THE TOKEN BROKER (hub/github-tokens), the containers' ONLY GitHub credential since
      # 2026-10-27 — required. The App's key is github-app.pem in HUB_SECRETS. What each token
      # may do is the list below, never more than the App was granted; which repo, the anchors
      # at the top of this file.
      HUB_GITHUB_APP_ID: ${HUB_GITHUB_APP_ID:?set HUB_GITHUB_APP_ID in dev/.env — the hub's GitHub App (dev/README.md)}
      HUB_GITHUB_KEY: /run/hub-secrets/github-app.pem
      HUB_GITHUB_PERMISSIONS: ${HUB_GITHUB_PERMISSIONS:-contents=write,pull_requests=write,issues=write,workflows=write,actions=read,checks=read,statuses=read}
      HUB_GITHUB_TOKENS: /home/dev/tokens
      HUB_REPO_INFRA: *repo-infra
      HUB_REPO_OR3: *repo-or3
      HUB_REPO_DESTINY_DIRECTOR: *repo-dd
      HUB_REPO_DOSSIER: *repo-ds
      HUB_REPO_INVECTIVE: *repo-invective
      HUB_REPO_NIBBLES: *repo-nibbles
      HUB_REPO_IONIC_TRACES: *repo-ionic
      HUB_REPO_CLAUDE_SESSIONS: *repo-claude-sessions
      # Where claude-sessions reads the pool's memory (the home's header, the door's load line).
      # Uncomment with the pool's mount below, once the pool exists; neither works alone.
      # CLAUDE_SESSIONS_POOL: /run/devpool
    volumes:
      - claude-sessions:/opt/claude-sessions
      # The hub's key, its known_hosts, its sshd host key and its pass log.
      - hub-state:/home/dev/.hub
      # Every container's token, one directory each; each container mounts only its own.
      - github-tokens:/home/dev/tokens
      # The shared Claude login (x-claude-login above). Mounted here only so the volume is made
      # from the hub's dev-owned mountpoint: the dev images lack the directory, and a volume made
      # from a missing mountpoint is root's. The hub itself runs no claude and never reads it.
      - claude-login:/home/dev/.claude-login
      # Mode-700 directory on zero holding the hub's authorized_keys (the clients' keys)
      # and its tunnel credentials. Read-only.
      - ${HUB_SECRETS:?set HUB_SECRETS in dev/.env — server-create-dev-container.yml -e container=dev writes it}:/run/hub-secrets:ro
      # THE POOL'S MEMORY, for the home's header, once the pool exists — uncomment then, with
      # CLAUDE_SESSIONS_POOL above.
      # Long form with create_host_path false, so a path that is not there fails the start
      # rather than having Docker mkdir a cgroup under /sys/fs/cgroup.
      # - type: bind
      #   source: /sys/fs/cgroup/devpool
      #   target: /run/devpool
      #   read_only: true
      #   bind: { create_host_path: false }
    healthcheck:
      # hub/health: what every container mounts is in place, and the offload and token loops
      # have beaten recently. Its header says what each part means.
      test: ["CMD", "hub-health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 128m

  # ── the tunnel ────────────────────────────────────────────────────────────────
  # A sidecar, as Phase 3 settled for deployments (decisions.md § "Sidecar, not baked-in"),
  # pinned identically to theirs. Two hostnames: the hub's, and or3's for the phone's
  # reverse forward to the vessel (cloudflared.yml says why).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: dev-cloudflared
    restart: unless-stopped
    networks: [dev]
    # As the checkout's owner, not the image's 65532: the credentials are written by the
    # dev-container edge play, which leaves them owned by gavin at 0600, and a file the
    # connector cannot read kills it on start. cloudflared needs no home and no shell.
    user: "${HOST_UID:?set HOST_UID in dev/.env}:${HOST_GID:?set HOST_GID in dev/.env}"
    profiles: [tunnel]
    # THE PROFILE IS THE SWITCH, not the id: `tunnel` in COMPOSE_PROFILES once
    # server-create-dev-container.yml -e container=dev has made the tunnel. `:-`, not `:?`,
    # for the one reason the invariant allows — a required variable stops Compose even with
    # this profile off, so `:?` would hold every container hostage to a tunnel. With the
    # profile on and no id, the connector refuses at start and says so in `make tunnel-log`.
    command: tunnel --config /etc/cloudflared/config.yml run ${HUB_TUNNEL_ID:-}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      # Long form, so a missing file fails the start rather than Docker making a directory
      # called tunnel.json in the secrets directory.
      - type: bind
        source: ${HUB_SECRETS:?set HUB_SECRETS in dev/.env}/tunnel.json
        target: /etc/cloudflared/creds.json
        read_only: true
        bind: { create_host_path: false }
    depends_on: [hub]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m

  # ── the dev containers ────────────────────────────────────────────────────────
  infra:
    <<: *dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_TAG: *base-tag
    image: infra
    container_name: infra
    hostname: infra   # Claude Code shows this as the machine title
    # A cap, not a reservation. 2560m like or3's since 2026-10-27 (owner: 1024m had been
    # restrictive for work); the pool is what keeps all of them together off Immich.
    mem_limit: ${DEV_MEM_LIMIT:-2560m}
    # memswap is RAM + swap. Each container's is its RAM plus the pool's whole 6G, so the pool
    # (hosts/zero/system/devpool), not each container, decides how much swap dev work may use —
    # zram first, then the SSD swap behind it (owner, 2026-10-27).
    memswap_limit: ${DEV_MEMSWAP_LIMIT:-8704m}
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      # The repo cloned into the workspace volume at first start, over https with the hub's
      # token (entrypoint.sh).
      DEV_REPO: *repo-infra
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      # Files the repo expects beside its tracked ones, kept in the env volume and linked into
      # the workspace (entrypoint.sh). None for infra: its .env files live on the hosts.
      DEV_ENV_FILES: ""
    volumes:
      - *opt
      - *managed
      - *claude-login
      # THE WORKSPACE IS A VOLUME, cloned into, and no longer zero's own checkout. zero's
      # ~gavin/infra is now only what the box runs; the container's tree is its own, so a
      # commit in here never leaves zero's checkout diverged again (CLAUDE.md § Git, the
      # 2026-10-25 divergence). Push to share work, as from anywhere else.
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty until the hub's first mint.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: infra, nocopy: true } }
      - infra-workspace:/workspace
      # The repo's untracked secrets, in a volume of their own, linked into the workspace.
      - infra-env:/home/dev/.env.d
      # Mode-700 directory outside the repo: an optional authorized_keys, and the fleet key
      # files, absent by decision (docs/management-plane.md). Read-only.
      - ${INFRA_SECRETS:?set INFRA_SECRETS in dev/.env to the absolute path of the secrets dir}:/run/infra-secrets:ro
      # The logins, history and state, kept from the infra-dev project they were made in, so
      # moving into this one costs no login and loses no conversation.
      - infra-claude:/home/dev/.claude
      - infra-claude:/home/dev/.claude-logins/false
      - infra-gh:/home/dev/.config/gh
      - infra-ssh-host:/home/dev/.ssh-host
      - infra-local-share:/home/dev/.local/share
      - infra-jcode:/home/dev/.jcode

  # ── the other repos' containers, ported from each repo's own compose file ───────
  # All three move in at the one cutover (dev/README.md § "The cutover from the old layout").
  # EACH BUILDS STRAIGHT FROM ITS REPO ON GITHUB, `main`, with its own Dockerfile and on this
  # base — BASE_TAG is a build arg every child Dockerfile already takes, so no child repo
  # changes first, and no clone on zero is read by anything (owner, 2026-10-27). or3 is
  # private, so its context is fetched over ssh with or3's own deploy key; dd and ds are
  # public, over https. Each works in its own clone in a volume, its untracked .env in an env
  # volume, its keys in a secrets directory outside any clone.
  #
  # Volume names are the old projects' (or3-dev_, destiny-director_, dossier_), read from
  # docs/fleet-inventory.md of 2026-10-25, so logins and history carry over.
  or3:
    <<: *dev
    build:
      context: git@github.com:gsfernandes81/or3.git#main:dev
      # The deploy key that already lives in OR3_SECRETS (or3's dev/seed-secrets.sh makes it),
      # lent to BuildKit for the fetch only; it is not in any layer.
      ssh:
        - default=${OR3_SECRETS:?set OR3_SECRETS in dev/.env}/id_ed25519_or3_deploy
      args:
        BASE_TAG: *base-tag
    image: or3
    container_name: or3
    hostname: or3
    # or3's own RAM figure, from its compose file; its swap is the pool's (below).
    mem_limit: 2560m
    memswap_limit: 8704m   # RAM + the pool's 6G of swap, as infra's says
    shm_size: 256m
    # No tmpfs on /tmp: it is the container's own disk, as in or3's compose since 16843d5
    # (2026-10-27). It was RAM while Docker lived on the SD card; on the SSD a full `make
    # test` filled most of the 512 MB, crashed browsers and spent the container's memory cap.
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: or3
      DEV_REPO: *repo-or3
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      DEV_ENV_FILES: ".env"
      DEV_SECRETS_DIR: /run/or3-secrets
    volumes:
      - *opt
      - *managed
      - *claude-login
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty until the hub's first mint.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: or3, nocopy: true } }
      - or3-workspace:/workspace
      - or3-env:/home/dev/.env.d
      # The or3ecr key, the deploy key and the phone's authorized_keys (or3's
      # dev/seed-secrets.sh writes them). Its sshd is also reached straight from the phone,
      # through the hub's tunnel, for or3-tunnel's reverse forward (cloudflared.yml): the
      # base's sshd allows remote forwarding for exactly that, and this authorized_keys holds
      # the phone's key.
      - ${OR3_SECRETS:?set OR3_SECRETS in dev/.env}:/run/or3-secrets:ro
      - or3-claude:/home/dev/.claude
      - or3-claude:/home/dev/.claude-logins/false
      - or3-gh:/home/dev/.config/gh
      - or3-ssh-host:/home/dev/.ssh-host
      - or3-local-share:/home/dev/.local/share

  destiny-director:
    <<: *dev
    build:
      context: https://github.com/gsfernandes81/destiny-director.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: *base-tag
    image: destiny-director
    container_name: destiny-director
    hostname: destiny-director
    # Sized for the dev bots, which run in here and start only by hand (`make devbot-up` in a
    # session): its child-init.sh syncs the venv and starts nothing (read 2026-10-27, at
    # 313751c). It was once recorded idling at ~1.4 GB, which is that cap's reason; at rest
    # with no bot it should be near the others.
    mem_limit: 2560m
    memswap_limit: 8704m   # RAM + the pool's 6G of swap, as infra's says
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: destiny-director
      DEV_REPO: *repo-dd
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      # DATABASE_URL, RAILWAY_API_TOKEN and the app's variables. dd reads the file itself
      # (dd.common.cfg's load_dotenv, `uv run --env-file .env`), so a link in the workspace
      # serves it; its old compose-level env_file is not carried over.
      DEV_ENV_FILES: ".env"
      DEV_SECRETS_DIR: /run/dd-secrets
    # YAML merge is shallow: listing depends_on here replaces the anchor's, so the hub is
    # named again beside the database.
    depends_on:
      hub:
        condition: service_healthy
      dd-postgres:
        condition: service_healthy
    volumes:
      - *opt
      - *managed
      - *claude-login
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty until the hub's first mint.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: destiny-director, nocopy: true } }
      - dd-workspace:/workspace
      - dd-env:/home/dev/.env.d
      # What was the clone's .dev-ssh/, moved out of it at the cutover: mode 700, read-only.
      - ${DD_SECRETS:?set DD_SECRETS in dev/.env}:/run/dd-secrets:ro
      - dd-uv-cache:/home/dev/.cache/uv
      - dd-claude:/home/dev/.claude
      - dd-claude:/home/dev/.claude-logins/false
      - dd-railway:/home/dev/.railway
      - dd-gh:/home/dev/.config/gh
      - dd-ssh-host:/home/dev/.ssh-host
      - dd-zed-server:/home/dev/.zed_server
      - dd-local-share:/home/dev/.local/share

  # destiny-director's development database, as its compose file had it. `postgres` is the
  # host its .env's DATABASE_URL names, so that is its alias here; the container keeps its
  # old name. Dev-only credentials, as in that repo.
  dd-postgres:
    image: postgres:17-alpine
    container_name: dd-postgres
    restart: "no"
    # In the pool with the dev containers: it is dev work's memory, not the host's.
    cgroup_parent: ${DEV_CGROUP_PARENT:-}
    networks:
      dev:
        aliases: [postgres]
    environment:
      POSTGRES_USER: kyber
      POSTGRES_PASSWORD: kyber
      POSTGRES_DB: kyber
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyber -d kyber"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dd-postgres-data:/var/lib/postgresql/data

  dossier:
    <<: *dev
    build:
      context: https://github.com/gsfernandes81/dossier.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: *base-tag
    image: dossier
    container_name: dossier
    hostname: dossier
    # dossier's compose set no limit; this is a ceiling for the pool to sit above. Raise it
    # here if uv sync or the TUI's tests are killed.
    mem_limit: 1536m
    memswap_limit: 7680m   # RAM + the pool's 6G of swap, as infra's says
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: dossier
      DEV_REPO: *repo-ds
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      DEV_ENV_FILES: ""
      DEV_SECRETS_DIR: /run/ds-secrets
    volumes:
      - *opt
      - *managed
      - *claude-login
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty until the hub's first mint.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: dossier, nocopy: true } }
      - ds-workspace:/workspace
      - ds-env:/home/dev/.env.d
      - ${DS_SECRETS:?set DS_SECRETS in dev/.env}:/run/ds-secrets:ro
      - ds-uv-cache:/home/dev/.cache/uv
      - ds-claude:/home/dev/.claude
      - ds-claude:/home/dev/.claude-logins/false
      - ds-gh:/home/dev/.config/gh
      - ds-ssh-host:/home/dev/.ssh-host
      - ds-zed-server:/home/dev/.zed_server
      - ds-local-share:/home/dev/.local/share

  # ── three more, added 2026-10-27 ─────────────────────────────────────────────
  # The same shape as dossier, from each repo's own Dockerfile.dev: invective, nibbles and
  # ionic-traces. No secrets mount: none of them carries an ssh identity, and the base reads
  # only files it finds in DEV_SECRETS_DIR, so an absent one is no identity rather than an
  # error. No database for ionic-traces yet: ionic-traces' production database is on `one` and
  # stopped by decision, and a dev one is added here when it is wanted. The GitHub App is
  # installed on every repo of the owner's account, so each gets its token with nothing to add.
  invective:
    <<: *dev
    build:
      context: https://github.com/gsfernandes81/invective.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: *base-tag
    image: invective
    container_name: invective
    hostname: invective
    mem_limit: 1536m
    memswap_limit: 7680m   # RAM + the pool's 6G of swap, as infra's says
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: invective
      DEV_REPO: *repo-invective
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      DEV_ENV_FILES: ""
    volumes:
      - *opt
      - *managed
      - *claude-login
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: invective, nocopy: true } }
      - invective-workspace:/workspace
      - invective-env:/home/dev/.env.d
      - invective-uv-cache:/home/dev/.cache/uv
      - invective-claude:/home/dev/.claude
      - invective-claude:/home/dev/.claude-logins/false
      - invective-gh:/home/dev/.config/gh
      - invective-ssh-host:/home/dev/.ssh-host
      - invective-local-share:/home/dev/.local/share

  nibbles:
    <<: *dev
    build:
      context: https://github.com/gsfernandes81/nibbles.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: *base-tag
    image: nibbles
    container_name: nibbles
    hostname: nibbles
    mem_limit: 1536m
    memswap_limit: 7680m   # RAM + the pool's 6G of swap, as infra's says
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: nibbles
      DEV_REPO: *repo-nibbles
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      DEV_ENV_FILES: ""
    volumes:
      - *opt
      - *managed
      - *claude-login
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: nibbles, nocopy: true } }
      - nibbles-workspace:/workspace
      - nibbles-env:/home/dev/.env.d
      - nibbles-uv-cache:/home/dev/.cache/uv
      - nibbles-claude:/home/dev/.claude
      - nibbles-claude:/home/dev/.claude-logins/false
      - nibbles-gh:/home/dev/.config/gh
      - nibbles-ssh-host:/home/dev/.ssh-host
      - nibbles-local-share:/home/dev/.local/share

  ionic-traces:
    <<: *dev
    build:
      context: https://github.com/gsfernandes81/ionic-traces.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: *base-tag
    image: ionic-traces
    container_name: ionic-traces
    hostname: ionic-traces
    mem_limit: 1536m
    memswap_limit: 7680m   # RAM + the pool's 6G of swap, as infra's says
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: ionic-traces
      DEV_REPO: *repo-ionic
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      DEV_ENV_FILES: ""
    volumes:
      - *opt
      - *managed
      - *claude-login
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: ionic-traces, nocopy: true } }
      - ionic-workspace:/workspace
      - ionic-env:/home/dev/.env.d
      - ionic-uv-cache:/home/dev/.cache/uv
      - ionic-claude:/home/dev/.claude
      - ionic-claude:/home/dev/.claude-logins/false
      - ionic-gh:/home/dev/.config/gh
      - ionic-ssh-host:/home/dev/.ssh-host
      - ionic-local-share:/home/dev/.local/share

  # ── claude-sessions, added 2026-10-27 ────────────────────────────────────────
  # The hub's own software, worked on through the hub (owner, 2026-10-27), from that repo's
  # Dockerfile.dev: the base and a pinned Rust toolchain. It runs the released claude-sessions
  # from the hub's volume like every container, and builds its own in /workspace/target, so the
  # two never meet — as long as it is `cargo build`, never `cargo install`: ~/.cargo/bin is
  # ahead of /opt/claude-sessions/bin on PATH, so an installed dev build would become what this
  # container's own hooks and agent run. It cannot test the hub against real containers: no container has docker.
  claude-sessions:
    <<: *dev
    build:
      context: https://github.com/gsfernandes81/claude-sessions.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: *base-tag
      # ITS CI'S LAYERS, REUSED, NOT ITS IMAGE (owner, 2026-10-28). That repo's dev-image
      # workflow builds this Dockerfile natively per architecture and keeps a registry cache,
      # so where its base matches ours every layer, cargo-mutants' compile included, is a
      # pull. Still built here and on x-base-tag, because a pinned prebuilt image would stay
      # on whatever base it was built against and a base bump would need that repo to move
      # first. When the bases differ, nothing after FROM matches and zero compiles, slower and
      # still correct. A cache that cannot be read (GitHub down) is an ERROR line on the
      # import step and an uncached build, never a failed one.
      cache_from:
        - type=registry,ref=ghcr.io/gsfernandes81/claude-sessions-dev:buildcache-arm64
        - type=registry,ref=ghcr.io/gsfernandes81/claude-sessions-dev:buildcache-amd64
    image: claude-sessions
    container_name: claude-sessions
    hostname: claude-sessions
    # rustc and rust-analyzer are the heavy ones; the crate has no dependencies.
    mem_limit: 1536m
    memswap_limit: 7680m   # RAM + the pool's 6G of swap, as infra's says
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: claude-sessions
      DEV_REPO: *repo-claude-sessions
      CLAUDE_SECURESTORAGE_CONFIG_DIR: *claude-login-dir
      DEV_ENV_FILES: ""
    volumes:
      - *opt
      - *managed
      - *claude-login
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: claude-sessions, nocopy: true } }
      - claude-sessions-workspace:/workspace
      - claude-sessions-env:/home/dev/.env.d
      - claude-sessions-claude:/home/dev/.claude
      - claude-sessions-claude:/home/dev/.claude-logins/false
      - claude-sessions-gh:/home/dev/.config/gh
      - claude-sessions-ssh-host:/home/dev/.ssh-host
      - claude-sessions-local-share:/home/dev/.local/share

networks:
  # The hub reaches each container's sshd by name here. Nothing is published on zero.
  dev:

volumes:
  claude-sessions:
  hub-state:
  github-tokens:
  claude-login:
  infra-workspace:
  infra-env:
  # infra's, made under its old project name `infra-dev` and kept by name, so the
  # logins, the host key and the conversation history move with it.
  infra-claude: { external: true, name: infra-dev_infra-claude }
  infra-gh: { external: true, name: infra-dev_infra-gh }
  infra-ssh-host: { external: true, name: infra-dev_infra-ssh-host }
  infra-local-share: { external: true, name: infra-dev_infra-local-share }
  infra-jcode: { external: true, name: infra-dev_infra-jcode }
  or3-workspace:
  or3-env:
  dd-workspace:
  dd-env:
  ds-workspace:
  ds-env:
  # The other three's, under their old project names (docs/fleet-inventory.md, 2026-10-25).
  or3-claude: { external: true, name: or3-dev_or3-claude }
  or3-gh: { external: true, name: or3-dev_or3-gh }
  or3-ssh-host: { external: true, name: or3-dev_or3-ssh-host }
  or3-local-share: { external: true, name: or3-dev_or3-local-share }
  dd-uv-cache: { external: true, name: destiny-director_dd-uv-cache }
  dd-claude: { external: true, name: destiny-director_dd-claude }
  dd-railway: { external: true, name: destiny-director_dd-railway }
  dd-gh: { external: true, name: destiny-director_dd-gh }
  dd-ssh-host: { external: true, name: destiny-director_dd-ssh-host }
  dd-zed-server: { external: true, name: destiny-director_dd-zed-server }
  dd-local-share: { external: true, name: destiny-director_dd-local-share }
  dd-postgres-data: { external: true, name: destiny-director_dd-postgres-data }
  ds-uv-cache: { external: true, name: dossier_ds-uv-cache }
  ds-claude: { external: true, name: dossier_ds-claude }
  ds-gh: { external: true, name: dossier_ds-gh }
  ds-ssh-host: { external: true, name: dossier_ds-ssh-host }
  ds-zed-server: { external: true, name: dossier_ds-zed-server }
  ds-local-share: { external: true, name: dossier_ds-local-share }
  invective-workspace:
  invective-env:
  nibbles-workspace:
  nibbles-env:
  ionic-workspace:
  ionic-env:
  # Their logins and history, external like the others' so `make down-volumes` cannot take a
  # conversation history; `make volumes` makes them once, empty.
  invective-uv-cache: { external: true, name: invective-dev_invective-uv-cache }
  invective-claude: { external: true, name: invective-dev_invective-claude }
  invective-gh: { external: true, name: invective-dev_invective-gh }
  invective-ssh-host: { external: true, name: invective-dev_invective-ssh-host }
  invective-local-share: { external: true, name: invective-dev_invective-local-share }
  nibbles-uv-cache: { external: true, name: nibbles-dev_nibbles-uv-cache }
  nibbles-claude: { external: true, name: nibbles-dev_nibbles-claude }
  nibbles-gh: { external: true, name: nibbles-dev_nibbles-gh }
  nibbles-ssh-host: { external: true, name: nibbles-dev_nibbles-ssh-host }
  nibbles-local-share: { external: true, name: nibbles-dev_nibbles-local-share }
  ionic-uv-cache: { external: true, name: ionic-dev_ionic-uv-cache }
  ionic-claude: { external: true, name: ionic-dev_ionic-claude }
  ionic-gh: { external: true, name: ionic-dev_ionic-gh }
  ionic-ssh-host: { external: true, name: ionic-dev_ionic-ssh-host }
  ionic-local-share: { external: true, name: ionic-dev_ionic-local-share }
  claude-sessions-workspace:
  claude-sessions-env:
  # Its login and history, external from the start like the three above; `make volumes` makes
  # them once, empty. The project prefix is its own name, there being no old one to keep.
  claude-sessions-claude: { external: true, name: claude-sessions_claude-sessions-claude }
  claude-sessions-gh: { external: true, name: claude-sessions_claude-sessions-gh }
  claude-sessions-ssh-host: { external: true, name: claude-sessions_claude-sessions-ssh-host }
  claude-sessions-local-share: { external: true, name: claude-sessions_claude-sessions-local-share }
