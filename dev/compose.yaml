# Every dev container on zero, in one Compose project, with the hub that is the way in to
# all of them (decided 2026-10-25, built 2026-10-26 — docs/decisions.md § "Dev containers:
# one compose file in infra"; plans/dev-pool.md has what is left). Bring it up with
# `make up` in this directory; `gavin` is not in the docker group, so nothing here runs
# from an agent session.
#
#   hub          claude-sessions' menu over every container, and the offload timer. `ssh dev`.
#   cloudflared  the hub's tunnel, a sidecar as Phase 3 settled for deployments.
#   infra-dev    this repo's container. or3-dev, dd-dev (+ dd-postgres), ds-dev: each repo's,
#                built from its own Dockerfile, each behind a profile of its own name —
#                COMPOSE_PROFILES in dev/.env says which `make up` starts.
#
# The invariants in ../README.md apply here as everywhere: no `..`; `name:` declared;
# host-specific values only from the gitignored .env, `${VAR:?}` where absence must stop
# Compose. A REQUIRED VARIABLE STOPS COMPOSE EVEN FOR A SERVICE WHOSE PROFILE IS OFF —
# checked with Compose 5.6.1 on 2026-10-26 — so every container's paths are in .env from the
# start; the profile is what keeps one from starting.
name: dev

# EACH CONTAINER'S REPO, stated once. Its service clones it (DEV_REPO), and the hub mints that
# container's GitHub token for it and nothing else (HUB_REPO_*, below) — one anchor each, so the
# two cannot name different repos.
x-repo-infra: &repo-infra gsfernandes81/infra
x-repo-or3: &repo-or3 gsfernandes81/or3
x-repo-dd: &repo-dd gsfernandes81/destiny-director
x-repo-ds: &repo-ds gsfernandes81/dossier

# What every dev container shares. A child sets its own build, name, repo, secrets and
# volumes beside these.
x-dev: &dev
  init: true
  # restart: no, as every dev container always was: each holds live claude sessions, and an
  # unattended restart at 03:00 would bring them back with nobody watching. A reboot leaves
  # them down, which recovery.md says is the expected resting state. The hub is the exception
  # (below): it runs no claude.
  restart: "no"
  networks: [dev]
  # The hub installs the binary every container's hooks, agent and offload pass run before
  # any container starts, and the drop-in below is a subpath of its volume that must exist
  # to be mounted at all.
  depends_on:
    hub:
      condition: service_healthy
  # ONE MEMORY POOL for every dev container (plans/dev-pool.md): a parent cgroup whose limit
  # the boot file in hosts/zero/system/ writes. Empty — the default until that file is
  # installed and proved — leaves each container under Docker's own parent, exactly as today;
  # Compose drops an empty cgroup_parent rather than passing it (checked, Compose 5.6.1). Set
  # DEV_CGROUP_PARENT=/devpool in .env once the pool exists. The per-container mem_limit
  # stays either way, as a ceiling inside it.
  cgroup_parent: ${DEV_CGROUP_PARENT:-}

# What every dev container mounts from the hub's volume, read-only: the binary at
# /opt/claude-sessions/bin (on the base's PATH), the skill, the hub's public key — and the
# hooks drop-in as Claude Code's managed-settings.d, a subpath mount rather than a symlink so
# Claude Code reads a plain directory of plain files. Read-only, so no claude in a container
# can rewrite the hooks every claude runs.
x-opt: &opt
  type: volume
  source: claude-sessions
  target: /opt/claude-sessions
  read_only: true
x-managed: &managed
  type: volume
  source: claude-sessions
  target: /etc/claude-code/managed-settings.d
  read_only: true
  volume:
    subpath: managed-settings.d

services:
  # ── the hub ───────────────────────────────────────────────────────────────────
  hub:
    build:
      context: hub
      args:
        USER_UID: ${HOST_UID:?run make, which passes the checkout owner's uid}
        USER_GID: ${HOST_GID:?run make, which passes the checkout owner's gid}
    image: dev-hub
    container_name: dev-hub
    # `dev` is what the menu's home is headed with, and what `ssh dev` names.
    hostname: dev
    init: true
    # The door, and it runs no claude: back after a reboot with nobody needing to start it.
    restart: unless-stopped
    networks: [dev]
    environment:
      # The containers the menu and the offloader reach, by name on the `dev` network — only
      # those on a base new enough to have /opt/claude-sessions mounted (base 2026.10.26).
      CLAUDE_SESSIONS_HOSTS: ${HUB_HOSTS:?set HUB_HOSTS in dev/.env — the containers the hub manages, e.g. infra-dev}
      CLAUDE_SESSIONS_REMOTE: /opt/claude-sessions/bin/claude-sessions
      HUB_OFFLOAD: ${HUB_OFFLOAD:-1}
      # THE TOKEN BROKER (hub/github-tokens). Empty app id is OFF — a setting, not a mistake,
      # so `:-` — and every container keeps its own gh login and deploy key. The App's key is
      # github-app.pem in HUB_SECRETS. What each token may do is the list below, never more
      # than the App was granted; which repo, the anchors at the top of this file.
      HUB_GITHUB_APP_ID: ${HUB_GITHUB_APP_ID:-}
      HUB_GITHUB_KEY: /run/hub-secrets/github-app.pem
      HUB_GITHUB_PERMISSIONS: ${HUB_GITHUB_PERMISSIONS:-contents=write,pull_requests=write,issues=write,workflows=write,actions=read,checks=read,statuses=read}
      HUB_GITHUB_TOKENS: /home/dev/tokens
      HUB_REPO_INFRA_DEV: *repo-infra
      HUB_REPO_OR3_DEV: *repo-or3
      HUB_REPO_DD_DEV: *repo-dd
      HUB_REPO_DS_DEV: *repo-ds
    volumes:
      - claude-sessions:/opt/claude-sessions
      # The hub's key, its known_hosts, its sshd host key and its pass log.
      - hub-state:/home/dev/.hub
      # Every container's token, one directory each; each container mounts only its own.
      - github-tokens:/home/dev/tokens
      # Mode-700 directory on zero holding the hub's authorized_keys (the clients' keys)
      # and its tunnel credentials. Read-only.
      - ${HUB_SECRETS:?set HUB_SECRETS in dev/.env — server-create-dev-container.yml -e container=dev writes it}:/run/hub-secrets:ro
      # THE POOL'S MEMORY, for the home's header, once the pool exists — uncomment then.
      # Long form with create_host_path false, so a path that is not there fails the start
      # rather than having Docker mkdir a cgroup under /sys/fs/cgroup.
      # - type: bind
      #   source: /sys/fs/cgroup/devpool
      #   target: /run/devpool
      #   read_only: true
      #   bind: { create_host_path: false }
    healthcheck:
      # Healthy once the install has put what every container mounts in place, and the
      # token broker has made every container's directory and tried its first pass.
      test: ["CMD", "sh", "-c", "test -x /opt/claude-sessions/bin/claude-sessions && test -s /opt/claude-sessions/hub.pub && test -d /opt/claude-sessions/managed-settings.d && test -e /home/dev/tokens/.ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: 128m

  # ── the tunnel ────────────────────────────────────────────────────────────────
  # A sidecar, as Phase 3 settled for deployments (decisions.md § "Sidecar, not baked-in"),
  # pinned identically to theirs. Two hostnames: the hub's, and or3-dev's for the phone's
  # reverse forward to the vessel (cloudflared.yml says why).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: dev-cloudflared
    restart: unless-stopped
    networks: [dev]
    # As the checkout's owner, not the image's 65532: the credentials are written by the
    # dev-container edge play, which leaves them owned by gavin at 0600, and a file the
    # connector cannot read kills it on start. cloudflared needs no home and no shell.
    user: "${HOST_UID:?run make}:${HOST_GID:?run make}"
    profiles: [tunnel]
    # THE PROFILE IS THE SWITCH, not the id: `tunnel` in COMPOSE_PROFILES once
    # server-create-dev-container.yml -e container=dev has made the tunnel. `:-`, not `:?`,
    # for the one reason the invariant allows — a required variable stops Compose even with
    # this profile off, so `:?` would hold every container hostage to a tunnel. With the
    # profile on and no id, the connector refuses at start and says so in `make tunnel-log`.
    command: tunnel --config /etc/cloudflared/config.yml run ${HUB_TUNNEL_ID:-}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      # Long form, so a missing file fails the start rather than Docker making a directory
      # called tunnel.json in the secrets directory.
      - type: bind
        source: ${HUB_SECRETS:?set HUB_SECRETS in dev/.env}/tunnel.json
        target: /etc/cloudflared/creds.json
        read_only: true
        bind: { create_host_path: false }
    depends_on: [hub]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m

  # ── the dev containers ────────────────────────────────────────────────────────
  infra-dev:
    <<: *dev
    build:
      context: .
      dockerfile: Dockerfile
      # The tag is the Makefile's BASE_TAG, the single source; this is its fallback.
      args:
        BASE_TAG: ${BASE_TAG:-2026.10.26}
    image: infra-dev
    container_name: infra-dev
    hostname: infra-dev   # Claude Code shows this as the machine title
    # A cap, not a reservation; dev/README.md has why it is lower than or3-dev's.
    mem_limit: ${DEV_MEM_LIMIT:-1024m}
    memswap_limit: ${DEV_MEMSWAP_LIMIT:-1536m}
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      # The repo cloned into the workspace volume at first start — by gh when it is logged
      # in, else over ssh with the deploy key (entrypoint.sh).
      DEV_REPO: *repo-infra
      # Files the repo expects beside its tracked ones, kept in the env volume and linked into
      # the workspace (entrypoint.sh). None for infra: its .env files live on the hosts.
      DEV_ENV_FILES: ""
      CLAUDE_SESSIONS_OFFLOAD: ${DEV_IDLE_OFFLOAD:-1}
    volumes:
      - *opt
      - *managed
      # THE WORKSPACE IS A VOLUME, cloned into, and no longer zero's own checkout. zero's
      # ~gavin/infra is now only what the box runs; the container's tree is its own, so a
      # commit in here never leaves zero's checkout diverged again (CLAUDE.md § Git, the
      # 2026-10-25 divergence). Push to share work, as from anywhere else.
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty when the broker is off.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: infra-dev } }
      - infra-workspace:/workspace
      # The repo's untracked secrets, in a volume of their own, linked into the workspace.
      - infra-env:/home/dev/.env.d
      # Mode-700 directory outside the repo: the deploy key, the fleet key if any, the
      # owner's authorized_keys, the host-specific ssh fragments. Read-only.
      - ${INFRA_SECRETS:?set INFRA_SECRETS in dev/.env to the absolute path of the secrets dir}:/run/infra-secrets:ro
      # The logins, history and state, kept from the infra-dev project they were made in, so
      # moving into this one costs no login and loses no conversation.
      - infra-claude:/home/dev/.claude
      - infra-gh:/home/dev/.config/gh
      - infra-ssh-host:/home/dev/.ssh-host
      - infra-local-share:/home/dev/.local/share
      - infra-jcode:/home/dev/.jcode
    # The container no longer needs to reach zero for ansible's sake (no fleet key, by
    # decision); kept so the inventory's `zero` still resolves if fleet access is ever given.
    extra_hosts:
      - "${DEV_HOST_ALIAS:-zero}:host-gateway"

  # ── the other repos' containers, ported from each repo's own compose file ───────
  # All three move in at the one cutover (dev/README.md § "The cutover from the old layout").
  # EACH BUILDS STRAIGHT FROM ITS REPO ON GITHUB, `main`, with its own Dockerfile and on this
  # base — BASE_TAG is a build arg every child Dockerfile already takes, so no child repo
  # changes first, and no clone on zero is read by anything (owner, 2026-10-27). or3 is
  # private, so its context is fetched over ssh with or3's own deploy key; dd and ds are
  # public, over https. Each works in its own clone in a volume, its untracked .env in an env
  # volume, its keys in a secrets directory outside any clone.
  #
  # Each sits behind a profile of its own name, so COMPOSE_PROFILES says which start with
  # `make up` — dd-dev and ds-dev have been stopped at rest, and dd-dev idles at ~1.4 GB.
  # `make up S=dd-dev` starts one regardless: naming a service enables its profile.
  #
  # Volume names are the old projects' (or3-dev_, destiny-director_, dossier_), read from
  # docs/fleet-inventory.md of 2026-10-25, so logins and history carry over.
  or3-dev:
    <<: *dev
    profiles: [or3-dev]
    build:
      context: git@github.com:gsfernandes81/or3.git#main:dev
      # The deploy key that already lives in OR3_SECRETS (or3's dev/seed-secrets.sh makes it),
      # lent to BuildKit for the fetch only; it is not in any layer.
      ssh:
        - default=${OR3_SECRETS:?set OR3_SECRETS in dev/.env}/id_ed25519_or3_deploy
      args:
        BASE_TAG: ${BASE_TAG:-2026.10.26}
    image: or3-dev
    container_name: or3-dev
    hostname: or3-dev
    # or3's own figures, from its compose file.
    mem_limit: 2560m
    memswap_limit: 3072m
    shm_size: 256m
    tmpfs:
      - /tmp:exec,mode=1777,size=512m
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: or3-dev
      DEV_REPO: *repo-or3
      DEV_ENV_FILES: ".env"
      DEV_SECRETS_DIR: /run/or3-secrets
      CLAUDE_SESSIONS_OFFLOAD: ${DEV_IDLE_OFFLOAD:-1}
    volumes:
      - *opt
      - *managed
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty when the broker is off.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: or3-dev } }
      - or3-workspace:/workspace
      - or3-env:/home/dev/.env.d
      # The or3ecr key, the deploy key and the phone's authorized_keys (or3's
      # dev/seed-secrets.sh writes them). Its sshd is also reached straight from the phone,
      # through the hub's tunnel, for or3-tunnel's reverse forward (cloudflared.yml), so its
      # forwarding drop-in stays and so does this authorized_keys.
      - ${OR3_SECRETS:?set OR3_SECRETS in dev/.env}:/run/or3-secrets:ro
      - or3-claude:/home/dev/.claude
      - or3-gh:/home/dev/.config/gh
      - or3-ssh-host:/home/dev/.ssh-host
      - or3-local-share:/home/dev/.local/share

  dd-dev:
    <<: *dev
    profiles: [dd-dev]
    build:
      context: https://github.com/gsfernandes81/destiny-director.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: ${BASE_TAG:-2026.10.26}
    image: dd-dev
    container_name: dd-dev
    hostname: dd-dev
    # destiny-director's own figures: dd-dev idles at ~1.4 GB, and the dev bots run in here.
    mem_limit: 2560m
    memswap_limit: 2816m
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: dd-dev
      DEV_REPO: *repo-dd
      # DATABASE_URL, RAILWAY_API_TOKEN and the app's variables. dd reads the file itself
      # (dd.common.cfg's load_dotenv, `uv run --env-file .env`), so a link in the workspace
      # serves it; its old compose-level env_file is not carried over.
      DEV_ENV_FILES: ".env"
      DEV_SECRETS_DIR: /run/dd-secrets
      CLAUDE_SESSIONS_OFFLOAD: ${DEV_IDLE_OFFLOAD:-1}
    # YAML merge is shallow: listing depends_on here replaces the anchor's, so the hub is
    # named again beside the database.
    depends_on:
      hub:
        condition: service_healthy
      dd-postgres:
        condition: service_healthy
    volumes:
      - *opt
      - *managed
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty when the broker is off.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: dd-dev } }
      - dd-workspace:/workspace
      - dd-env:/home/dev/.env.d
      # What was the clone's .dev-ssh/, moved out of it at the cutover: mode 700, read-only.
      - ${DD_SECRETS:?set DD_SECRETS in dev/.env}:/run/dd-secrets:ro
      # THE HOST'S ~/.ssh IS NO LONGER MOUNTED. destiny-director's drop-in pointed sshd at
      # the host account's authorized_keys, for a door that published a port; the hub is the
      # door now, so this blanks that drop-in and the base's two files apply — the client
      # keys in its secrets dir, if any, and the hub's. gavin's private keys on zero stop
      # being visible inside the container as a side effect.
      - ./child-authorized-keys.conf:/home/dev/sshd_config.d/10-authorized-keys.conf:ro
      - dd-uv-cache:/home/dev/.cache/uv
      - dd-claude:/home/dev/.claude
      - dd-railway:/home/dev/.railway
      - dd-gh:/home/dev/.config/gh
      - dd-ssh-host:/home/dev/.ssh-host
      - dd-zed-server:/home/dev/.zed_server
      - dd-local-share:/home/dev/.local/share

  # destiny-director's development database, as its compose file had it. `postgres` is the
  # host its .env's DATABASE_URL names, so that is its alias here; the container keeps its
  # old name. Dev-only credentials, as in that repo.
  dd-postgres:
    profiles: [dd-dev]
    image: postgres:17-alpine
    container_name: dd-postgres
    restart: "no"
    networks:
      dev:
        aliases: [postgres]
    environment:
      POSTGRES_USER: kyber
      POSTGRES_PASSWORD: kyber
      POSTGRES_DB: kyber
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyber -d kyber"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dd-postgres-data:/var/lib/postgresql/data

  ds-dev:
    <<: *dev
    profiles: [ds-dev]
    build:
      context: https://github.com/gsfernandes81/dossier.git#main
      dockerfile: Dockerfile.dev
      args:
        BASE_TAG: ${BASE_TAG:-2026.10.26}
    image: ds-dev
    container_name: ds-dev
    hostname: ds-dev
    # dossier's compose set no limit; this is a ceiling for the pool to sit above. Raise it
    # here if uv sync or the TUI's tests are killed.
    mem_limit: 1536m
    memswap_limit: 2048m
    environment:
      GIT_USER_NAME: ${GIT_USER_NAME:-Gavin Fernandes}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-gavinfernandes2012@pm.me}
      DEV_NAME: ds-dev
      DEV_REPO: *repo-ds
      DEV_ENV_FILES: ""
      DEV_SECRETS_DIR: /run/ds-secrets
      CLAUDE_SESSIONS_OFFLOAD: ${DEV_IDLE_OFFLOAD:-1}
    volumes:
      - *opt
      - *managed
      # Its GitHub token, from the hub, read-only: its own directory of the tokens volume and
      # no other container's (hub/github-tokens). Empty when the broker is off.
      - { type: volume, source: github-tokens, target: /run/github, read_only: true, volume: { subpath: ds-dev } }
      - ds-workspace:/workspace
      - ds-env:/home/dev/.env.d
      - ${DS_SECRETS:?set DS_SECRETS in dev/.env}:/run/ds-secrets:ro
      # As dd-dev's: the hub is the door, so the host's ~/.ssh is not mounted.
      - ./child-authorized-keys.conf:/home/dev/sshd_config.d/10-authorized-keys.conf:ro
      - ds-uv-cache:/home/dev/.cache/uv
      - ds-claude:/home/dev/.claude
      - ds-gh:/home/dev/.config/gh
      - ds-ssh-host:/home/dev/.ssh-host
      - ds-zed-server:/home/dev/.zed_server
      - ds-local-share:/home/dev/.local/share

networks:
  # The hub reaches each container's sshd by name here. Nothing is published on zero.
  dev:

volumes:
  claude-sessions:
  hub-state:
  github-tokens:
  infra-workspace:
  infra-env:
  # infra-dev's, made under its old project name `infra-dev` and kept by name, so the
  # logins, the host key and the conversation history move with it.
  infra-claude: { external: true, name: infra-dev_infra-claude }
  infra-gh: { external: true, name: infra-dev_infra-gh }
  infra-ssh-host: { external: true, name: infra-dev_infra-ssh-host }
  infra-local-share: { external: true, name: infra-dev_infra-local-share }
  infra-jcode: { external: true, name: infra-dev_infra-jcode }
  or3-workspace:
  or3-env:
  dd-workspace:
  dd-env:
  ds-workspace:
  ds-env:
  # The other three's, under their old project names (docs/fleet-inventory.md, 2026-10-25).
  or3-claude: { external: true, name: or3-dev_or3-claude }
  or3-gh: { external: true, name: or3-dev_or3-gh }
  or3-ssh-host: { external: true, name: or3-dev_or3-ssh-host }
  or3-local-share: { external: true, name: or3-dev_or3-local-share }
  dd-uv-cache: { external: true, name: destiny-director_dd-uv-cache }
  dd-claude: { external: true, name: destiny-director_dd-claude }
  dd-railway: { external: true, name: destiny-director_dd-railway }
  dd-gh: { external: true, name: destiny-director_dd-gh }
  dd-ssh-host: { external: true, name: destiny-director_dd-ssh-host }
  dd-zed-server: { external: true, name: destiny-director_dd-zed-server }
  dd-local-share: { external: true, name: destiny-director_dd-local-share }
  dd-postgres-data: { external: true, name: destiny-director_dd-postgres-data }
  ds-uv-cache: { external: true, name: dossier_ds-uv-cache }
  ds-claude: { external: true, name: dossier_ds-claude }
  ds-gh: { external: true, name: dossier_ds-gh }
  ds-ssh-host: { external: true, name: dossier_ds-ssh-host }
  ds-zed-server: { external: true, name: dossier_ds-zed-server }
  ds-local-share: { external: true, name: dossier_ds-local-share }
