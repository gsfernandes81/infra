name: torrents
services:
  gluetun:
    # Pinned by digest to the build running on 2026-10-25, which no version tag points at
    # any more (`latest` has moved on twice), so `latest` here is a label and the digest is
    # the image. Moving to a version tag is a deliberate bump of the VPN container.
    image: qmcgaw/gluetun:latest@sha256:4af0c804003481e100180e1f8d4d5e9c48163fedc0f88d061881b615aef9d183
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080  # QB
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - VPN_IPV6=off
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
    env_file:
      - .env

  torrent:
    container_name: torrent
    image: linuxserver/qbittorrent:5.1.4-r2-ls442@sha256:065792d2b11f0facff340210fc1cf13623b029a94ecdf08b02d06d922205f618
    restart: always
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /media/torrents-config:/config
      - /media/torrents:/downloads
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '256M'

  syncthing:
    image: syncthing/syncthing:2.0.14@sha256:6d2ab058383b533e045cf2c32fc4c6bbe87c612c92bc2aca9f552fb099b2e123
    container_name: syncthing
    hostname: syncthing-torrents.gsrpi.uk
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /media/torrents:/var/syncthing
      - /media/syncthing-config:/var/syncthing/config
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '256M'
