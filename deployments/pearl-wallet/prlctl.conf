; pearl-wallet's prlctl config, mounted read-only at prlctl's default path
; (/home/nonroot/.prlctl/prlctl.conf), so `docker exec pearl-wallet prlctl getbalance`
; needs no flags. The username and password match oyster.conf, whose header says why they
; are not a secret.
;
; wallet=1 talks to Oyster, not to a pearld, and makes prlctl verify Oyster's own TLS
; certificate, which Oyster writes into the wallet volume at its first start.

wallet=1
rpcserver=127.0.0.1:44207
rpcuser=pearl-wallet
rpcpass=loopback-only-not-a-secret
