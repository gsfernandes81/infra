; pearl-wallet's Oyster config, mounted read-only at /etc/oyster/oyster.conf.
;
; THE PASSWORD BELOW IS NOT A SECRET, and is in git on purpose. The RPC server listens on
; the container's own loopback, so only a process inside the container reaches it, which
; means root on zero running `docker exec`. Root can read the wallet file and this file
; anyway. What protects the coins is the wallet's private passphrase, which the owner
; chose at --create and which is stored nowhere. The reasoning is in docs/decisions.md
; § Pearl wallet on `zero`. Do not reuse this password anywhere that listens beyond
; loopback.
;
; The same username and password are in prlctl.conf; change both together.

[Application Options]

; The light client (neutrino): no pearld, no copy of the chain. Peers are outbound only.
usespv=1

; 127.0.0.1, not localhost, which may resolve to ::1 first (CLAUDE.md § Landmines).
rpclisten=127.0.0.1:44207
username=pearl-wallet
password=loopback-only-not-a-secret

; Oyster's own log file sits in the wallet volume on zero's SD card, beside Docker's
; capped copy of the same lines. 1 MB per file, not the 10 MB default.
logsize=1024
