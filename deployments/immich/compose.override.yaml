# What is ours on top of Immich's release file. compose.yaml beside this is that file,
# UNMODIFIED, so a release is taken by replacing it and reading a plain diff (SOURCE says
# how). Compose reads this one automatically; no command changes.
#
# Three changes: the server and machine-learning images pinned to one version, the resource
# limits (measured on the host it runs on, not Immich's advice), and machine learning's
# MODEL_REVISION (below).
#
# THE PINS are v3.3.5, committed 2026-10-25 and deployed on `zero` through the redeploy play
# (server-deploy-compose.yml -e deployment=immich) by 2026-10-26, owner-reported. It ran
# v3.0.1 before; v3.0.1's digests were read off the box on 2026-10-25, and it had been
# started from `IMMICH_VERSION=v3`, a floating major tag, so `.env`'s IMMICH_VERSION no
# longer reaches the image and can be deleted. These digests are the multi-arch index ones
# from the registry, as v3.0.1's were. Both images are ONE version, so they move together;
# Renovate proposes them as one group (renovate.json), and a release also means replacing
# compose.yaml (SOURCE) — already v3.3.5's file, whose postgres and valkey lines are the
# ones `zero` runs. The server migrates the database on its first start on a new version
# and there is no migrating back, so the redeploy play dumps it off the array first, after
# you answer y (ansible/deploy-hooks/immich/prepare.yml, docs/recovery.md).
#
# NO `:?` GUARDS HERE, and that is tested, not forgotten. The data paths used to carry
# `${UPLOAD_LOCATION:?…}` and `${DB_DATA_LOCATION:?…}` so an unset value stopped Compose
# instead of bind-mounting an empty path (a blank library, or initdb into nothing).
# Upstream's own `${UPLOAD_LOCATION}:/data` already does that: unset, it renders `:/data`
# and Compose refuses it ("empty section between colons"), same for the database. Verified
# 2026-10-25 on Compose 5.6.1, with and without this file. The message is worse; the stop
# is the same. If a Compose upgrade ever stops refusing that, this is where the guards
# come back: re-state each volume here with `:?`, merged by its container path.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: '2000M'

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    # Immich's re-exported models, opt-in from v3.3.0 and to become the default later. Their
    # outputs are numerically equivalent, so no job is re-run; the first load of each model
    # prepares and caches it (a one-off, slower start). Measured 2026-10-25 on x86 CPU with
    # ViT-B-32 and buffalo_l loaded: v3.3.5 holds ~270 MB of its own memory plus ~770 MB of
    # model files mapped from disk (droppable under pressure), where v3.0.1 held ~1.19 GB
    # of its own. Most of that is v3.3 itself; v2 against v1 differed by little on x86. It is
    # here for the arm64 build, which the release notes say gains, and because it will be
    # the default anyway. docs/decisions.md has the numbers.
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '2000M'
