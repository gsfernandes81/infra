# garmin-mcp on `one` — a Garmin Connect MCP server (its read tools plus five chosen writes, below) that claude.ai reaches as a
# custom connector. Reached ONLY through the cloudflared sidecar below, on its own tunnel;
# nothing is published on the host. Deploy, the MFA step, rotation: README.md beside this.
# Why it is shaped this way: plans/garmin-mcp.md until it is retired, then docs/decisions.md.
#
# NO `network_mode: host`, ANYWHERE IN THIS FILE, and that is load-bearing. Both services
# share the project's own network, which is why the ingress can say `http://garmin-mcp:8080`
# and why 8080 cannot collide with gluetun, which holds 8080 on `one` itself.
#
# The images are literals — the deployed image is never a variable (CLAUDE.md § Repo
# invariants). garmin-mcp's is BUILT here from the checkout SOURCE pins, and tagged with
# that sha, so Compose's default build policy builds it only when the tag is absent: a
# re-run never rebuilds, and upstream's unpinned Python dependencies cannot drift between
# reviewed bumps. A bump is: SOURCE, the tag below, the allowlist below, one commit.
#
# The sidecar is calibre-web's, pinned identically. It is OUTSIDE the fleet's staggered
# cloudflared autoupdate (management-plane.md, 2h), by design: `--no-autoupdate` is in the
# image's entrypoint, and an in-container update would land in a layer a recreate discards.
name: garmin-mcp

x-logging: &logging
  # Capped, because /healthz, the OAuth endpoints and every 401 are reachable by anyone,
  # and each hit lands in json-file on `one`'s SD card.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  garmin-mcp:
    build:
      context: ${SRC_ROOT:?run ansible/playbooks/server-deploy-garmin-mcp.yml — it writes SRC_ROOT}/garmin-mcp
    image: garmin-mcp-remote:0cf102c
    # Never pulled, built only when the tag is absent. The default (`missing`) first tries
    # the tag on Docker Hub, warning on every first build, and would PREFER a same-named
    # image published there over the reviewed source. Not `build`: that rebuilds on every
    # `up` (compose v5.6.1, pkg/compose/build.go:85), re-resolving upstream's unpinned
    # Python dependencies whenever the build cache is gone, which is the drift the sha tag
    # exists to prevent.
    pull_policy: never
    container_name: garmin-mcp
    restart: unless-stopped
    # EXPLICIT environment, never `env_file:`. env_file would hand the container every line
    # of .env — including a GARMIN_PASSWORD someone added by following upstream's README,
    # which the server would then use to log in silently and write a base64 copy of the
    # tokens beside it. Only the names listed here can reach the container.
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?run ansible/playbooks/server-deploy-garmin-mcp.yml — it writes MCP_BEARER_TOKEN}
      MCP_CONSENT_SECRET: ${MCP_CONSENT_SECRET:?run ansible/playbooks/server-deploy-garmin-mcp.yml — it writes MCP_CONSENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?run ansible/playbooks/server-deploy-garmin-mcp.yml — it writes PUBLIC_BASE_URL}
      # Without it the MCP SDK drops a session after 30 minutes idle, and claude.ai reports
      # the resulting 404 as a failed tool call — the first call of every quiet half hour.
      GARMIN_MCP_STATELESS_HTTP: "true"
      # Taxuspt's READ_ONLY_TOOLS at the sha upstream's Dockerfile pins (30324f7) — 108 names,
      # every one matching ^(get|count|search)_, which no write tool does — PLUS five writes
      # the owner chose on 2026-10-24, appended at the end: upload_workout(s), schedule_ and
      # unschedule_workout, set_activity_description. None takes a file path; the last
      # int()s its id before it reaches a URL. Nothing here deletes recorded data. Unlisted
      # tools are never registered, and the play's probe asks the live server for its tool
      # list and fails on any name outside the prefix that is not in garmin_allowed_writes.
      #
      # At a bump, regenerate the READ part by READING the new sha's source, never importing it:
      #   python3 -I -c "import ast;t=ast.parse(open('src/garmin_mcp/tool_annotations.py').read());print(','.join(sorted(next(ast.literal_eval(n.value.args[0]) for n in t.body if isinstance(n,ast.Assign) and n.targets[0].id=='READ_ONLY_TOOLS'))))"
      # then re-append the writes, and diff against this line: the diff IS the review.
      #
      # Adding a write tool later is one name here plus the same name in the play's
      # garmin_allowed_writes — two edits in one commit, so it cannot happen by accident.
      # One line, unfolded: a folded scalar would join lines with a space.
      GARMIN_ENABLED_TOOLS: count_activities,get_acclimation,get_activities,get_activities_by_date,get_activities_fordate,get_activity,get_activity_exercise_sets,get_activity_fit_data,get_activity_fit_messages,get_activity_gear,get_activity_hr_in_timezones,get_activity_power_in_timezones,get_activity_split_summaries,get_activity_splits,get_activity_typed_splits,get_activity_types,get_activity_weather,get_adhoc_challenges,get_all_day_events,get_all_day_stress,get_available_badge_challenges,get_badge_challenges,get_blood_pressure,get_body_battery,get_body_battery_events,get_body_composition,get_calendar_events,get_course_details,get_courses,get_custom_food_serving_units,get_custom_foods,get_cycling_ftp,get_daily_steps,get_daily_weigh_ins,get_device_alarms,get_device_last_used,get_device_settings,get_device_solar_data,get_devices,get_earned_badges,get_endurance_score,get_energy_balance,get_fitnessage_data,get_floors,get_full_name,get_garmin_coach_workouts,get_gear,get_goals,get_heart_rate_zones,get_heart_rates,get_heart_rates_summary,get_hill_score,get_hrv_data,get_hrv_trend,get_hydration_data,get_inprogress_virtual_challenges,get_lactate_threshold,get_lifestyle_logging_data,get_menstrual_calendar_data,get_menstrual_data_for_date,get_morning_training_readiness,get_non_completed_badge_challenges,get_nutrition_daily_food_log,get_nutrition_daily_meals,get_nutrition_daily_settings,get_nutrition_summary_between_dates,get_personal_record,get_power_duration_curve,get_pregnancy_summary,get_primary_training_device,get_progress_summary_between_dates,get_race_predictions,get_recovery_time_remaining,get_respiration_data,get_respiration_summary,get_respiration_trend,get_rhr_day,get_running_tolerance,get_running_tolerance_trend,get_scheduled_workouts,get_sleep_data,get_sleep_summary,get_sleep_summary_range,get_spo2_data,get_stats,get_stats_and_body,get_stats_range,get_steps_data,get_stress_data,get_stress_summary,get_training_effect,get_training_load_balance,get_training_load_trend,get_training_plan_workouts,get_training_readiness,get_training_status,get_unit_system,get_user_profile,get_user_summary,get_userprofile_settings,get_vo2max_trend,get_weekly_intensity_minutes,get_weekly_steps,get_weekly_stress,get_weigh_ins,get_workout_by_id,get_workouts,search_foods,schedule_workout,set_activity_description,unschedule_workout,upload_workout,upload_workouts
    volumes:
      # The cached Garmin session (~6 months), written by the MFA step in README.md. On the
      # root filesystem under /var/lib/docker, not /media, so the mount guards do not apply.
      - garmin-tokens:/data/garminconnect
    # No `ports:`. The sidecar reaches nginx over the project network; nothing else should.
    #
    # Root inside the container only renders nginx's config, chowns the token volume and
    # supervises; every process that handles a request runs as `app`. These caps are what
    # that needs and no more. DAC_OVERRIDE is NOT optional, though a first boot would make
    # it look so: the auth step leaves the token directory 0700 and owned by `app`, and the
    # entrypoint's `chown -R` (as root, under set -e) cannot read into it without this cap —
    # so the container would crash-loop only AFTER the first successful login.
    #
    # KILL, because supervisord and nginx's master run as root and their children as `app`:
    # root without CAP_KILL cannot signal another uid, so every stop or restart would hang
    # for Docker's 10 s and end in SIGKILL, logging `kill() failed (1: Operation not
    # permitted)` — on the restart the MFA step itself asks for.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, KILL]
    # `one` has 1 GB beside qBittorrent, gluetun, Syncthing and calibre-web. Set once, not
    # "tightened later": the play prints real usage on every run as a record.
    mem_limit: 512m
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: garmin-mcp-cloudflared
    restart: unless-stopped
    # The image's ENTRYPOINT is `cloudflared --no-autoupdate`. The tunnel id is an argument
    # because the image has no shell to read it out of the credentials file; the play that
    # wrote the credentials wrote TUNNEL_ID into .env in the same run, so the two agree.
    command: tunnel --config /etc/cloudflared/config.yml run ${TUNNEL_ID:?run ansible/playbooks/server-deploy-garmin-mcp.yml — its deployment-tunnel half writes TUNNEL_ID}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      # Outside the repo checkout, owned by 65532 (the image's user) at 0600 — the play
      # sets both. A root-owned 0600 file here is unreadable and the connector dies on start.
      - ${TUNNEL_CREDENTIALS:?run ansible/playbooks/server-deploy-garmin-mcp.yml — its deployment-tunnel half writes TUNNEL_CREDENTIALS}:/etc/cloudflared/creds.json:ro
    # The same readiness probe calibre-web's sidecar uses: /ready answers 200 once at least
    # one edge connection is registered. A reading, not an action: nothing restarts on it.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    logging: *logging

volumes:
  garmin-tokens:
